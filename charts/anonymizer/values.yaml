image:
  repository: ai-gateway-anonymizer
  tag: dev
  pullPolicy: IfNotPresent

devMode:
  enabled: true
  sourceHostPath: /mnt/c/tmp/ai-gateway
  image:
    repository: golang
    tag: 1.22-alpine
    pullPolicy: IfNotPresent

anonymizer:
  replicaCount: 1
  port: 8081
  rules: all
  ruleDefinitions:
    # Contextual rules run first so labels and surrounding dialogue remain readable.
    - name: dialog_code_word
      placeholder: "{{DIALOG_KW_MASK}}"
      capture_group: 1
      pattern: '(?is)(?:назовите|скажите|ваше)?\s*(?:кодовое|секретное|ключевое)\s+слово[.?:\s]{0,4}(?:клиент:\s*)?(.{1,100}?)(?:\s+(?:\d{2}:\d{2}:\d{2}\s+оператор:\s+)?(?:кодовое\s+слово\s+)?(?:подошло|верно|подходит|принято)\b)'
    - name: code_word
      placeholder: "{{CODE_WORD}}"
      capture_group: 1
      pattern: '(?i)(?:кодовое\s+слово|кодслово|секретное\s+слово|ключевое\s+слово|запоминающее\s+слово)\s*[:=\-/]?\s*([^\s,;.!?]{2,64})'
    - name: cvv
      placeholder: "{{CVC_CVV}}"
      capture_group: 1
      pattern: '(?i)(?:cvv2?|cvc2?|cvp|свв|свс|свп|три\s+цифры|код\s+на\s+обороте|на\s+обороте|безопасный\s+код|защитный\s+код|код\s+безопасности|security\s+code)[\s:_.-]*(\d{3})\b'
    # A bare four-digit matcher is intentionally omitted: it would mask years,
    # prices, address fragments, and other non-PIN values without a PIN label.
    - name: pin
      placeholder: "{{PIN}}"
      capture_group: 1
      pattern: '(?i)(?:пин(?:-?код)?|pin\s*code)\s*[:=_-]*\s*(\d[\s_\\/-]*\d[\s_\\/-]*\d[\s_\\/-]*\d)\b'
    - name: otp
      placeholder: "{{OTP}}"
      capture_group: 1
      pattern: '(?i)(?:otp(?:[\s_-]*код)?|одноразовый[\s_-]*(?:пароль|код)|единовременный[\s_-]*(?:пароль|код))\s*[:—=_-]?\s*(\d{6})\b'
    - name: cft_id
      placeholder: "{{CFT_ID}}"
      capture_group: 1
      pattern: '(?i)(?:id\s+цфт|цфт(?:\s+id|[-\s№]+))\s*(\d{11})\b'
    - name: rrn
      placeholder: "{{ACCOUNT_TRANS}}"
      capture_group: 1
      pattern: '(?i)\brrn[-\s]*(\d{12,15})\b'
    - name: password
      placeholder: "{{PASSWORD}}"
      capture_group: 1
      pattern: '(?i)\b(?:password|passwd|pwd|пароль)\s*[:=]\s*["'']?([^"''\s,;]{6,})["'']?'
    - name: security_key
      placeholder: "{{SECURITY_KEY}}"
      capture_group: 1
      pattern: '(?i)\b(?:secret\s+key|aes\s+key|rsa\s+key|private\s+key|ключ)\s*[:=]\s*["'']?([^"''\s,;]{6,})["'']?'
    - name: user_id
      placeholder: "{{USER_ID}}"
      capture_group: 1
      pattern: '(?i)\b(?:login|alias|username|user|идентификатор\s+пользователя|логин)\s*[:;=-]\s*([A-Za-zА-Яа-яЁё0-9_.-]{3,})\b'
    - name: inn_context
      placeholder: "{{INN}}"
      capture_group: 1
      pattern: '(?i)\bинн\s*[:.]?\s*((?:\d{10}|\d{12}|\d{2}-?\d{2}-?\d{5,6}-?\d{1,2}))\b'
    - name: passport_ru_context
      placeholder: "{{PASSPORT_RU}}"
      capture_group: 1
      pattern: '(?i)\b(?:паспорт|passport)\s*[:№#]?\s*(?:(?:серия|series)\s*)?((?:\d{2}\s*\d{2}|\d{4})\s*(?:(?:номер|no\.?)\s*|[№#]\s*)?\d{6})\b'
    - name: person_context
      placeholder: "{{PERSON_NAME}}"
      capture_group: 1
      pattern: '(?i)\b(?:клиент|сотрудник|пользователь|менеджер|специалист|руководитель|директор|агент|консультант|оператор|представитель)\s+([А-ЯЁ][а-яё]+(?:\s+[А-ЯЁ][а-яё]+){0,2})\b'
    - name: api_key
      placeholder: "{{API_KEY}}"
      pattern: '(?i)\b(?:api[_-]?key|access[_-]?token|secret[_-]?key|client[_-]?secret|bearer)\s*[:=]\s*["'']?[A-Za-z0-9._~+/=\-]{16,}["'']?'
    - name: private_key
      placeholder: "{{PRIVATE_KEY}}"
      pattern: '(?s)-----BEGIN (?:RSA |ENCRYPTED |OPENSSH )?PRIVATE KEY-----.*?-----END (?:RSA |ENCRYPTED |OPENSSH )?PRIVATE KEY-----'
    - name: jwt
      placeholder: "{{JWT}}"
      pattern: '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'
    - name: email
      placeholder: "{{EMAIL}}"
      pattern: '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'
    - name: domain_user
      placeholder: "{{USER_ID}}"
      pattern: '(?i)\b(?:bcs\\[A-Za-z0-9_.-]+|[A-Za-z0-9_.-]+@global\.bcs|(?:svc|usr)[-_][A-Za-z0-9_.-]+)\b'
    - name: social_login
      placeholder: "{{AT_LOGIN}}"
      pattern: '@[A-Za-z0-9_.-]{2,}\b'
    - name: computer_name
      placeholder: "{{COMPUTER_NAME}}"
      pattern: '\b(?:SWP|SWD|DN)-[A-Z]{3}\d{2}-[A-Z0-9]{5,}\b'
    - name: uuid
      placeholder: "{{GUID_UUID}}"
      pattern: '(?i)\b(?:[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}|[a-f0-9]{32})\b'
    - name: k_number
      placeholder: "{{K_NUMBERS}}"
      pattern: '\b[KkDdКкДд]-[0-9]{5,8}\b'
    - name: bic
      placeholder: "{{BIC}}"
      pattern: '\b\d{2}-\d{2}-\d{2}-\d{3}\b'
    - name: swift_bic
      placeholder: "{{SWIFT_BIC}}"
      pattern: '\b[A-Z]{4}RU[A-Z0-9]{2}(?:[A-Z0-9]{3})?\b'
    - name: bank_card
      placeholder: "{{BANK_CARD}}"
      pattern: '\b(?:\d[ _:;,./-]?){13,19}\b'
      validator: luhn
    - name: expiration_date
      placeholder: "{{EXPDATE}}"
      pattern: '\b(?:0[1-9]|1[0-2])[\s_/-](?:20)?\d{2}\b'
    - name: passport_ru
      placeholder: "{{PASSPORT_RU}}"
      pattern: '\b(?:\d{2}\s+\d{2}|\d{4})\s+(?:№\s*)?\d{6}\b'
    - name: inn
      placeholder: "{{INN}}"
      pattern: '\b(?:\d{10}|\d{12})\b'
    - name: phone
      placeholder: "{{PHONE}}"
      pattern: '(?i)(?:\+7|8|\+1|\+\d{1,3})?[\s(.-]*\d{3}[\s). -]*\d{3}[\s.-]*\d{2}[\s.-]*\d{2}\b'
    - name: home_phone
      placeholder: "{{HOME_PHONE}}"
      pattern: '(?i)(?:домашний\s+телефон|дом\.?\s*тел\.?|городской\s+телефон)[:\s-]*\d{6,8}\b|\b\(\d{3,5}\)\s*[-:_]?\d{3}(?:\s*[-:_/]\s*\d{2}){2}\b'
    - name: ip
      placeholder: "{{IP}}"
      pattern: '\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b'
    - name: snils
      placeholder: "{{SNILS}}"
      pattern: '\b(?:\d{3}[-_:;=>\s]*){3}\d{2}\b|\b\d{6}[-_:;=>\s]+\d{5}\b'
    - name: deposit_account
      placeholder: "{{DEPO_ACCT}}"
      pattern: '\bСВ\d{7}\b'
    - name: bank_account
      placeholder: "{{ACCOUNT_TRANS}}"
      pattern: '№?\s*\b\d{20}\b'
    - name: account_transaction
      placeholder: "{{ACCOUNT_TRANS}}"
      pattern: '\b\d{1,3}-\d{1,3}-\d{4,}-\d{1,4}\b|\b\d{1,3}(?:\.\d{1,}){3}\.\d{4,}\b|\b[AB]\d{20,45}\b'
    - name: broker_account
      placeholder: "{{BROKER_ACCT}}"
      pattern: '\b(?:\d{3}-\d{2}-\d{2}\s*[/／]\s*\d{2,4}|Б\d+/\d{2,4}-м|ДО-\d+/\d{2,4}-м|\d{4,}/\d{2,4}(?:-[А-Яа-яЁёA-Za-z0-9]+)*)\b'
    - name: date
      placeholder: "{{DATE}}"
      pattern: '(?i)\b(?:(?:0[1-9]|[12][0-9]|3[01])[- ./](?:0[1-9]|1[0-2])[- ./]\d{2,4}|\d{4}[- ./](?:0[1-9]|1[0-2])[- ./](?:0[1-9]|[12][0-9]|3[01])|(?:0?[1-9]|[12][0-9]|3[01])\s+(?:янв(?:аря)?|февр(?:аля)?|мар(?:та)?|апр(?:еля)?|мая|июн(?:я)?|июл(?:я)?|авг(?:уста)?|сент(?:ября)?|окт(?:ября)?|нояб(?:ря)?|дек(?:абря)?)(?:\s+\d{2,4}(?:г\.?|\s+года?)?)?)\b'
    - name: money
      placeholder: "{{MONEY}}"
      pattern: '(?:\$\s*\d{1,3}(?:[.,]\d{3})*(?:[.,]\d+)?|\d+(?:[.,]\d{3})*(?:[.,]\d+)?\s*(?:€|руб\.?|р\.|\$|₽))'
    - name: address_ru
      placeholder: "{{ADDRESS_RU}}"
      pattern: '(?i)(?:г\.|город|ул\.|улица|пр-т|проспект|пер\.|переулок|д\.|дом|кв\.|квартира)\s*[^,;\n]{2,120}'
    - name: person_ru
      placeholder: "{{PERSON_RU}}"
      pattern: '[А-ЯЁ][а-яё]+(?:\s+[А-ЯЁ][а-яё]+){1,2}'

externalRedis:
  addr: ai-gateway-redis:6379

resources: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]
