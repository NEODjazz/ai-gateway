apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-migrations
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
data:
  001_usage_events.sql: |
    CREATE DATABASE IF NOT EXISTS ai_gateway;

    CREATE TABLE IF NOT EXISTS ai_gateway.usage_events
    (
        timestamp String,
        timestamp_unix UInt64 DEFAULT toUnixTimestamp(parseDateTimeBestEffort(timestamp)),
        event_id String,
        request_id String,
        user_id String,
        roles Array(String),
        api_key_fingerprint String,
        provider String,
        provider_endpoint_name String,
        provider_endpoint_type String,
        model String,
        api_type LowCardinality(String),
        phase LowCardinality(String),
        cache_status LowCardinality(String),
        status LowCardinality(String),
        error String,
        failure_class LowCardinality(String),
        latency_ms UInt32,
        prompt_tokens_estimated UInt32,
        input_tokens UInt32,
        output_tokens UInt32,
        total_tokens UInt32,
        cost Float64,
        currency LowCardinality(String)
    )
    ENGINE = MergeTree
    PARTITION BY toYYYYMM(parseDateTimeBestEffort(timestamp))
    ORDER BY (user_id, provider, model, timestamp)
    TTL parseDateTimeBestEffort(timestamp) + INTERVAL 24 MONTH;

    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS timestamp String DEFAULT formatDateTime(toDateTime(timestamp_unix), '%Y-%m-%dT%H:%i:%SZ') FIRST;

    ALTER TABLE ai_gateway.usage_events
        MODIFY COLUMN IF EXISTS timestamp_unix UInt64 DEFAULT toUnixTimestamp(parseDateTimeBestEffort(timestamp));

    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS event_id String AFTER timestamp_unix;

    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS phase LowCardinality(String) AFTER api_type;

    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS cache_status LowCardinality(String) AFTER phase;

    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS failure_class LowCardinality(String) AFTER error;
  002_usage_catalog.sql: |
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS team_id String AFTER user_id;
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS catalog_version String AFTER currency;
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS pricing_key String AFTER catalog_version;
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS input_cost_per_1m Float64 AFTER pricing_key;
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS output_cost_per_1m Float64 AFTER input_cost_per_1m;
  003_usage_identity.sql: |
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS provider_id String AFTER provider;
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS upstream_model String AFTER model;
  004_usage_sessions.sql: |
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS session_id String AFTER request_id;
  005_usage_observability.sql: |
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS organization_id String AFTER team_id;
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS first_token_latency_ms UInt32 AFTER latency_ms;
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS retry_count UInt16 AFTER first_token_latency_ms;
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS fallback_count UInt16 AFTER retry_count;
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS cache_kind LowCardinality(String) AFTER cache_status;
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS usage_estimated Bool AFTER total_tokens;
  006_usage_traces.sql: |
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS trace_id String AFTER session_id;
  007_usage_tags.sql: |
    ALTER TABLE ai_gateway.usage_events
        ADD COLUMN IF NOT EXISTS tags Array(String) AFTER roles;
