apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-gateway.providerConfigName" . }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  default_provider: {{ .Values.gateway.provider.default | quote }}
  {{- $providers := list }}
  {{- range .Values.gateway.providers }}
  {{- $providers = append $providers (omit . "api_key") }}
  {{- end }}
  providers.json: {{ $providers | toJson | quote }}
  guardrail-policies.json: {{ .Values.gateway.guardrailPolicies | toJson | quote }}
