{{- if .Values.gateway.providerSecrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-gateway.providerSecretName" . }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.gateway.redis.password | quote }}
  MANAGEMENT_SHARED_SECRET: {{ .Values.gateway.management.sharedSecret | quote }}
  BILLING_MANAGEMENT_SHARED_SECRET: {{ .Values.gateway.management.billingSharedSecret | quote }}
  BILLING_SHARED_SECRET: {{ .Values.gateway.modules.billing.sharedSecret | quote }}
  SEMANTIC_CACHE_EMBEDDING_API_KEY: {{ .Values.gateway.semanticCache.embeddingApiKey | quote }}
  PROVIDER_CONTROL_PLANE_POSTGRES_DSN: {{ .Values.gateway.controlPlane.postgresDsn | quote }}
  PROVIDER_CREDENTIAL_ENCRYPTION_KEY: {{ .Values.gateway.controlPlane.credentialEncryptionKey | quote }}
  {{- range .Values.gateway.providers }}
  {{- $apiKey := index $.Values.gateway.providerApiKeys .name }}
  {{- if $apiKey }}
  {{ include "ai-gateway.providerApiKeyEnvName" . }}: {{ $apiKey | quote }}
  {{- end }}
  {{- end }}
{{- end }}
