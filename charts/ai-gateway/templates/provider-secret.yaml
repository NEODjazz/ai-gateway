{{- if .Values.gateway.providerSecrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-gateway.providerSecretName" . }}
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.gateway.redis.password | quote }}
  {{- range .Values.gateway.providers }}
  {{- $apiKey := index $.Values.gateway.providerApiKeys .name }}
  {{- if $apiKey }}
  {{ include "ai-gateway.providerApiKeyEnvName" . }}: {{ $apiKey | quote }}
  {{- end }}
  {{- end }}
{{- end }}
