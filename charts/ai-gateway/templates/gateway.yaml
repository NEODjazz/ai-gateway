apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway.fullname" . }}-gateway
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      annotations:
        checksum/provider-config: {{ include (print $.Template.BasePath "/provider-configmap.yaml") . | sha256sum }}
        checksum/provider-secret: {{ include (print $.Template.BasePath "/provider-secret.yaml") . | sha256sum }}
      labels:
        {{- include "ai-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      {{- with .Values.gateway.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "ai-gateway.image" . | quote }}
          imagePullPolicy: {{ include "ai-gateway.imagePullPolicy" . }}
          {{- include "ai-gateway.devCommand" (dict "root" . "service" "gateway") | nindent 10 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- include "ai-gateway.devEnv" . | nindent 12 }}
            - name: AI_GATEWAY_SERVICE
              value: gateway
            - name: AI_GATEWAY_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: OTEL_SERVICE_NAME
              value: ai-gateway
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.gateway.telemetry.otlpTracesEndpoint | quote }}
            - name: OTEL_TRACE_SAMPLE_RATIO
              value: {{ .Values.gateway.telemetry.sampleRatio | quote }}
            - name: HTTP_ADDR
              value: ":8080"
            - name: ADMIN_UI_ENABLED
              value: {{ .Values.gateway.adminUI.enabled | quote }}
            - name: API_DOCS_ENABLED
              value: {{ .Values.gateway.apiDocs.enabled | quote }}
            - name: API_DOCS_TRY_IT_OUT_ENABLED
              value: {{ .Values.gateway.apiDocs.tryItOutEnabled | quote }}
            - name: PROVIDER_TYPE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-gateway.providerConfigName" . }}
                  key: default_provider
            - name: DEFAULT_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-gateway.providerConfigName" . }}
                  key: default_provider
            - name: PROVIDERS_JSON
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-gateway.providerConfigName" . }}
                  key: providers.json
            - name: GUARDRAIL_POLICIES_JSON
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-gateway.providerConfigName" . }}
                  key: guardrail-policies.json
            - name: GUARDRAIL_MONITOR_CAPACITY
              value: {{ .Values.gateway.guardrailMonitor.capacity | quote }}
            - name: GUARDRAIL_MONITOR_TTL_SECONDS
              value: {{ .Values.gateway.guardrailMonitor.ttlSeconds | quote }}
            - name: MODEL_CATALOG_JSON
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ai-gateway.providerConfigName" . }}
                  key: model-catalog.json
            - name: EXACT_CACHE_TTL_SECONDS
              value: {{ .Values.gateway.exactCache.ttlSeconds | quote }}
            - name: EXACT_CACHE_MAX_BYTES
              value: {{ printf "%.0f" (float64 .Values.gateway.exactCache.maxBytes) | quote }}
            - name: SEMANTIC_CACHE_TTL_SECONDS
              value: {{ .Values.gateway.semanticCache.ttlSeconds | quote }}
            - name: SEMANTIC_CACHE_THRESHOLD
              value: {{ .Values.gateway.semanticCache.threshold | quote }}
            - name: SEMANTIC_CACHE_MAX_ENTRIES
              value: {{ .Values.gateway.semanticCache.maxEntries | quote }}
            - name: SEMANTIC_CACHE_MAX_BYTES
              value: {{ printf "%.0f" (float64 .Values.gateway.semanticCache.maxBytes) | quote }}
            - name: SEMANTIC_CACHE_EMBEDDING_URL
              value: {{ .Values.gateway.semanticCache.embeddingUrl | quote }}
            - name: SEMANTIC_CACHE_EMBEDDING_MODEL
              value: {{ .Values.gateway.semanticCache.embeddingModel | quote }}
            - name: SEMANTIC_CACHE_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.providerSecretName" . }}
                  key: SEMANTIC_CACHE_EMBEDDING_API_KEY
                  optional: true
            - name: ROUTING_STRATEGY
              value: {{ .Values.gateway.routing.strategy | quote }}
            - name: ADAPTIVE_ROUTING_EWMA_ALPHA
              value: {{ .Values.gateway.routing.adaptiveEwmaAlpha | quote }}
            - name: RESPONSES_AFFINITY_TTL_SECONDS
              value: {{ .Values.gateway.routing.responsesAffinityTtlSeconds | quote }}
            - name: RESPONSES_OWNERSHIP_TTL_SECONDS
              value: {{ .Values.gateway.routing.responsesOwnershipTtlSeconds | quote }}
            - name: PROVIDER_CONTROL_PLANE_REFRESH_SECONDS
              value: {{ .Values.gateway.controlPlane.refreshSeconds | quote }}
            - name: PROVIDER_CONTROL_PLANE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.providerSecretName" . }}
                  key: PROVIDER_CONTROL_PLANE_POSTGRES_DSN
                  optional: true
            - name: PROVIDER_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.providerSecretName" . }}
                  key: PROVIDER_CREDENTIAL_ENCRYPTION_KEY
                  optional: true
            - name: REDIS_ADDR
              value: {{ .Values.gateway.redis.addr | quote }}
            - name: REDIS_DB
              value: {{ .Values.gateway.redis.db | quote }}
            - name: REDIS_PREFIX
              value: {{ .Values.gateway.redis.prefix | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.providerSecretName" . }}
                  key: REDIS_PASSWORD
                  optional: true
            {{- range .Values.gateway.providers }}
            - name: {{ include "ai-gateway.providerApiKeyEnvName" . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.providerSecretName" $ }}
                  key: {{ include "ai-gateway.providerApiKeyEnvName" . }}
                  optional: true
            {{- end }}
            - name: AUTH_REQUIRED
              value: {{ .Values.gateway.modules.auth.required | quote }}
            - name: AUTH_URL
              value: {{ ternary .Values.gateway.modules.auth.url "" .Values.gateway.modules.auth.remote | quote }}
            - name: MANAGEMENT_AUTH_URL
              value: {{ .Values.gateway.management.authUrl | quote }}
            - name: MANAGEMENT_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.providerSecretName" . }}
                  key: MANAGEMENT_SHARED_SECRET
                  optional: false
            - name: BILLING_MANAGEMENT_URL
              value: {{ .Values.gateway.management.billingUrl | quote }}
            - name: BILLING_MANAGEMENT_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.providerSecretName" . }}
                  key: BILLING_MANAGEMENT_SHARED_SECRET
                  optional: false
            - name: ANONYMIZER_REQUIRED
              value: {{ .Values.gateway.modules.anonymizer.required | quote }}
            - name: ANONYMIZER_RULES
              value: {{ .Values.gateway.modules.anonymizer.rules | quote }}
            - name: ANONYMIZER_URL
              value: {{ ternary .Values.gateway.modules.anonymizer.url "" .Values.gateway.modules.anonymizer.remote | quote }}
            - name: BILLING_REQUIRED
              value: {{ .Values.gateway.modules.billing.required | quote }}
            - name: BILLING_URL
              value: {{ ternary .Values.gateway.modules.billing.url "" .Values.gateway.modules.billing.remote | quote }}
            - name: BILLING_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.providerSecretName" . }}
                  key: BILLING_SHARED_SECRET
                  optional: false
            - name: DLP_REQUIRED
              value: {{ .Values.gateway.modules.dlp.required | quote }}
            - name: DLP_URL
              value: {{ ternary .Values.gateway.modules.dlp.url "" .Values.gateway.modules.dlp.remote | quote }}
            - name: AV_REQUIRED
              value: {{ .Values.gateway.modules.av.required | quote }}
            - name: AV_URL
              value: {{ ternary .Values.gateway.modules.av.url "" .Values.gateway.modules.av.remote | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- include "ai-gateway.devVolumeMounts" . | nindent 10 }}
      {{- include "ai-gateway.devVolumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway.fullname" . }}-gateway
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "ai-gateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
