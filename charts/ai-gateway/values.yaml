image:
  repository: ghcr.io/neodjazz/ai-gateway-gateway
  # Defaults to Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

devMode:
  enabled: false
  sourceHostPath: /mnt/c/tmp/ai-gateway
  image:
    repository: golang
    tag: 1.26.7-alpine
    pullPolicy: IfNotPresent

gateway:
  replicaCount: 1
  port: 8080
  adminUI:
    enabled: true
  apiDocs:
    # Keep disabled on externally reachable production gateways unless needed.
    enabled: false
    # Enables browser-originated API calls from Swagger UI.
    tryItOutEnabled: false
  provider:
    default: azure-open-ai
    testModel: gpt-5.3
  modelCatalog:
    version: local-v1
    unknown_model_policy: legacy
    models: []
  guardrailPolicies: {}
  # strict:
  #   dlp: true
  #   av: true
  exactCache:
    # Disabled by default; bundled cache is process-local and tenant-scoped.
    ttlSeconds: 0
    maxBytes: 1048576
  semanticCache:
    # Opt-in and process-local. Use only for text-only chat traffic.
    ttlSeconds: 0
    threshold: "0.95"
    maxEntries: 100
    maxBytes: 1048576
    embeddingUrl: ""
    embeddingModel: ""
    embeddingApiKey: ""
  routing:
    strategy: weighted
    adaptiveEwmaAlpha: "0.2"
    responsesAffinityTtlSeconds: 3600
  controlPlane:
    # PostgreSQL is the source of truth; empty DSN keeps runtime-only management.
    postgresDsn: ""
    # Required (minimum 16 characters) whenever postgresDsn is set.
    credentialEncryptionKey: ""
    refreshSeconds: 1
  management:
    authUrl: http://ai-gateway-auth:8082
    # Supply the same value to the auth chart from an encrypted values source.
    sharedSecret: dev-management-shared-secret
    billingUrl: http://ai-gateway-billing:8083
    # Independent from the auth management secret.
    billingSharedSecret: dev-billing-management-shared-secret
  telemetry:
    otlpTracesEndpoint: ""
    sampleRatio: "1"
  redis:
    # Leave addr empty to use process-local stores.
    addr: ""
    db: 0
    prefix: ai-gateway
    password: ""
  providers:
    - name: ollama-local
      type: ollama
      base_url: http://host.docker.internal:11434
      # Optional endpoint admission control:
      # max_parallel_requests: 2
      # queue_capacity: 8
      # queue_timeout_ms: 5000
      # Shadow evaluation endpoint (never selected as primary):
      # shadow: true
      # mirror_percentage: 10
      # mirror_timeout_ms: 5000
      # max_parallel_requests: 2  # required for shadow endpoints
      stream: true
      dlp_enabled: false
      av_enabled: false
      models:
        - gemma4:e4b
      priority: 10
      enabled: true
    # Enable after `ollama pull nomic-embed-text`. Keeping embeddings on a
    # dedicated endpoint prevents a chat-only model from being selected.
    - name: ollama-embeddings
      type: ollama
      base_url: http://host.docker.internal:11434
      stream: false
      dlp_enabled: false
      av_enabled: false
      capabilities:
        - embeddings
      models:
        - nomic-embed-text:latest
      priority: 10
      enabled: false
    - name: azure-open-ai
      type: openai
      base_url: $PROVIDER_BASE_URL_AZURE_OPEN_AI
      stream: true
      dlp_enabled: false
      av_enabled: false
      models:
        - gpt-5.3
      priority: 10
      enabled: true
    # OpenAI-compatible reranker. Some vLLM/TEI installations expose
    # /rerank instead of /v1/rerank, hence the explicit path override.
    # - name: local-reranker
    #   type: openai-compatible
    #   base_url: http://reranker:8000
    #   rerank_path: /rerank
    #   capabilities: [rerank]
    #   models: [rerank-model]
    #   max_parallel_requests: 4
    #   enabled: true
    - name: anthropic
      type: anthropic
      base_url: https://api.anthropic.com
      stream: true
      dlp_enabled: false
      av_enabled: false
      models:
        - claude-sonnet-4-5
      priority: 20
      enabled: false
    - name: demo
      type: demo
      dlp_enabled: false
      av_enabled: false
      models:
        - fallback-demo-model
      priority: 1000
      enabled: true
  providerSecrets:
    create: true
    name: ""
  providerApiKeys:
    azure-open-ai: $PROVIDER_API_KEY_AZURE_OPEN_AI
    anthropic: ""
  service:
    type: LoadBalancer
  modules:
    auth:
      required: true
      remote: true
      url: http://ai-gateway-auth:8082
    anonymizer:
      required: true
      remote: true
      url: http://ai-gateway-anonymizer:8081
      rules: all
    billing:
      required: true
      remote: true
      url: http://ai-gateway-billing:8083
      sharedSecret: dev-billing-shared-secret
    dlp:
      required: true
      remote: true
      url: http://ai-gateway-security-dlp:8084
    av:
      required: true
      remote: true
      url: http://ai-gateway-security-av:8085

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
