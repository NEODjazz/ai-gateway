apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.auth.replicaCount }}
  selector:
    matchLabels:
      {{- include "auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auth.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: auth
          image: {{ include "auth.image" . | quote }}
          imagePullPolicy: {{ include "auth.imagePullPolicy" . }}
          {{- include "auth.devCommand" . | nindent 10 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.auth.port }}
          env:
            {{- include "auth.devEnv" . | nindent 12 }}
            - name: AI_GATEWAY_SERVICE
              value: auth
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "auth.fullname" . }}
                  key: jwt-secret
            - name: AUTH_JWT_ISSUER
              value: {{ .Values.auth.jwt.issuer | quote }}
            - name: AUTH_JWT_AUDIENCE
              value: {{ .Values.auth.jwt.audience | quote }}
            - name: AUTH_JWT_JWKS_URL
              value: {{ .Values.auth.jwt.jwksUrl | quote }}
            - name: AUTH_JWT_JWKS_CACHE_TTL_SECONDS
              value: {{ .Values.auth.jwt.jwksCacheTtlSeconds | quote }}
            - name: AUTH_JWT_CLOCK_SKEW_SECONDS
              value: {{ .Values.auth.jwt.clockSkewSeconds | quote }}
            - name: AUTH_JWT_USER_ID_CLAIM
              value: {{ .Values.auth.jwt.userIdClaim | quote }}
            - name: AUTH_JWT_TEAM_ID_CLAIM
              value: {{ .Values.auth.jwt.teamIdClaim | quote }}
            - name: AUTH_JWT_ROLES_CLAIM
              value: {{ .Values.auth.jwt.rolesClaim | quote }}
            - name: AUTH_JWT_IDENTITY_MODE
              value: {{ .Values.auth.jwt.identityMode | quote }}
            - name: AUTH_JWT_ROLE_MAPPINGS_JSON
              value: {{ .Values.auth.jwt.roleMappings | toJson | quote }}
            - name: AUTH_VIRTUAL_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "auth.fullname" . }}
                  key: virtual-keys.json
            - name: AUTH_POSTGRES_KEYS_ENABLED
              value: {{ .Values.auth.postgres.enabled | quote }}
            - name: AUTH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "auth.fullname" . }}
                  key: postgres-dsn
            {{- $credentialKey := include "auth.credentialEncryptionKey" . }}
            {{- if or .Values.credentialEncryption.existingSecret $credentialKey }}
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.credentialEncryption.existingSecret }}
                  name: {{ .Values.credentialEncryption.existingSecret | quote }}
                  key: {{ required "credentialEncryption.secretKey is required" .Values.credentialEncryption.secretKey | quote }}
                  {{- else }}
                  name: {{ include "auth.fullname" . }}
                  key: CREDENTIAL_ENCRYPTION_KEY
                  {{- end }}
            {{- end }}
            - name: AUTH_KEY_HASH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "auth.fullname" . }}
                  key: key-hash-secret
            - name: MANAGEMENT_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "auth.fullname" . }}
                  key: management-shared-secret
            - name: AUTH_STATIC_KEY_FALLBACK_ENABLED
              value: {{ .Values.auth.staticKeyFallbackEnabled | quote }}
            - name: AUTH_DEMO_KEYS_ENABLED
              value: {{ .Values.auth.demoKeysEnabled | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.devMode.enabled }}
          volumeMounts:
            - name: source
              mountPath: /workspace
          {{- end }}
      {{- if .Values.devMode.enabled }}
      volumes:
        - name: source
          hostPath:
            path: {{ .Values.devMode.sourceHostPath | quote }}
            type: Directory
      {{- end }}
