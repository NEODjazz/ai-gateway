apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth.fullname" . }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ .Values.auth.jwt.secret | b64enc | quote }}
  key-hash-secret: {{ .Values.auth.keyHashSecret | b64enc | quote }}
  management-shared-secret: {{ .Values.auth.managementSharedSecret | b64enc | quote }}
  postgres-dsn: {{ .Values.auth.postgres.dsn | b64enc | quote }}
  virtual-keys.json: {{ .Values.auth.virtualKeys | toJson | b64enc | quote }}
