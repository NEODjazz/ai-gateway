image:
  repository: ghcr.io/neodjazz/ai-gateway-auth
  # Defaults to Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

devMode:
  enabled: false
  sourceHostPath: /mnt/c/tmp/ai-gateway
  image:
    repository: golang
    tag: 1.22-alpine
    pullPolicy: IfNotPresent

auth:
  replicaCount: 1
  port: 8082
  jwt:
    secret: dev-jwt-secret
    issuer: ai-gateway
    audience: ai-gateway

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
