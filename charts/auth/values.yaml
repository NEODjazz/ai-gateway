image:
  repository: ghcr.io/neodjazz/ai-gateway-auth
  # Defaults to Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

devMode:
  enabled: false
  sourceHostPath: /mnt/c/tmp/ai-gateway
  image:
    repository: golang
    tag: 1.26.7-alpine
    pullPolicy: IfNotPresent

auth:
  replicaCount: 1
  port: 8082
  jwt:
    secret: dev-jwt-secret
    issuer: ai-gateway
    audience: ai-gateway
  postgres:
    enabled: true
    dsn: postgres://ai_gateway:ai_gateway@ai-gateway-postgres:5432/ai_gateway?sslmode=disable
  keyHashSecret: dev-auth-key-hash-secret
  staticKeyFallbackEnabled: true
  demoKeysEnabled: true
  # Production values should be supplied from an encrypted values source.
  virtualKeys: []
  # - token: replace-me
  #   user_id: user-1
  #   team_id: team-1
  #   roles: [developer]
  #   allowed_models: ["gpt-5.*"]
  #   rate_limit_rpm: 60
  #   rate_limit_tpm: 100000

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
