apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres.fullname" . }}-migrations
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
data:
  034_gateway_cached_contents.sql: |
    CREATE TABLE IF NOT EXISTS gateway_cached_contents (
        cached_content_name TEXT NOT NULL,
        owner_key TEXT NOT NULL,
        endpoint TEXT NOT NULL,
        model TEXT NOT NULL,
        deployment CHAR(64) NOT NULL,
        snapshot JSONB NOT NULL CHECK (jsonb_typeof(snapshot) = 'object'),
        expires_at TIMESTAMPTZ NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (owner_key,cached_content_name),
        CHECK (length(cached_content_name) BETWEEN 16 AND 256),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (length(endpoint) BETWEEN 1 AND 128),
        CHECK (length(model) BETWEEN 1 AND 256),
        CHECK (length(deployment) = 64),
        CHECK (octet_length(snapshot::text) BETWEEN 2 AND 1048576)
    );
    CREATE INDEX IF NOT EXISTS gateway_cached_contents_owner_created_idx
        ON gateway_cached_contents (owner_key,created_at DESC,cached_content_name DESC);
    CREATE INDEX IF NOT EXISTS gateway_cached_contents_expiry_idx
        ON gateway_cached_contents (expires_at);
  018_billing_image_units.sql: |
    ALTER TABLE billing_budget_reservations
        ADD COLUMN IF NOT EXISTS image_cost_per_unit numeric(20,10) NOT NULL DEFAULT 0;
  033_gateway_skill_executions.sql: |
    CREATE TABLE IF NOT EXISTS gateway_skill_executions (
        container_id TEXT PRIMARY KEY,
        owner_key TEXT NOT NULL,
        endpoint_id TEXT NOT NULL,
        expires_at TIMESTAMPTZ NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (length(container_id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (length(endpoint_id) BETWEEN 1 AND 128)
    );
    CREATE INDEX IF NOT EXISTS gateway_skill_executions_owner_expiry_idx
        ON gateway_skill_executions (owner_key, expires_at, container_id);
  032_gateway_containers.sql: |
    CREATE TABLE IF NOT EXISTS gateway_containers (
        container_id TEXT NOT NULL,
        owner_key TEXT NOT NULL,
        endpoint TEXT NOT NULL,
        model TEXT NOT NULL,
        deployment CHAR(64) NOT NULL,
        snapshot JSONB NOT NULL CHECK (jsonb_typeof(snapshot) = 'object'),
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (container_id),
        CHECK (length(container_id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (length(endpoint) BETWEEN 1 AND 128),
        CHECK (length(model) BETWEEN 1 AND 256)
    );
    CREATE INDEX IF NOT EXISTS gateway_containers_owner_created_idx
        ON gateway_containers (owner_key,created_at DESC,container_id DESC);
  016_provider_cost_precision.sql: |
    ALTER TABLE billing_budget_policies
        ALTER COLUMN max_cost TYPE NUMERIC(20, 10);
    ALTER TABLE billing_budget_reservations
        ALTER COLUMN reserved_cost TYPE NUMERIC(20, 10),
        ALTER COLUMN actual_cost TYPE NUMERIC(20, 10);
  017_deployment_budgets.sql: |
    ALTER TABLE billing_budget_policies
        DROP CONSTRAINT IF EXISTS billing_budget_policies_scope_type_check;
    ALTER TABLE billing_budget_policies
        ADD CONSTRAINT billing_budget_policies_scope_type_check
        CHECK (scope_type IN ('global', 'key', 'user', 'team', 'organization', 'model', 'provider', 'deployment', 'tag'));
    ALTER TABLE billing_budget_reservations
        ADD COLUMN IF NOT EXISTS deployment_name TEXT NOT NULL DEFAULT '';
    CREATE INDEX IF NOT EXISTS idx_billing_budget_reservations_deployment
        ON billing_budget_reservations(deployment_name, created_at, state);
  031_gateway_vector_store_file_batches.sql: |
    CREATE TABLE IF NOT EXISTS gateway_vector_store_file_batches (
        id TEXT PRIMARY KEY,
        vector_store_id TEXT NOT NULL REFERENCES gateway_vector_stores(id) ON DELETE CASCADE,
        owner_key TEXT NOT NULL,
        status TEXT NOT NULL CHECK (status IN ('completed')),
        total INTEGER NOT NULL CHECK (total BETWEEN 1 AND 2000),
        completed INTEGER NOT NULL CHECK (completed >= 0),
        failed INTEGER NOT NULL DEFAULT 0 CHECK (failed >= 0),
        cancelled INTEGER NOT NULL DEFAULT 0 CHECK (cancelled >= 0),
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (length(id) BETWEEN 1 AND 128),
        CHECK (length(vector_store_id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (completed + failed + cancelled = total),
        UNIQUE (id,vector_store_id,owner_key)
    );
    CREATE INDEX IF NOT EXISTS gateway_vector_store_file_batches_owner_created_idx
        ON gateway_vector_store_file_batches (owner_key,vector_store_id,created_at DESC,id DESC);
    CREATE TABLE IF NOT EXISTS gateway_vector_store_file_batch_files (
        batch_id TEXT NOT NULL,
        vector_store_id TEXT NOT NULL,
        file_id TEXT NOT NULL,
        owner_key TEXT NOT NULL,
        ordinal INTEGER NOT NULL CHECK (ordinal BETWEEN 0 AND 1999),
        PRIMARY KEY (batch_id,file_id),
        UNIQUE (batch_id,ordinal),
        FOREIGN KEY (batch_id,vector_store_id,owner_key) REFERENCES gateway_vector_store_file_batches(id,vector_store_id,owner_key) ON DELETE CASCADE,
        FOREIGN KEY (vector_store_id,file_id) REFERENCES gateway_vector_store_files(vector_store_id,file_id) ON DELETE CASCADE,
        CHECK (length(owner_key) BETWEEN 1 AND 256)
    );
    CREATE INDEX IF NOT EXISTS gateway_vector_store_file_batch_files_lookup_idx
        ON gateway_vector_store_file_batch_files (owner_key,vector_store_id,batch_id,file_id);
  029_gateway_assistant_runs.sql: |
    CREATE TABLE IF NOT EXISTS gateway_assistant_runs (
        id TEXT NOT NULL, thread_id TEXT NOT NULL, owner_key TEXT NOT NULL, status TEXT NOT NULL,
        snapshot JSONB NOT NULL, revision BIGINT NOT NULL DEFAULT 1, retain_until TIMESTAMPTZ NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (length(id) BETWEEN 1 AND 128), CHECK (length(thread_id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (status IN ('queued','in_progress','requires_action','cancelling','completed','failed','cancelled','expired','incomplete')),
        CHECK (jsonb_typeof(snapshot) = 'object'), CHECK (octet_length(snapshot::text) BETWEEN 2 AND 2097152),
        CHECK (revision > 0), CHECK (retain_until > created_at), PRIMARY KEY (owner_key,thread_id,id),
        FOREIGN KEY (owner_key,thread_id) REFERENCES gateway_assistant_threads(owner_key,id) ON DELETE CASCADE
    );
    CREATE UNIQUE INDEX IF NOT EXISTS gateway_assistant_runs_one_active_idx
        ON gateway_assistant_runs (owner_key,thread_id)
        WHERE status IN ('queued','in_progress','requires_action','cancelling');
    CREATE INDEX IF NOT EXISTS gateway_assistant_runs_thread_created_idx
        ON gateway_assistant_runs (owner_key,thread_id,created_at DESC,id DESC);
    CREATE TABLE IF NOT EXISTS gateway_assistant_run_steps (
        id TEXT NOT NULL, run_id TEXT NOT NULL, thread_id TEXT NOT NULL, owner_key TEXT NOT NULL,
        status TEXT NOT NULL, snapshot JSONB NOT NULL, revision BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (length(id) BETWEEN 1 AND 128), CHECK (length(run_id) BETWEEN 1 AND 128),
        CHECK (length(thread_id) BETWEEN 1 AND 128), CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (status IN ('in_progress','completed','failed','cancelled','expired')),
        CHECK (jsonb_typeof(snapshot) = 'object'), CHECK (octet_length(snapshot::text) BETWEEN 2 AND 2097152),
        CHECK (revision > 0), PRIMARY KEY (owner_key,thread_id,run_id,id),
        FOREIGN KEY (owner_key,thread_id,run_id) REFERENCES gateway_assistant_runs(owner_key,thread_id,id) ON DELETE CASCADE
    );
    CREATE INDEX IF NOT EXISTS gateway_assistant_run_steps_run_created_idx
        ON gateway_assistant_run_steps (owner_key,thread_id,run_id,created_at DESC,id DESC);
  028_gateway_assistant_threads.sql: |
    CREATE TABLE IF NOT EXISTS gateway_assistant_threads (
        id TEXT NOT NULL, owner_key TEXT NOT NULL, snapshot JSONB NOT NULL,
        revision BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (length(id) BETWEEN 1 AND 128), CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (jsonb_typeof(snapshot) = 'object'), CHECK (octet_length(snapshot::text) BETWEEN 2 AND 1048576),
        CHECK (revision > 0), PRIMARY KEY (owner_key,id)
    );
    CREATE INDEX IF NOT EXISTS gateway_assistant_threads_owner_created_idx
        ON gateway_assistant_threads (owner_key,created_at DESC,id DESC);
    CREATE TABLE IF NOT EXISTS gateway_assistant_messages (
        id TEXT NOT NULL, thread_id TEXT NOT NULL, owner_key TEXT NOT NULL, snapshot JSONB NOT NULL,
        revision BIGINT NOT NULL DEFAULT 1, created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (length(id) BETWEEN 1 AND 128), CHECK (length(thread_id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256), CHECK (jsonb_typeof(snapshot) = 'object'),
        CHECK (octet_length(snapshot::text) BETWEEN 2 AND 2097152), CHECK (revision > 0),
        PRIMARY KEY (owner_key,thread_id,id),
        FOREIGN KEY (owner_key,thread_id) REFERENCES gateway_assistant_threads(owner_key,id) ON DELETE CASCADE
    );
    CREATE INDEX IF NOT EXISTS gateway_assistant_messages_thread_created_idx
        ON gateway_assistant_messages (owner_key,thread_id,created_at DESC,id DESC);
  027_gateway_assistants.sql: |
    CREATE TABLE IF NOT EXISTS gateway_assistants (
        id TEXT NOT NULL,
        owner_key TEXT NOT NULL,
        snapshot JSONB NOT NULL,
        revision BIGINT NOT NULL DEFAULT 1,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (length(id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (jsonb_typeof(snapshot) = 'object'),
        CHECK (octet_length(snapshot::text) BETWEEN 2 AND 1048576),
        CHECK (revision > 0),
        PRIMARY KEY (owner_key, id)
    );
    CREATE INDEX IF NOT EXISTS gateway_assistants_owner_created_idx
        ON gateway_assistants (owner_key, created_at DESC, id DESC);
  015_billing_video_duration.sql: |
    ALTER TABLE billing_budget_reservations
        ADD COLUMN IF NOT EXISTS video_cost_per_second numeric(20,10) NOT NULL DEFAULT 0;
  026_gateway_video_jobs.sql: |
    CREATE TABLE IF NOT EXISTS gateway_video_jobs (
        video_id TEXT NOT NULL,
        owner_key TEXT NOT NULL,
        endpoint TEXT NOT NULL,
        model TEXT NOT NULL,
        deployment TEXT NOT NULL,
        snapshot JSONB NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (video_id <> '' AND length(video_id) <= 128),
        CHECK (owner_key <> '' AND length(owner_key) <= 256),
        CHECK (endpoint <> '' AND length(endpoint) <= 128),
        CHECK (model <> '' AND length(model) <= 256),
        CHECK (length(deployment) = 64),
        CHECK (octet_length(snapshot::text) <= 4194304),
        PRIMARY KEY (owner_key, video_id)
    );
    CREATE INDEX IF NOT EXISTS gateway_video_jobs_owner_created_idx
        ON gateway_video_jobs (owner_key, created_at DESC, video_id DESC);
  014_billing_training_tokens.sql: |
    ALTER TABLE billing_budget_reservations
        ADD COLUMN IF NOT EXISTS training_cost_per_1m NUMERIC(18, 8) NOT NULL DEFAULT 0;
  025_gateway_fine_tuning_jobs.sql: |
    CREATE TABLE IF NOT EXISTS gateway_fine_tuning_jobs (
        job_id TEXT PRIMARY KEY,
        owner_key TEXT NOT NULL,
        endpoint TEXT NOT NULL,
        model TEXT NOT NULL,
        deployment TEXT NOT NULL,
        snapshot JSONB NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (length(job_id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (length(endpoint) BETWEEN 1 AND 128),
        CHECK (length(model) BETWEEN 1 AND 256),
        CHECK (length(deployment) = 64),
        CHECK (jsonb_typeof(snapshot) = 'object')
    );
    CREATE INDEX IF NOT EXISTS gateway_fine_tuning_jobs_owner_created_idx
        ON gateway_fine_tuning_jobs (owner_key, created_at DESC, job_id DESC);
  024_gateway_batch_output_expiration.sql: |
    ALTER TABLE gateway_batches
        ADD COLUMN IF NOT EXISTS output_expiry_seconds BIGINT NOT NULL DEFAULT 0
        CHECK (output_expiry_seconds = 0 OR output_expiry_seconds BETWEEN 3600 AND 2592000);
  023_gateway_file_expiration.sql: |
    ALTER TABLE gateway_files
        ADD COLUMN IF NOT EXISTS expires_at TIMESTAMPTZ;
    CREATE INDEX IF NOT EXISTS gateway_files_expiration_idx
        ON gateway_files (expires_at)
        WHERE expires_at IS NOT NULL;
  022_gateway_batches.sql: |
    CREATE TABLE IF NOT EXISTS gateway_batches (
        id TEXT PRIMARY KEY,
        owner_key TEXT NOT NULL,
        input_file_id TEXT NOT NULL,
        endpoint TEXT NOT NULL,
        completion_window TEXT NOT NULL,
        status TEXT NOT NULL CHECK (status IN ('queued','in_progress','finalizing','completed','failed','expired','cancelled')),
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        identity JSONB NOT NULL,
        total INTEGER NOT NULL CHECK (total BETWEEN 1 AND 50000),
        completed INTEGER NOT NULL DEFAULT 0 CHECK (completed >= 0),
        failed INTEGER NOT NULL DEFAULT 0 CHECK (failed >= 0),
        output_file_id TEXT NOT NULL DEFAULT '',
        error_file_id TEXT NOT NULL DEFAULT '',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        in_progress_at TIMESTAMPTZ,
        expires_at TIMESTAMPTZ NOT NULL,
        finalizing_at TIMESTAMPTZ,
        completed_at TIMESTAMPTZ,
        failed_at TIMESTAMPTZ,
        expired_at TIMESTAMPTZ,
        cancelling_at TIMESTAMPTZ,
        cancelled_at TIMESTAMPTZ,
        CHECK (length(id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (completed + failed <= total),
        CHECK (jsonb_typeof(metadata) = 'object'),
        CHECK (jsonb_typeof(identity) = 'object')
    );
    CREATE INDEX IF NOT EXISTS gateway_batches_owner_created_idx
        ON gateway_batches (owner_key, created_at DESC, id DESC);
    CREATE TABLE IF NOT EXISTS gateway_batch_items (
        batch_id TEXT NOT NULL REFERENCES gateway_batches(id) ON DELETE CASCADE,
        owner_key TEXT NOT NULL,
        ordinal INTEGER NOT NULL CHECK (ordinal >= 0),
        custom_id TEXT NOT NULL,
        url TEXT NOT NULL,
        body JSONB NOT NULL,
        identity JSONB NOT NULL,
        state TEXT NOT NULL DEFAULT 'pending' CHECK (state IN ('pending','completed','failed')),
        execution_id TEXT NOT NULL UNIQUE,
        result BYTEA,
        PRIMARY KEY (batch_id, ordinal),
        UNIQUE (batch_id, custom_id),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (char_length(custom_id) BETWEEN 1 AND 128),
        CHECK (octet_length(body::text) <= 4194304)
    );
    CREATE INDEX IF NOT EXISTS gateway_batch_items_results_idx
        ON gateway_batch_items (batch_id, state, ordinal);
  021_gateway_a2a_push_configs.sql: |
    CREATE TABLE IF NOT EXISTS gateway_a2a_push_configs (
        id TEXT NOT NULL,
        task_id TEXT NOT NULL REFERENCES gateway_a2a_tasks(id) ON DELETE CASCADE,
        owner_key TEXT NOT NULL,
        agent_id TEXT NOT NULL,
        payload BYTEA NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (task_id, id),
        CHECK (length(id) BETWEEN 1 AND 128),
        CHECK (length(task_id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (length(agent_id) BETWEEN 1 AND 128),
        CHECK (octet_length(payload) BETWEEN 1 AND 16384)
    );
    CREATE INDEX IF NOT EXISTS gateway_a2a_push_configs_owner_task_created_idx
        ON gateway_a2a_push_configs (owner_key, agent_id, task_id, created_at DESC, id DESC);
  020_gateway_a2a_tasks.sql: |
    CREATE TABLE IF NOT EXISTS gateway_a2a_tasks (
        id TEXT PRIMARY KEY,
        owner_key TEXT NOT NULL,
        agent_id TEXT NOT NULL,
        model TEXT NOT NULL,
        context_id TEXT NOT NULL,
        state TEXT NOT NULL CHECK (state IN ('TASK_STATE_UNSPECIFIED','TASK_STATE_SUBMITTED','TASK_STATE_WORKING','TASK_STATE_COMPLETED','TASK_STATE_FAILED','TASK_STATE_CANCELED','TASK_STATE_INPUT_REQUIRED','TASK_STATE_REJECTED','TASK_STATE_AUTH_REQUIRED')),
        payload BYTEA NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        expires_at TIMESTAMPTZ NOT NULL,
        CHECK (length(id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (length(agent_id) BETWEEN 1 AND 128),
        CHECK (length(model) BETWEEN 1 AND 256),
        CHECK (length(context_id) BETWEEN 1 AND 128),
        CHECK (length(state) BETWEEN 1 AND 64),
        CHECK (octet_length(payload) BETWEEN 1 AND 2097152),
        CHECK (expires_at > created_at)
    );
    CREATE INDEX IF NOT EXISTS gateway_a2a_tasks_owner_agent_created_idx
        ON gateway_a2a_tasks (owner_key, agent_id, model, created_at DESC, id DESC);
    CREATE INDEX IF NOT EXISTS gateway_a2a_tasks_expiry_idx
        ON gateway_a2a_tasks (expires_at);
  019_gateway_vector_store_files.sql: |
    CREATE TABLE IF NOT EXISTS gateway_vector_store_files (
        vector_store_id TEXT NOT NULL REFERENCES gateway_vector_stores(id) ON DELETE CASCADE,
        file_id TEXT NOT NULL REFERENCES gateway_files(id) ON DELETE CASCADE,
        owner_key TEXT NOT NULL,
        status TEXT NOT NULL DEFAULT 'completed' CHECK (status IN ('completed')),
        attributes JSONB NOT NULL DEFAULT '{}'::jsonb CONSTRAINT gateway_vector_store_files_attributes_object CHECK (jsonb_typeof(attributes) = 'object'),
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (vector_store_id, file_id),
        CHECK (length(vector_store_id) BETWEEN 1 AND 128),
        CHECK (length(file_id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256)
    );
    CREATE INDEX IF NOT EXISTS gateway_vector_store_files_owner_created_idx
        ON gateway_vector_store_files (owner_key, vector_store_id, created_at DESC, file_id DESC);
  030_gateway_vector_store_file_attributes.sql: |
    ALTER TABLE gateway_vector_store_files
        ADD COLUMN IF NOT EXISTS attributes JSONB NOT NULL DEFAULT '{}'::jsonb;
    DO $$
    BEGIN
        IF NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conrelid = 'gateway_vector_store_files'::regclass
              AND conname = 'gateway_vector_store_files_attributes_object'
        ) THEN
            ALTER TABLE gateway_vector_store_files
                ADD CONSTRAINT gateway_vector_store_files_attributes_object
                CHECK (jsonb_typeof(attributes) = 'object');
        END IF;
    END $$;
  018_gateway_vector_stores.sql: |
    CREATE TABLE IF NOT EXISTS gateway_vector_stores (
        id TEXT PRIMARY KEY,
        owner_key TEXT NOT NULL,
        name TEXT NOT NULL,
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        expires_after_days INTEGER NOT NULL DEFAULT 0 CHECK (expires_after_days BETWEEN 0 AND 365),
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        last_active_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        expires_at TIMESTAMPTZ,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (length(id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (char_length(name) BETWEEN 1 AND 256),
        CHECK (jsonb_typeof(metadata) = 'object'),
        CHECK ((expires_after_days = 0 AND expires_at IS NULL)
            OR (expires_after_days > 0 AND expires_at IS NOT NULL))
    );
    CREATE INDEX IF NOT EXISTS gateway_vector_stores_owner_created_idx
        ON gateway_vector_stores (owner_key, created_at DESC, id DESC);
    CREATE INDEX IF NOT EXISTS gateway_vector_stores_expiry_idx
        ON gateway_vector_stores (expires_at) WHERE expires_at IS NOT NULL;
  017_gateway_async_jobs.sql: |
    CREATE TABLE IF NOT EXISTS gateway_async_jobs (
        kind TEXT NOT NULL,
        resource_id TEXT NOT NULL,
        owner_key TEXT NOT NULL,
        endpoint_id TEXT NOT NULL,
        execution_id TEXT NOT NULL UNIQUE,
        payload BYTEA NOT NULL,
        state TEXT NOT NULL DEFAULT 'pending' CHECK (state IN ('pending','leased')),
        attempts INTEGER NOT NULL DEFAULT 0 CHECK (attempts >= 0),
        lease_generation BIGINT NOT NULL DEFAULT 0 CHECK (lease_generation >= 0),
        available_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        lease_until TIMESTAMPTZ,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (kind,resource_id),
        CHECK (length(kind) BETWEEN 1 AND 64),
        CHECK (length(resource_id) BETWEEN 1 AND 256),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (length(endpoint_id) BETWEEN 1 AND 128),
        CHECK (length(execution_id) BETWEEN 1 AND 128),
        CHECK (octet_length(payload) BETWEEN 1 AND 65536)
    );
    CREATE INDEX IF NOT EXISTS gateway_async_jobs_due_idx
        ON gateway_async_jobs (kind,available_at,created_at) WHERE state='pending';
    CREATE INDEX IF NOT EXISTS gateway_async_jobs_expired_lease_idx
        ON gateway_async_jobs (kind,lease_until) WHERE state='leased';
  016_gateway_skill_ownership.sql: |
    CREATE TABLE IF NOT EXISTS gateway_skill_ownership (
        skill_id TEXT PRIMARY KEY,
        owner_key TEXT NOT NULL,
        endpoint_id TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS gateway_skill_ownership_owner_endpoint_idx
        ON gateway_skill_ownership (owner_key, endpoint_id, skill_id);
  015_gateway_files.sql: |
    CREATE TABLE IF NOT EXISTS gateway_files
    (
        id TEXT PRIMARY KEY,
        owner_key TEXT NOT NULL,
        filename TEXT NOT NULL,
        purpose TEXT NOT NULL,
        content_type TEXT NOT NULL,
        bytes BIGINT NOT NULL CHECK (bytes >= 0),
        content BYTEA NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (length(id) BETWEEN 1 AND 128),
        CHECK (length(owner_key) BETWEEN 1 AND 256),
        CHECK (length(filename) BETWEEN 1 AND 512),
        CHECK (length(purpose) BETWEEN 1 AND 64),
        CHECK (length(content_type) BETWEEN 1 AND 255),
        CHECK (octet_length(content) = bytes)
    );
    CREATE INDEX IF NOT EXISTS gateway_files_owner_created_idx
        ON gateway_files (owner_key, created_at DESC, id DESC);
    CREATE INDEX IF NOT EXISTS gateway_files_owner_purpose_created_idx
        ON gateway_files (owner_key, purpose, created_at DESC, id DESC);
  014_gateway_mcp_tool_calls.sql: |
    CREATE TABLE IF NOT EXISTS gateway_mcp_tool_calls
    (
        scope_key TEXT NOT NULL,
        idempotency_key TEXT NOT NULL,
        request_hash TEXT NOT NULL,
        execution_id TEXT NOT NULL,
        state TEXT NOT NULL CHECK (state IN ('pending', 'completed')),
        http_status INTEGER NOT NULL DEFAULT 0 CHECK (http_status BETWEEN 0 AND 599),
        response BYTEA,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (scope_key, idempotency_key),
        CHECK (length(scope_key) BETWEEN 1 AND 1024),
        CHECK (length(idempotency_key) BETWEEN 1 AND 128),
        CHECK (length(request_hash) = 64),
        CHECK (length(execution_id) BETWEEN 1 AND 128),
        CHECK ((state = 'pending' AND http_status = 0 AND response IS NULL)
            OR (state = 'completed' AND http_status BETWEEN 100 AND 599 AND response IS NOT NULL))
    );
    DO $$
    BEGIN
        IF EXISTS (
            SELECT 1 FROM information_schema.columns
            WHERE table_name = 'gateway_mcp_tool_calls'
              AND column_name = 'response'
              AND data_type <> 'bytea'
        ) THEN
            ALTER TABLE gateway_mcp_tool_calls
                ALTER COLUMN response TYPE BYTEA USING convert_to(response::text, 'UTF8');
        END IF;
    END $$;
    CREATE INDEX IF NOT EXISTS gateway_mcp_tool_calls_updated_at_idx
        ON gateway_mcp_tool_calls (updated_at);
    DELETE FROM gateway_mcp_tool_calls WHERE updated_at < now() - interval '24 hours';
  007_gateway_control_plane.sql: |
    CREATE TABLE IF NOT EXISTS gateway_control_plane_state
    (
        singleton BOOLEAN PRIMARY KEY DEFAULT TRUE CHECK (singleton),
        revision BIGINT NOT NULL DEFAULT 0 CHECK (revision >= 0),
        payload JSONB NOT NULL DEFAULT '{}'::jsonb,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    INSERT INTO gateway_control_plane_state (singleton, revision, payload)
    VALUES (TRUE, 0, '{}'::jsonb)
    ON CONFLICT (singleton) DO NOTHING;

  001_financial_core.sql: |
    CREATE TABLE IF NOT EXISTS users
    (
        id TEXT PRIMARY KEY,
        email TEXT,
        status TEXT NOT NULL DEFAULT 'active',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS tariffs
    (
        id TEXT PRIMARY KEY,
        name TEXT NOT NULL,
        currency TEXT NOT NULL DEFAULT 'USD',
        enabled BOOLEAN NOT NULL DEFAULT true,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS tariff_prices
    (
        id BIGSERIAL PRIMARY KEY,
        tariff_id TEXT NOT NULL REFERENCES tariffs(id),
        provider TEXT NOT NULL,
        model TEXT NOT NULL,
        input_price_per_1k NUMERIC(18, 8) NOT NULL DEFAULT 0,
        output_price_per_1k NUMERIC(18, 8) NOT NULL DEFAULT 0,
        effective_from TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS user_tariffs
    (
        user_id TEXT NOT NULL REFERENCES users(id),
        tariff_id TEXT NOT NULL REFERENCES tariffs(id),
        active_from TIMESTAMPTZ NOT NULL DEFAULT now(),
        active_to TIMESTAMPTZ,
        PRIMARY KEY (user_id, tariff_id, active_from)
    );

    CREATE TABLE IF NOT EXISTS balances
    (
        user_id TEXT PRIMARY KEY REFERENCES users(id),
        currency TEXT NOT NULL DEFAULT 'USD',
        amount NUMERIC(18, 8) NOT NULL DEFAULT 0,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS invoices
    (
        id TEXT PRIMARY KEY,
        user_id TEXT NOT NULL REFERENCES users(id),
        currency TEXT NOT NULL DEFAULT 'USD',
        amount NUMERIC(18, 8) NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS payments
    (
        id TEXT PRIMARY KEY,
        user_id TEXT NOT NULL REFERENCES users(id),
        invoice_id TEXT REFERENCES invoices(id),
        currency TEXT NOT NULL DEFAULT 'USD',
        amount NUMERIC(18, 8) NOT NULL,
        status TEXT NOT NULL,
        provider TEXT,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS limits
    (
        id BIGSERIAL PRIMARY KEY,
        user_id TEXT NOT NULL REFERENCES users(id),
        provider TEXT,
        model TEXT,
        max_input_tokens_per_day BIGINT,
        max_output_tokens_per_day BIGINT,
        max_total_tokens_per_day BIGINT,
        max_cost_per_day NUMERIC(18, 8),
        enabled BOOLEAN NOT NULL DEFAULT true
    );

    CREATE TABLE IF NOT EXISTS quotas
    (
        id BIGSERIAL PRIMARY KEY,
        user_id TEXT NOT NULL REFERENCES users(id),
        period TEXT NOT NULL,
        provider TEXT,
        model TEXT,
        total_tokens BIGINT NOT NULL DEFAULT 0,
        cost NUMERIC(18, 8) NOT NULL DEFAULT 0,
        enabled BOOLEAN NOT NULL DEFAULT true
    );

    CREATE TABLE IF NOT EXISTS financial_transactions
    (
        id TEXT PRIMARY KEY,
        user_id TEXT NOT NULL REFERENCES users(id),
        request_id TEXT,
        transaction_type TEXT NOT NULL,
        currency TEXT NOT NULL DEFAULT 'USD',
        amount NUMERIC(18, 8) NOT NULL,
        balance_after NUMERIC(18, 8),
        metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_financial_transactions_user_created
        ON financial_transactions(user_id, created_at DESC);

  002_billing_outbox.sql: |
    CREATE TABLE IF NOT EXISTS billing_event_ledger
    (
        event_id TEXT PRIMARY KEY,
        request_id TEXT NOT NULL,
        phase TEXT NOT NULL CHECK (phase IN ('reserve', 'commit', 'cancel')),
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS billing_outbox
    (
        id BIGSERIAL PRIMARY KEY,
        event_id TEXT NOT NULL UNIQUE REFERENCES billing_event_ledger(event_id),
        payload JSONB NOT NULL,
        attempts INTEGER NOT NULL DEFAULT 0,
        available_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        locked_at TIMESTAMPTZ,
        delivered_at TIMESTAMPTZ,
        last_error TEXT,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_billing_outbox_pending
        ON billing_outbox(available_at, id)
        WHERE delivered_at IS NULL;
  004_budgets.sql: |
    CREATE TABLE IF NOT EXISTS billing_budget_policies
    (
        id BIGSERIAL PRIMARY KEY,
        scope_type TEXT NOT NULL CHECK (scope_type IN ('global', 'key', 'user', 'team', 'model', 'provider')),
        scope_id TEXT NOT NULL,
        period TEXT NOT NULL CHECK (period IN ('hour', 'day', 'week', 'month')),
        currency TEXT NOT NULL DEFAULT 'USD',
        max_cost NUMERIC(18, 8),
        max_tokens BIGINT,
        enabled BOOLEAN NOT NULL DEFAULT TRUE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CHECK (COALESCE(max_cost, 0) > 0 OR COALESCE(max_tokens, 0) > 0)
    );
    CREATE INDEX IF NOT EXISTS idx_billing_budget_policies_scope
        ON billing_budget_policies(enabled, currency, scope_type, scope_id);
    CREATE TABLE IF NOT EXISTS billing_budget_reservations
    (
        request_id TEXT PRIMARY KEY,
        owner_key TEXT NOT NULL,
        credential_id TEXT NOT NULL DEFAULT '',
        user_id TEXT NOT NULL DEFAULT '',
        team_id TEXT NOT NULL DEFAULT '',
        provider_name TEXT NOT NULL DEFAULT '',
        provider_type TEXT NOT NULL DEFAULT '',
        model TEXT NOT NULL DEFAULT '',
        currency TEXT NOT NULL DEFAULT 'USD',
        state TEXT NOT NULL CHECK (state IN ('reserved', 'committed', 'canceled')),
        reserved_cost NUMERIC(18, 8) NOT NULL DEFAULT 0,
        reserved_tokens BIGINT NOT NULL DEFAULT 0,
        actual_cost NUMERIC(18, 8) NOT NULL DEFAULT 0,
        actual_tokens BIGINT NOT NULL DEFAULT 0,
        reservation_expires_at TIMESTAMPTZ NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_billing_budget_reservations_active
        ON billing_budget_reservations(created_at, reservation_expires_at, state);
    CREATE INDEX IF NOT EXISTS idx_billing_budget_reservations_identity
        ON billing_budget_reservations(credential_id, user_id, team_id, model, provider_name, provider_type);
  005_pricing_snapshots.sql: |
    ALTER TABLE billing_budget_reservations
        ADD COLUMN IF NOT EXISTS catalog_version TEXT NOT NULL DEFAULT '',
        ADD COLUMN IF NOT EXISTS pricing_key TEXT NOT NULL DEFAULT '',
        ADD COLUMN IF NOT EXISTS input_cost_per_1m NUMERIC(18, 8) NOT NULL DEFAULT 0,
        ADD COLUMN IF NOT EXISTS output_cost_per_1m NUMERIC(18, 8) NOT NULL DEFAULT 0;
  006_management_audit.sql: |
    CREATE TABLE IF NOT EXISTS management_audit_events
    (
        id BIGSERIAL PRIMARY KEY,
        occurred_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        request_id TEXT NOT NULL,
        actor_id TEXT NOT NULL,
        actor_credential_id TEXT NOT NULL,
        action TEXT NOT NULL,
        target_type TEXT NOT NULL,
        target_id TEXT NOT NULL DEFAULT '',
        outcome TEXT NOT NULL CHECK (outcome IN ('attempted', 'succeeded', 'failed')),
        details JSONB NOT NULL DEFAULT '{}'::jsonb
    );
    CREATE INDEX IF NOT EXISTS idx_management_audit_events_time
        ON management_audit_events(occurred_at DESC, id DESC);
    CREATE INDEX IF NOT EXISTS idx_management_audit_events_actor
        ON management_audit_events(actor_id, id DESC);
    CREATE INDEX IF NOT EXISTS idx_management_audit_events_action
        ON management_audit_events(action, id DESC);
  007_tag_budgets.sql: |
    ALTER TABLE billing_budget_policies
        DROP CONSTRAINT IF EXISTS billing_budget_policies_scope_type_check;
    ALTER TABLE billing_budget_policies
        ADD CONSTRAINT billing_budget_policies_scope_type_check
        CHECK (scope_type IN ('global', 'key', 'user', 'team', 'organization', 'model', 'provider', 'deployment', 'tag'));
    ALTER TABLE billing_budget_reservations
        ADD COLUMN IF NOT EXISTS tags TEXT[] NOT NULL DEFAULT '{}';
    CREATE INDEX IF NOT EXISTS idx_billing_budget_reservations_tags
        ON billing_budget_reservations USING GIN(tags);
  008_organization_budgets.sql: |
    ALTER TABLE billing_budget_policies
        DROP CONSTRAINT IF EXISTS billing_budget_policies_scope_type_check;
    ALTER TABLE billing_budget_policies
        ADD CONSTRAINT billing_budget_policies_scope_type_check
        CHECK (scope_type IN ('global', 'key', 'user', 'team', 'organization', 'model', 'provider', 'deployment', 'tag'));
    ALTER TABLE billing_budget_reservations
        ADD COLUMN IF NOT EXISTS organization_id TEXT NOT NULL DEFAULT '';
    CREATE INDEX IF NOT EXISTS idx_billing_budget_reservations_organization
        ON billing_budget_reservations(organization_id, created_at, state);
  010_billing_server_tools.sql: |
    ALTER TABLE billing_budget_reservations
        ADD COLUMN IF NOT EXISTS search_cost_per_1k NUMERIC(18, 8) NOT NULL DEFAULT 0;
  011_billing_characters.sql: |
    ALTER TABLE billing_budget_reservations
        ADD COLUMN IF NOT EXISTS character_cost_per_1m NUMERIC(18, 8) NOT NULL DEFAULT 0;
  012_billing_pages.sql: |
    ALTER TABLE billing_budget_reservations
        ADD COLUMN IF NOT EXISTS page_cost_per_1k NUMERIC(18, 8) NOT NULL DEFAULT 0;
  013_billing_audio_duration.sql: |
