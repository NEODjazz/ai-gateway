  003_virtual_keys.sql: |
    CREATE TABLE IF NOT EXISTS auth_virtual_keys
    (
        id TEXT PRIMARY KEY,
        token_hash CHAR(64) NOT NULL UNIQUE,
        user_id TEXT NOT NULL,
        team_id TEXT,
        roles TEXT[] NOT NULL DEFAULT '{}',
        allowed_models TEXT[] NOT NULL DEFAULT '{}',
        rate_limit_rpm INTEGER NOT NULL DEFAULT 0 CHECK (rate_limit_rpm >= 0),
        rate_limit_tpm INTEGER NOT NULL DEFAULT 0 CHECK (rate_limit_tpm >= 0),
        rotation_family_id TEXT NOT NULL,
        rotated_from_id TEXT REFERENCES auth_virtual_keys(id),
        rotated_to_id TEXT REFERENCES auth_virtual_keys(id),
        expires_at TIMESTAMPTZ,
        revoked_at TIMESTAMPTZ,
        last_used_at TIMESTAMPTZ,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_auth_virtual_keys_active_hash
        ON auth_virtual_keys(token_hash)
        WHERE revoked_at IS NULL;

    CREATE INDEX IF NOT EXISTS idx_auth_virtual_keys_user
        ON auth_virtual_keys(user_id, created_at DESC);
  004_allowed_tools.sql: |
    ALTER TABLE auth_virtual_keys
        ADD COLUMN IF NOT EXISTS allowed_tools TEXT[] NOT NULL DEFAULT '{}';
  005_virtual_key_metadata.sql: |
    ALTER TABLE auth_virtual_keys
        ADD COLUMN IF NOT EXISTS alias TEXT NOT NULL DEFAULT '',
        ADD COLUMN IF NOT EXISTS description TEXT NOT NULL DEFAULT '',
        ADD COLUMN IF NOT EXISTS tags TEXT[] NOT NULL DEFAULT '{}',
        ADD COLUMN IF NOT EXISTS disabled_at TIMESTAMPTZ;

    CREATE INDEX IF NOT EXISTS auth_virtual_keys_disabled_at_idx
        ON auth_virtual_keys (disabled_at)
        WHERE disabled_at IS NOT NULL AND revoked_at IS NULL;
  006_identity_directory.sql: |
    CREATE TABLE IF NOT EXISTS users
    (
        id TEXT PRIMARY KEY,
        email TEXT,
        status TEXT NOT NULL DEFAULT 'active',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE users
        ADD COLUMN IF NOT EXISTS name TEXT NOT NULL DEFAULT '',
        ADD COLUMN IF NOT EXISTS roles TEXT[] NOT NULL DEFAULT '{}',
        ADD COLUMN IF NOT EXISTS updated_at TIMESTAMPTZ NOT NULL DEFAULT now();

    CREATE TABLE IF NOT EXISTS auth_teams
    (
        id TEXT PRIMARY KEY,
        name TEXT NOT NULL,
        description TEXT NOT NULL DEFAULT '',
        status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active', 'disabled')),
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS auth_team_memberships
    (
        team_id TEXT NOT NULL REFERENCES auth_teams(id) ON DELETE CASCADE,
        user_id TEXT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        roles TEXT[] NOT NULL DEFAULT '{}',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (team_id, user_id)
    );

    CREATE INDEX IF NOT EXISTS auth_team_memberships_user_idx
        ON auth_team_memberships (user_id, team_id);
  007_organizations.sql: |
    CREATE TABLE IF NOT EXISTS auth_organizations
    (
        id TEXT PRIMARY KEY,
        name TEXT NOT NULL,
        description TEXT NOT NULL DEFAULT '',
        status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active', 'disabled')),
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS auth_organization_teams
    (
        organization_id TEXT NOT NULL REFERENCES auth_organizations(id) ON DELETE CASCADE,
        team_id TEXT NOT NULL REFERENCES auth_teams(id) ON DELETE CASCADE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        PRIMARY KEY (organization_id, team_id)
    );

    CREATE UNIQUE INDEX IF NOT EXISTS auth_organization_teams_team_idx
        ON auth_organization_teams (team_id);

  008_virtual_key_ownership.sql: |
    ALTER TABLE auth_virtual_keys
        ALTER COLUMN user_id DROP NOT NULL;

    ALTER TABLE auth_virtual_keys
        ADD COLUMN IF NOT EXISTS organization_id TEXT REFERENCES auth_organizations(id);

    CREATE INDEX IF NOT EXISTS auth_virtual_keys_organization_idx
        ON auth_virtual_keys (organization_id, created_at DESC);
  009_virtual_key_access_groups.sql: |
    ALTER TABLE auth_virtual_keys
        ADD COLUMN IF NOT EXISTS access_group_ids TEXT[] NOT NULL DEFAULT '{}';

    CREATE INDEX IF NOT EXISTS auth_virtual_keys_access_groups_idx
        ON auth_virtual_keys USING GIN (access_group_ids);
  010_scim_users.sql: |
    ALTER TABLE users
        ADD COLUMN IF NOT EXISTS external_id TEXT NOT NULL DEFAULT '',
        ADD COLUMN IF NOT EXISTS scim_deleted_at TIMESTAMPTZ;

    CREATE UNIQUE INDEX IF NOT EXISTS auth_users_external_id_active_idx
        ON users (external_id)
        WHERE external_id <> '' AND scim_deleted_at IS NULL;

    CREATE UNIQUE INDEX IF NOT EXISTS auth_users_username_active_idx
        ON users (lower(email))
        WHERE email IS NOT NULL AND email <> '' AND scim_deleted_at IS NULL;
  011_scim_user_deletions.sql: |
    ALTER TABLE users
        ADD COLUMN IF NOT EXISTS scim_deleted_at TIMESTAMPTZ;

    DROP INDEX IF EXISTS auth_users_external_id_idx;
    DROP INDEX IF EXISTS auth_users_username_idx;

    CREATE INDEX IF NOT EXISTS auth_users_scim_visible_idx
        ON users (created_at DESC, id)
        WHERE scim_deleted_at IS NULL;
  012_scim_groups.sql: |
    ALTER TABLE auth_teams
        ADD COLUMN IF NOT EXISTS external_id TEXT NOT NULL DEFAULT '',
        ADD COLUMN IF NOT EXISTS scim_deleted_at TIMESTAMPTZ;

    CREATE UNIQUE INDEX IF NOT EXISTS auth_teams_external_id_active_idx
        ON auth_teams (external_id)
        WHERE external_id <> '' AND scim_deleted_at IS NULL;

    CREATE UNIQUE INDEX IF NOT EXISTS auth_teams_name_active_idx
        ON auth_teams (lower(name))
        WHERE scim_deleted_at IS NULL;

    CREATE INDEX IF NOT EXISTS auth_teams_scim_visible_idx
        ON auth_teams (created_at DESC, id)
        WHERE scim_deleted_at IS NULL;
