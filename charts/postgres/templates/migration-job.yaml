{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgres.fullname" . }}-migrate
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}
                  key: password
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "postgres.fullname" . }} -U {{ .Values.username }}; do sleep 2; done
              for migration in /migrations/*.sql; do
                psql -v ON_ERROR_STOP=1 -h {{ include "postgres.fullname" . }} -U {{ .Values.username }} -d {{ .Values.database }} -f "$migration"
              done
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: {{ include "postgres.fullname" . }}-migrations
{{- end }}
