      properties:
        enabled: {type: boolean}
        model: {type: string, minLength: 1, description: Required when enabled is true.}
        provider: {type: string}
        top_n: {type: integer, minimum: 1, maximum: 20, description: Defaults to the smaller of 5 and the number of retrieved excerpts.}
      if:
        properties: {enabled: {const: true}}
      then:
        required: [model]
    VectorStoreSearchRequest:
      type: object
      additionalProperties: false
      required: [query, model]
      properties:
        query: {type: string, minLength: 1, maxLength: 4096}
        model: {type: string, minLength: 1}
        provider: {type: string}
        max_num_results: {type: integer, minimum: 1, maximum: 50, default: 10}
        filters:
          $ref: '#/components/schemas/VectorStoreSearchFilters'
    VectorStoreSearchFilters:
      anyOf:
        - type: object
          propertyNames: {maxLength: 64}
          additionalProperties:
            oneOf:
              - {type: string, maxLength: 512}
              - {type: number}
              - {type: boolean}
          maxProperties: 16
        - $ref: '#/components/schemas/VectorStoreSearchComparisonFilter'
        - $ref: '#/components/schemas/VectorStoreSearchCompoundFilter'
    VectorStoreSearchComparisonFilter:
      type: object
      additionalProperties: false
      required: [type, key, value]
      properties:
        type: {type: string, enum: [eq, ne, in, nin, gt, gte, lt, lte]}
        key: {type: string, minLength: 1, maxLength: 64}
        value:
          oneOf:
            - {type: string, maxLength: 512}
            - {type: number}
            - {type: boolean}
            - type: array
              minItems: 1
              maxItems: 16
              items:
                oneOf:
                  - {type: string, maxLength: 512}
                  - {type: number}
                  - {type: boolean}
    VectorStoreSearchCompoundFilter:
      type: object
      additionalProperties: false
      required: [type, filters]
      properties:
        type: {type: string, enum: [and, or]}
        filters:
          type: array
          minItems: 1
          maxItems: 16
          items:
            oneOf:
              - $ref: '#/components/schemas/VectorStoreSearchComparisonFilter'
              - $ref: '#/components/schemas/VectorStoreSearchCompoundFilter'
    VectorStoreSearchContent:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: {type: string, const: text}
        text: {type: string}
    VectorStoreSearchResult:
      type: object
      additionalProperties: false
      required: [file_id, filename, score, attributes, content]
      properties:
        file_id: {type: string}
        filename: {type: string}
        score: {type: number, minimum: 0, maximum: 1}
        attributes:
          type: object
          propertyNames: {maxLength: 64}
          additionalProperties:
            oneOf:
              - {type: string, maxLength: 512}
              - {type: number}
              - {type: boolean}
          maxProperties: 16
        content: {type: array, minItems: 1, maxItems: 1, items: {$ref: '#/components/schemas/VectorStoreSearchContent'}}
    VectorStoreSearchResultPage:
      type: object
      additionalProperties: false
      required: [object, search_query, data, has_more, next_page]
      properties:
        object: {type: string, const: vector_store.search_results.page}
        search_query: {type: array, minItems: 1, maxItems: 1, items: {type: string}}
        data: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/VectorStoreSearchResult'}}
        has_more: {type: boolean, const: false}
        next_page: {type: 'null'}
    BedrockInvokeRequest:
      type: object
      additionalProperties: false
      required: [anthropic_version, max_tokens, messages]
      properties:
        anthropic_version: {type: string, const: bedrock-2023-05-31}
        max_tokens: {type: integer, minimum: 1, maximum: 2147483647}
        messages:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: {type: string, enum: [user, assistant]}
              content:
                oneOf:
                  - {type: string}
                  - type: array
                    minItems: 1
                    items: {type: object, description: 'Text, image, tool_use, tool_result, thinking or redacted_thinking block'}
        system:
          description: Text or an array of text blocks.
          oneOf:
            - {type: string}
            - type: array
              minItems: 1
              items: {type: object}
        tools:
          type: array
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [name, input_schema]
            properties:
              name: {type: string, minLength: 1}
              description: {type: string}
              input_schema: {type: object, additionalProperties: true}
              cache_control:
                type: object
                additionalProperties: false
                required: [type]
                properties:
                  type: {type: string, const: ephemeral}
                  ttl: {type: string, enum: [5m, 1h]}
        tool_choice:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, enum: [auto, any, none, tool]}
            name: {type: string}
            disable_parallel_tool_use: {type: boolean}
        output_config:
          type: object
          additionalProperties: false
          required: [format]
          properties:
            format:
              type: object
              additionalProperties: false
              required: [type, schema]
              properties:
                type: {type: string, const: json_schema}
                schema: {type: object, additionalProperties: true}
        temperature: {type: number, minimum: 0, maximum: 1}
        top_p: {type: number, minimum: 0, maximum: 1}
        stop_sequences:
          type: array
          maxItems: 4
          items: {type: string, minLength: 1}
    BedrockConverseRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/BedrockMessage'}
        system:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/BedrockSystemContentBlock'}
        inferenceConfig: {$ref: '#/components/schemas/BedrockInferenceConfig'}
        toolConfig: {$ref: '#/components/schemas/BedrockToolConfig'}
        serviceTier:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, enum: [default, flex, priority, reserved]}
        performanceConfig:
          type: object
          additionalProperties: false
          required: [latency]
          properties:
            latency: {type: string, enum: [standard, optimized]}
        outputConfig:
          $ref: '#/components/schemas/BedrockOutputConfig'
        guardrailConfig:
          type: object
          additionalProperties: false
          required: [guardrailIdentifier, guardrailVersion]
          properties:
            guardrailIdentifier: {type: string, minLength: 1, maxLength: 2048, pattern: '^(?:[a-z0-9]+|arn:aws(?:-[^:]+)?:bedrock:[a-z0-9-]{1,20}:[0-9]{12}:guardrail/[a-z0-9]+)$'}
            guardrailVersion: {type: string, pattern: '^(?:[1-9][0-9]{0,7}|DRAFT)$'}
            trace: {type: string, enum: [enabled, disabled, enabled_full]}
        additionalModelRequestFields:
          description: A non-null JSON value of model-specific inference parameters, bounded to 64 KiB by the gateway.
        additionalModelResponseFieldPaths:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Non-empty RFC 6901 JSON Pointers for bounded model-specific response fields.
          items: {type: string, minLength: 1, maxLength: 256, pattern: '^/([^~]|~[01])*$'}
        requestMetadata:
          type: object
          maxProperties: 16
          description: Bounded key-value metadata attached to the provider invocation log. Requests using it bypass response caches.
          propertyNames: {minLength: 1, maxLength: 256, pattern: '^[a-zA-Z0-9\s:_@$#=/+,.-]+$'}
          additionalProperties: {type: string, maxLength: 256, pattern: '^[a-zA-Z0-9\s:_@$#=/+,.-]*$'}
    BedrockInferenceConfig:
      type: object
      additionalProperties: false
      properties:
        maxTokens: {type: integer, minimum: 1, maximum: 2147483647}
        temperature: {type: number, minimum: 0, maximum: 1}
        topP: {type: number, minimum: 0, maximum: 1}
        stopSequences:
          type: array
          maxItems: 4
          items: {type: string, minLength: 1}
    BedrockOutputConfig:
      type: object
      additionalProperties: false
      required: [textFormat]
      properties:
        textFormat:
          type: object
          additionalProperties: false
          required: [type, structure]
          properties:
            type: {type: string, const: json_schema}
            structure:
              type: object
              additionalProperties: false
              required: [jsonSchema]
              properties:
                jsonSchema:
                  type: object
                  additionalProperties: false
                  required: [schema]
                  properties:
                    schema: {type: string, minLength: 1, maxLength: 1048576, description: JSON-encoded schema object}
                    name: {type: string, maxLength: 256}
                    description: {type: string, maxLength: 8192}
    BedrockMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant]}
        content:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/BedrockContentBlock'}
    BedrockContentBlock:
      type: object
      additionalProperties: false
      oneOf:
        - required: [text]
        - required: [cachePoint]
        - required: [image]
        - required: [document]
        - required: [toolUse]
        - required: [toolResult]
        - required: [citationsContent]
        - required: [reasoningContent]
      properties:
        text: {type: string, minLength: 1}
        cachePoint: {$ref: '#/components/schemas/BedrockCachePoint'}
        image:
          type: object
          additionalProperties: false
          required: [format, source]
          properties:
            format: {type: string, enum: [jpeg, png, gif, webp]}
            source:
              type: object
              additionalProperties: false
              required: [bytes]
              properties:
                bytes: {type: string, minLength: 4, maxLength: 11184812, pattern: '^[A-Za-z0-9+/]+={0,2}$'}
        document:
          type: object
          additionalProperties: false
          required: [format, name, source]
          properties:
            format: {type: string, enum: [pdf, csv, doc, docx, xls, xlsx, html, txt, md]}
            name: {type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9][A-Za-z0-9 ()\[\]-]*[A-Za-z0-9)\]]$|^[A-Za-z0-9]$'}
            source:
              type: object
              additionalProperties: false
              required: [bytes]
              properties:
                bytes: {type: string, minLength: 4, maxLength: 6291456, pattern: '^[A-Za-z0-9+/]+={0,2}$'}
        toolUse:
          type: object
          additionalProperties: false
          required: [toolUseId, name, input]
          properties:
            toolUseId: {type: string, minLength: 1}
            name: {type: string, minLength: 1}
            input: {}
        toolResult:
          type: object
          additionalProperties: false
          required: [toolUseId, content]
          properties:
            toolUseId: {type: string, minLength: 1}
            content:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                additionalProperties: false
                required: [text]
                properties:
                  text: {type: string, minLength: 1}
        citationsContent:
          allOf:
            - {$ref: '#/components/schemas/BedrockCitationsContent'}
          readOnly: true
        reasoningContent:
          $ref: '#/components/schemas/BedrockReasoningContent'
    BedrockSystemContentBlock:
      type: object
      additionalProperties: false
      oneOf:
        - required: [text]
        - required: [cachePoint]
      properties:
        text: {type: string, minLength: 1}
        cachePoint: {$ref: '#/components/schemas/BedrockCachePoint'}
    BedrockCachePoint:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, const: default}
        ttl: {type: string, enum: [5m, 1h]}
    BedrockReasoningContent:
      type: object
      additionalProperties: false
      oneOf:
        - required: [reasoningText]
        - required: [redactedContent]
      properties:
        reasoningText:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text: {type: string, minLength: 1, maxLength: 1048576}
            signature: {type: string, minLength: 1, maxLength: 1048576}
        redactedContent:
          type: string
          minLength: 4
          maxLength: 1048576
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
    BedrockCitationsContent:
      type: object
      additionalProperties: false
      required: [content, citations]
      properties:
        content:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: {type: string}
        citations:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/BedrockCitation'}
    BedrockCitation:
      type: object
      additionalProperties: false
      required: [location]
      properties:
        title: {type: string, maxLength: 2048}
        source: {type: string, maxLength: 8192}
        sourceContent:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: {type: string, maxLength: 65536}
        location:
          $ref: '#/components/schemas/BedrockCitationLocation'
    BedrockCitationLocation:
      type: object
      additionalProperties: false
      oneOf:
        - required: [documentChar]
        - required: [documentChunk]
        - required: [documentPage]
        - required: [searchResultLocation]
        - required: [web]
      properties:
        documentChar: {$ref: '#/components/schemas/BedrockDocumentLocation'}
        documentChunk: {$ref: '#/components/schemas/BedrockDocumentLocation'}
        documentPage: {$ref: '#/components/schemas/BedrockDocumentLocation'}
        searchResultLocation:
          type: object
          additionalProperties: false
          required: [searchResultIndex, start, end]
          properties:
            searchResultIndex: {type: integer, minimum: 0}
            start: {type: integer, minimum: 0}
            end: {type: integer, minimum: 0}
        web:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            domain: {type: string, maxLength: 253}
            url: {type: string, format: uri, minLength: 1, maxLength: 8192}
    BedrockDocumentLocation:
      type: object
      additionalProperties: false
      required: [documentIndex, start, end]
      properties:
        documentIndex: {type: integer, minimum: 0}
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 0}
    BedrockToolConfig:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            oneOf:
              - required: [toolSpec]
              - required: [cachePoint]
            properties:
              toolSpec:
                type: object
                additionalProperties: false
                required: [name, inputSchema]
                properties:
                  name: {type: string, minLength: 1}
                  description: {type: string}
                  inputSchema:
                    type: object
                    additionalProperties: false
                    required: [json]
                    properties:
                      json: {}
              cachePoint: {$ref: '#/components/schemas/BedrockCachePoint'}
        toolChoice:
          $ref: '#/components/schemas/BedrockToolChoice'
    BedrockToolChoice:
      type: object
      additionalProperties: false
      oneOf:
        - required: [auto]
        - required: [any]
        - required: [tool]
      properties:
        auto: {type: object, additionalProperties: false}
        any: {type: object, additionalProperties: false}
        tool:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
    BedrockConverseResponse:
      type: object
      additionalProperties: false
      required: [output, stopReason, usage]
      properties:
        output:
          type: object
          additionalProperties: false
          required: [message]
          properties:
            message: {$ref: '#/components/schemas/BedrockMessage'}
        stopReason: {type: string, enum: [end_turn, max_tokens, tool_use, content_filtered, guardrail_intervened, malformed_model_output, malformed_tool_use, model_context_window_exceeded]}
        usage:
          type: object
          additionalProperties: false
          required: [inputTokens, outputTokens, totalTokens]
          properties:
            inputTokens: {type: integer, minimum: 0}
            cacheReadInputTokens: {type: integer, minimum: 0}
            cacheWriteInputTokens: {type: integer, minimum: 0}
            outputTokens: {type: integer, minimum: 0}
            totalTokens: {type: integer, minimum: 0}
        additionalModelResponseFields:
          description: Model-specific fields explicitly selected by additionalModelResponseFieldPaths.
          readOnly: true
        trace:
          description: Provider guardrail trace returned only when tracing was explicitly enabled.
          readOnly: true
    GeminiCachedContent:
      type: object
      additionalProperties: false
      required: [name, model, createTime, updateTime, expireTime]
      properties:
        name: {type: string, pattern: '^cachedContents/[A-Za-z0-9_.-]+$', maxLength: 256}
        displayName: {type: string, maxLength: 128}
        model: {type: string, pattern: '^models/[A-Za-z0-9_.:-]+$', maxLength: 263}
        createTime: {type: string, format: date-time}
        updateTime: {type: string, format: date-time}
        expireTime: {type: string, format: date-time}
        usageMetadata:
          type: object
          additionalProperties: false
          required: [totalTokenCount]
          properties:
            totalTokenCount: {type: integer, minimum: 0}
    GeminiCachedContentExpiration:
      type: object
      additionalProperties: false
      oneOf:
        - required: [ttl]
        - required: [expireTime]
      properties:
        ttl: {type: string, pattern: '^[0-9]+(?:\.[0-9]+)?s$'}
        expireTime: {type: string, format: date-time}
    GeminiCachedContentCreateRequest:
      type: object
      additionalProperties: false
      required: [model]
      anyOf:
        - required: [contents]
        - required: [systemInstruction]
        - required: [tools]
      allOf:
        - oneOf:
            - required: [ttl]
            - required: [expireTime]
      properties:
        model: {type: string, pattern: '^models/[A-Za-z0-9_.:-]+$', maxLength: 263, description: Public gateway model resource name.}
        displayName: {type: string, maxLength: 128}
        ttl: {type: string, pattern: '^[0-9]+(?:\.[0-9]+)?s$'}
        expireTime: {type: string, format: date-time}
        contents:
          type: array
          maxItems: 10000
          items: {$ref: '#/components/schemas/GenerateContent'}
        systemInstruction:
          allOf:
            - {$ref: '#/components/schemas/GenerateContent'}
          description: Text parts only; role must be absent or system.
        tools:
          type: array
          maxItems: 128
          items: {type: object}
        toolConfig:
          type: object
          description: Native function-calling or retrieval configuration validated against the selected tools.
    GeminiCachedContentList:
      type: object
      additionalProperties: false
      required: [cachedContents]
      properties:
        cachedContents:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/GeminiCachedContent'}
        nextPageToken: {type: string, minLength: 1, maxLength: 344}
    GenerateContentError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, status, message]
          properties:
            code: {type: integer}
            status: {type: string}
            message: {type: string}
    GenerateCountRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [contents]
        - required: [generateContentRequest]
      properties:
        contents:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/GenerateContent'}
        generateContentRequest:
          $ref: '#/components/schemas/GenerateCountContext'
    GenerateCountContext:
      type: object
      additionalProperties: false
      required: [contents]
      properties:
        model:
          type: string
          description: Optional path model name, with or without the models/ prefix. Must match the path.
        contents:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/GenerateContent'}
        systemInstruction:
          allOf:
            - {$ref: '#/components/schemas/GenerateContent'}
          description: Text parts only; role must be absent or system.
        tools:
          type: array
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [functionDeclarations]
                properties:
                  functionDeclarations:
                    type: array
                    minItems: 1
                    maxItems: 128
                    items:
                      type: object
                      additionalProperties: false
                      required: [name]
                      properties:
                        name: {type: string, minLength: 1}
                        description: {type: string}
                        parameters:
                          type: object
                          description: Native Schema supports nullable, anyOf, size/numeric bounds and pattern (64 levels, 128 alternatives); mutually exclusive with parametersJsonSchema.
                        parametersJsonSchema: {type: object}
              - type: object
                additionalProperties: false
                required: [codeExecution]
                properties:
                  codeExecution:
                    type: object
                    additionalProperties: false
                    description: Native server-side Python execution included in token counting context.
              - type: object
                additionalProperties: false
                required: [urlContext]
                properties:
                  urlContext:
                    type: object
                    additionalProperties: false
                    description: Native server-side URL retrieval included in token counting context. Requires the url_context tool grant.
              - type: object
                additionalProperties: false
                required: [googleMaps]
                properties:
                  googleMaps:
                    type: object
                    additionalProperties: false
                    description: Native location grounding included in token counting context. Requires the google_maps tool grant.
        toolConfig:
          type: object
          additionalProperties: false
          properties:
            functionCallingConfig:
              type: object
              additionalProperties: false
              properties:
                mode: {type: string, enum: [AUTO, NONE, ANY]}
                allowedFunctionNames:
                  type: array
                  maxItems: 1
                  items: {type: string}
                  description: ANY requires exactly one declared function name.
            retrievalConfig:
              type: object
              additionalProperties: false
              required: [latLng]
              properties:
                latLng: {$ref: '#/components/schemas/GeminiLatLng'}
    GenerateContentRequest:
      type: object
      additionalProperties: false
      required: [contents]
      properties:
        cachedContent:
          type: string
          pattern: '^cachedContents/[A-Za-z0-9_.-]+$'
          maxLength: 256
          description: Owner-scoped cached content created through this gateway. Generate, stream and token-count requests are pinned to its original deployment, credential and effective policy; its provider-reported token count enters TPM and budget reserve; response caches, mirroring and model fallback are disabled. A changed deployment or policy returns 409 and requires cached content recreation.
        serviceTier:
          type: string
          enum: [unspecified, standard, flex, priority]
          description: Native execution tier. The provider-reported effective tier is returned in usageMetadata.serviceTier.
        store:
          type: boolean
          description: Native provider storage control. Requests with store=true bypass exact and semantic response caches so the provider executes every request.
        contents:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/GenerateContent'}
        systemInstruction:
          allOf:
            - {$ref: '#/components/schemas/GenerateContent'}
          description: Text parts only; role must be absent or system.
        safetySettings:
          type: array
          maxItems: 6
          uniqueItems: true
          description: Native Gemini per-category blocking thresholds. Requires the gemini_safety_settings deployment capability and bypasses response caches.
          items:
            type: object
            additionalProperties: false
            required: [category, threshold]
            properties:
              category: {type: string, enum: [HARM_CATEGORY_HATE_SPEECH, HARM_CATEGORY_SEXUALLY_EXPLICIT, HARM_CATEGORY_DANGEROUS_CONTENT, HARM_CATEGORY_HARASSMENT, HARM_CATEGORY_CIVIC_INTEGRITY, HARM_CATEGORY_JAILBREAK]}
              threshold: {type: string, enum: [HARM_BLOCK_THRESHOLD_UNSPECIFIED, BLOCK_LOW_AND_ABOVE, BLOCK_MEDIUM_AND_ABOVE, BLOCK_ONLY_HIGH, BLOCK_NONE, OFF]}
        tools:
          type: array
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [functionDeclarations]
                properties:
                  functionDeclarations:
                    type: array
                    minItems: 1
                    maxItems: 128
                    items:
                      type: object
                      additionalProperties: false
                      required: [name]
                      properties:
                        name: {type: string, minLength: 1}
                        description: {type: string}
                        parameters:
                          type: object
                          description: Native Schema supports nullable, anyOf, size/numeric bounds and pattern (64 levels, 128 alternatives); mutually exclusive with parametersJsonSchema.
                        parametersJsonSchema: {type: object}
              - type: object
                additionalProperties: false
                required: [googleSearch]
                properties:
                  googleSearch:
                    type: object
                    additionalProperties: false
                    description: Native server-side Google Search grounding. Requires the web_search deployment capability, bypasses response caches, and bills actual returned search queries.
              - type: object
                additionalProperties: false
                required: [codeExecution]
                properties:
                  codeExecution:
                    type: object
                    additionalProperties: false
                    description: Native server-side Python execution. Requires the gemini_code_execution deployment capability and code_execution tool grant, and bypasses response caches.
              - type: object
                additionalProperties: false
                required: [urlContext]
                properties:
                  urlContext:
                    type: object
                    additionalProperties: false
                    description: Native server-side URL retrieval. Requires the url_context deployment capability and tool grant, includes returned tool-input tokens in billing, and bypasses response caches.
              - type: object
                additionalProperties: false
                required: [googleMaps]
                properties:
                  googleMaps:
                    type: object
                    additionalProperties: false
                    description: Native location-aware grounding. Requires the google_maps deployment capability and tool grant, bills an actual grounding request when provider metadata confirms use, and bypasses response caches.
        toolConfig:
          type: object
          additionalProperties: false
          properties:
            functionCallingConfig:
              type: object
              additionalProperties: false
              properties:
                mode: {type: string, enum: [AUTO, NONE, ANY]}
                allowedFunctionNames:
                  type: array
                  maxItems: 1
                  items: {type: string}
                  description: ANY requires exactly one declared function name.
            retrievalConfig:
              type: object
              additionalProperties: false
              required: [latLng]
              description: Optional user location for Google Maps grounding; invalid coordinates fail before provider execution.
              properties:
                latLng: {$ref: '#/components/schemas/GeminiLatLng'}
        generationConfig:
          type: object
          additionalProperties: false
          properties:
            maxOutputTokens: {type: integer, minimum: 1, maximum: 2147483647}
            temperature: {type: number, minimum: 0, maximum: 2}
            topP: {type: number, minimum: 0, maximum: 1}
            topK: {type: integer, minimum: 1, maximum: 1000000}
            seed: {type: integer, minimum: -2147483648, maximum: 2147483647}
            candidateCount: {type: integer, enum: [1], description: The gateway returns exactly one candidate and normalizes this value before provider routing.}
            presencePenalty: {type: number, minimum: -2, maximum: 2}
            frequencyPenalty: {type: number, minimum: -2, maximum: 2}
            responseLogprobs: {type: boolean}
            logprobs: {type: integer, minimum: 0, maximum: 20, description: Requires responseLogprobs=true.}
            responseModalities:
              type: array
              maxItems: 1
              items: {type: string, enum: [TEXT]}
              description: Text output is supported; an empty array is normalized to TEXT.
            stopSequences:
              type: array
              maxItems: 4
              items: {type: string, minLength: 1}
            responseMimeType: {type: string, enum: [text/plain, application/json]}
            responseSchema:
              type: object
              description: Native Schema supports nullable, anyOf, size/numeric bounds and pattern (64 levels, 128 alternatives); mutually exclusive with responseJsonSchema. Requires application/json.
            responseJsonSchema: {type: object}
    GenerateContent:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        role: {type: string, enum: [user, model, system]}
        parts:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/GeneratePart'}
    GeneratePart:
      type: object
      additionalProperties: false
      oneOf:
        - required: [text]
        - required: [inlineData]
        - required: [fileData]
        - required: [functionCall]
        - required: [functionResponse]
        - required: [executableCode]
        - required: [codeExecutionResult]
      properties:
        text: {type: string}
        thoughtSignature:
          type: string
          format: byte
          description: Opaque signature supported on functionCall, thought text, and ordinary model text parts and preserved for later turns.
        thought:
          type: boolean
          description: When true, text is model reasoning and is preserved separately from visible response text.
        inlineData:
          type: object
          additionalProperties: false
          required: [mimeType, data]
          properties:
            mimeType: {type: string, enum: [image/png, image/jpeg, image/gif, image/webp, audio/wav, audio/mp3, audio/mpeg, audio/aiff, audio/aac, audio/ogg, audio/opus, audio/flac, audio/m4a, audio/webm, video/mp4, video/webm, video/mpeg, video/mpg, video/mov, video/avi, video/x-flv, video/wmv, video/3gpp, application/pdf]}
            data: {type: string, format: byte}
          description: Inline images require vision; signature-verifiable audio containers require audio_input; MP4, WebM, MPEG, MPG, MOV, AVI, FLV, WMV and 3GPP video require video_input; PDF requires file_input. All binary parts are bounded, signature-validated and projected to configured AV scanners.
        fileData:
          type: object
          additionalProperties: false
          required: [mimeType, fileUri]
          properties:
            mimeType: {type: string, enum: [image/png, image/jpeg, image/gif, image/webp, audio/wav, audio/mp3, audio/mpeg, audio/aiff, audio/aac, audio/ogg, audio/opus, audio/flac, audio/m4a, audio/webm, audio/mp4, video/mp4, video/webm, video/mpeg, video/mpg, video/mov, video/avi, video/x-flv, video/wmv, video/3gpp, application/pdf, text/plain]}
            fileUri: {type: string, minLength: 6, maxLength: 128, pattern: '^file_[A-Za-z0-9_.-]+$', description: Owner-scoped gateway Files identifier with purpose=user_data.}
          description: The authenticated credential and user must own the referenced gateway File. The stored MIME type must match mimeType. Resolution and signature validation happen before policy, token counting, routing or billing.
        functionCall:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            id: {type: string}
            name: {type: string, minLength: 1}
            args:
              description: Omitted or null arguments are normalized to an empty object.
              oneOf:
                - {type: object}
                - {type: 'null'}
        functionResponse:
          type: object
          additionalProperties: false
          required: [name, response]
          properties:
            id: {type: string}
            name: {type: string, minLength: 1}
            response: {type: object}
        executableCode:
          type: object
          additionalProperties: false
          required: [language, code]
          properties:
            id: {type: string, maxLength: 128}
            language: {type: string, enum: [PYTHON]}
            code: {type: string, minLength: 1}
        codeExecutionResult:
          type: object
          additionalProperties: false
          required: [outcome]
          properties:
            id: {type: string, maxLength: 128}
            outcome: {type: string, enum: [OUTCOME_OK, OUTCOME_FAILED, OUTCOME_DEADLINE_EXCEEDED]}
            output: {type: string}
    GenerateContentResponse:
      type: object
      required: [responseId, modelVersion, candidates, usageMetadata]
      properties:
        responseId: {type: string}
        modelVersion:
          type: string
          description: Provider-reported model version when available, otherwise the normalized model name.
        candidates:
          type: array
          maxItems: 1
          items:
            type: object
            properties:
              index: {type: integer, enum: [0]}
              content: {$ref: '#/components/schemas/GenerateContent'}
              finishReason: {type: string, enum: [STOP, MAX_TOKENS, SAFETY]}
              groundingMetadata:
                type: object
                description: Bounded provider grounding metadata, including search queries, sources, supports and the native search entry point.
              urlContextMetadata:
                type: object
                additionalProperties: false
                description: Validated provider URL retrieval outcomes. At most 20 entries are returned.
                properties:
                  urlMetadata:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      additionalProperties: false
                      required: [retrievedUrl, urlRetrievalStatus]
                      properties:
                        retrievedUrl: {type: string, format: uri, maxLength: 8192}
                        urlRetrievalStatus: {type: string, enum: [URL_RETRIEVAL_STATUS_UNSPECIFIED, URL_RETRIEVAL_STATUS_SUCCESS, URL_RETRIEVAL_STATUS_ERROR, URL_RETRIEVAL_STATUS_PAYWALL, URL_RETRIEVAL_STATUS_UNSAFE]}
        usageMetadata:
          type: object
          properties:
            promptTokenCount: {type: integer, minimum: 0}
            toolUsePromptTokenCount: {type: integer, minimum: 0, description: Provider-reported input tokens consumed by server-side tools. Included in billing input tokens and totalTokenCount.}
            candidatesTokenCount: {type: integer, minimum: 0}
            thoughtsTokenCount: {type: integer, minimum: 0}
            cachedContentTokenCount: {type: integer, minimum: 0}
            totalTokenCount: {type: integer, minimum: 0}
            serviceTier: {type: string, enum: [unspecified, standard, flex, priority]}
    GeminiLatLng:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
    MessagesContextManagement:
      type: object
      additionalProperties: false
      required: [edits]
      properties:
        edits:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: When both strategies are present, clear_thinking must be first.
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [type]
                properties:
                  type: {type: string, const: clear_tool_uses_20250919}
                  trigger: {$ref: '#/components/schemas/MessagesContextLimit'}
                  keep:
                    type: object
                    additionalProperties: false
                    required: [type, value]
                    properties:
                      type: {type: string, const: tool_uses}
                      value: {type: integer, minimum: 1, maximum: 10000000}
                  clear_at_least:
                    type: object
                    additionalProperties: false
                    required: [type, value]
                    properties:
                      type: {type: string, const: input_tokens}
                      value: {type: integer, minimum: 1, maximum: 10000000}
                  clear_tool_inputs:
                    oneOf:
                      - {type: boolean}
                      - {type: array, maxItems: 64, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
                  exclude_tools: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
              - type: object
                additionalProperties: false
                required: [type]
                properties:
                  type: {type: string, const: clear_thinking_20251015}
                  keep:
                    oneOf:
                      - {type: string, const: all}
                      - type: object
                        additionalProperties: false
                        required: [type, value]
                        properties:
                          type: {type: string, const: thinking_turns}
                          value: {type: integer, minimum: 1, maximum: 10000000}
    MessagesContextLimit:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: {type: string, enum: [input_tokens, tool_uses]}
        value: {type: integer, minimum: 1, maximum: 10000000}
    MessageTokenCountRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model: {type: string, minLength: 1}
        messages: {$ref: '#/components/schemas/MessagesRequest/properties/messages'}
        system: {$ref: '#/components/schemas/MessagesRequest/properties/system'}
        tools: {$ref: '#/components/schemas/MessagesRequest/properties/tools'}
        tool_choice: {$ref: '#/components/schemas/MessagesRequest/properties/tool_choice'}
        output_config: {$ref: '#/components/schemas/MessagesRequest/properties/output_config'}
        thinking: {$ref: '#/components/schemas/MessagesRequest/properties/thinking'}
        container: {$ref: '#/components/schemas/MessagesRequest/properties/container'}
        cache_control: {$ref: '#/components/schemas/MessagesRequest/properties/cache_control'}
        inference_geo: {$ref: '#/components/schemas/MessagesRequest/properties/inference_geo'}
        context_management: {$ref: '#/components/schemas/MessagesRequest/properties/context_management'}
    MessagesToolsetMemberConfig:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: boolean, default: true}
        defer_loading: {type: boolean, default: false}
    MessagesToolResultBlock:
      type: object
      additionalProperties: false
      required: [type, tool_use_id, content]
      properties:
        type: {type: string, const: tool_result}
        tool_use_id: {type: string, minLength: 1}
        is_error:
          type: boolean
          default: false
          description: Marks a failed client tool execution. Requires the tool_result_error deployment capability so routing cannot discard the failure state.
        content:
          oneOf:
            - {type: string}
            - type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [type, text]
                properties:
                  type: {type: string, const: text}
                  text: {type: string}
    MessagesDocumentBlock:
      type: object
      additionalProperties: false
      required: [type, source]
      properties:
        type: {type: string, const: document}
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: Optional policy-scanned document title forwarded to the native adapter. Requires document_metadata capability.
        context:
          type: string
          minLength: 1
          maxLength: 8192
          description: Optional policy-scanned document context forwarded to the native adapter. Requires document_metadata capability.
        citations:
          type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled: {type: boolean, const: true}
          description: Enables native citations for this document. Requires the document_citations deployment capability; omission leaves citations disabled.
        source:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, media_type, data]
              properties:
                type: {type: string, const: base64}
                media_type: {type: string, const: application/pdf}
                data: {type: string, format: byte, description: Base64 PDF bytes. Decoded content must start with the PDF signature.}
            - type: object
              additionalProperties: false
              required: [type, media_type, data]
              properties:
                type: {type: string, const: text}
                media_type: {type: string, const: text/plain}
                data: {type: string, minLength: 1, maxLength: 262144, description: Inline UTF-8 plain text. Whitespace-only data is rejected.}
            - type: object
              additionalProperties: false
              required: [type, file_id]
              properties:
                type: {type: string, const: file}
                file_id: {type: string, pattern: '^file_[A-Za-z0-9_-]+$', maxLength: 128, description: Owner-scoped file with purpose user_data containing PDF or UTF-8 plain text.}
            - type: object
              additionalProperties: false
              required: [type, url]
              properties:
                type: {type: string, const: url}
                url: {type: string, format: uri, pattern: '^https://', maxLength: 2048, description: "Public HTTPS URL returning application/pdf. Credentials, fragments and redirects are rejected."}
      description: Inline, owner-scoped stored or public HTTPS PDF/plain-text input. At most five documents are accepted per request. PDF input has a 16 MiB decoded aggregate limit, requires file_input capability and enters attachment policy scanning. Plain text has a 262144-character per-document and 1048576-character aggregate limit and requires document_text capability. File and URL references are resolved after authentication and before content policy, TPM and billing admission. URL fetches use public-address DNS enforcement, TLS 1.2 or newer, no environment proxy, no redirects, a 15-second timeout and bounded response reads. Durable batches snapshot resolved content during creation and retain the 4 MiB resolved-line limit. All forms bypass response caches and are preserved by generation and native token counting. Optional title and context enter DLP and anonymization, token accounting and capability routing. Optional citations are preserved across the same paths and require document_citations capability. Within one request, citations must be enabled for every document or omitted from every document.
    MessagesImageBlock:
      type: object
      additionalProperties: false
      required: [type, source]
      properties:
        type: {type: string, const: image}
        source:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, media_type, data]
              properties:
                type: {type: string, const: base64}
                media_type: {type: string, enum: [image/jpeg, image/png, image/gif, image/webp]}
                data: {type: string, format: byte}
            - type: object
              additionalProperties: false
              required: [type, url]
              properties:
                type: {type: string, const: url}
                url: {type: string, format: uri, pattern: '^https://', maxLength: 2048, description: "Public HTTPS image URL. Credentials, fragments and redirects are rejected."}
            - type: object
              additionalProperties: false
              required: [type, file_id]
              properties:
                type: {type: string, const: file}
                file_id: {type: string, pattern: '^file_[A-Za-z0-9_-]+$', maxLength: 128, description: "Owner-scoped file with purpose user_data containing JPEG, PNG, GIF or WebP."}
      description: Base64, public HTTPS or owner-scoped stored JPEG, PNG, GIF or WebP user image. At most eight images and 16 MiB decoded bytes are accepted per request, with an 8 MiB per-image limit and signature validation. URL and file references are resolved after authentication and converted to inline data before policy, accounting and provider execution. Stored files are isolated by authenticated credential and user. Durable batches snapshot resolved bytes during creation.
    MessagesRequest:
      type: object
      additionalProperties: false
      required: [model, max_tokens, messages]
      properties:
        model: {type: string, minLength: 1}
        max_tokens: {type: integer, minimum: 0, description: Total output limit including thinking tokens. Zero performs a cache-population request without generated output and requires the zero_output deployment capability. A manual thinking budget must be smaller than a positive value.}
        cache_control:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, const: ephemeral}
            ttl: {type: string, enum: [5m, 1h]}
          description: Applies an ephemeral prompt-cache marker to the last cacheable request block and requires the prompt_cache deployment capability.
        inference_geo:
          type: string
          enum: [global, us]
          description: Native inference processing geography. Requires an inference_geo-capable deployment. Responses must report the requested value; response caches are bypassed. US-only processing uses the provider's 1.1 price multiplier for token reserve and settlement.
        context_management:
          allOf: [{$ref: '#/components/schemas/MessagesContextManagement'}]
          description: Native server-side tool-result and thinking-block editing. Requires context_management capability, bypasses response caches, and is preserved by token counting and durable batches.
        stop_sequences:
          type: array
          maxItems: 4
          items: {type: string, minLength: 1}
          description: Requires an adapter reporting exact matched stops; currently native Anthropic
        stream: {type: boolean, default: false}
        temperature: {type: number, minimum: 0, maximum: 1, description: Must be omitted or equal to 1 when adaptive or enabled thinking is requested.}
        top_p: {type: number, minimum: 0, maximum: 1}
        top_k: {type: integer, minimum: 0, maximum: 1000000, description: Deprecated native sampling control. Availability depends on the selected upstream model.}
        service_tier: {type: string, enum: [auto, standard_only], description: "Native capacity selection. The assigned standard, priority or batch tier is returned in usage.service_tier."}
        container:
          type: object
          additionalProperties: false
          required: [skills]
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
              pattern: '^[A-Za-z0-9_.-]+$'
              description: Reuse a container returned by an earlier skill execution. The credential, user, deployment and provider-reported expiry are enforced by durable gateway state.
            skills:
              type: array
              minItems: 1
              maxItems: 20
              uniqueItems: true
              items:
                type: object
                additionalProperties: false
                required: [type, skill_id]
                properties:
                  type: {type: string, enum: [anthropic, custom]}
                  skill_id: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$'}
                  version: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$'}
          description: Requires a code_execution_20250825 tool. Custom skills are owner-checked and pin routing to their creation deployment. Reused container IDs must belong to the same credential and user and remain unexpired. Streaming responses are buffered until the returned container binding is durably recorded.
        metadata:
          type: object
          additionalProperties: false
          properties:
            user_id: {type: string, maxLength: 512}
        output_config:
          type: object
          additionalProperties: false
          properties:
            effort: {type: string, enum: [low, medium, high, xhigh, max]}
            format:
              type: object
              additionalProperties: false
              required: [type, schema]
              properties:
                type: {type: string, const: json_schema}
                schema: {type: object, additionalProperties: true}
        thinking:
          description: Native reasoning policy. Requires the thinking deployment capability. Response caching is bypassed and provider-reported output usage settles the complete response within max_tokens.
          oneOf:
            - type: object
              additionalProperties: false
              required: [type]
              properties:
                type: {type: string, const: adaptive}
                display: {type: string, enum: [summarized, omitted]}
            - type: object
              additionalProperties: false
              required: [type, budget_tokens]
              properties:
                type: {type: string, const: enabled}
                budget_tokens: {type: integer, minimum: 1024, description: Must be smaller than max_tokens on generation requests.}
                display: {type: string, enum: [summarized, omitted]}
            - type: object
              additionalProperties: false
              required: [type]
              properties:
                type: {type: string, const: disabled}
        system:
          description: Text or text blocks. Text blocks may carry an explicit ephemeral cache_control breakpoint.
          oneOf:
            - {type: string}
            - type: array
              items: {type: object}
        messages:
          type: array
          minItems: 1
          maxItems: 10000
          description: A final assistant message with non-empty text requests continuation and requires an assistant_prefill-capable deployment and model.
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: {type: string, enum: [user, assistant]}
              content:
                oneOf:
                  - {type: string}
                  - type: array
                    minItems: 1
                    items: {type: object}
                    description: Supports text, bounded base64 or HTTPS URL image, inline, stored or URL PDF/plain-text document, tool_use, tool_result, thinking, redacted_thinking and bounded native server-tool or client-toolset continuation blocks. Images follow MessagesImageBlock and documents follow MessagesDocumentBlock; both are accepted only in user messages. Ordinary tool_result blocks follow MessagesToolResultBlock; is_error=true requires tool_result_error capability and bypasses semantic response caching. Client-toolset calls and results retain their required toolset_name. Thinking history is accepted only for assistant messages and routed only to an adapter with an explicit signed-reasoning contract.
        tools:
          type: array
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [name, input_schema]
                properties:
                  name: {type: string, minLength: 1}
                  description: {type: string}
                  input_schema: {type: object, additionalProperties: true}
                  defer_loading: {type: boolean, default: false, description: Requires one tool_search_tool_regex_20251119 or tool_search_tool_bm25_20251119 server tool and cannot be combined with cache_control.}
                  cache_control:
                    type: object
                    additionalProperties: false
                    required: [type]
                    properties:
                      type: {type: string, const: ephemeral}
                      ttl: {type: string, enum: [5m, 1h]}
              - type: object
                additionalProperties: false
                required: [type, name]
                properties:
                  type: {type: string, enum: [code_execution_20250825, code_execution_20260120, code_execution_20260521]}
                  name: {type: string, const: code_execution}
              - type: object
                additionalProperties: false
                required: [type, name]
                properties:
                  type: {type: string, const: tool_search_tool_regex_20251119}
                  name: {type: string, const: tool_search_tool_regex}
              - type: object
                additionalProperties: false
                required: [type, name]
                properties:
                  type: {type: string, const: tool_search_tool_bm25_20251119}
                  name: {type: string, const: tool_search_tool_bm25}
              - type: object
                additionalProperties: false
                required: [type]
                properties:
                  type: {type: string, const: computer_toolset_20260801}
                  allowed_callers: {type: array, maxItems: 1, uniqueItems: true, items: {type: string, const: direct}}
                  configs:
                    type: object
                    additionalProperties: false
                    description: Per-member controls. Omitted members remain enabled and non-deferred. At least one member must remain enabled, and every enabled member must resolve to the same defer_loading value.
                    properties:
                      screenshot: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      zoom: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      left_click: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      right_click: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      middle_click: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      double_click: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      triple_click: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      left_click_drag: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      mouse_move: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      left_mouse_down: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      left_mouse_up: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      cursor_position: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      scroll: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      type: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      key: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      hold_key: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      wait: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                  cache_control:
                    type: object
                    additionalProperties: false
                    required: [type]
                    description: Cannot be combined with a deferred toolset.
                    properties:
                      type: {type: string, const: ephemeral}
                      ttl: {type: string, enum: [5m, 1h]}
              - type: object
                additionalProperties: false
                required: [type]
                properties:
                  type: {type: string, const: browser_toolset_20260801}
                  allowed_callers: {type: array, maxItems: 1, uniqueItems: true, items: {type: string, const: direct}}
                  configs:
                    type: object
                    additionalProperties: false
                    description: Per-member controls. The four diagnostic, scripting and upload members default to disabled; other omitted members remain enabled. At least one member must remain enabled, and every enabled member must resolve to the same defer_loading value.
                    properties:
                      navigate: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      screenshot: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      zoom: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      left_click: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      right_click: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      middle_click: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      double_click: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
                      triple_click: {$ref: '#/components/schemas/MessagesToolsetMemberConfig'}
