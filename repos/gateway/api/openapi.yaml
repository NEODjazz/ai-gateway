        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/agent-profiles:
    get:
      operationId: listAgentProfiles
      tags: [Agent templates]
      summary: List metadata-only profiles for external agent runtimes
      responses:
        '200': {description: Agent profiles and execution boundary, content: {application/json: {schema: {$ref: '#/components/schemas/AgentProfileList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/agent-profiles/{id}:
    parameters: [{$ref: '#/components/parameters/AccessEntryID'}]
    put:
      operationId: putAgentProfile
      tags: [Agent templates]
      summary: Create or update an external-runtime profile
      description: The referenced enabled tool policy is copied into the profile. Prompt content, memory, vector data and workflow state are not accepted.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentProfileInput'}}}}
      responses:
        '200': {description: Materialized agent profile saved, content: {application/json: {schema: {$ref: '#/components/schemas/AgentProfile'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteAgentProfile
      tags: [Agent templates]
      summary: Delete an agent profile
      responses:
        '204': {description: Agent profile deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/mcp/servers:
    get:
      operationId: listMCPServers
      tags: [MCP]
      summary: List registered MCP server metadata
      description: Credentials and request headers are not accepted or returned.
      parameters:
        - {name: expand, in: query, schema: {type: string, enum: [references]}, description: Include dependent toolset IDs}
      responses:
        '200': {description: MCP servers, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/MCPServer'}}, references: {type: object, additionalProperties: {$ref: '#/components/schemas/MCPServerReferences'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/mcp/servers/{id}:
    put:
      operationId: updateMCPServer
      tags: [MCP]
      summary: Create or atomically update safe MCP server metadata
      description: Stores endpoint and policy metadata without credentials or headers. Enabled Streamable HTTP entries can be queried through the authenticated discovery endpoint; saves do not connect to the server. Tool execution is not exposed. Enabled server grants are consulted for connector authorization through toolsets; direct grants are independent. Tool strings are not verified against a remote tool list.
      parameters: [{$ref: '#/components/parameters/MCPEntryID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MCPServerInput'}}}}
      responses:
        '200': {description: MCP server saved, content: {application/json: {schema: {$ref: '#/components/schemas/MCPServer'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteMCPServer
      tags: [MCP]
      summary: Delete an MCP server not referenced by a toolset
      parameters: [{$ref: '#/components/parameters/MCPEntryID'}]
      responses:
        '204': {description: MCP server deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/mcp/toolsets:
    get:
      operationId: listMCPToolsets
      tags: [MCP]
      summary: List MCP tool permission bundles
      parameters:
        - {name: expand, in: query, schema: {type: string, enum: [references]}, description: Include access-group and virtual-key assignments}
      responses:
        '200': {description: MCP toolsets, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/MCPToolset'}}, references: {type: object, additionalProperties: {$ref: '#/components/schemas/MCPToolsetReferences'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/mcp/toolsets/{id}:
    put:
      operationId: updateMCPToolset
      tags: [MCP]
      summary: Create or atomically update a toolset grant
      description: Groups function names or connector identifiers as exact or trailing-wildcard grants. Assignment uses toolset:<id> in allowed_tools. Disabling this toolset stops that authorization path but does not revoke other grants. Connector grants require a matching tools grant on an enabled registered server at authorization time; ordinary function names do not.
      parameters: [{$ref: '#/components/parameters/MCPEntryID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MCPToolsetInput'}}}}
      responses:
        '200': {description: MCP toolset saved, content: {application/json: {schema: {$ref: '#/components/schemas/MCPToolset'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteMCPToolset
      tags: [MCP]
      summary: Delete an MCP toolset without access-group or virtual-key assignments
      parameters: [{$ref: '#/components/parameters/MCPEntryID'}]
      responses:
        '204': {description: MCP toolset deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
