  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [Inference]
      summary: Create a chat completion
      description: |
        Supports function tools, structured outputs, SSE streaming, and bounded
        inline image input. Vision requests accept at most 8 JPEG, PNG, GIF, or
        WebP data URLs, at most 8 MiB decoded each and 16 MiB decoded total.
        Remote image URLs are rejected. The native Cohere adapter supports
        text-only JSON, function tools, and native or buffered SSE with
        provider-reported usage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              text:
                value:
                  model: gpt-5-mini
                  messages:
                    - role: user
                      content: Explain atomic rate limiting briefly.
              vision:
                value:
                  model: vision-model
                  messages:
                    - role: user
                      content:
                        - type: text
                          text: Describe this image.
                        - type: image_url
                          image_url:
                            url: data:image/png;base64,iVBORw0KGgo=
                            detail: auto
      responses:
        '200':
          description: Completion JSON or an SSE stream when `stream=true`
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: 'OpenAI-compatible `data:` events terminated by `data: [DONE]`.'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
  /v1/completions:
    post:
      operationId: createCompletion
      tags: [Inference]
      summary: Create a text completion
      description: Supports string/list and token-ID prompts with native completion parameters on adapters that expose a completions operation. Streaming is incremental when the selected adapter exposes native SSE; otherwise the bounded JSON result is replayed as compatible SSE after billing and post-processing.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompletionRequest'}
            example:
              model: gpt-3.5-turbo-instruct
              prompt: Complete this sentence
              max_tokens: 16
      responses:
        '200':
          description: Text completion JSON, native SSE, or buffered SSE fallback when `stream=true`
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompletionResponse'}
            text/event-stream:
              schema:
                type: string
                description: 'Text completion `data:` events terminated by `data: [DONE]`.'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
  /v1/responses:
    post:
      operationId: createResponse
      tags: [Inference]
      summary: Create a Responses API response
      description: Supports function tools, explicitly scoped MCP connectors, structured output, previous-response affinity, SSE, durable background execution, and inline images. Background requests require store=true, stream=false, and an explicit background_responses deployment capability; billing settlement is resumed from PostgreSQL after process restarts. MCP definitions are forwarded to an upstream provider that must support remote MCP; the gateway does not execute MCP calls. Routing requires explicit mcp capability. Tool authorization checks connector identity (label and canonical URL), not individual remote tool names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseRequest'
            examples:
              text:
                value:
                  model: gpt-5-mini
                  input: Summarize the release notes.
              mcp:
                value:
                  model: gpt-5-mini
                  input: Check the weather.
                  tools:
                    - type: mcp
                      server_label: weather-prod
                      server_url: https://mcp.example.test
      responses:
        '200':
          description: Completed response JSON, queued background response JSON, or an SSE stream when `stream=true`
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseResponse'
            text/event-stream:
              schema:
                type: string
                description: 'Named Responses API events terminated by `data: [DONE]`.'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
        '503':
          description: Required response affinity, ownership, or background job storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/interactions:
    post:
      operationId: createInteraction
      tags: [Inference]
      summary: Create a model interaction
      description: Converts a model interaction to the existing Responses execution pipeline. Supports synchronous, incremental SSE, and durable background execution; string or step-array input; system instructions; function tools; structured response formats; continuity; storage selection; and bounded generation settings. Background execution defaults to store=true and rejects an explicit store=false. Agents, MCP tools, seed, stop sequences, and thinking level are rejected before provider execution. Streaming background execution is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionRequest'
      responses:
        '200':
          description: Completed, queued, failed, or incomplete interaction JSON, or named interaction SSE events when stream=true
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionResponse'
            text/event-stream:
              schema:
                type: string
                description: Named interaction and step events terminated by a named done event containing `[DONE]`.
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
        '503':
          description: Required response affinity, policy, ownership, or background job storage is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/interactions/{id}:
    get:
      operationId: retrieveInteraction
      tags: [Inference]
      summary: Retrieve a stored interaction
      description: Resolves the authenticated owner's immutable deployment binding and rechecks current model policy before reading the durable resource. Retrieval does not create inference usage or billing.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, maxLength: 256}}
      responses:
        '200':
          description: Stored interaction
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InteractionResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: The interaction does not exist for the authenticated owner.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: The original deployment binding no longer matches the active deployment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Interaction ownership storage is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      operationId: deleteInteraction
      tags: [Inference]
      summary: Delete a stored interaction
      description: Deletes the resource from its original deployment and removes its matching ownership binding. An upstream not-found response is treated as an idempotent delete while the ownership binding exists.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, maxLength: 256}}
      responses:
        '204':
          description: Interaction deleted
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: The interaction does not exist for the authenticated owner.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: The original deployment or ownership binding changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Interaction ownership storage is unavailable or could not be cleaned after upstream deletion.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/interactions/{id}/cancel:
    post:
      operationId: cancelInteraction
      tags: [Inference]
      summary: Cancel a stored background interaction
      description: Resolves the authenticated owner's immutable deployment binding and rechecks current model policy before cancellation. Cancellation does not create a new inference billing lifecycle.
