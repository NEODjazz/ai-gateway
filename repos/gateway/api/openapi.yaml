        '200': {description: Destinations and bounded queue counters, content: {application/json: {schema: {$ref: '#/components/schemas/LoggingDestinationList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/logging/destinations/{id}:
