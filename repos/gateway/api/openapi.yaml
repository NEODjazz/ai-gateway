      responses:
        '204': {description: Budget policy disabled}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/budgets/{id}/summary:
    get:
      operationId: getBudgetSummary
      tags: [Budgets]
      summary: Get current committed and reserved spend
      parameters:
        - $ref: '#/components/parameters/BudgetID'
      responses:
        '200':
          description: Current budget window summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetSummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/usage/report:
    get:
      operationId: getUsageReport
      tags: [Usage]
      summary: Get aggregated usage and spend
      description: Returns final request outcomes aggregated by currency, day, public or upstream model, provider, endpoint, credential tag, and customer scope. Mixed currencies are never summed together.
      parameters:
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 90, default: 30}
        - name: from
          in: query
          description: Inclusive RFC3339 timestamp; must be provided together with `to`.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: Exclusive RFC3339 timestamp; range is limited to 90 days.
          schema: {type: string, format: date-time}
        - name: model
          in: query
          schema: {type: string, maxLength: 256}
        - name: upstream_model
          in: query
          schema: {type: string, maxLength: 256}
        - name: provider
          in: query
          schema: {type: string, maxLength: 256}
        - name: endpoint
          in: query
          schema: {type: string, maxLength: 256}
        - name: tag
          in: query
          schema: {type: string, maxLength: 256}
        - name: scope_type
          in: query
          description: Customer dimension to filter; must be provided together with `scope_id`.
          schema: {type: string, enum: [key, user, team, organization]}
        - name: scope_id
          in: query
          description: Non-secret virtual-key fingerprint or configured customer ID.
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Usage and spend report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageReport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/customers/{scope_type}/{scope_id}/usage:
    get:
      operationId: getCustomerUsageReport
      tags: [Customers]
      summary: Get usage and spend for one customer scope
      description: Aggregates metadata-only final outcomes for an organization, user, team, or non-secret virtual-key ID. Scope values are passed to ClickHouse as typed parameters.
      parameters:
        - {name: scope_type, in: path, required: true, schema: {type: string, enum: [key, user, team, organization]}}
        - {name: scope_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 30}}
      responses:
        '200': {description: Scoped usage and spend report, content: {application/json: {schema: {$ref: '#/components/schemas/UsageReport'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs:
    get:
      operationId: listRequestLogs
      tags: [Observability]
      summary: List inference request outcomes
      description: Returns bounded metadata-only final outcomes. Prompts, responses, raw provider errors, credentials, and upstream URLs are never returned.
      parameters:
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
        - {name: from, in: query, description: Custom UTC window start; must be paired with to and span at most 90 days, schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive custom UTC window end, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: before_request_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: request_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: session_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: trace_id, in: query, schema: {type: string, pattern: '^[0-9a-fA-F]{32}$'}}
        - {name: status, in: query, schema: {type: string, enum: [ok, error]}}
        - {name: model, in: query, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, schema: {type: string, maxLength: 256}}
        - {name: tag, in: query, schema: {type: string, maxLength: 256}}
        - {name: user_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: team_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: organization_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: credential_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: cache_status, in: query, schema: {type: string, enum: [hit, miss, error]}}
        - {name: failure_class, in: query, schema: {type: string, maxLength: 256}}
        - {name: min_cost, in: query, schema: {type: number, minimum: 0}}
        - {name: max_cost, in: query, schema: {type: number, minimum: 0}}
      responses:
        '200':
          description: Request log page ordered newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLogPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs/groups:
    get:
      operationId: listRequestLogGroups
      tags: [Observability]
      summary: Aggregate inference outcomes by session or trace
      description: Aggregates the complete bounded query window in ClickHouse. Spend is grouped separately by currency and content fields are never read or returned.
      parameters:
        - {name: dimension, in: query, required: true, schema: {type: string, enum: [session, trace]}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
        - {name: from, in: query, description: Custom UTC window start; must be paired with to and span at most 90 days, schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive custom UTC window end, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: before_group_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: before_currency, in: query, schema: {type: string, maxLength: 16}}
        - {name: request_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: session_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: trace_id, in: query, schema: {type: string, pattern: '^[0-9a-fA-F]{32}$'}}
        - {name: status, in: query, schema: {type: string, enum: [ok, error]}}
        - {name: model, in: query, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, schema: {type: string, maxLength: 256}}
        - {name: tag, in: query, schema: {type: string, maxLength: 256}}
        - {name: user_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: team_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: organization_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: credential_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: cache_status, in: query, schema: {type: string, enum: [hit, miss, error]}}
        - {name: failure_class, in: query, schema: {type: string, maxLength: 256}}
        - {name: min_cost, in: query, schema: {type: number, minimum: 0}}
        - {name: max_cost, in: query, schema: {type: number, minimum: 0}}
      responses:
        '200': {description: Session or trace aggregate page ordered by latest request, content: {application/json: {schema: {$ref: '#/components/schemas/RequestLogGroupPage'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs/settings:
    get:
      operationId: getRequestLogSettings
      tags: [Observability]
      summary: Get request-log privacy and retention settings
      responses:
        '200':
          description: Effective request-log settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLogSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs/{request_id}:
    get:
      operationId: getRequestLog
      tags: [Observability]
      summary: Get one inference request outcome
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Safe request outcome metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLog'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/routing/diagnostics:
    get:
      operationId: getRoutingDiagnostics
      tags: [Routing]
      summary: Get safe provider routing diagnostics
      description: Returns endpoint names and operational routing state. Base URLs, credentials, and internal headers are never exposed.
      responses:
        '200':
          description: Routing strategy and endpoint state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoutingDiagnostics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/routing/simulate:
    post:
      operationId: simulateRouting
      tags: [Routing]
      summary: Explain deployment selection without calling a provider
      description: Uses a copy of routing state so weighted selection counters and endpoint health are not mutated.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingSimulationRequest'}}}}
      responses:
        '200': {description: Ordered eligible deployments and selected route, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingSimulation'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-catalog:
    get:
      operationId: getRuntimeModelCatalog
      tags: [Models]
      summary: Get the active runtime model catalog
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, schema: {type: string, maxLength: 256}}
        - {name: capability, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [model, provider, input_cost, output_cost]}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: asc}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        '200':
          description: Active catalog snapshot
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ModelCatalog'}
                  - {$ref: '#/components/schemas/ModelCatalogPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    put:
      operationId: replaceRuntimeModelCatalog
      tags: [Models]
      summary: Atomically replace the active runtime model catalog
      description: Replicas synchronize the validated catalog through the versioned control-plane snapshot. Priced entries require an explicit currency.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelCatalog'}
      responses:
        '200':
          description: Activated catalog snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelCatalog'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-onboarding/plan:
    post:
      operationId: planModelOnboarding
      tags: [Models]
      summary: Validate a model onboarding transaction without changing runtime state
      description: Returns the current control-plane revision and normalized catalog, deployment, and model-group changes. Providers and credentials must already exist.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingInput'}}}}
      responses:
        '200': {description: Validated non-mutating plan, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingPlan'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-onboarding/apply:
    post:
      operationId: applyModelOnboarding
      tags: [Models]
      summary: Atomically commit a previously validated model onboarding transaction
      description: Revalidates the complete input and commits catalog, deployments, and model groups in one optimistic control-plane revision. A stale expected_revision returns 409 and changes nothing.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingApply'}}}}
      responses:
        '200': {description: Committed plan with the new control-plane revision, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingPlan'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/audit/events:
    get:
      operationId: listManagementAuditEvents
      tags: [Audit]
      summary: List durable management audit events
      description: Returns append-only attempted and terminal outcome events in descending ID order.
      parameters:
        - {name: before_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: actor_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: action, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: Audit event page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
components:
  securitySchemes:
    googleAPIKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: Gateway virtual key, not an upstream provider credential
    nativeAPIKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Gateway virtual key, not an upstream provider credential
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Virtual key or JWT
  headers:
    XExecutionID:
      description: Server-generated inference execution identifier used in billing and request logs. Independent of the caller correlation ID.
      schema:
        type: string
        maxLength: 128
    XRequestID:
      description: Request correlation identifier
      schema:
        type: string
        maxLength: 128
  parameters:
    SkillID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    SkillVersionID:
      name: version
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    VirtualKeyID:
      name: id
      in: path
      required: true
      description: Opaque virtual-key identifier, never the plaintext token
      schema:
        type: string
        pattern: '^vk_[A-Za-z0-9_-]{5,125}$'
        maxLength: 128
    DirectoryTeamID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    DirectoryUserID:
      name: user_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    DirectoryUserPathID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    ModelDeploymentID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    GuardrailPolicyName:
      name: name
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    MCPEntryID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    AccessEntryID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    OrganizationID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9._@:-]+$'}
    OrganizationTeamID:
      name: team_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9._@:-]+$'}
    BudgetID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
  responses:
    InvalidRequest:
      description: Invalid request or unsupported input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: unauthorized, message: invalid api key}
            ts: '2026-08-21T12:00:00Z'
    Forbidden:
      description: Credential policy rejects the model, function, or MCP connector
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdminRequired:
      description: The credential does not have the admin role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTooLarge:
      description: Request exceeds the 24 MiB inference body limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Credential rate limit, budget, or provider concurrency capacity exceeded
      headers:
        Retry-After:
          description: Seconds until the rate window resets or provider admission should be retried, when available
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContentRejected:
      description: A required DLP, antivirus, or content-policy guardrail rejected the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: content_rejected, message: content rejected}
            ts: '2026-08-21T12:00:00Z'
    ProviderFailed:
      description: Provider, guardrail, billing, or post-processing failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ModuleFailed:
      description: Required gateway module failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: Required storage is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GuardrailUnavailable:
      description: Required policy registry, audit store, or scanner is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ManagementUnavailable:
      description: Required admin management service is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists or the optimistic control-plane revision is stale
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested managed resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    A2APart:
      type: object
      additionalProperties: false
      description: A2A 1.0 member-discriminated part. This endpoint currently accepts text only.
      properties:
        text: {type: string}
        mediaType: {type: string}
    A2AMessage:
      type: object
      additionalProperties: false
      required: [messageId, role, parts]
      properties:
        messageId: {type: string, minLength: 1, maxLength: 128}
        contextId: {type: string, maxLength: 128}
        taskId: {type: string, maxLength: 128, description: Existing durable task to continue}
        role: {type: string, enum: [ROLE_USER, ROLE_AGENT]}
        parts: {type: array, minItems: 1, maxItems: 1024, items: {$ref: '#/components/schemas/A2APart'}}
        metadata: {type: object, additionalProperties: true}
    A2AJSONRPCRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id: {oneOf: [{type: string}, {type: number}]}
        method: {type: string, enum: [SendMessage, GetTask, ListTasks, CancelTask]}
        params:
          type: object
          additionalProperties: false
          properties:
            tenant: {type: string, description: Must equal the selected agent profile ID}
            id: {type: string, minLength: 1, maxLength: 128, description: Task ID for GetTask or CancelTask}
            contextId: {type: string, maxLength: 128}
            status: {type: string, enum: [TASK_STATE_UNSPECIFIED, TASK_STATE_SUBMITTED, TASK_STATE_WORKING, TASK_STATE_COMPLETED, TASK_STATE_FAILED, TASK_STATE_CANCELED, TASK_STATE_INPUT_REQUIRED, TASK_STATE_REJECTED, TASK_STATE_AUTH_REQUIRED]}
            pageSize: {type: integer, minimum: 1, maximum: 100, default: 50}
            pageToken: {type: string, maxLength: 128}
            historyLength: {type: integer, minimum: 0, maximum: 100}
            includeArtifacts: {type: boolean, default: false}
            statusTimestampAfter: {type: string, format: date-time}
            message: {$ref: '#/components/schemas/A2AMessage'}
            configuration:
              type: object
              additionalProperties: false
              properties:
                acceptedOutputModes: {type: array, items: {type: string, const: text/plain}}
                returnImmediately: {type: boolean, description: Return an owner-scoped submitted or working task while durable background execution continues}
    A2AJSONRPCResponse:
      type: object
      additionalProperties: false
      required: [jsonrpc, id]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id: {oneOf: [{type: string}, {type: number}, {type: "null"}]}
        result:
          oneOf:
            - type: object
              additionalProperties: false
              required: [message]
              properties: {message: {$ref: '#/components/schemas/A2AMessage'}}
            - type: object
              additionalProperties: false
              required: [task]
              properties: {task: {$ref: '#/components/schemas/A2ATask'}}
            - {$ref: '#/components/schemas/A2ATask'}
            - type: object
              additionalProperties: false
              required: [tasks, pageSize, totalSize]
              properties:
                tasks: {type: array, items: {$ref: '#/components/schemas/A2ATask'}}
                nextPageToken: {type: string}
                pageSize: {type: integer}
                totalSize: {type: integer}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: integer}
            message: {type: string}
    A2ATask:
      type: object
      additionalProperties: false
      required: [id, contextId, status]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        contextId: {type: string, minLength: 1, maxLength: 128}
        status:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state: {type: string, enum: [TASK_STATE_UNSPECIFIED, TASK_STATE_SUBMITTED, TASK_STATE_WORKING, TASK_STATE_COMPLETED, TASK_STATE_FAILED, TASK_STATE_CANCELED, TASK_STATE_INPUT_REQUIRED, TASK_STATE_REJECTED, TASK_STATE_AUTH_REQUIRED]}
            timestamp: {type: string, format: date-time}
        artifacts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [artifactId, parts]
            properties:
              artifactId: {type: string, minLength: 1, maxLength: 128}
              parts: {type: array, minItems: 1, maxItems: 1024, items: {$ref: '#/components/schemas/A2APart'}}
        history: {type: array, items: {$ref: '#/components/schemas/A2AMessage'}}
    A2AAgentCard:
      type: object
      additionalProperties: true
      required: [name, description, supportedInterfaces, version, capabilities, defaultInputModes, defaultOutputModes, skills]
      properties:
        name: {type: string}
        description: {type: string}
        version: {type: string}
        supportedInterfaces: {type: array, minItems: 1, items: {type: object, additionalProperties: true}}
        capabilities: {type: object, additionalProperties: true}
        securitySchemes: {type: object, additionalProperties: true}
        securityRequirements: {type: array, items: {type: object, additionalProperties: true}}
        defaultInputModes: {type: array, items: {type: string}}
        defaultOutputModes: {type: array, items: {type: string}}
        skills: {type: array, minItems: 1, items: {type: object, additionalProperties: true}}
    Skill:
      type: object
      required: [id, type, source]
      properties:
        id: {type: string}
        type: {type: string, const: skill}
        display_name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        latest_version_id: {type: string}
        source:
          type: object
          required: [type]
          properties: {type: {type: string, enum: [custom, anthropic, anthropic_example, plugin]}}
    SkillVersion:
      type: object
      required: [id, type, skill_id]
      properties:
        id: {type: string}
        type: {type: string, const: skill_version}
        skill_id: {type: string}
        name: {type: string}
        description: {type: string}
        created_at: {type: string, format: date-time}
    SkillList:
      type: object
      required: [data, has_more]
      properties:
        data: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/Skill'}}
        has_more: {type: boolean}
        first_id: {type: string}
        last_id: {type: string}
    FileObject:
      type: object
      additionalProperties: false
      required: [id, object, bytes, created_at, filename, purpose, status]
      properties:
        id: {type: string, pattern: '^file_[a-f0-9]{32}$'}
        object: {type: string, const: file}
        bytes: {type: integer, format: int64, minimum: 1}
        created_at: {type: integer, format: int64}
        filename: {type: string, minLength: 1, maxLength: 512}
        purpose: {type: string, minLength: 1, maxLength: 64}
        status: {type: string, const: processed}
    FileList:
      type: object
      additionalProperties: false
      required: [object, data, has_more]
      properties:
        object: {type: string, const: list}
        data: {type: array, items: {$ref: '#/components/schemas/FileObject'}}
        first_id: {type: string}
        last_id: {type: string}
        has_more: {type: boolean}
    FileDeletion:
      type: object
      additionalProperties: false
      required: [id, object, deleted]
      properties:
        id: {type: string}
        object: {type: string, const: file}
        deleted: {type: boolean, const: true}
    VectorStoreExpiry:
      type: object
      additionalProperties: false
      required: [anchor, days]
      properties:
        anchor: {type: string, const: last_active_at}
        days: {type: integer, minimum: 1, maximum: 365}
    VectorStoreCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        expires_after: {$ref: '#/components/schemas/VectorStoreExpiry'}
        metadata:
          type: object
          maxProperties: 16
          additionalProperties: {type: string, maxLength: 512}
    VectorStoreUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        expires_after: {$ref: '#/components/schemas/VectorStoreExpiry'}
        metadata:
          type: object
          maxProperties: 16
          additionalProperties: {type: string, maxLength: 512}
    VectorStore:
      type: object
      additionalProperties: false
      required: [id, object, created_at, name, usage_bytes, status, file_counts, metadata, last_active_at]
      properties:
        id: {type: string, pattern: '^vs_[a-f0-9]{32}$'}
        object: {type: string, const: vector_store}
        created_at: {type: integer, format: int64}
        name: {type: string, minLength: 1, maxLength: 256}
        usage_bytes: {type: integer, format: int64, minimum: 0}
        status: {type: string, enum: [completed, expired]}
        file_counts:
          type: object
          additionalProperties: false
          required: [in_progress, completed, failed, cancelled, total]
          properties:
            in_progress: {type: integer, minimum: 0, const: 0}
            completed: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0, const: 0}
            cancelled: {type: integer, minimum: 0, const: 0}
            total: {type: integer, minimum: 0}
        metadata:
          type: object
          maxProperties: 16
          additionalProperties: {type: string}
        expires_after: {$ref: '#/components/schemas/VectorStoreExpiry'}
        expires_at: {type: integer, format: int64}
        last_active_at: {type: integer, format: int64}
    VectorStoreList:
      type: object
      additionalProperties: false
      required: [object, data, has_more]
      properties:
        object: {type: string, const: list}
        data: {type: array, items: {$ref: '#/components/schemas/VectorStore'}}
        first_id: {type: string}
        last_id: {type: string}
        has_more: {type: boolean}
    VectorStoreDeletion:
      type: object
      additionalProperties: false
      required: [id, object, deleted]
      properties:
        id: {type: string}
        object: {type: string, const: vector_store.deleted}
        deleted: {type: boolean, const: true}
    VectorStoreFileCreateRequest:
      type: object
      additionalProperties: false
      required: [file_id]
      properties:
        file_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    VectorStoreFile:
      type: object
      additionalProperties: false
      required: [id, object, usage_bytes, created_at, vector_store_id, status, last_error, attributes]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        object: {type: string, const: vector_store.file}
        usage_bytes: {type: integer, format: int64, minimum: 0}
        created_at: {type: integer, format: int64}
        vector_store_id: {type: string, minLength: 1, maxLength: 128}
        status: {type: string, const: completed}
        last_error: {type: 'null'}
        attributes:
          type: object
          additionalProperties: {type: string}
          maxProperties: 16
    VectorStoreFileList:
      type: object
      additionalProperties: false
      required: [object, data, has_more]
      properties:
        object: {type: string, const: list}
        data: {type: array, items: {$ref: '#/components/schemas/VectorStoreFile'}}
        first_id: {type: string}
        last_id: {type: string}
        has_more: {type: boolean}
    VectorStoreFileDeletion:
      type: object
      additionalProperties: false
      required: [id, object, deleted]
      properties:
        id: {type: string}
        object: {type: string, const: vector_store.file.deleted}
        deleted: {type: boolean, const: true}
    BedrockConverseRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/BedrockMessage'}
        system:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: {type: string, minLength: 1}
        inferenceConfig: {$ref: '#/components/schemas/BedrockInferenceConfig'}
        toolConfig: {$ref: '#/components/schemas/BedrockToolConfig'}
        serviceTier:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, enum: [default, flex, priority, reserved]}
        performanceConfig:
          type: object
          additionalProperties: false
          required: [latency]
          properties:
            latency: {type: string, enum: [standard, optimized]}
        outputConfig:
          $ref: '#/components/schemas/BedrockOutputConfig'
        guardrailConfig:
          type: object
          additionalProperties: false
          required: [guardrailIdentifier, guardrailVersion]
          properties:
            guardrailIdentifier: {type: string, minLength: 1, maxLength: 2048, pattern: '^(?:[a-z0-9]+|arn:aws(?:-[^:]+)?:bedrock:[a-z0-9-]{1,20}:[0-9]{12}:guardrail/[a-z0-9]+)$'}
            guardrailVersion: {type: string, pattern: '^(?:[1-9][0-9]{0,7}|DRAFT)$'}
            trace: {type: string, enum: [enabled, disabled, enabled_full]}
        additionalModelRequestFields:
          description: A non-null JSON value of model-specific inference parameters, bounded to 64 KiB by the gateway.
        additionalModelResponseFieldPaths:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Non-empty RFC 6901 JSON Pointers for bounded model-specific response fields.
          items: {type: string, minLength: 1, maxLength: 256, pattern: '^/([^~]|~[01])*$'}
        requestMetadata:
          type: object
          maxProperties: 16
          description: Bounded key-value metadata attached to the provider invocation log. Requests using it bypass response caches.
          propertyNames: {minLength: 1, maxLength: 256, pattern: '^[a-zA-Z0-9\s:_@$#=/+,.-]+$'}
          additionalProperties: {type: string, maxLength: 256, pattern: '^[a-zA-Z0-9\s:_@$#=/+,.-]*$'}
    BedrockInferenceConfig:
      type: object
      additionalProperties: false
      properties:
        maxTokens: {type: integer, minimum: 1, maximum: 2147483647}
        temperature: {type: number, minimum: 0, maximum: 1}
        topP: {type: number, minimum: 0, maximum: 1}
        stopSequences:
          type: array
          maxItems: 4
          items: {type: string, minLength: 1}
    BedrockOutputConfig:
      type: object
      additionalProperties: false
      required: [textFormat]
      properties:
        textFormat:
          type: object
          additionalProperties: false
          required: [type, structure]
          properties:
            type: {type: string, const: json_schema}
            structure:
              type: object
              additionalProperties: false
              required: [jsonSchema]
              properties:
                jsonSchema:
                  type: object
                  additionalProperties: false
                  required: [schema]
                  properties:
                    schema: {type: string, minLength: 1, maxLength: 1048576, description: JSON-encoded schema object}
                    name: {type: string, maxLength: 256}
                    description: {type: string, maxLength: 8192}
    BedrockMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant]}
        content:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/BedrockContentBlock'}
    BedrockContentBlock:
      type: object
      additionalProperties: false
      oneOf:
        - required: [text]
        - required: [image]
        - required: [document]
        - required: [toolUse]
        - required: [toolResult]
        - required: [citationsContent]
        - required: [reasoningContent]
      properties:
        text: {type: string, minLength: 1}
        image:
          type: object
          additionalProperties: false
          required: [format, source]
          properties:
            format: {type: string, enum: [jpeg, png, gif, webp]}
            source:
              type: object
              additionalProperties: false
              required: [bytes]
              properties:
                bytes: {type: string, minLength: 4, maxLength: 11184812, pattern: '^[A-Za-z0-9+/]+={0,2}$'}
        document:
          type: object
          additionalProperties: false
          required: [format, name, source]
          properties:
            format: {type: string, enum: [pdf, csv, doc, docx, xls, xlsx, html, txt, md]}
            name: {type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9][A-Za-z0-9 ()\[\]-]*[A-Za-z0-9)\]]$|^[A-Za-z0-9]$'}
            source:
              type: object
              additionalProperties: false
              required: [bytes]
              properties:
                bytes: {type: string, minLength: 4, maxLength: 6291456, pattern: '^[A-Za-z0-9+/]+={0,2}$'}
        toolUse:
          type: object
          additionalProperties: false
          required: [toolUseId, name, input]
          properties:
            toolUseId: {type: string, minLength: 1}
            name: {type: string, minLength: 1}
            input: {}
        toolResult:
          type: object
          additionalProperties: false
          required: [toolUseId, content]
          properties:
            toolUseId: {type: string, minLength: 1}
            content:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                additionalProperties: false
                required: [text]
                properties:
                  text: {type: string, minLength: 1}
        citationsContent:
          allOf:
            - {$ref: '#/components/schemas/BedrockCitationsContent'}
          readOnly: true
        reasoningContent:
          $ref: '#/components/schemas/BedrockReasoningContent'
    BedrockReasoningContent:
      type: object
      additionalProperties: false
      oneOf:
        - required: [reasoningText]
        - required: [redactedContent]
      properties:
        reasoningText:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text: {type: string, minLength: 1, maxLength: 1048576}
            signature: {type: string, minLength: 1, maxLength: 1048576}
        redactedContent:
          type: string
          minLength: 4
          maxLength: 1048576
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
    BedrockCitationsContent:
      type: object
      additionalProperties: false
      required: [content, citations]
      properties:
        content:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: {type: string}
        citations:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/BedrockCitation'}
    BedrockCitation:
      type: object
      additionalProperties: false
      required: [location]
      properties:
        title: {type: string, maxLength: 2048}
        source: {type: string, maxLength: 8192}
        sourceContent:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text: {type: string, maxLength: 65536}
        location:
          $ref: '#/components/schemas/BedrockCitationLocation'
    BedrockCitationLocation:
      type: object
      additionalProperties: false
      oneOf:
        - required: [documentChar]
        - required: [documentChunk]
        - required: [documentPage]
        - required: [searchResultLocation]
        - required: [web]
      properties:
        documentChar: {$ref: '#/components/schemas/BedrockDocumentLocation'}
        documentChunk: {$ref: '#/components/schemas/BedrockDocumentLocation'}
        documentPage: {$ref: '#/components/schemas/BedrockDocumentLocation'}
        searchResultLocation:
          type: object
          additionalProperties: false
          required: [searchResultIndex, start, end]
          properties:
            searchResultIndex: {type: integer, minimum: 0}
            start: {type: integer, minimum: 0}
            end: {type: integer, minimum: 0}
        web:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            domain: {type: string, maxLength: 253}
            url: {type: string, format: uri, minLength: 1, maxLength: 8192}
    BedrockDocumentLocation:
      type: object
      additionalProperties: false
      required: [documentIndex, start, end]
      properties:
        documentIndex: {type: integer, minimum: 0}
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 0}
    BedrockToolConfig:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [toolSpec]
            properties:
              toolSpec:
                type: object
                additionalProperties: false
                required: [name, inputSchema]
                properties:
                  name: {type: string, minLength: 1}
                  description: {type: string}
                  inputSchema:
                    type: object
                    additionalProperties: false
                    required: [json]
                    properties:
                      json: {}
        toolChoice:
          $ref: '#/components/schemas/BedrockToolChoice'
    BedrockToolChoice:
      type: object
      additionalProperties: false
      oneOf:
        - required: [auto]
        - required: [any]
        - required: [tool]
      properties:
        auto: {type: object, additionalProperties: false}
        any: {type: object, additionalProperties: false}
        tool:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
    BedrockConverseResponse:
      type: object
      additionalProperties: false
      required: [output, stopReason, usage]
      properties:
        output:
          type: object
          additionalProperties: false
          required: [message]
          properties:
            message: {$ref: '#/components/schemas/BedrockMessage'}
        stopReason: {type: string, enum: [end_turn, max_tokens, tool_use, content_filtered, guardrail_intervened, malformed_model_output, malformed_tool_use, model_context_window_exceeded]}
        usage:
          type: object
          additionalProperties: false
          required: [inputTokens, outputTokens, totalTokens]
          properties:
            inputTokens: {type: integer, minimum: 0}
            outputTokens: {type: integer, minimum: 0}
            totalTokens: {type: integer, minimum: 0}
        additionalModelResponseFields:
          description: Model-specific fields explicitly selected by additionalModelResponseFieldPaths.
          readOnly: true
        trace:
          description: Provider guardrail trace returned only when tracing was explicitly enabled.
          readOnly: true
    GenerateContentError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, status, message]
          properties:
            code: {type: integer}
            status: {type: string}
            message: {type: string}
    GenerateCountRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [contents]
        - required: [generateContentRequest]
      properties:
        contents:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/GenerateContent'}
        generateContentRequest:
          $ref: '#/components/schemas/GenerateCountContext'
    GenerateCountContext:
      type: object
      additionalProperties: false
      required: [contents]
      properties:
        model:
          type: string
          description: Optional path model name, with or without the models/ prefix. Must match the path.
        contents:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/GenerateContent'}
        systemInstruction:
          allOf:
            - {$ref: '#/components/schemas/GenerateContent'}
          description: Text parts only; role must be absent or system.
        tools:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [functionDeclarations]
            properties:
              functionDeclarations:
                type: array
                minItems: 1
                maxItems: 128
                items:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1}
                    description: {type: string}
                    parameters:
                      type: object
                      description: Native Schema supports nullable, anyOf, size/numeric bounds and pattern (64 levels, 128 alternatives); mutually exclusive with parametersJsonSchema.
                    parametersJsonSchema: {type: object}
        toolConfig:
          type: object
          additionalProperties: false
          properties:
            functionCallingConfig:
              type: object
              additionalProperties: false
              properties:
                mode: {type: string, enum: [AUTO, NONE, ANY]}
                allowedFunctionNames:
                  type: array
                  maxItems: 1
                  items: {type: string}
                  description: ANY requires exactly one declared function name.
    GenerateContentRequest:
      type: object
      additionalProperties: false
      required: [contents]
      properties:
        contents:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/GenerateContent'}
        systemInstruction:
          allOf:
            - {$ref: '#/components/schemas/GenerateContent'}
          description: Text parts only; role must be absent or system.
        tools:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [functionDeclarations]
            properties:
              functionDeclarations:
                type: array
                minItems: 1
                maxItems: 128
                items:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1}
                    description: {type: string}
                    parameters:
                      type: object
                      description: Native Schema supports nullable, anyOf, size/numeric bounds and pattern (64 levels, 128 alternatives); mutually exclusive with parametersJsonSchema.
                    parametersJsonSchema: {type: object}
        toolConfig:
          type: object
          additionalProperties: false
          properties:
            functionCallingConfig:
              type: object
              additionalProperties: false
              properties:
                mode: {type: string, enum: [AUTO, NONE, ANY]}
                allowedFunctionNames:
                  type: array
                  maxItems: 1
                  items: {type: string}
                  description: ANY requires exactly one declared function name.
        generationConfig:
          type: object
          additionalProperties: false
          properties:
            maxOutputTokens: {type: integer, minimum: 1, maximum: 2147483647}
            temperature: {type: number, minimum: 0, maximum: 2}
            topP: {type: number, minimum: 0, maximum: 1}
            topK: {type: integer, minimum: 1, maximum: 1000000}
            seed: {type: integer, minimum: -2147483648, maximum: 2147483647}
            candidateCount: {type: integer, enum: [1], description: The gateway returns exactly one candidate and normalizes this value before provider routing.}
            presencePenalty: {type: number, minimum: -2, maximum: 2}
            frequencyPenalty: {type: number, minimum: -2, maximum: 2}
            responseLogprobs: {type: boolean}
            logprobs: {type: integer, minimum: 0, maximum: 20, description: Requires responseLogprobs=true.}
            responseModalities:
              type: array
              maxItems: 1
              items: {type: string, enum: [TEXT]}
              description: Text output is supported; an empty array is normalized to TEXT.
            stopSequences:
              type: array
              maxItems: 4
              items: {type: string, minLength: 1}
            responseMimeType: {type: string, enum: [text/plain, application/json]}
            responseSchema:
              type: object
              description: Native Schema supports nullable, anyOf, size/numeric bounds and pattern (64 levels, 128 alternatives); mutually exclusive with responseJsonSchema. Requires application/json.
            responseJsonSchema: {type: object}
    GenerateContent:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        role: {type: string, enum: [user, model, system]}
        parts:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/GeneratePart'}
    GeneratePart:
      type: object
      additionalProperties: false
      oneOf:
        - required: [text]
        - required: [inlineData]
        - required: [functionCall]
        - required: [functionResponse]
      properties:
        text: {type: string}
        thoughtSignature:
          type: string
          format: byte
          description: Opaque signature supported on functionCall, thought text, and ordinary model text parts and preserved for later turns.
        thought:
          type: boolean
          description: When true, text is model reasoning and is preserved separately from visible response text.
        inlineData:
          type: object
          additionalProperties: false
          required: [mimeType, data]
          properties:
            mimeType: {type: string, enum: [image/png, image/jpeg, image/gif, image/webp]}
            data: {type: string, format: byte}
        functionCall:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            id: {type: string}
            name: {type: string, minLength: 1}
            args:
              description: Omitted or null arguments are normalized to an empty object.
              oneOf:
                - {type: object}
                - {type: 'null'}
        functionResponse:
          type: object
          additionalProperties: false
          required: [name, response]
          properties:
            id: {type: string}
            name: {type: string, minLength: 1}
            response: {type: object}
    GenerateContentResponse:
      type: object
      required: [responseId, modelVersion, candidates, usageMetadata]
      properties:
        responseId: {type: string}
        modelVersion:
          type: string
          description: Provider-reported model version when available, otherwise the normalized model name.
        candidates:
          type: array
          maxItems: 1
          items:
            type: object
            properties:
              index: {type: integer, enum: [0]}
              content: {$ref: '#/components/schemas/GenerateContent'}
              finishReason: {type: string, enum: [STOP, MAX_TOKENS, SAFETY]}
        usageMetadata:
          type: object
          properties:
            promptTokenCount: {type: integer, minimum: 0}
            candidatesTokenCount: {type: integer, minimum: 0}
            thoughtsTokenCount: {type: integer, minimum: 0}
            cachedContentTokenCount: {type: integer, minimum: 0}
            totalTokenCount: {type: integer, minimum: 0}
    MessageTokenCountRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model: {type: string, minLength: 1}
        messages: {$ref: '#/components/schemas/MessagesRequest/properties/messages'}
        system: {$ref: '#/components/schemas/MessagesRequest/properties/system'}
        tools: {$ref: '#/components/schemas/MessagesRequest/properties/tools'}
        tool_choice: {$ref: '#/components/schemas/MessagesRequest/properties/tool_choice'}
        output_config: {$ref: '#/components/schemas/MessagesRequest/properties/output_config'}
    MessagesRequest:
      type: object
      additionalProperties: false
      required: [model, max_tokens, messages]
      properties:
        model: {type: string, minLength: 1}
        max_tokens: {type: integer, minimum: 1}
        stop_sequences:
          type: array
          maxItems: 4
          items: {type: string, minLength: 1}
          description: Requires an adapter reporting exact matched stops; currently native Anthropic
        background: {type: boolean, default: false, description: Requires store=true and stream=false. Settlement continues from durable storage after restart.}
        stream: {type: boolean, default: false}
        stream_options:
          type: object
          additionalProperties: false
          properties:
            include_usage: {type: boolean, description: Emit a final usage chunk to the client; upstream usage collection remains enabled for billing.}
            include_obfuscation: {type: boolean, default: true, description: Add random padding to streaming delta events to reduce payload-size side channels.}
        temperature: {type: number, minimum: 0, maximum: 1}
        top_p: {type: number, minimum: 0, maximum: 1}
        service_tier: {type: string, enum: [auto, standard_only], description: "Native capacity selection. The assigned standard, priority or batch tier is returned in usage.service_tier."}
        metadata:
          type: object
          additionalProperties: false
          properties:
            user_id: {type: string, maxLength: 512}
        output_config:
          type: object
          additionalProperties: false
          properties:
            effort: {type: string, enum: [low, medium, high, xhigh, max]}
            format:
              type: object
              additionalProperties: false
              required: [type, schema]
              properties:
                type: {type: string, const: json_schema}
                schema: {type: object, additionalProperties: true}
        system:
          description: Text or text blocks. Text blocks may carry an explicit ephemeral cache_control breakpoint.
          oneOf:
            - {type: string}
            - type: array
              items: {type: object}
        messages:
          type: array
          minItems: 1
          maxItems: 10000
          description: A final assistant message with non-empty text requests continuation and requires an assistant_prefill-capable deployment and model.
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: {type: string, enum: [user, assistant]}
              content:
                oneOf:
                  - {type: string}
                  - type: array
                    minItems: 1
                    items: {type: object}
                    description: Supports text, image, tool_use, tool_result, thinking and redacted_thinking blocks. Thinking history is accepted only for assistant messages and routed only to an adapter with an explicit signed-reasoning contract.
        tools:
          type: array
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [name, input_schema]
                properties:
                  name: {type: string, minLength: 1}
                  description: {type: string}
                  input_schema: {type: object, additionalProperties: true}
                  cache_control:
                    type: object
                    additionalProperties: false
