        refusal: {type: [string, 'null'], description: Model refusal content for assistant history and responses.}
        annotations:
          type: array
          readOnly: true
          maxItems: 128
          items: {$ref: '#/components/schemas/ChatAnnotation'}
        audio:
          $ref: '#/components/schemas/ChatAudio'
          description: Previous audio id in request history, or generated audio data in a response.
        name: {type: string}
        tool_call_id: {type: string}
        tool_calls:
          type: array
          items: {$ref: '#/components/schemas/ToolCall'}
        function_call:
          $ref: '#/components/schemas/LegacyFunctionCall'
          description: Legacy assistant function call. Supported by compatible deployments; native adapters reject it explicitly.
        reasoning:
          type: array
          maxItems: 128
          description: Signed or redacted native reasoning history. Supported only by deployments with an explicit reasoning-block contract.
          items: {$ref: '#/components/schemas/ReasoningBlock'}
        reasoning_content:
          type: string
          maxLength: 1048576
          description: Unsigned assistant reasoning preserved by deployments with an explicit string reasoning contract. It is counted as request context and disables semantic cache reuse.
    ReasoningBlock:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, thinking, signature]
          properties:
            index: {type: integer, minimum: 0, maximum: 127, readOnly: true}
            type: {type: string, const: thinking}
            thinking: {type: string, minLength: 1, maxLength: 1048576}
            signature: {type: string, minLength: 1, maxLength: 1048576}
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            index: {type: integer, minimum: 0, maximum: 127, readOnly: true}
            type: {type: string, const: redacted_thinking}
            data: {type: string, minLength: 1, maxLength: 1048576}
    ChatAnnotation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, url_citation]
          properties:
            type: {type: string, const: url_citation}
            url_citation:
              type: object
              additionalProperties: false
              required: [end_index, start_index, title, url]
              properties:
                end_index: {type: integer, minimum: 0}
                start_index: {type: integer, minimum: 0}
                title: {type: string, minLength: 1, maxLength: 2048}
                url: {type: string, format: uri, minLength: 1, maxLength: 8192}
        - type: object
          additionalProperties: false
          required: [type, source_citation]
          properties:
            type: {type: string, const: source_citation}
            source_citation:
              type: object
              additionalProperties: false
              required: [start_index, end_index, location_type, location_start, location_end]
              oneOf:
                - properties:
                    location_type: {type: string, enum: [document_char, document_chunk, document_page]}
                  required: [document_index]
                  not: {required: [search_result_index]}
                - properties:
                    location_type: {type: string, const: search_result}
                  required: [search_result_index]
                  not: {required: [document_index]}
              properties:
                start_index: {type: integer, minimum: 0}
                end_index: {type: integer, minimum: 0}
                title: {type: string, maxLength: 2048}
                source: {type: string, maxLength: 8192}
                source_content:
                  type: array
                  maxItems: 16
                  items: {type: string, maxLength: 65536}
                location_type: {type: string, enum: [document_char, document_chunk, document_page, search_result]}
                document_index: {type: integer, minimum: 0}
                search_result_index: {type: integer, minimum: 0}
                location_start: {type: integer, minimum: 0}
                location_end: {type: integer, minimum: 0}
    ChatAudio:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, minLength: 1, maxLength: 256}
        data: {type: string, minLength: 1, maxLength: 33554432, contentEncoding: base64, readOnly: true}
        expires_at: {type: integer, format: int64, minimum: 0, readOnly: true}
        transcript: {type: string, maxLength: 1048576, readOnly: true}
    ChatAudioOptions:
      type: object
      additionalProperties: false
      required: [format, voice]
      properties:
        format: {type: string, enum: [wav, aac, mp3, flac, opus, pcm16]}
        voice:
          oneOf:
            - {type: string, minLength: 1, maxLength: 256}
            - type: object
              additionalProperties: false
              required: [id]
              properties:
                id: {type: string, minLength: 1, maxLength: 256}
    FunctionDefinition:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        parameters:
          type: object
          additionalProperties: true
        strict: {type: boolean}
        prompt_cache_breakpoint:
          type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: {type: string, const: explicit}
            ttl: {type: string, enum: [5m, 1h]}
    ChatTool:
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type: {type: string, const: function}
        function: {$ref: '#/components/schemas/FunctionDefinition'}
    LegacyFunctionDefinition:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        description: {type: string, maxLength: 4096}
        parameters:
          type: object
          additionalProperties: true
        strict: {type: boolean}
    JSONSchemaFormat:
      type: object
      additionalProperties: false
      required: [name, schema]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        schema:
          type: object
          additionalProperties: true
        strict: {type: boolean}
    ResponseFormat:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [text, json_object, json_schema]
        json_schema: {$ref: '#/components/schemas/JSONSchemaFormat'}
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        provider: {type: string}
        model: {type: string, minLength: 1}
        messages:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Message'}
        tools:
          type: array
          items: {$ref: '#/components/schemas/ChatTool'}
        tool_choice: {}
        parallel_tool_calls: {type: boolean}
        functions:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/LegacyFunctionDefinition'}
          description: Legacy function declarations for compatible deployments. Mutually exclusive with tools.
        function_call:
          description: Legacy function selection. Mutually exclusive with tool_choice.
          oneOf:
            - {type: string, enum: [none, auto]}
            - type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        response_format: {$ref: '#/components/schemas/ResponseFormat'}
        stream: {type: boolean, default: false}
        max_tokens: {type: integer, minimum: 1}
        max_completion_tokens: {type: integer, minimum: 1, description: Mapped to native max_tokens by Mistral deployments.}
        temperature: {type: number}
        top_p: {type: number}
        stop: {}
        seed: {type: integer, format: int64}
        metadata:
          type: object
          maxProperties: 16
          propertyNames: {maxLength: 64}
          additionalProperties: {type: string, maxLength: 512}
        store: {type: boolean, description: false is forwarded by compatible and native Gemini adapters; true is rejected until stored Chat lifecycle routes are available.}
        modalities:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [text, audio]}
          description: Native Gemini accepts text-only output; compatible deployment support is provider-specific.
        audio: {$ref: '#/components/schemas/ChatAudioOptions'}
        reasoning_effort: {type: string, enum: [none, minimal, low, medium, high, xhigh, max], description: Native Gemini maps minimal through high to thinkingConfig.thinkingLevel; native Ollama maps none to think=false; available levels depend on the selected model.}
        safe_prompt: {type: boolean, description: Enables provider-managed prompt safety for native Mistral Chat deployments; rejected by other adapters.}
        n: {type: integer, minimum: 1, maximum: 128, default: 1, description: Native Gemini supports values up to 20; compatible deployment limits are provider-specific.}
        safety_identifier: {type: string, maxLength: 64}
        prompt_cache_key: {type: string}
        prompt_cache_options:
          type: object
          additionalProperties: false
          properties:
            mode: {type: string, enum: [implicit, explicit]}
            ttl: {type: string, enum: [30m]}
        prompt_cache_retention: {type: string, enum: [in_memory, 24h]}
        prompt_mode: {type: string, enum: [reasoning], description: Enables the native Mistral reasoning system prompt; rejected by other adapters.}
        prediction:
          type: object
          additionalProperties: false
          required: [type, content]
          properties:
            type: {type: string, const: content}
            content:
              oneOf:
                - type: string
                - type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [type, text]
                    properties:
                      type: {type: string, const: text}
                      text: {type: string}
                      prompt_cache_breakpoint:
                        type: object
                        additionalProperties: false
                        required: [mode]
                        properties:
                          mode: {type: string, const: explicit}
        service_tier: {type: string, enum: [auto, default, on_demand, flex, performance, scale, priority, fast, ultrafast, standard_only], description: "Managed OpenAI accepts auto, default, flex, and priority. OpenRouter passes validated values through. Native Groq accepts auto, default, on_demand, flex, and performance; native Gemini accepts auto, default, standard_only, flex, and priority; native Anthropic accepts auto and standard_only. Other adapters reject the field."}
        user: {type: string, description: "Legacy provider hint; never used as gateway authorization, rate-limit, or billing identity."}
        verbosity: {type: string, enum: [low, medium, high]}
        web_search_options:
          type: object
          additionalProperties: false
          properties:
            search_context_size: {type: string, enum: [low, medium, high]}
            max_uses: {type: integer, minimum: 1, maximum: 5, default: 5}
            user_location:
              type: object
              additionalProperties: false
              required: [type, approximate]
              properties:
                type: {type: string, const: approximate}
                approximate:
                  type: object
                  additionalProperties: false
                  properties:
                    city: {type: string}
                    country: {type: string}
                    region: {type: string}
                    timezone: {type: string}
        web_fetch_options:
          type: object
          additionalProperties: false
          required: [allowed_domains, max_content_tokens]
          description: Enables bounded native server-side retrieval. A non-empty domain allowlist is required to constrain data-exfiltration exposure; citations are always enabled by the gateway.
          properties:
            allowed_domains:
              type: array
              minItems: 1
              maxItems: 20
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 253, pattern: '^[A-Za-z0-9.-]+$'}
            max_uses: {type: integer, minimum: 1, maximum: 5, default: 5}
            max_content_tokens: {type: integer, minimum: 1, maximum: 100000}
        logprobs: {type: boolean, description: "Native Gemini, Cohere, and Ollama adapters preserve token log probabilities; support by compatible deployments is provider-specific."}
        top_logprobs: {type: integer, minimum: 0, maximum: 20, description: Requires logprobs=true. Native Gemini maps this to the per-step candidate count; native Ollama returns up to this many alternatives.}
        frequency_penalty: {type: number, minimum: -2, maximum: 2}
        presence_penalty: {type: number, minimum: -2, maximum: 2}
        min_p: {type: number, minimum: 0, maximum: 1, description: "Relative minimum token probability forwarded by compatible and native Ollama adapters."}
        top_k: {type: integer, minimum: 0, maximum: 1000000, description: "Maximum candidate token count forwarded by compatible, native Gemini, native Ollama, and native Cohere adapters; Cohere accepts at most 500."}
        top_a: {type: number, minimum: 0, maximum: 1, description: Dynamic token probability threshold forwarded by compatible adapters.}
        repetition_penalty: {type: number, exclusiveMinimum: 0, description: Multiplicative repetition penalty forwarded by compatible adapters.}
        logit_bias:
          type: object
          propertyNames: {pattern: '^[0-9]+$'}
          additionalProperties: {type: integer, minimum: -100, maximum: 100}

    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: {type: integer, minimum: 0}
        completion_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
        completion_tokens_details:
          type: object
          properties:
            accepted_prediction_tokens: {type: integer, minimum: 0}
            audio_tokens: {type: integer, minimum: 0}
            reasoning_tokens: {type: integer, minimum: 0}
            rejected_prediction_tokens: {type: integer, minimum: 0}
            text_tokens: {type: integer, minimum: 0}
        prompt_tokens_details:
          type: object
          properties:
            cached_tokens: {type: integer, minimum: 0}
            cache_write_tokens: {type: integer, minimum: 0}
            cache_creation_tokens: {type: integer, minimum: 0}
            audio_tokens: {type: integer, minimum: 0}
            image_tokens: {type: integer, minimum: 0}
            text_tokens: {type: integer, minimum: 0}
    CompletionRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        provider: {type: string}
        model: {type: string, minLength: 1}
        prompt:
          description: A string, strings, token IDs or token-ID arrays. At most 128 prompts and 128 returned choices after multiplying by n.
          anyOf:
            - type: string
            - type: array
              maxItems: 128
              items: {type: string}
            - type: array
              items: {type: integer, minimum: 0, maximum: 2147483647}
            - type: array
              minItems: 1
              maxItems: 128
              items:
                type: array
                items: {type: integer, minimum: 0, maximum: 2147483647}
        metadata:
          type: object
          description: Native Mistral FIM metadata; rejected by other adapters.
          maxProperties: 16
          propertyNames: {maxLength: 64}
          additionalProperties: {type: string, maxLength: 512}
        best_of: {type: integer, minimum: 1, maximum: 20, description: Must be at least n and cannot exceed 1 with stream=true.}
        echo: {type: boolean}
        frequency_penalty: {type: number, minimum: -2, maximum: 2}
        logit_bias:
          type: object
          propertyNames: {pattern: '^[0-9]+$'}
          additionalProperties: {type: integer, minimum: -100, maximum: 100}
        logprobs: {type: integer, minimum: 0, maximum: 5}
        max_tokens: {type: integer, minimum: 0}
        min_tokens: {type: integer, minimum: 0, description: Native Mistral FIM minimum output tokens; cannot exceed max_tokens and is rejected by other adapters.}
        n: {type: integer, minimum: 1, maximum: 128}
        presence_penalty: {type: number, minimum: -2, maximum: 2}
        prompt_cache_key: {type: string, description: Native Mistral FIM prompt cache key; rejected by other adapters.}
        seed: {type: integer, format: int64}
        stop:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              maxItems: 4
              items: {type: string, minLength: 1}
        stream: {type: boolean, default: false}
        suffix: {type: string}
        temperature: {type: number, minimum: 0, maximum: 2}
        top_p: {type: number, minimum: 0, maximum: 1}
        user: {type: string, maxLength: 256}
    CompletionLogprobs:
      type: object
      required: [text_offset, token_logprobs, tokens, top_logprobs]
      properties:
        text_offset:
          type: array
          items: {type: integer, minimum: 0}
        token_logprobs:
          type: array
          items:
            type: [number, 'null']
        tokens:
          type: array
          items: {type: string}
        top_logprobs:
          type: array
          items:
            oneOf:
              - type: object
                additionalProperties: {type: number}
              - type: 'null'
    CompletionChoice:
      type: object
      required: [finish_reason, index, text]
      properties:
        finish_reason: {type: string}
        index: {type: integer, minimum: 0, maximum: 127}
        logprobs:
          oneOf:
            - {$ref: '#/components/schemas/CompletionLogprobs'}
            - type: 'null'
        text: {type: string}
    CompletionResponse:
      type: object
      additionalProperties: false
      required: [id, object, created, model, choices, usage]
      properties:
        id: {type: string, minLength: 1, maxLength: 512}
        object: {type: string, const: text_completion}
        created: {type: integer, minimum: 0}
        model: {type: string, minLength: 1}
        choices:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/CompletionChoice'}
        system_fingerprint: {type: string}
        usage: {$ref: '#/components/schemas/Usage'}
    ChoiceLogprobs:
      type: object
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/TokenLogprob'}
        refusal:
          type: array
          items: {$ref: '#/components/schemas/TokenLogprob'}
    TopLogprob:
      type: object
      required: [token, logprob, bytes]
      properties:
        token: {type: string}
        logprob: {type: number}
        bytes:
          oneOf:
            - type: 'null'
            - type: array
              items: {type: integer}
    TokenLogprob:
      allOf:
        - {$ref: '#/components/schemas/TopLogprob'}
        - type: object
          properties:
            top_logprobs:
              type: array
              items: {$ref: '#/components/schemas/TopLogprob'}
    Choice:
      type: object
      required: [index, message, finish_reason]
      properties:
        index: {type: integer, minimum: 0}
        message: {$ref: '#/components/schemas/Message'}
        finish_reason: {type: string}
        stop_sequence: {type: string, description: Exact matched sequence when reported by the provider}
        logprobs: {$ref: '#/components/schemas/ChoiceLogprobs'}
    ChatCompletionResponse:
      type: object
      required: [id, object, model, choices, usage]
      properties:
        id: {type: string}
        object: {type: string, const: chat.completion}
        created: {type: integer, format: int64, minimum: 0}
        model: {type: string}
        metadata:
          type: object
          maxProperties: 16
          propertyNames: {maxLength: 64}
          additionalProperties: {type: string, maxLength: 512}
        service_tier: {type: string}
        system_fingerprint: {type: string}
        choices:
          type: array
          items: {$ref: '#/components/schemas/Choice'}
        usage: {$ref: '#/components/schemas/Usage'}
    FunctionResponseTool:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type: {type: string, const: function}
        name: {type: string, minLength: 1}
        description: {type: string}
        parameters:
          type: object
          additionalProperties: true
        strict: {type: boolean}
    MCPResponseTool:
      type: object
      description: Remote connector forwarded to the selected provider for execution. This does not reference or automatically load a registry entry. Gateway authorization checks mcp:<server_label>@<canonical-https-url>; the provider enforces connector-level allowed_tools and require_approval.
      additionalProperties: false
      required: [type, server_label, server_url]
      properties:
        type: {type: string, const: mcp}
        server_label: {type: string, minLength: 1}
        server_url:
          type: string
          format: uri
          pattern: '^https://'
        server_description: {type: string}
        allowed_tools:
          type: array
          items: {type: string}
        require_approval: {}
        headers:
          type: object
          additionalProperties: {type: string}
          description: Provider-scoped connector headers. Client bearer is never injected.
    ResponseInputMessage:
      type: object
      additionalProperties: true
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant]}
        content:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/TextContentPart'
              - $ref: '#/components/schemas/InputImageContentPart'
    ResponseRequest:
      description: Supply at most one non-null output limit, max_output_tokens or max_tokens.
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        metadata:
          type: object
          maxProperties: 16
          propertyNames: {maxLength: 64}
          additionalProperties: {type: string, maxLength: 512}
        reasoning:
          type: object
          additionalProperties: false
          properties:
            effort: {type: string}
            summary: {type: string}
            generate_summary: {type: string}
            context: {type: string}
            mode: {type: string}
        top_logprobs: {type: integer, minimum: 0, maximum: 20}
        truncation: {type: string, enum: [auto, disabled]}
        store: {type: boolean}
        include:
          type: array
          items: {type: string}
        provider: {type: string}
        model: {type: string, minLength: 1}
        input:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              items:
                oneOf:
                  - {$ref: '#/components/schemas/ResponseInputMessage'}
                  - {$ref: '#/components/schemas/TextContentPart'}
                  - {$ref: '#/components/schemas/InputImageContentPart'}
                  - type: object
                    additionalProperties: true
        instructions: {type: string}
        tools:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/FunctionResponseTool'
              - $ref: '#/components/schemas/MCPResponseTool'
        tool_choice: {}
        parallel_tool_calls: {type: boolean}
        text:
          type: object
          additionalProperties: true
          properties:
            verbosity: {type: string, enum: [low, medium, high]}
        previous_response_id: {type: string}
        user: {type: string, maxLength: 512, pattern: '^[a-zA-Z0-9_-]+$', description: Provider-specific end-user isolation identifier; native adapters reject it unless explicitly supported.}
        safety_identifier: {type: string, maxLength: 64}
        prompt_cache_key: {type: string}
        service_tier: {type: string, enum: [auto, default, on_demand, flex, performance, scale, priority, fast, ultrafast, standard_only], description: Forwarded by compatible adapters; native adapters may reject it.}
        stream: {type: boolean, default: false}
        max_output_tokens: {type: integer, minimum: 1}
        max_tokens: {type: integer, minimum: 1}
        temperature: {type: number}
        top_p: {type: number}
        frequency_penalty: {type: number, minimum: -2, maximum: 2}
        presence_penalty: {type: number, minimum: -2, maximum: 2}
        max_tool_calls: {type: integer, minimum: 1, maximum: 1000}
    InteractionGenerationConfig:
      type: object
      additionalProperties: false
      properties:
        max_output_tokens: {type: integer, minimum: 1}
        temperature: {type: number, minimum: 0, maximum: 2}
        top_p: {type: number, minimum: 0, maximum: 1}
        seed: {type: integer, description: Rejected by this endpoint.}
        stop_sequences:
          type: array
          items: {type: string}
          description: Rejected when non-empty by this endpoint.
        thinking_level: {type: string, description: Rejected by this endpoint.}
    InteractionRequest:
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        provider: {type: string}
        model: {type: string, minLength: 1}
        agent: {type: string, description: Rejected by this endpoint.}
        input:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              items: {type: object, additionalProperties: true}
        system_instruction: {type: string}
        tools:
          type: array
          items: {$ref: '#/components/schemas/FunctionResponseTool'}
        response_format: {}
        previous_interaction_id: {type: string}
        store: {type: boolean}
        stream: {type: boolean, default: false, description: Streams named interaction and step SSE events. Cannot be combined with background=true.}
        background: {type: boolean, default: false, description: Runs durably when true; store defaults to true and an explicit false is rejected.}
        generation_config: {$ref: '#/components/schemas/InteractionGenerationConfig'}
    InteractionResponseContent:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, const: text}
        text: {type: string}
    InteractionStep:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        id: {type: string}
        type: {type: string, enum: [model_output, function_call, thought]}
        name: {type: string}
        arguments: {}
        content:
          type: array
          items: {$ref: '#/components/schemas/InteractionResponseContent'}
    InteractionUsage:
      type: object
      additionalProperties: false
      properties:
        total_cached_tokens: {type: integer, minimum: 0}
        total_input_tokens: {type: integer, minimum: 0}
        total_output_tokens: {type: integer, minimum: 0}
        total_thought_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
    InteractionResponse:
      type: object
      additionalProperties: false
      required: [id, object, model, status]
      properties:
        id: {type: string}
        object: {type: string, const: interaction}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
        model: {type: string}
        status: {type: string}
        steps:
          type: array
          items: {$ref: '#/components/schemas/InteractionStep'}
        usage: {$ref: '#/components/schemas/InteractionUsage'}
        error:
