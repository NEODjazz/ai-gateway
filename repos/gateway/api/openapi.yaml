openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AI Gateway API
  version: 0.1.416
  description: |
    OpenAI-compatible inference API and administrative virtual-key API.
    Authentication, routing, guardrails, anonymization, billing, caching, and
    provider failover are performed by the gateway.
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same-origin gateway
tags:
  - name: Inference
  - name: Models
  - name: Assistants
  - name: A2A
  - name: Virtual keys
  - name: Identity
  - name: SCIM
  - name: Model deployments
  - name: Guardrails
  - name: Tags
  - name: MCP
  - name: Files
  - name: Batches
  - name: Fine-tuning
  - name: Vector stores
  - name: Skills
  - name: Projects and access
  - name: Caching and logging
  - name: Cached content
  - name: Agent templates
  - name: Customers
  - name: Organizations
  - name: AI Hub
  - name: Cost optimization
  - name: Operations
  - name: Observability
security:
  - bearerAuth: []
paths:
  /auth/sso/config:
    get:
      operationId: getBrowserSSOConfig
      tags: [Identity]
      summary: Discover whether browser SSO is enabled
      security: []
      responses:
        '200':
          description: Safe browser sign-in configuration
          content:
            application/json:
              schema:
                type: object
                required: [enabled, start_url]
                properties:
                  enabled: {type: boolean}
                  start_url: {type: string, const: /auth/sso/start}
  /auth/sso/start:
    get:
      operationId: startBrowserSSO
      tags: [Identity]
      summary: Start an authorization-code browser sign-in
      description: Creates encrypted five-minute state and PKCE verifier cookies and redirects to the configured identity provider. No bearer credential is exposed to browser JavaScript.
      security: []
      responses:
        '302': {description: Redirect to the identity provider authorization endpoint}
        '404': {description: Browser SSO is disabled}
  /auth/sso/callback:
    get:
      operationId: completeBrowserSSO
      tags: [Identity]
      summary: Complete browser sign-in
      description: Validates encrypted state, exchanges the one-time code with PKCE, authorizes the returned bearer credential through the gateway auth pipeline, and creates an encrypted HttpOnly Strict same-site session cookie with a bounded lifetime.
      security: []
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302': {description: Redirect to the management console}
        '400': {description: Invalid or expired callback state}
        '401': {description: Identity-provider credential is not authorized}
        '502': {description: Identity-provider token exchange failed}
  /auth/sso/logout:
    post:
      operationId: endBrowserSSO
      tags: [Identity]
      summary: Clear the browser session cookie
      security: []
      responses:
        '204': {description: Browser session cleared}
  /scim/v2/ServiceProviderConfig:
    get:
      operationId: getSCIMServiceProviderConfig
      tags: [SCIM]
      summary: Discover supported provisioning capabilities
      responses:
        '200': {description: Service provider configuration, content: {application/scim+json: {schema: {type: object, additionalProperties: true}}}}
        '401': {description: Invalid bearer credential, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '403': {description: Global administrator role required, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
  /scim/v2:
    get:
      operationId: discoverSCIMResources
      tags: [SCIM]
      summary: Discover supported provisioning resource types from the SCIM base path
      responses:
        '200': {description: Supported resource types, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMListResponse'}}}}
        '401': {description: Invalid bearer credential, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '403': {description: Global administrator role required, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
  /scim/v2/ResourceTypes:
    get:
      operationId: listSCIMResourceTypes
      tags: [SCIM]
      summary: List supported provisioning resource types
      responses:
        '200': {description: Supported resource types, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMListResponse'}}}}
        '401': {description: Invalid bearer credential, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '403': {description: Global administrator role required, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
  /scim/v2/ResourceTypes/{id}:
    get:
      operationId: getSCIMResourceType
      tags: [SCIM]
      summary: Get a supported provisioning resource type
      parameters: [{name: id, in: path, required: true, schema: {type: string, enum: [User, Group]}}]
      responses:
        '200': {description: Supported resource type, content: {application/scim+json: {schema: {type: object, additionalProperties: true}}}}
        '404': {description: Resource type not found, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
  /scim/v2/Schemas:
    get:
      operationId: listSCIMSchemas
      tags: [SCIM]
      summary: List supported provisioning schemas
      responses:
        '200': {description: Supported schemas, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMListResponse'}}}}
        '401': {description: Invalid bearer credential, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '403': {description: Global administrator role required, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
  /scim/v2/Schemas/{id}:
    get:
      operationId: getSCIMSchema
      tags: [SCIM]
      summary: Get a supported provisioning schema
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Supported schema, content: {application/scim+json: {schema: {type: object, additionalProperties: true}}}}
        '404': {description: Schema not found, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
  /scim/v2/Users:
    get:
      operationId: listSCIMUsers
      tags: [SCIM]
      summary: List provisioned users with exact pagination totals
      parameters:
        - {name: startIndex, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: count, in: query, schema: {type: integer, minimum: 0, maximum: 500, default: 100}}
        - {name: filter, in: query, description: Supports exact userName eq and externalId eq expressions, schema: {type: string, maxLength: 1024}}
        - {name: sortBy, in: query, schema: {type: string, enum: [userName, displayName, externalId]}}
        - {name: sortOrder, in: query, schema: {type: string, enum: [ascending, descending], default: ascending}}
      responses:
        '200': {description: User page, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMUserList'}}}}
        '400': {description: Invalid pagination, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '401': {description: Invalid bearer credential, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '403': {description: Global administrator role required, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '503': {description: Identity directory unavailable, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
    post:
      operationId: createSCIMUser
      tags: [SCIM]
      summary: Provision a user
      requestBody: {required: true, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMUserInput'}}}}
      responses:
        '201': {description: User provisioned, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMUser'}}}}
        '400': {description: Invalid user resource, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '401': {description: Invalid bearer credential, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '403': {description: Global administrator role required, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '409': {description: User already exists, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '503': {description: Identity directory or audit unavailable, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
  /scim/v2/Users/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
    get:
      operationId: getSCIMUser
      tags: [SCIM]
      summary: Retrieve a provisioned user
      responses:
        '200': {description: Provisioned user, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMUser'}}}}
        '404': {description: User not found, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
    put:
      operationId: replaceSCIMUser
      tags: [SCIM]
      summary: Replace a provisioned user
      requestBody: {required: true, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMUserInput'}}}}
      responses:
        '200': {description: User replaced, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMUser'}}}}
        '400': {description: Invalid user resource, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '404': {description: User not found, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '503': {description: Identity directory or audit unavailable, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
    patch:
      operationId: patchSCIMUser
      tags: [SCIM]
      description: Adds or replaces writable user attributes, removes optional attributes, and removes individual roles with a value filter. Required userName and read-only groups cannot be removed.
      summary: Patch supported user attributes
      requestBody: {required: true, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMPatchRequest'}}}}
      responses:
        '200': {description: User patched, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMUser'}}}}
        '400': {description: Invalid patch operation, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '404': {description: User not found, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '503': {description: Identity directory or audit unavailable, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
    delete:
      operationId: deactivateSCIMUser
      tags: [SCIM]
      summary: Deactivate a provisioned user
      responses:
        '204': {description: User deactivated}
        '404': {description: User not found, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '503': {description: Identity directory or audit unavailable, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
  /scim/v2/Groups:
    get:
      operationId: listSCIMGroups
      tags: [SCIM]
      summary: List provisioned groups with exact pagination totals
      parameters:
        - {name: startIndex, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: count, in: query, schema: {type: integer, minimum: 0, maximum: 500, default: 100}}
        - {name: filter, in: query, description: Supports exact displayName eq and externalId eq expressions, schema: {type: string, maxLength: 1024}}
        - {name: sortBy, in: query, schema: {type: string, enum: [displayName, externalId]}}
        - {name: sortOrder, in: query, schema: {type: string, enum: [ascending, descending], default: ascending}}
      responses:
        '200': {description: Group page, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMGroupList'}}}}
        '400': {description: Invalid pagination or filter, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '401': {description: Invalid bearer credential, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '403': {description: Global administrator role required, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '503': {description: Identity directory unavailable, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
    post:
      operationId: createSCIMGroup
      tags: [SCIM]
      summary: Provision a group and its members atomically
      requestBody: {required: true, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMGroupInput'}}}}
      responses:
        '201': {description: Group provisioned, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMGroup'}}}}
        '400': {description: Invalid group resource, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '404': {description: Member not found, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '409': {description: Group already exists, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '503': {description: Identity directory or audit unavailable, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
  /scim/v2/Groups/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
    get:
      operationId: getSCIMGroup
      tags: [SCIM]
      summary: Retrieve a provisioned group and members
      responses:
        '200': {description: Provisioned group, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMGroup'}}}}
        '404': {description: Group not found, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
    put:
      operationId: replaceSCIMGroup
      tags: [SCIM]
      summary: Atomically replace a provisioned group and members
      requestBody: {required: true, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMGroupInput'}}}}
      responses:
        '200': {description: Group replaced, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMGroup'}}}}
        '400': {description: Invalid group resource, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '404': {description: Group or member not found, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '409': {description: Group conflicts with an existing group, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '503': {description: Identity directory or audit unavailable, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
    patch:
      operationId: patchSCIMGroup
      tags: [SCIM]
      summary: Atomically patch group attributes and membership
      requestBody: {required: true, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMPatchRequest'}}}}
      responses:
        '200': {description: Group patched, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMGroup'}}}}
        '400': {description: Invalid patch operation, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '404': {description: Group or member not found, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '503': {description: Identity directory or audit unavailable, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
    delete:
      operationId: deleteSCIMGroup
      tags: [SCIM]
      summary: Delete a provisioned group and remove its memberships atomically
      responses:
        '204': {description: Group deleted}
        '404': {description: Group not found, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
        '503': {description: Identity directory or audit unavailable, content: {application/scim+json: {schema: {$ref: '#/components/schemas/SCIMError'}}}}
  /v1/assistants:
    post:
      operationId: createAssistant
      tags: [Assistants]
      summary: Create an owner-isolated assistant definition
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistantCreateRequest'}
      responses:
        '200':
          description: Created assistant
          content: {application/json: {schema: {$ref: '#/components/schemas/Assistant'}}}
        '400': {description: Invalid definition or unowned tool resource}
        '401': {description: Invalid gateway credential}
        '403': {description: Model or tool is not allowed}
        '429': {description: Assistant owner quota exceeded}
        '503': {description: Durable assistant storage unavailable}
    get:
      operationId: listAssistants
      tags: [Assistants]
      summary: List assistant definitions owned by the caller
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: after, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: Owner-filtered assistant page
          content: {application/json: {schema: {$ref: '#/components/schemas/AssistantList'}}}
        '401': {description: Invalid gateway credential}
        '503': {description: Durable assistant storage unavailable}
  /v1/assistants/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, maxLength: 128}}
    get:
      operationId: getAssistant
      tags: [Assistants]
      summary: Retrieve an owned assistant definition
      responses:
        '200':
          description: Assistant definition
          content: {application/json: {schema: {$ref: '#/components/schemas/Assistant'}}}
        '404': {description: Assistant is absent or belongs to another owner}
    post:
      operationId: updateAssistant
      tags: [Assistants]
      summary: Update an owned assistant definition
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantUpdateRequest'}}}
      responses:
        '200':
          description: Updated assistant
          content: {application/json: {schema: {$ref: '#/components/schemas/Assistant'}}}
        '400': {description: Invalid update or unowned tool resource}
        '404': {description: Assistant is absent or belongs to another owner}
        '409': {description: Assistant was modified concurrently}
    delete:
      operationId: deleteAssistant
      tags: [Assistants]
      summary: Delete an owned assistant definition
      responses:
        '200':
          description: Assistant deletion result
          content: {application/json: {schema: {$ref: '#/components/schemas/AssistantDeletion'}}}
        '404': {description: Assistant is absent or belongs to another owner}
  /v1/threads:
    post:
      operationId: createAssistantThread
      tags: [Assistants]
      summary: Create an owner-isolated assistant thread
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantThreadCreateRequest'}}}
      responses:
        '200':
          description: Created thread
          content: {application/json: {schema: {$ref: '#/components/schemas/AssistantThread'}}}
        '400': {description: Invalid thread or unowned tool resource}
        '401': {description: Invalid gateway credential}
        '429': {description: Thread owner quota exceeded}
        '503': {description: Durable assistant thread storage unavailable}
  /v1/threads/{thread_id}:
    parameters:
      - {name: thread_id, in: path, required: true, schema: {type: string, maxLength: 128}}
    get:
      operationId: getAssistantThread
      tags: [Assistants]
      summary: Retrieve an owned assistant thread
      responses:
        '200':
          description: Assistant thread
          content: {application/json: {schema: {$ref: '#/components/schemas/AssistantThread'}}}
        '404': {description: Thread is absent or belongs to another owner}
    post:
      operationId: updateAssistantThread
      tags: [Assistants]
      summary: Update an owned assistant thread
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantThreadUpdateRequest'}}}
      responses:
        '200':
          description: Updated thread
          content: {application/json: {schema: {$ref: '#/components/schemas/AssistantThread'}}}
        '400': {description: Invalid update or unowned tool resource}
        '404': {description: Thread is absent or belongs to another owner}
        '409': {description: Thread was modified concurrently}
    delete:
      operationId: deleteAssistantThread
      tags: [Assistants]
      summary: Delete an owned assistant thread and its messages
      responses:
        '200':
          description: Thread deletion result
          content: {application/json: {schema: {$ref: '#/components/schemas/AssistantThreadDeletion'}}}
        '404': {description: Thread is absent or belongs to another owner}
  /v1/threads/{thread_id}/messages:
    parameters:
      - {name: thread_id, in: path, required: true, schema: {type: string, maxLength: 128}}
    post:
      operationId: createAssistantMessage
      tags: [Assistants]
      summary: Create a message in an owned assistant thread
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantMessageCreateRequest'}}}
      responses:
        '200':
          description: Created thread message
          content: {application/json: {schema: {$ref: '#/components/schemas/AssistantMessage'}}}
        '400': {description: "Invalid content, attachment, or unowned file"}
        '404': {description: Thread is absent or belongs to another owner}
        '429': {description: Per-thread message quota exceeded}
    get:
      operationId: listAssistantMessages
      tags: [Assistants]
      summary: List messages in an owned assistant thread
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: after, in: query, schema: {type: string, maxLength: 128}}
        - {name: before, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: Owner-filtered message page
          content: {application/json: {schema: {$ref: '#/components/schemas/AssistantMessageList'}}}
        '400': {description: Invalid or conflicting pagination controls}
        '404': {description: Thread or pagination boundary is absent for this owner}
  /v1/threads/{thread_id}/messages/{message_id}:
    parameters:
      - {name: thread_id, in: path, required: true, schema: {type: string, maxLength: 128}}
      - {name: message_id, in: path, required: true, schema: {type: string, maxLength: 128}}
    get:
      operationId: getAssistantMessage
      tags: [Assistants]
      summary: Retrieve an owned assistant thread message
      responses:
        '200':
          description: Thread message
          content: {application/json: {schema: {$ref: '#/components/schemas/AssistantMessage'}}}
        '404': {description: Thread message is absent or belongs to another owner}
    post:
      operationId: updateAssistantMessage
      tags: [Assistants]
      summary: Replace metadata on an owned assistant thread message
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantMessageUpdateRequest'}}}
      responses:
        '200':
          description: Updated thread message
          content: {application/json: {schema: {$ref: '#/components/schemas/AssistantMessage'}}}
        '400': {description: Invalid metadata update}
        '404': {description: Thread message is absent or belongs to another owner}
        '409': {description: Thread message was modified concurrently}
    delete:
      operationId: deleteAssistantMessage
      tags: [Assistants]
      summary: Delete an owned assistant thread message
      responses:
        '200':
          description: Message deletion result
          content: {application/json: {schema: {$ref: '#/components/schemas/AssistantMessageDeletion'}}}
        '404': {description: Thread message is absent or belongs to another owner}
  /v1/threads/{thread_id}/runs:
    parameters:
      - {name: thread_id, in: path, required: true, schema: {type: string, maxLength: 128}}
    post:
      operationId: createAssistantRun
      tags: [Assistants]
      summary: Start a durable background run for an owned thread
      description: Executes the complete bounded thread history through the normal routing, policy and billing pipeline. Function tools support durable output continuation. Code interpreter and file search are forwarded for provider-side execution with currently owned assistant and thread resources. One active run is allowed per thread.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRunCreateRequest'}}}
      responses:
        '200': {description: Created run, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRun'}}}}
        '400': {description: Invalid run parameters or unsupported assistant tool}
        '403': {description: Effective model or function tool is not allowed}
        '404': {description: Thread or assistant is absent for this owner}
        '409': {description: Thread already has an active run}
        '429': {description: 'Run quota, TPM, RPM, deployment quota, provider quota, or budget exceeded'}
        '503': {description: Durable run or background job storage unavailable}
    get:
      operationId: listAssistantRuns
      tags: [Assistants]
      summary: List durable runs for an owned thread
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: after, in: query, schema: {type: string, maxLength: 128}}
        - {name: before, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200': {description: Owner-filtered run page, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRunList'}}}}
        '400': {description: Invalid or conflicting pagination controls}
        '404': {description: Thread or pagination boundary is absent for this owner}
  /v1/threads/{thread_id}/runs/{run_id}:
    parameters:
      - {name: thread_id, in: path, required: true, schema: {type: string, maxLength: 128}}
      - {name: run_id, in: path, required: true, schema: {type: string, maxLength: 128}}
    get:
      operationId: getAssistantRun
      tags: [Assistants]
      summary: Retrieve and reconcile an owned durable run
      description: Terminal provider state is exposed only after the durable background billing job has settled.
      responses:
        '200': {description: Current run state, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRun'}}}}
        '404': {description: Thread or run is absent for this owner}
  /v1/threads/{thread_id}/runs/{run_id}/cancel:
    parameters:
      - {name: thread_id, in: path, required: true, schema: {type: string, maxLength: 128}}
      - {name: run_id, in: path, required: true, schema: {type: string, maxLength: 128}}
    post:
      operationId: cancelAssistantRun
      tags: [Assistants]
      summary: Cancel an active owned run
      responses:
        '200': {description: Cancelling or cancelled run, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRun'}}}}
        '404': {description: Thread or run is absent for this owner}
        '409': {description: Run cannot be cancelled in its current state}
        '501': {description: Selected deployment does not support cancellation}
  /v1/threads/{thread_id}/runs/{run_id}/submit_tool_outputs:
    parameters:
      - {name: thread_id, in: path, required: true, schema: {type: string, maxLength: 128}}
      - {name: run_id, in: path, required: true, schema: {type: string, maxLength: 128}}
    post:
      operationId: submitAssistantRunToolOutputs
      tags: [Assistants]
      summary: Continue an owned run with all pending function outputs
      description: Validates an exact, duplicate-free set of pending call IDs and starts the continuation through the normal durable background routing, policy and billing pipeline.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRunToolOutputsRequest'}}}
      responses:
        '200': {description: Continued run, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRun'}}}}
        '400': {description: 'Missing, duplicate, unknown, or oversized tool output'}
        '404': {description: Thread or run is absent for this owner}
        '409': {description: Run is not waiting for tool outputs or changed concurrently}
        '429': {description: 'TPM, RPM, deployment quota, provider quota, or budget exceeded'}
        '503': {description: Durable background job storage unavailable}
  /v1/threads/{thread_id}/runs/{run_id}/steps:
    parameters:
      - {name: thread_id, in: path, required: true, schema: {type: string, maxLength: 128}}
      - {name: run_id, in: path, required: true, schema: {type: string, maxLength: 128}}
    get:
      operationId: listAssistantRunSteps
