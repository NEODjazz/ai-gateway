        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deletePolicyAttachment
      tags: [Guardrails]
      summary: Delete a policy attachment
      responses:
        '204': {description: Policy attachment deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/tags:
    get:
      operationId: listTags
      tags: [Tags]
      summary: List durable credential-tag model policies
      responses:
        '200': {description: Managed tags, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/TagDefinition'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/tags/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9_.:/-]{1,128}$'}
    put:
      operationId: putTag
      tags: [Tags]
      summary: Create or update a credential-tag model policy
      description: Registered tag constraints intersect. Disabled tags deny tagged credentials; unregistered tags remain metadata-only for backward compatibility.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TagDefinitionInput'}}}}
      responses:
        '200': {description: Tag saved, content: {application/json: {schema: {$ref: '#/components/schemas/TagDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteTag
      tags: [Tags]
      summary: Delete a managed tag policy
      responses:
        '204': {description: Tag policy deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/compliance/check:
    post:
      operationId: checkCompliance
      tags: [Guardrails]
      summary: Dry-run text through a guardrail policy without calling a model
      description: Text is projected to selected DLP/AV scanners and is not stored by the gateway or returned in the response.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ComplianceCheckInput'}}}}
      responses:
        '200': {description: Compliance decision, content: {application/json: {schema: {$ref: '#/components/schemas/ComplianceCheckResult'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/guardrails/monitor:
    get:
      operationId: getGuardrailMonitor
      tags: [Guardrails]
      summary: Inspect bounded shared guardrail outcomes
      description: Returns metadata-only outcomes from a shared bounded Redis history when configured, with an explicit current-replica fallback. Prompt text, scanner details and response content are never retained.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - {name: window, in: query, schema: {type: string, enum: [retained, 15m, 1h, 24h], default: retained}}
        - {name: module, in: query, schema: {type: string, enum: [dlp, av]}}
        - {name: policy, in: query, schema: {type: string, maxLength: 128}}
        - {name: outcome, in: query, schema: {type: string, enum: [passed, rejected, unavailable]}}
        - {name: source, in: query, schema: {type: string, enum: [inference, compliance]}}
      responses:
        '200': {description: Guardrail monitoring snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/GuardrailMonitorSnapshot'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/cache/diagnostics:
    get:
      operationId: getCacheDiagnostics
      tags: [Caching and logging]
      summary: Inspect exact and semantic cache runtime counters
      responses:
        '200': {description: Cache configuration and counters, content: {application/json: {schema: {$ref: '#/components/schemas/CacheDiagnostics'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/logging/destinations:
    get:
      operationId: listLoggingDestinations
      tags: [Caching and logging]
      summary: List metadata-only logging webhook destinations
      responses:
        '200': {description: Destinations and bounded queue counters, content: {application/json: {schema: {$ref: '#/components/schemas/LoggingDestinationList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/logging/destinations/{id}:
    parameters: [{$ref: '#/components/parameters/AccessEntryID'}]
    put:
      operationId: putLoggingDestination
      tags: [Caching and logging]
      summary: Create or update a logging destination
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoggingDestinationInput'}}}}
      responses:
        '200': {description: Destination saved without its secret, content: {application/json: {schema: {$ref: '#/components/schemas/LoggingDestination'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteLoggingDestination
      tags: [Caching and logging]
      summary: Delete a logging destination
      responses:
        '204': {description: Destination deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/logging/destinations/{id}/test:
    post:
      operationId: testLoggingDestination
      tags: [Caching and logging]
      summary: Send a fixed metadata-only probe to a logging destination
      parameters: [{$ref: '#/components/parameters/AccessEntryID'}]
      responses:
        '200': {description: Probe accepted, content: {application/json: {schema: {$ref: '#/components/schemas/LoggingDestinationProbe'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {description: Destination rejected the probe or was unreachable}
        '503': {description: Append-only audit preflight or logging management is unavailable}
  /admin/v1/tool-policies:
    get:
      operationId: listToolPolicies
      tags: [Agent templates]
      summary: List reusable agent tool policies
      responses:
        '200': {description: Tool policies, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/ToolPolicy'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/tool-policies/{id}:
    parameters: [{$ref: '#/components/parameters/AccessEntryID'}]
    put:
      operationId: putToolPolicy
      tags: [Agent templates]
      summary: Create or update a tool policy
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ToolPolicyInput'}}}}
      responses:
        '200': {description: Tool policy saved, content: {application/json: {schema: {$ref: '#/components/schemas/ToolPolicy'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteToolPolicy
      tags: [Agent templates]
      summary: Delete a tool policy without altering materialized profiles
      responses:
        '204': {description: Tool policy deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/agent-profiles:
    get:
      operationId: listAgentProfiles
      tags: [Agent templates]
      summary: List metadata-only profiles for external agent runtimes
      responses:
        '200': {description: Agent profiles and execution boundary, content: {application/json: {schema: {$ref: '#/components/schemas/AgentProfileList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/agent-profiles/{id}:
    parameters: [{$ref: '#/components/parameters/AccessEntryID'}]
    put:
      operationId: putAgentProfile
      tags: [Agent templates]
      summary: Create or update an external-runtime profile
      description: The referenced enabled tool policy is copied into the profile. Prompt content, memory, vector data and workflow state are not accepted.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentProfileInput'}}}}
      responses:
        '200': {description: Materialized agent profile saved, content: {application/json: {schema: {$ref: '#/components/schemas/AgentProfile'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteAgentProfile
      tags: [Agent templates]
      summary: Delete an agent profile
      responses:
        '204': {description: Agent profile deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/mcp/servers:
    get:
      operationId: listMCPServers
      tags: [MCP]
      summary: List registered MCP server metadata
      description: Credentials and request headers are not accepted or returned.
      parameters:
        - {name: expand, in: query, schema: {type: string, enum: [references]}, description: Include dependent toolset IDs}
      responses:
        '200': {description: MCP servers, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/MCPServer'}}, references: {type: object, additionalProperties: {$ref: '#/components/schemas/MCPServerReferences'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/mcp/servers/{id}:
    put:
      operationId: updateMCPServer
      tags: [MCP]
      summary: Create or atomically update safe MCP server metadata
      description: Stores metadata only; does not connect, discover tools, execute calls, or configure clients. No credential or header fields are accepted. Enabled server tool grants are consulted for connector authorization through toolsets; direct grants are independent. Tool strings are not verified against the server URL or a remote tool list.
      parameters: [{$ref: '#/components/parameters/MCPEntryID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MCPServerInput'}}}}
      responses:
        '200': {description: MCP server saved, content: {application/json: {schema: {$ref: '#/components/schemas/MCPServer'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteMCPServer
      tags: [MCP]
      summary: Delete an MCP server not referenced by a toolset
      parameters: [{$ref: '#/components/parameters/MCPEntryID'}]
      responses:
        '204': {description: MCP server deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/mcp/toolsets:
    get:
      operationId: listMCPToolsets
      tags: [MCP]
      summary: List MCP tool permission bundles
      parameters:
        - {name: expand, in: query, schema: {type: string, enum: [references]}, description: Include access-group and virtual-key assignments}
      responses:
        '200': {description: MCP toolsets, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/MCPToolset'}}, references: {type: object, additionalProperties: {$ref: '#/components/schemas/MCPToolsetReferences'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/mcp/toolsets/{id}:
    put:
      operationId: updateMCPToolset
      tags: [MCP]
      summary: Create or atomically update a toolset grant
      description: Groups function names or connector identifiers as exact or trailing-wildcard grants. Assignment uses toolset:<id> in allowed_tools. Disabling this toolset stops that authorization path but does not revoke other grants. Connector grants require a matching tools grant on an enabled registered server at authorization time; ordinary function names do not.
      parameters: [{$ref: '#/components/parameters/MCPEntryID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MCPToolsetInput'}}}}
      responses:
        '200': {description: MCP toolset saved, content: {application/json: {schema: {$ref: '#/components/schemas/MCPToolset'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteMCPToolset
      tags: [MCP]
      summary: Delete an MCP toolset without access-group or virtual-key assignments
      parameters: [{$ref: '#/components/parameters/MCPEntryID'}]
      responses:
        '204': {description: MCP toolset deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/projects:
    get:
      operationId: listProjects
      tags: [Projects and access]
      summary: List project ownership metadata
      responses:
        '200': {description: Projects, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Project'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/projects/{id}:
    parameters: [{$ref: '#/components/parameters/AccessEntryID'}]
    get:
      operationId: getProject
      tags: [Projects and access]
      summary: Get project ownership metadata
      responses:
        '200': {description: Project, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    put:
      operationId: putProject
      tags: [Projects and access]
      summary: Create or update a project
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}}
      responses:
        '200': {description: Project saved, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteProject
      tags: [Projects and access]
      summary: Delete an unused project
      responses:
        '204': {description: Project deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Project is referenced by an access group}
  /admin/v1/access-groups:
    get:
      operationId: listAccessGroups
      tags: [Projects and access]
      summary: List reusable virtual-key permission templates
      responses:
        '200': {description: Access groups, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/AccessGroup'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/access-groups/{id}:
    parameters: [{$ref: '#/components/parameters/AccessEntryID'}]
    get:
      operationId: getAccessGroup
      tags: [Projects and access]
      summary: Get an access-group permission template
      responses:
        '200': {description: Access group, content: {application/json: {schema: {$ref: '#/components/schemas/AccessGroup'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    put:
      operationId: putAccessGroup
      tags: [Projects and access]
      summary: Create or update a virtual-key permission template
      description: Virtual keys store this group's ID and evaluate its current grants at request time. Updating or disabling a group therefore affects every assigned key immediately.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccessGroupInput'}}}}
      responses:
        '200': {description: Access group saved, content: {application/json: {schema: {$ref: '#/components/schemas/AccessGroup'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteAccessGroup
      tags: [Projects and access]
      summary: Delete an unused access-group template
      description: Deletion is rejected while any non-revoked virtual key references the group.
      responses:
        '204': {description: Access group deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Access group is referenced by a non-revoked virtual key}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/budgets:
    get:
      operationId: listBudgets
      tags: [Budgets]
      summary: List budget policies, optionally with currency-isolated live summaries
      parameters:
        - name: expand
          in: query
          schema: {type: string, enum: [summaries]}
          description: Include current-window usage, remaining capacity, and reset timestamps keyed by budget ID.
      responses:
        '200':
          description: Budget policies
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/BudgetPolicy'}}
                  summaries:
                    type: object
                    additionalProperties: {$ref: '#/components/schemas/BudgetSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    post:
      operationId: createBudget
      tags: [Budgets]
      summary: Create a budget policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BudgetPolicyInput'}
      responses:
        '201':
          description: Budget policy created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetPolicy'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/budgets/{id}:
    parameters:
      - $ref: '#/components/parameters/BudgetID'
    get:
      operationId: getBudget
      tags: [Budgets]
      summary: Get a budget policy
      responses:
        '200':
          description: Budget policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetPolicy'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    put:
      operationId: updateBudget
      tags: [Budgets]
      summary: Replace a budget policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BudgetPolicyInput'}
      responses:
        '200':
          description: Updated budget policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetPolicy'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: disableBudget
      tags: [Budgets]
      summary: Disable a budget policy
      responses:
        '204': {description: Budget policy disabled}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/budgets/{id}/summary:
    get:
      operationId: getBudgetSummary
      tags: [Budgets]
      summary: Get current committed and reserved spend
      parameters:
        - $ref: '#/components/parameters/BudgetID'
      responses:
        '200':
          description: Current budget window summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetSummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/usage/report:
    get:
      operationId: getUsageReport
      tags: [Usage]
      summary: Get aggregated usage and spend
      description: Returns final request outcomes aggregated by currency, day, public or upstream model, provider, endpoint, credential tag, and customer scope. Mixed currencies are never summed together.
      parameters:
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 90, default: 30}
        - name: from
          in: query
          description: Inclusive RFC3339 timestamp; must be provided together with `to`.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: Exclusive RFC3339 timestamp; range is limited to 90 days.
          schema: {type: string, format: date-time}
        - name: model
          in: query
          schema: {type: string, maxLength: 256}
        - name: upstream_model
          in: query
          schema: {type: string, maxLength: 256}
        - name: provider
          in: query
          schema: {type: string, maxLength: 256}
        - name: endpoint
          in: query
          schema: {type: string, maxLength: 256}
        - name: tag
          in: query
          schema: {type: string, maxLength: 256}
        - name: scope_type
          in: query
          description: Customer dimension to filter; must be provided together with `scope_id`.
          schema: {type: string, enum: [key, user, team, organization]}
        - name: scope_id
          in: query
          description: Non-secret virtual-key fingerprint or configured customer ID.
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Usage and spend report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageReport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/customers/{scope_type}/{scope_id}/usage:
    get:
      operationId: getCustomerUsageReport
      tags: [Customers]
      summary: Get usage and spend for one customer scope
      description: Aggregates metadata-only final outcomes for an organization, user, team, or non-secret virtual-key ID. Scope values are passed to ClickHouse as typed parameters.
      parameters:
        - {name: scope_type, in: path, required: true, schema: {type: string, enum: [key, user, team, organization]}}
        - {name: scope_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 30}}
      responses:
        '200': {description: Scoped usage and spend report, content: {application/json: {schema: {$ref: '#/components/schemas/UsageReport'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs:
    get:
      operationId: listRequestLogs
      tags: [Observability]
      summary: List inference request outcomes
      description: Returns bounded metadata-only final outcomes. Prompts, responses, raw provider errors, credentials, and upstream URLs are never returned.
      parameters:
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
        - {name: from, in: query, description: Custom UTC window start; must be paired with to and span at most 90 days, schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive custom UTC window end, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: before_request_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: request_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: session_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: trace_id, in: query, schema: {type: string, pattern: '^[0-9a-fA-F]{32}$'}}
        - {name: status, in: query, schema: {type: string, enum: [ok, error]}}
        - {name: model, in: query, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, schema: {type: string, maxLength: 256}}
        - {name: tag, in: query, schema: {type: string, maxLength: 256}}
        - {name: user_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: team_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: organization_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: credential_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: cache_status, in: query, schema: {type: string, enum: [hit, miss, error]}}
        - {name: failure_class, in: query, schema: {type: string, maxLength: 256}}
        - {name: min_cost, in: query, schema: {type: number, minimum: 0}}
        - {name: max_cost, in: query, schema: {type: number, minimum: 0}}
      responses:
        '200':
          description: Request log page ordered newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLogPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs/groups:
    get:
      operationId: listRequestLogGroups
      tags: [Observability]
      summary: Aggregate inference outcomes by session or trace
      description: Aggregates the complete bounded query window in ClickHouse. Spend is grouped separately by currency and content fields are never read or returned.
      parameters:
        - {name: dimension, in: query, required: true, schema: {type: string, enum: [session, trace]}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
        - {name: from, in: query, description: Custom UTC window start; must be paired with to and span at most 90 days, schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive custom UTC window end, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: before_group_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: before_currency, in: query, schema: {type: string, maxLength: 16}}
        - {name: request_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: session_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: trace_id, in: query, schema: {type: string, pattern: '^[0-9a-fA-F]{32}$'}}
        - {name: status, in: query, schema: {type: string, enum: [ok, error]}}
        - {name: model, in: query, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, schema: {type: string, maxLength: 256}}
        - {name: tag, in: query, schema: {type: string, maxLength: 256}}
        - {name: user_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: team_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: organization_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: credential_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: cache_status, in: query, schema: {type: string, enum: [hit, miss, error]}}
        - {name: failure_class, in: query, schema: {type: string, maxLength: 256}}
        - {name: min_cost, in: query, schema: {type: number, minimum: 0}}
        - {name: max_cost, in: query, schema: {type: number, minimum: 0}}
      responses:
        '200': {description: Session or trace aggregate page ordered by latest request, content: {application/json: {schema: {$ref: '#/components/schemas/RequestLogGroupPage'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs/settings:
    get:
      operationId: getRequestLogSettings
      tags: [Observability]
      summary: Get request-log privacy and retention settings
      responses:
        '200':
          description: Effective request-log settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLogSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs/{request_id}:
    get:
      operationId: getRequestLog
      tags: [Observability]
      summary: Get one inference request outcome
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Safe request outcome metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLog'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/routing/diagnostics:
    get:
      operationId: getRoutingDiagnostics
      tags: [Routing]
      summary: Get safe provider routing diagnostics
      description: Returns endpoint names and operational routing state. Base URLs, credentials, and internal headers are never exposed.
      responses:
        '200':
          description: Routing strategy and endpoint state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoutingDiagnostics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/routing/simulate:
    post:
      operationId: simulateRouting
      tags: [Routing]
      summary: Explain deployment selection without calling a provider
      description: Uses a copy of routing state so weighted selection counters and endpoint health are not mutated.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingSimulationRequest'}}}}
      responses:
        '200': {description: Ordered eligible deployments and selected route, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingSimulation'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-catalog:
    get:
      operationId: getRuntimeModelCatalog
      tags: [Models]
      summary: Get the active runtime model catalog
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, schema: {type: string, maxLength: 256}}
        - {name: capability, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [model, provider, input_cost, output_cost]}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: asc}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        '200':
          description: Active catalog snapshot
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ModelCatalog'}
                  - {$ref: '#/components/schemas/ModelCatalogPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    put:
      operationId: replaceRuntimeModelCatalog
      tags: [Models]
      summary: Atomically replace the active runtime model catalog
      description: Replicas synchronize the validated catalog through the versioned control-plane snapshot. Priced entries require an explicit currency.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelCatalog'}
      responses:
        '200':
          description: Activated catalog snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelCatalog'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-onboarding/plan:
    post:
      operationId: planModelOnboarding
      tags: [Models]
      summary: Validate a model onboarding transaction without changing runtime state
      description: Returns the current control-plane revision and normalized catalog, deployment, and model-group changes. Providers and credentials must already exist.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingInput'}}}}
      responses:
        '200': {description: Validated non-mutating plan, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingPlan'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-onboarding/apply:
    post:
      operationId: applyModelOnboarding
      tags: [Models]
      summary: Atomically commit a previously validated model onboarding transaction
      description: Revalidates the complete input and commits catalog, deployments, and model groups in one optimistic control-plane revision. A stale expected_revision returns 409 and changes nothing.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingApply'}}}}
      responses:
        '200': {description: Committed plan with the new control-plane revision, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingPlan'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/audit/events:
    get:
      operationId: listManagementAuditEvents
      tags: [Audit]
      summary: List durable management audit events
      description: Returns append-only attempted and terminal outcome events in descending ID order.
      parameters:
        - {name: before_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: actor_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: action, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: Audit event page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
components:
  securitySchemes:
    googleAPIKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: Gateway virtual key, not an upstream provider credential
    nativeAPIKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Gateway virtual key, not an upstream provider credential
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Virtual key or JWT
  headers:
    XExecutionID:
      description: Server-generated inference execution identifier used in billing and request logs. Independent of the caller correlation ID.
      schema:
        type: string
        maxLength: 128
    XRequestID:
      description: Request correlation identifier
      schema:
        type: string
        maxLength: 128
  parameters:
    VirtualKeyID:
      name: id
      in: path
      required: true
      description: Opaque virtual-key identifier, never the plaintext token
      schema:
        type: string
        pattern: '^vk_[A-Za-z0-9_-]{5,125}$'
        maxLength: 128
    DirectoryTeamID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    DirectoryUserID:
      name: user_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    DirectoryUserPathID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    ModelDeploymentID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    GuardrailPolicyName:
      name: name
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    MCPEntryID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    AccessEntryID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    OrganizationID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9._@:-]+$'}
    OrganizationTeamID:
      name: team_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9._@:-]+$'}
    BudgetID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
  responses:
    InvalidRequest:
      description: Invalid request or unsupported input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: unauthorized, message: invalid api key}
            ts: '2026-08-21T12:00:00Z'
    Forbidden:
      description: Credential policy rejects the model, function, or MCP connector
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdminRequired:
      description: The credential does not have the admin role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTooLarge:
      description: Request exceeds the 24 MiB inference body limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Credential rate limit, budget, or provider concurrency capacity exceeded
      headers:
        Retry-After:
          description: Seconds until the rate window resets or provider admission should be retried, when available
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContentRejected:
      description: A required DLP, antivirus, or content-policy guardrail rejected the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: content_rejected, message: content rejected}
            ts: '2026-08-21T12:00:00Z'
    ProviderFailed:
      description: Provider, guardrail, billing, or post-processing failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ModuleFailed:
      description: Required gateway module failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: Required storage is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ManagementUnavailable:
      description: Required admin management service is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists or the optimistic control-plane revision is stale
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested managed resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    GenerateContentError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, status, message]
          properties:
            code: {type: integer}
            status: {type: string}
            message: {type: string}
    GenerateCountRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [contents]
        - required: [generateContentRequest]
      properties:
        contents:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/GenerateContent'}
        generateContentRequest:
          $ref: '#/components/schemas/GenerateCountContext'
    GenerateCountContext:
      type: object
      additionalProperties: false
      required: [contents]
      properties:
        model:
          type: string
          description: Optional path model name, with or without the models/ prefix. Must match the path.
        contents:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/GenerateContent'}
        systemInstruction:
          allOf:
            - {$ref: '#/components/schemas/GenerateContent'}
          description: Text parts only; role must be absent or system.
        tools:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [functionDeclarations]
            properties:
              functionDeclarations:
                type: array
                minItems: 1
                maxItems: 128
                items:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1}
                    description: {type: string}
                    parameters:
                      type: object
                      description: Native Schema supports nullable, anyOf, size/numeric bounds and pattern (64 levels, 128 alternatives); mutually exclusive with parametersJsonSchema.
                    parametersJsonSchema: {type: object}
        toolConfig:
          type: object
          additionalProperties: false
          properties:
            functionCallingConfig:
              type: object
              additionalProperties: false
              properties:
                mode: {type: string, enum: [AUTO, NONE, ANY]}
                allowedFunctionNames:
                  type: array
                  maxItems: 1
                  items: {type: string}
                  description: ANY requires exactly one declared function name.
    GenerateContentRequest:
      type: object
      additionalProperties: false
      required: [contents]
      properties:
        contents:
          type: array
          minItems: 1
          maxItems: 10000
          items: {$ref: '#/components/schemas/GenerateContent'}
        systemInstruction:
          allOf:
            - {$ref: '#/components/schemas/GenerateContent'}
          description: Text parts only; role must be absent or system.
        tools:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [functionDeclarations]
            properties:
              functionDeclarations:
                type: array
                minItems: 1
                maxItems: 128
                items:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1}
                    description: {type: string}
                    parameters:
                      type: object
                      description: Native Schema supports nullable, anyOf, size/numeric bounds and pattern (64 levels, 128 alternatives); mutually exclusive with parametersJsonSchema.
                    parametersJsonSchema: {type: object}
        toolConfig:
          type: object
          additionalProperties: false
          properties:
            functionCallingConfig:
              type: object
              additionalProperties: false
              properties:
                mode: {type: string, enum: [AUTO, NONE, ANY]}
                allowedFunctionNames:
                  type: array
                  maxItems: 1
                  items: {type: string}
                  description: ANY requires exactly one declared function name.
        generationConfig:
          type: object
          additionalProperties: false
          properties:
            maxOutputTokens: {type: integer, minimum: 1, maximum: 2147483647}
            temperature: {type: number, minimum: 0, maximum: 2}
            topP: {type: number, minimum: 0, maximum: 1}
            seed: {type: integer, minimum: -2147483648, maximum: 2147483647}
            candidateCount: {type: integer, enum: [1]}
            stopSequences:
              type: array
              maxItems: 4
              items: {type: string, minLength: 1}
            responseMimeType: {type: string, enum: [text/plain, application/json]}
            responseSchema:
              type: object
              description: Native Schema supports nullable, anyOf, size/numeric bounds and pattern (64 levels, 128 alternatives); mutually exclusive with responseJsonSchema. Requires application/json.
            responseJsonSchema: {type: object}
    GenerateContent:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        role: {type: string, enum: [user, model, system]}
        parts:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/GeneratePart'}
    GeneratePart:
      type: object
      additionalProperties: false
      oneOf:
        - required: [text]
        - required: [inlineData]
        - required: [functionCall]
        - required: [functionResponse]
      properties:
        text: {type: string}
        thoughtSignature:
          type: string
          description: Only supported on functionCall parts.
        inlineData:
          type: object
          additionalProperties: false
          required: [mimeType, data]
          properties:
            mimeType: {type: string, enum: [image/png, image/jpeg, image/gif, image/webp]}
            data: {type: string, format: byte}
        functionCall:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            id: {type: string}
            name: {type: string, minLength: 1}
            args:
              description: Omitted or null arguments are normalized to an empty object.
              oneOf:
                - {type: object}
                - {type: 'null'}
        functionResponse:
          type: object
          additionalProperties: false
          required: [name, response]
          properties:
            id: {type: string}
            name: {type: string, minLength: 1}
            response: {type: object}
    GenerateContentResponse:
      type: object
      required: [responseId, modelVersion, candidates, usageMetadata]
      properties:
        responseId: {type: string}
        modelVersion:
          type: string
          description: Provider-reported model version when available, otherwise the normalized model name.
        candidates:
          type: array
          maxItems: 1
          items:
            type: object
            properties:
              index: {type: integer, enum: [0]}
              content: {$ref: '#/components/schemas/GenerateContent'}
              finishReason: {type: string, enum: [STOP, MAX_TOKENS, SAFETY]}
        usageMetadata:
          type: object
          properties:
            promptTokenCount: {type: integer, minimum: 0}
            candidatesTokenCount: {type: integer, minimum: 0}
            thoughtsTokenCount: {type: integer, minimum: 0}
            cachedContentTokenCount: {type: integer, minimum: 0}
            totalTokenCount: {type: integer, minimum: 0}
    MessageTokenCountRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model: {type: string, minLength: 1}
        messages: {$ref: '#/components/schemas/MessagesRequest/properties/messages'}
        system: {$ref: '#/components/schemas/MessagesRequest/properties/system'}
        tools: {$ref: '#/components/schemas/MessagesRequest/properties/tools'}
        tool_choice: {$ref: '#/components/schemas/MessagesRequest/properties/tool_choice'}
    MessagesRequest:
      type: object
      additionalProperties: false
      required: [model, max_tokens, messages]
      properties:
        model: {type: string, minLength: 1}
        max_tokens: {type: integer, minimum: 1}
        stop_sequences:
          type: array
          maxItems: 4
          items: {type: string, minLength: 1}
          description: Requires an adapter reporting exact matched stops; currently native Anthropic
        stream: {type: boolean, default: false}
        temperature: {type: number, minimum: 0, maximum: 1}
        top_p: {type: number, minimum: 0, maximum: 1}
        system:
          description: Text or text blocks without cache controls
          oneOf:
            - {type: string}
            - type: array
              items: {type: object}
        messages:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: {type: string, enum: [user, assistant]}
              content:
                oneOf:
                  - {type: string}
                  - type: array
                    minItems: 1
                    items: {type: object}
        tools:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, input_schema]
            properties:
              name: {type: string, minLength: 1}
              description: {type: string}
              input_schema: {type: object, additionalProperties: true}
        tool_choice:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, enum: [auto, any, none, tool]}
            name: {type: string}
            disable_parallel_tool_use: {type: boolean}
    MessagesResponse:
      type: object
      required: [id, type, role, model, content, stop_reason, stop_sequence, usage]
      properties:
        id: {type: string}
        type: {type: string, enum: [message]}
        role: {type: string, enum: [assistant]}
        model: {type: string}
        content:
          type: array
          items: {type: object}
        stop_reason: {type: string, enum: [end_turn, max_tokens, tool_use, refusal, stop_sequence]}
        stop_sequence: {type: [string, 'null']}
        usage:
          type: object
          required: [input_tokens, output_tokens, cache_read_input_tokens, cache_creation_input_tokens]
          properties:
            input_tokens: {type: integer, minimum: 0}
            output_tokens: {type: integer, minimum: 0}
            cache_read_input_tokens: {type: integer, minimum: 0}
            cache_creation_input_tokens: {type: integer, minimum: 0}
    AdminSession:
      type: object
      additionalProperties: false
      required: [roles, allowed_models, allowed_tools, capabilities]
      properties:
        user_id: {type: string, maxLength: 256}
        team_id: {type: string, maxLength: 256}
        organization_id: {type: string, maxLength: 256}
        credential_id: {type: string, maxLength: 256}
        credential_alias: {type: string, maxLength: 256}
        roles: {type: array, uniqueItems: true, items: {type: string, maxLength: 128}}
        allowed_models: {type: array, uniqueItems: true, items: {type: string, maxLength: 256}}
        allowed_tools: {type: array, uniqueItems: true, items: {type: string, maxLength: 256}}
        capabilities:
          type: array
          uniqueItems: true
          items: {type: string, enum: [admin, api_docs, inference, team_directory]}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurred_at, request_id, actor_id, actor_credential_id, action, target_type, outcome]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        occurred_at: {type: string, format: date-time}
        request_id: {type: string, maxLength: 128}
        actor_id: {type: string, maxLength: 256}
        actor_credential_id: {type: string, maxLength: 256}
        action: {type: string, maxLength: 128}
        target_type: {type: string, maxLength: 128}
        target_id: {type: string, maxLength: 256}
        outcome: {type: string, enum: [attempted, succeeded, failed]}
        details: {type: object, additionalProperties: true}
    ModelCatalogEntry:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider:
          type: string
          minLength: 1
          description: Managed provider ID; deployment ID, provider type, and wildcard entries remain supported for compatibility and overrides.
        model: {type: string, minLength: 1}
        capabilities:
          type: array
          uniqueItems: true
          items: {type: string, enum: [chat, responses, embeddings, rerank, stream, tools, structured_output, mcp, vision]}
        max_input_tokens: {type: integer, minimum: 0}
        max_output_tokens: {type: integer, minimum: 0}
        input_cost_per_1m: {type: number, minimum: 0}
        output_cost_per_1m: {type: number, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    ModelCatalog:
      type: object
      additionalProperties: false
      required: [version, models]
      properties:
        version: {type: string, minLength: 1, maxLength: 128}
        unknown_model_policy: {type: string, enum: [legacy, deny], default: legacy}
        models:
          type: array
          maxItems: 5000
          items: {$ref: '#/components/schemas/ModelCatalogEntry'}
    ModelCatalogPage:
      type: object
      additionalProperties: false
      required: [data, total, limit, offset, version]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ModelCatalogEntry'}}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 200}
        offset: {type: integer, minimum: 0}
        version: {type: string}
        unknown_model_policy: {type: string, enum: [legacy, deny]}
    ModelOnboardingInput:
      type: object
      additionalProperties: false
      required: [catalog, deployments, model_groups]
      properties:
        catalog: {$ref: '#/components/schemas/ModelCatalog'}
        deployments:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/ModelDeploymentInput'}
        model_groups:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/ModelGroup'}
    ModelOnboardingApply:
      type: object
      additionalProperties: false
      required: [expected_revision, catalog, deployments, model_groups]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        catalog: {$ref: '#/components/schemas/ModelCatalog'}
        deployments:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/ModelDeploymentInput'}
        model_groups:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/ModelGroup'}
    ModelOnboardingPlan:
      type: object
      additionalProperties: false
      required: [revision, catalog_version, deployments, model_groups, changes]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
        catalog_version: {type: string, minLength: 1, maxLength: 128}
        deployments: {type: array, items: {$ref: '#/components/schemas/ModelDeployment'}}
        model_groups: {type: array, items: {$ref: '#/components/schemas/ModelGroup'}}
        changes: {type: array, items: {type: string, maxLength: 512}}
    BudgetPolicyInput:
      type: object
      additionalProperties: false
      required: [scope_type, scope_id, period]
      properties:
        scope_type: {type: string, enum: [global, key, user, team, organization, model, provider, tag]}
        scope_id: {type: string, minLength: 1, maxLength: 256}
        period: {type: string, enum: [hour, day, week, month]}
        currency: {type: string, pattern: '^[A-Z]{3}$', default: USD}
        max_cost: {type: number, exclusiveMinimum: 0}
        max_tokens: {type: integer, format: int64, minimum: 1}
        enabled: {type: boolean, default: true}
      anyOf:
        - required: [max_cost]
        - required: [max_tokens]
    BudgetPolicy:
      allOf:
        - $ref: '#/components/schemas/BudgetPolicyInput'
        - type: object
          required: [id, currency, enabled, created_at, updated_at]
          properties:
            id: {type: integer, format: int64, minimum: 1}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    BudgetSummary:
      type: object
      required: [policy, window_start, window_end, used_cost, used_tokens]
      properties:
        policy: {$ref: '#/components/schemas/BudgetPolicy'}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        used_cost: {type: number, minimum: 0}
        remaining_cost: {type: number, minimum: 0}
        used_tokens: {type: integer, format: int64, minimum: 0}
        remaining_tokens: {type: integer, format: int64, minimum: 0}
    KeyBudgetProjection:
      type: object
      additionalProperties: false
      required: [key_id, policies]
      description: All enabled identity policies that apply simultaneously to a virtual key. Route-, provider-, model-, and request-tag policies are evaluated only at request time.
      properties:
        key_id: {type: string}
        policies:
          type: array
          items: {$ref: '#/components/schemas/BudgetSummary'}
    UsageAggregate:
      type: object
      additionalProperties: false
      required: [currency, requests, errors, input_tokens, output_tokens, total_tokens, cache_read_input_tokens, cache_write_input_tokens, cost, avg_latency_ms, cache_hits, cost_per_request]
      properties:
        date: {type: string, format: date}
        name: {type: string}
        currency: {type: string}
        requests: {type: integer, minimum: 0}
        errors: {type: integer, minimum: 0}
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
        cache_read_input_tokens: {type: integer, minimum: 0, description: Provider-reported input tokens served from its prompt cache}
        cache_write_input_tokens: {type: integer, minimum: 0, description: Provider-reported input tokens written to its prompt cache}
        cost: {type: number, minimum: 0}
        avg_latency_ms: {type: number, minimum: 0}
        cache_hits: {type: integer, minimum: 0}
        cost_per_request: {type: number, minimum: 0}
    UsageReport:
      type: object
      additionalProperties: false
      required: [days, from, to, totals, daily, by_model, by_upstream_model, by_provider, by_endpoint, by_tag, by_key, by_user, by_team, by_organization]
      properties:
        days: {type: integer, minimum: 1, maximum: 90}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        totals: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}}
        daily: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}}
        by_model: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}, description: Usage by stable public model or model group requested by the client}
        by_upstream_model: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}, description: Usage by the concrete provider model selected after routing}
        by_provider: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}, description: Usage by managed logical provider}
        by_endpoint: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}, description: Usage by concrete routed deployment or provider endpoint}
        by_tag: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}}
        by_key: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}, description: Usage by non-secret virtual-key ID or fingerprint}
        by_user: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}}
        by_team: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}}
        by_organization: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}}
    RequestLog:
      type: object
      additionalProperties: false
      required: [timestamp, request_id, api_type, phase, status, latency_ms, input_tokens, output_tokens, total_tokens, cache_read_input_tokens, cache_write_input_tokens, cost, currency, content_stored]
      properties:
        timestamp: {type: string, format: date-time}
        request_id: {type: string}
        session_id: {type: string, maxLength: 128}
        trace_id: {type: string, pattern: '^[0-9a-f]{32}$', description: OpenTelemetry trace identifier shared by all events in one distributed trace}
        user_id: {type: string}
        team_id: {type: string}
        organization_id: {type: string}
        roles: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}, description: Non-secret virtual-key tags used for policy and cost attribution}
        credential_id: {type: string, description: Non-secret credential identifier or fingerprint}
        provider: {type: string}
        provider_id: {type: string, description: Canonical managed provider identifier}
        provider_endpoint_name: {type: string}
        provider_endpoint_type: {type: string}
        model: {type: string, description: Canonical public model requested by the client}
        upstream_model: {type: string, description: Model identifier returned by the upstream provider}
        api_type: {type: string}
        phase: {type: string, enum: [commit, cancel]}
        status: {type: string, enum: [ok, error]}
        failure_class: {type: string, description: Bounded failure category; raw provider errors are excluded}
        latency_ms: {type: integer, minimum: 0}
        first_token_latency_ms: {type: integer, minimum: 0}
        retry_count: {type: integer, minimum: 0}
        fallback_count: {type: integer, minimum: 0}
        cache_status: {type: string}
        cache_kind: {type: string}
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
        cache_read_input_tokens: {type: integer, minimum: 0}
        cache_write_input_tokens: {type: integer, minimum: 0}
        usage_estimated: {type: boolean}
        cost: {type: number, minimum: 0}
        currency: {type: string}
        content_stored: {type: boolean, const: false}
    RequestLogPage:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/RequestLog'}}
        next_before: {type: string, format: date-time}
        next_request_id: {type: string}
    RequestLogGroup:
      type: object
      additionalProperties: false
      required: [group_id, requests, errors, models, providers, total_tokens, cache_read_input_tokens, cache_write_input_tokens, cache_hits, latency_ms, cost, currency, started_at, ended_at]
      properties:
        group_id: {type: string}
        requests: {type: integer, minimum: 0}
        errors: {type: integer, minimum: 0}
        models: {type: array, items: {type: string}}
        providers: {type: array, items: {type: string}}
        total_tokens: {type: integer, minimum: 0}
        cache_read_input_tokens: {type: integer, minimum: 0}
        cache_write_input_tokens: {type: integer, minimum: 0}
        cache_hits: {type: integer, minimum: 0}
        latency_ms: {type: number, minimum: 0}
        cost: {type: number, minimum: 0}
        currency: {type: string}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
    RequestLogGroupPage:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/RequestLogGroup'}}
        next_before: {type: string, format: date-time}
        next_before_group_id: {type: string}
        next_before_currency: {type: string}
    RequestLogSettings:
      type: object
      additionalProperties: false
      required: [retention_days, content_stored, max_query_days]
      properties:
        retention_days: {type: integer, minimum: 1}
        content_stored: {type: boolean, const: false}
        max_query_days: {type: integer, minimum: 1, maximum: 90}
    EndpointDiagnostics:
      type: object
      additionalProperties: false
      required: [name, type, models, priority, weight, state, consecutive_failures, samples, latency_ewma_ms, failure_ewma, in_flight_requests, queued_requests, max_retries, guardrail_policy_valid, dlp_enabled, av_enabled, shadow]
      properties:
        name: {type: string}
        type: {type: string}
        models: {type: array, items: {type: string}}
        capabilities: {type: array, items: {type: string}}
        priority: {type: integer}
        weight: {type: integer}
        state: {type: string, enum: [available, cooling_down, half_open]}
        cooldown_until: {type: string, format: date-time}
        consecutive_failures: {type: integer, minimum: 0}
        samples: {type: integer, minimum: 0}
        latency_ewma_ms: {type: number, minimum: 0}
        failure_ewma: {type: number, minimum: 0, maximum: 1}
        max_parallel_requests: {type: integer, minimum: 0}
        in_flight_requests: {type: integer, minimum: 0}
        queue_capacity: {type: integer, minimum: 0}
        queued_requests: {type: integer, minimum: 0}
        max_retries: {type: integer, minimum: 0}
        guardrail_policy: {type: string}
        guardrail_policy_valid: {type: boolean}
        dlp_enabled: {type: boolean}
        av_enabled: {type: boolean}
        shadow: {type: boolean}
        mirror_percentage: {type: number, minimum: 0, maximum: 100}
    RoutingDiagnostics:
      type: object
      additionalProperties: false
      required: [strategy, endpoints]
      properties:
        strategy: {type: string}
        endpoints: {type: array, items: {$ref: '#/components/schemas/EndpointDiagnostics'}}
    RoutingSimulationRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model: {type: string, minLength: 1, maxLength: 256}
        provider: {type: string, maxLength: 128}
        capabilities: {type: array, maxItems: 32, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 256}}
        max_output_tokens: {type: integer, minimum: 0}
        failure_class: {type: string, enum: [unknown, authentication, rate_limit, timeout, unavailable, context_length, content_policy, client_request, post_processing]}
    RoutingSimulationCandidate:
      type: object
      additionalProperties: false
      required: [deployment_id, provider_id, provider_type, priority, weight, model, stage, order]
      properties:
        deployment_id: {type: string}
        provider_id: {type: string}
        provider_type: {type: string}
        priority: {type: integer}
        weight: {type: integer}
        model: {type: string}
        fallback_type: {type: string, enum: [general, context_window, content_policy]}
        stage: {type: integer, minimum: 0}
        order: {type: integer, minimum: 1}
        retry_policy: {$ref: '#/components/schemas/RetryPolicy'}
    RoutingSimulation:
      type: object
      additionalProperties: false
      required: [strategy, reason, candidates]
      properties:
        strategy: {type: string}
        selected: {type: string}
        reason: {type: string}
        failure_class: {type: string}
        fallback_type: {type: string, enum: [general, context_window, content_policy]}
        candidates: {type: array, items: {$ref: '#/components/schemas/RoutingSimulationCandidate'}}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, ts]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
        ts:
          type: string
          format: date-time
    Model:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id: {type: string}
        object: {type: string, const: model}
        created: {type: integer, format: int64}
        owned_by: {type: string}
    ModelsResponse:
      type: object
      required: [object, data]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items: {$ref: '#/components/schemas/Model'}
    ImageURL:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          pattern: '^data:image/(jpeg|png|gif|webp);base64,[A-Za-z0-9+/]+={0,2}$'
          description: Inline image data URL. Remote URLs are rejected.
        detail:
          type: string
          enum: [auto, low, high]
    TextContentPart:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: {type: string, enum: [text, input_text]}
        text: {type: string, minLength: 1}
    ImageContentPart:
      type: object
      additionalProperties: false
      required: [type, image_url]
      properties:
        type: {type: string, const: image_url}
        image_url: {$ref: '#/components/schemas/ImageURL'}
    InputImageContentPart:
      type: object
      additionalProperties: false
      required: [type, image_url]
      properties:
        type: {type: string, const: input_image}
        image_url:
          type: string
          pattern: '^data:image/(jpeg|png|gif|webp);base64,[A-Za-z0-9+/]+={0,2}$'
    MessageContent:
      oneOf:
        - type: string
        - type: 'null'
        - type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/TextContentPart'
              - $ref: '#/components/schemas/ImageContentPart'
    FunctionCall:
      type: object
      required: [name, arguments]
      properties:
        name: {type: string, minLength: 1}
        arguments: {type: string}
    ToolCallExtraContent:
      type: object
      additionalProperties: false
      properties:
        google:
          type: object
          additionalProperties: false
          properties:
            thought_signature: {type: string}
    ToolCall:
      type: object
      required: [type, function]
      properties:
        index: {type: integer, minimum: 0}
        id: {type: string}
        type: {type: string, const: function}
        function: {$ref: '#/components/schemas/FunctionCall'}
        extra_content: {$ref: '#/components/schemas/ToolCallExtraContent'}
    Message:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content: {$ref: '#/components/schemas/MessageContent'}
        name: {type: string}
        tool_call_id: {type: string}
        tool_calls:
          type: array
          items: {$ref: '#/components/schemas/ToolCall'}
    FunctionDefinition:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        parameters:
          type: object
          additionalProperties: true
        strict: {type: boolean}
    ChatTool:
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type: {type: string, const: function}
        function: {$ref: '#/components/schemas/FunctionDefinition'}
    JSONSchemaFormat:
      type: object
      additionalProperties: false
      required: [name, schema]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        schema:
          type: object
          additionalProperties: true
        strict: {type: boolean}
    ResponseFormat:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [text, json_object, json_schema]
        json_schema: {$ref: '#/components/schemas/JSONSchemaFormat'}
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        provider: {type: string}
        model: {type: string, minLength: 1}
        messages:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Message'}
        tools:
          type: array
          items: {$ref: '#/components/schemas/ChatTool'}
        tool_choice: {}
        parallel_tool_calls: {type: boolean}
        response_format: {$ref: '#/components/schemas/ResponseFormat'}
        stream: {type: boolean, default: false}
        max_tokens: {type: integer, minimum: 1}
        max_completion_tokens: {type: integer, minimum: 1}
        temperature: {type: number}
        top_p: {type: number}
        stop: {}
        seed: {type: integer, format: int64}
        reasoning_effort: {type: string, enum: [none, minimal, low, medium, high, xhigh, max]}
        logprobs: {type: boolean}
        top_logprobs: {type: integer, minimum: 0, maximum: 20, description: Requires logprobs=true.}
        frequency_penalty: {type: number, minimum: -2, maximum: 2}
        presence_penalty: {type: number, minimum: -2, maximum: 2}
        logit_bias:
          type: object
          propertyNames: {pattern: '^[0-9]+$'}
          additionalProperties: {type: integer, minimum: -100, maximum: 100}

    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: {type: integer, minimum: 0}
        completion_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
        completion_tokens_details:
          type: object
          properties:
            reasoning_tokens: {type: integer, minimum: 0}
        prompt_tokens_details:
          type: object
          properties:
            cached_tokens: {type: integer, minimum: 0}
