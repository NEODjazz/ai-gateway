        - name: expand
          in: query
          schema: {type: string, enum: [summaries]}
          description: Include current-window usage, remaining capacity, and reset timestamps keyed by budget ID.
      responses:
        '200':
          description: Budget policies
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/BudgetPolicy'}}
                  summaries:
