        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: order, in: query, schema: {type: string, enum: [desc], default: desc}}
      responses:
        '200': {description: Owner-scoped container page, content: {application/json: {schema: {$ref: '#/components/schemas/ContainerList'}}}}
