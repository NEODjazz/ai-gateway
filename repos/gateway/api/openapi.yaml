          type: array
          items:
            type: [number, 'null']
        tokens:
          type: array
          items: {type: string}
        top_logprobs:
          type: array
          items:
            oneOf:
              - type: object
                additionalProperties: {type: number}
              - type: 'null'
    CompletionChoice:
      type: object
      required: [finish_reason, index, text]
