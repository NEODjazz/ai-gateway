              items: {type: string, minLength: 1, maxLength: 253, pattern: '^[A-Za-z0-9.-]+$'}
            max_uses: {type: integer, minimum: 1, maximum: 5, default: 5}
            max_content_tokens: {type: integer, minimum: 1, maximum: 100000}
