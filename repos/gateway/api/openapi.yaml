openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AI Gateway API
  version: 0.1.45
  description: |
    OpenAI-compatible inference API and administrative virtual-key API.
    Authentication, routing, guardrails, anonymization, billing, caching, and
    provider failover are performed by the gateway.
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same-origin gateway
tags:
  - name: Inference
  - name: Models
  - name: Virtual keys
  - name: Identity
  - name: Model deployments
  - name: Guardrails
  - name: Tags
  - name: MCP
  - name: Projects and access
  - name: Caching and logging
  - name: Agent templates
  - name: Customers
  - name: Organizations
  - name: AI Hub
  - name: Cost optimization
  - name: Operations
  - name: Observability
security:
  - bearerAuth: []
paths:
  /v1beta/models/{model}:countTokens:
    post:
      operationId: countGenerateTokens
      tags: [Inference]
      summary: Count native GenerateContent context tokens
      description: |
        Uses gateway authorization, model/tool ACL, quotas and content policy.
        Does not generate output or open a billing lifecycle. Query credentials are
        rejected. Requires a native token counter; no estimate fallback is used.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - in: query
          name: alt
          required: false
          schema: {type: string, enum: [json]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateCountRequest'}
      responses:
        '200':
          description: Provider-reported input token count
          content:
            application/json:
              schema:
                type: object
                required: [totalTokens]
                properties:
                  totalTokens: {type: integer, minimum: 0}
        default:
          description: Native error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentError'}
  /v1beta/models/{model}:generateContent:
    post:
      operationId: generateContent
      tags: [Inference]
      summary: Create native GenerateContent through the gateway pipeline
      description: |
        Uses gateway authorization, model/tool ACL, quotas, content policy and billing.
        Supports one candidate; unsupported fields are rejected. Tool calls are
        buffered until their JSON arguments are complete. Query credentials are rejected.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - in: query
          name: alt
          required: false
          schema: {type: string, enum: [json]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateContentRequest'}
      responses:
        '200':
          description: Native response with provider-reported usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentResponse'}
        default:
          description: Native error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentError'}
  /v1beta/models/{model}:streamGenerateContent:
    post:
      operationId: streamGenerateContent
      tags: [Inference]
      summary: Stream native GenerateContent through the gateway pipeline
      description: |
        Uses gateway authorization, model/tool ACL, quotas, content policy and billing.
        Supports one candidate; unsupported fields are rejected. Tool calls are
        buffered until their JSON arguments are complete. Query credentials are rejected.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - in: query
          name: alt
          required: true
          schema: {type: string, enum: [sse]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateContentRequest'}
      responses:
        '200':
          description: Native SSE events; errors terminate the stream without a successful finishReason
          content:
            text/event-stream:
              schema: {type: string}
        default:
          description: Native error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentError'}
  /v1/messages/count_tokens:
    post:
      operationId: countMessageTokens
      tags: [Inference]
      summary: Count context tokens using a native provider counter
      description: |
        Applies authorization, tool ACL, input TPM/RPM and pre-inference policy.
        Does not generate output or open a billing lifecycle. Currently requires
        native Anthropic or Gemini. No automatic retry, mirror or response cache is used.
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      parameters:
        - in: header
          name: anthropic-version
          required: true
          schema: {type: string, enum: ['2023-06-01']}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageTokenCountRequest'}
      responses:
        '200':
          description: Provider-reported count of the context after policy processing
          content:
            application/json:
              schema:
                type: object
                required: [input_tokens]
                additionalProperties: false
                properties:
                  input_tokens: {type: integer, minimum: 0}
        default:
          description: Native Messages error
          content:
            application/json:
              schema:
                type: object
                required: [type, error]
                properties:
                  type: {type: string, enum: [error]}
                  error:
                    type: object
                    required: [type, message]
                    properties:
                      type: {type: string}
                      message: {type: string}
  /v1/messages:
    post:
      operationId: createMessage
      tags: [Inference]
      summary: Create an Anthropic Messages response through the gateway pipeline
      description: |
        Supports text, base64 user images, function tools and text tool results.
        Advanced blocks, metadata, thinking, server tools and
        assistant prefill are rejected. Provider capability checks still apply.
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      parameters:
        - in: header
          name: anthropic-version
          required: true
          schema: {type: string, enum: ['2023-06-01']}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessagesRequest'}
      responses:
        '200':
          description: Message or native Messages SSE events ending in message_stop
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagesResponse'}
            text/event-stream:
              schema: {type: string}
        default:
          description: Native Messages error; existing gateway policy and rate limits apply
          content:
            application/json:
              schema:
                type: object
                required: [type, error]
                properties:
                  type: {type: string, enum: [error]}
                  error:
                    type: object
                    required: [type, message]
                    properties:
                      type: {type: string}
                      message: {type: string}
  /healthz:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Process liveness
      security: []
      responses:
        '204':
          description: Gateway process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
  /readyz:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Required dependency readiness
      security: []
      responses:
        '204':
          description: Required dependencies are ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /metrics:
    get:
      operationId: getMetrics
      tags: [Operations]
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /v1/models:
    get:
      operationId: listModels
      tags: [Models]
      summary: List models allowed for the authenticated credential
      responses:
        '200':
          description: Model list filtered by credential policy
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ModuleFailed'
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [Inference]
      summary: Create a chat completion
      description: |
        Supports function tools, structured outputs, SSE streaming, and bounded
        inline image input. Vision requests accept at most 8 JPEG, PNG, GIF, or
        WebP data URLs, at most 8 MiB decoded each and 16 MiB decoded total.
        Remote image URLs are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              text:
                value:
                  model: gpt-5-mini
                  messages:
                    - role: user
                      content: Explain atomic rate limiting briefly.
              vision:
                value:
                  model: vision-model
                  messages:
                    - role: user
                      content:
                        - type: text
                          text: Describe this image.
                        - type: image_url
                          image_url:
                            url: data:image/png;base64,iVBORw0KGgo=
                            detail: auto
      responses:
        '200':
          description: Completion JSON or an SSE stream when `stream=true`
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: 'OpenAI-compatible `data:` events terminated by `data: [DONE]`.'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
  /v1/responses:
    post:
      operationId: createResponse
      tags: [Inference]
      summary: Create a Responses API response
      description: Supports function tools, explicitly scoped MCP connectors, structured output, previous-response affinity, SSE, and inline images. MCP definitions are forwarded to an upstream provider that must support remote MCP; the gateway does not execute MCP calls. Routing requires explicit mcp capability. Tool authorization checks connector identity (label and canonical URL), not individual remote tool names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseRequest'
            examples:
              text:
                value:
                  model: gpt-5-mini
                  input: Summarize the release notes.
              mcp:
                value:
                  model: gpt-5-mini
                  input: Check the weather.
                  tools:
                    - type: mcp
                      server_label: weather-prod
                      server_url: https://mcp.example.test
      responses:
        '200':
          description: Response JSON or an SSE stream when `stream=true`
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseResponse'
            text/event-stream:
              schema:
                type: string
                description: 'Named Responses API events terminated by `data: [DONE]`.'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
        '503':
          description: Response session storage is unavailable; continuation was not sent to a provider. The error code is response_affinity_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/embeddings:
    post:
      operationId: createEmbeddings
      tags: [Inference]
      summary: Create float embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
            example:
              model: text-embedding-model
              input: Text to embed
              encoding_format: float
      responses:
        '200':
          description: Embedding vectors
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
  /v1/rerank:
    post:
      operationId: rerankDocuments
      tags: [Inference]
      summary: Rank documents by relevance to a query
      description: Cohere-compatible rerank request routed to an explicitly rerank-capable provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RerankRequest'}
            example:
              model: rerank-model
              query: Which document is about refunds?
              documents: [Shipping takes two days., Refunds are available for 30 days.]
              top_n: 1
              return_documents: true
      responses:
        '200':
          description: Documents ranked by provider relevance score
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RerankResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
  /admin/v1/session:
    get:
      operationId: getAdminSession
      tags: [Identity]
      summary: Validate the current console credential
      description: Returns bounded identity, scope, and UI capability metadata. The bearer token, provider credentials, prompts, and responses are never returned.
      responses:
        '200':
          description: Authenticated console session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {$ref: '#/components/responses/ModuleFailed'}
  /admin/v1/keys:
    get:
      operationId: listVirtualKeys
      tags: [Virtual keys]
      summary: List virtual key metadata
      description: Requires the `admin` role. Returns policy and lifecycle metadata only; plaintext tokens and token hashes are never exposed.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        - {name: search, in: query, description: Case-insensitive alias substring., schema: {type: string, maxLength: 128}}
        - {name: organization_id, in: query, description: Includes directly owned keys and keys inherited through organization teams., schema: {type: string, maxLength: 256}}
        - {name: team_id, in: query, description: Includes team-owned keys and keys owned by team members., schema: {type: string, maxLength: 256}}
        - {name: user_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: key_id, in: query, description: Case-insensitive key ID substring., schema: {type: string, maxLength: 256}}
        - name: access_group_id
          in: query
          description: Match keys assigned to any repeated access-group ID.
          style: form
          explode: true
          schema: {type: array, maxItems: 256, items: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}}
        - {name: status, in: query, schema: {type: string, enum: [active, disabled, revoked, expired, non_revoked]}}
        - {name: sort_by, in: query, schema: {type: string, enum: [key, alias, organization, team, user, created, status], default: created}}
        - {name: sort_order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: expand, in: query, description: Include billing-backed financial projections for the returned page., schema: {type: string, const: financials}}
      responses:
        '200':
          description: Safe virtual key metadata
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/VirtualKeyMetadata'}
                  total: {type: integer, minimum: 0}
                  limit: {type: integer, minimum: 1, maximum: 500}
                  offset: {type: integer, minimum: 0}
                  financials:
                    type: object
                    description: Present only when expand=financials. Keys are non-secret virtual-key IDs.
                    additionalProperties: {$ref: '#/components/schemas/KeyBudgetProjection'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    post:
      operationId: createVirtualKey
      tags: [Virtual keys]
      summary: Create a virtual key
      description: Requires an authenticated credential with the `admin` role. The plaintext token is returned exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualKeyPolicy'
      responses:
        '201':
          description: Virtual key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedVirtualKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
  /admin/v1/keys/{id}/rotate:
    post:
      operationId: rotateVirtualKey
      tags: [Virtual keys]
      summary: Rotate a virtual key
      description: Creates a linked replacement and revokes the previous key atomically.
      parameters:
        - $ref: '#/components/parameters/VirtualKeyID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualKeyPolicy'
      responses:
        '201':
          description: Replacement virtual key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedVirtualKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
  /admin/v1/keys/{id}:
    put:
      operationId: updateVirtualKey
      tags: [Virtual keys]
      summary: Update a virtual key policy without changing its secret
      parameters: [{$ref: '#/components/parameters/VirtualKeyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VirtualKeyPolicy'}
      responses:
        '204': {description: Virtual key policy updated}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: revokeVirtualKey
      tags: [Virtual keys]
      summary: Revoke a virtual key
      parameters:
        - $ref: '#/components/parameters/VirtualKeyID'
      responses:
        '204':
          description: Virtual key revoked
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
  /admin/v1/keys/{id}/disable:
    post:
      operationId: disableVirtualKey
      tags: [Virtual keys]
      summary: Temporarily disable a virtual key
      parameters: [{$ref: '#/components/parameters/VirtualKeyID'}]
      responses:
        '204': {description: Virtual key disabled}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/keys/{id}/enable:
    post:
      operationId: enableVirtualKey
      tags: [Virtual keys]
      summary: Re-enable a disabled virtual key
      parameters: [{$ref: '#/components/parameters/VirtualKeyID'}]
      responses:
        '204': {description: Virtual key enabled}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/users:
    get:
      operationId: listDirectoryUsers
      tags: [Identity]
      summary: List users visible to the admin scope
      parameters:
        - {name: team_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200':
          description: Directory users
          content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/DirectoryUser'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/users/{id}:
    put:
      operationId: putDirectoryUser
      tags: [Identity]
      summary: Create or update a directory user
      parameters: [{$ref: '#/components/parameters/DirectoryUserPathID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryUserInput'}}}}
      responses:
        '200': {description: User saved, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryUser'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/teams:
    get:
      operationId: listDirectoryTeams
      tags: [Identity]
      summary: List teams visible to the admin scope
      parameters:
        - {name: team_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Directory teams, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/DirectoryTeam'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/teams/{id}:
    put:
      operationId: putDirectoryTeam
      tags: [Identity]
      summary: Create or update a team
      parameters: [{$ref: '#/components/parameters/DirectoryTeamID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryTeamInput'}}}}
      responses:
        '200': {description: Team saved, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryTeam'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/teams/{id}/members/{user_id}:
    put:
      operationId: putTeamMembership
      tags: [Identity]
      summary: Add or update a scoped team membership
      parameters:
        - {$ref: '#/components/parameters/DirectoryTeamID'}
        - {$ref: '#/components/parameters/DirectoryUserID'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TeamMembershipInput'}}}}
      responses:
