        '200': {description: Tag saved, content: {application/json: {schema: {$ref: '#/components/schemas/TagDefinition'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteTag
      tags: [Tags]
      summary: Delete a managed tag policy
      responses:
        '204': {description: Tag policy deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/v1/compliance/check:
    post:
      operationId: checkCompliance
      tags: [Guardrails]
      summary: Dry-run text through a guardrail policy without calling a model
      description: Text is projected to selected DLP/AV scanners and is not stored by the gateway or returned in the response.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ComplianceCheckInput'}}}}
      responses:
        '200': {description: Compliance decision, content: {application/json: {schema: {$ref: '#/components/schemas/ComplianceCheckResult'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/guardrails/monitor:
    get:
      operationId: getGuardrailMonitor
      tags: [Guardrails]
      summary: Inspect bounded shared guardrail outcomes
      description: Returns metadata-only outcomes from a shared bounded Redis history when configured, with an explicit current-replica fallback. Prompt text, scanner details and response content are never retained.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - {name: window, in: query, schema: {type: string, enum: [retained, 15m, 1h, 24h], default: retained}}
        - {name: module, in: query, schema: {type: string, enum: [dlp, av]}}
        - {name: policy, in: query, schema: {type: string, maxLength: 128}}
        - {name: outcome, in: query, schema: {type: string, enum: [passed, rejected, unavailable]}}
        - {name: source, in: query, schema: {type: string, enum: [inference, inference_output, compliance, guardrail_api]}}
      responses:
        '200': {description: Guardrail monitoring snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/GuardrailMonitorSnapshot'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/cache/diagnostics:
    get:
      operationId: getCacheDiagnostics
      tags: [Caching and logging]
      summary: Inspect exact and semantic cache runtime counters
