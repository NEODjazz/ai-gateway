      parameters: [{$ref: '#/components/parameters/AccessEntryID'}]
      responses:
        '200': {description: Probe accepted, content: {application/json: {schema: {$ref: '#/components/schemas/LoggingDestinationProbe'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {description: Destination rejected the probe or was unreachable}
        '503': {description: Append-only audit preflight or logging management is unavailable}
  /admin/v1/tool-policies:
    get:
      operationId: listToolPolicies
      tags: [Agent templates]
      summary: List reusable agent tool policies
      responses:
        '200': {description: Tool policies, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/ToolPolicy'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/tool-policies/{id}:
