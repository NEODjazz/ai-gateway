    get:
      operationId: listContainerFiles
      tags: [Inference]
      summary: List files in an owned container through its pinned deployment
      security: [{bearerAuth: []}]
      parameters:
        - {name: after, in: query, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
      responses:
        '200': {description: Container file page, content: {application/json: {schema: {$ref: '#/components/schemas/ContainerFileList'}}}}
        default: {description: "Authentication, ownership, validation, provider, or storage failure", content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/containers/{id}/files/{file_id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
      - {name: file_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
    get:
      operationId: retrieveContainerFile
      tags: [Inference]
      summary: Retrieve file metadata from an owned container
