        basis: {type: string, const: catalog_prices_and_runtime_availability}
        usage_projection: {type: boolean, const: false}
    ManagedProvider:
      type: object
      additionalProperties: false
      required: [id, type, enabled]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        type: {type: string, enum: [demo, ollama, openai, openai-compatible, openrouter, azure-openai, anthropic, gemini, cohere, mistral, voyage, bedrock, groq, deepseek]}
        base_url: {type: string, format: uri, maxLength: 2048}
        api_version:
          type: string
          maxLength: 32
          description: Azure data-plane version. Empty selects the current /openai/v1 contract; dated and preview values are forwarded as api-version.
        auth_type:
          type: string
          enum: [api_key, gcp_adc, entra, bearer, aws_sigv4]
          description: Azure accepts api_key or entra. Azure entra uses the public or Azure US Government authority and resource audience selected from the provider endpoint, with a bound static token or ambient AKS federated workload identity, App Service, Container Apps or VM managed identity when no credential is bound. Gemini accepts api_key or gcp_adc; gcp_adc obtains a short-lived bearer token from the GCE or GKE metadata server and does not require a bound credential. Bedrock accepts bearer for compatible private endpoints or aws_sigv4 for AWS IAM authentication. A Bedrock aws_sigv4 deployment without a bound credential uses environment, projected web identity, bounded shared credentials profiles, ECS/EKS container or EC2 IMDSv2 role credentials. Explicit credentials remain write-only in the credential vault.
        region:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9-]+$'
          description: Required AWS region for Bedrock aws_sigv4 authentication; rejected for other provider types.
        rate_limit_rpm: {type: integer, minimum: 0, maximum: 10000000, description: Shared request quota across every deployment backed by this provider; zero disables it.}
        rate_limit_tpm: {type: integer, minimum: 0, maximum: 1000000000, description: Shared estimated token quota across every deployment backed by this provider; zero disables it.}
        enabled: {type: boolean}
    ProviderCapabilityProfile:
      type: object
      additionalProperties: false
      required: [type, operations, capabilities, auth_types, chat_parameters]
      properties:
        type: {type: string, enum: [demo, ollama, openai, openai-compatible, openrouter, azure-openai, anthropic, gemini, cohere, mistral, voyage, bedrock, groq, deepseek]}
        operations:
          type: array
          uniqueItems: true
          description: Native operations implemented by the managed adapter. count_tokens is used by the inbound token-count endpoint and is not a deployment capability.
          items: {type: string, enum: [chat, responses, count_tokens, embeddings, rerank, moderation, image_generation, image_edit, image_variation, audio_transcription, audio_translation, audio_speech, ocr, search, skills, stream]}
        capabilities:
          type: array
          uniqueItems: true
          description: Operations and optional request features preserved by the managed adapter.
          items: {type: string, enum: [chat, responses, background_responses, embeddings, rerank, moderation, image_generation, image_edit, image_variation, audio_transcription, audio_translation, audio_speech, ocr, search, skills, stream, tools, structured_output, mcp, vision, web_search, web_fetch, audio, prompt_cache, assistant_prefill]}
        auth_types:
          type: array
          uniqueItems: true
          description: Explicit auth_type values accepted by this provider type. An empty list means the adapter uses its fixed credential convention.
          items: {type: string, enum: [api_key, gcp_adc, entra, bearer, aws_sigv4]}
        chat_parameters:
          $ref: '#/components/schemas/ProviderChatParameterPolicy'
    ProviderChatParameterPolicy:
      type: object
      additionalProperties: false
      required: [reasoning_effort, logprobs, service_tier]
      description: Values accepted by the runtime adapter validator for selected Chat Completions parameters. Empty arrays mean the parameter is rejected. Availability can still depend on the upstream model.
      properties:
        reasoning_effort:
          type: array
          uniqueItems: true
          items: {type: string, enum: [none, minimal, low, medium, high, xhigh, max]}
        logprobs:
          type: array
          uniqueItems: true
          items: {type: string, enum: ['false', 'true']}
        service_tier:
          type: array
          uniqueItems: true
          items: {type: string, enum: [auto, default, on_demand, flex, performance, scale, priority, fast, ultrafast, standard_only]}
    ProviderCredentialCreateInput:
