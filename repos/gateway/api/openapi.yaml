  /v1/mcp/servers/{id}/tools:
    get:
      operationId: listMCPServerTools
      tags: [MCP]
      summary: Discover tools from an enabled registered MCP server
      description: Authenticates the virtual key, enforces connector or tool-specific credential and access-group grants, consumes RPM admission, and records a durable zero-cost discovery lifecycle. Each request creates a bounded Streamable HTTP session and performs initialize followed by tools/list. Returned definitions are filtered through the server registry, credential and access-group policies. The gateway sends no client bearer token or stored credential to the MCP server. Legacy SSE registry entries are rejected.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
      responses:
        '200':
          description: Bounded page of validated MCP tool definitions
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPRuntimeToolPage'}
        default:
          description: Authentication, policy, rate-limit, billing, transport, or upstream failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/mcp/servers/{id}/tools/{tool}:
    post:
      operationId: callMCPServerTool
      tags: [MCP]
      summary: Execute a tool on an enabled registered MCP server
      description: Authenticates the virtual key, enforces connector and access-group grants, consumes RPM admission, requires a scoped idempotency key, writes a fail-closed durable audit attempt, and settles one external tool request through billing. The first execution and its bounded result are persisted in PostgreSQL for 24 hours; retries replay the stored HTTP response without invoking the tool or billing again. A concurrent retry receives 409 and a Retry-After header. The gateway sends no client bearer token or stored credential to the MCP server.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: tool, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}, description: "Visible ASCII key scoped to the authenticated credential, server and tool. Reusing it with different arguments returns 409."}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MCPToolCallRequest'}
      responses:
        '200':
          description: Bounded MCP tool result, or the exact persisted response for an idempotent retry
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPToolCallResult'}
        '409':
          description: The key is in progress or conflicts with different arguments
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default:
          description: Authentication, policy, rate-limit, audit, billing, transport, persistence, or upstream failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/ocr:
    post:
      operationId: createOCR
      tags: [Inference]
      summary: Extract text and structured content from a document or image
      description: Routes to an explicitly OCR-capable native deployment. Applies strict document, page-selection and annotation validation, model authorization, RPM/TPM admission, bounded provider response validation, retries and exact processed-page settlement. Native Gemini accepts bounded inline PDF, PNG, JPEG and WebP data, requests schema-constrained page Markdown, verifies selected page indices and rejects unsupported remote documents and extraction controls before upstream execution. Inline data, including owner-scoped file references, is projected to configured antivirus scanning; annotation prompts are projected to text policy modules.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OCRRequest'}
      responses:
        '200':
          description: Bounded OCR result with exact processed-page usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OCRResponse'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
