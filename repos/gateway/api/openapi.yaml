openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AI Gateway API
  version: 0.1.221
  description: |
    OpenAI-compatible inference API and administrative virtual-key API.
    Authentication, routing, guardrails, anonymization, billing, caching, and
    provider failover are performed by the gateway.
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same-origin gateway
tags:
  - name: Inference
  - name: Models
  - name: A2A
  - name: Virtual keys
  - name: Identity
  - name: Model deployments
  - name: Guardrails
  - name: Tags
  - name: MCP
  - name: Files
  - name: Vector stores
  - name: Skills
  - name: Projects and access
  - name: Caching and logging
  - name: Agent templates
  - name: Customers
  - name: Organizations
  - name: AI Hub
  - name: Cost optimization
  - name: Operations
  - name: Observability
security:
  - bearerAuth: []
paths:
  /a2a/{agent}/.well-known/agent-card.json:
    get:
      operationId: getA2AAgentCard
      tags: [A2A]
      summary: Discover one enabled executable agent profile
      description: Returns an A2A 1.0 Agent Card for direct discovery. The card advertises text-only JSON-RPC execution and bearer authentication; streaming, push notifications and extended cards are not advertised.
      security: []
      parameters:
        - {name: agent, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
      responses:
        '200':
          description: Public A2A Agent Card
          content:
            application/json:
              schema: {$ref: '#/components/schemas/A2AAgentCard'}
        '404': {description: 'Agent profile is absent, disabled, or requires an unavailable instruction template'}
  /a2a/{agent}:
    post:
      operationId: callA2AAgent
      tags: [A2A]
      summary: Execute A2A messages and task lifecycle operations
      description: Implements A2A 1.0 SendMessage, GetTask, ListTasks and CancelTask. New messages pass through the same authentication, model authorization, rate limit, guardrail, routing and billing pipeline as Responses. When durable task storage is configured, SendMessage creates or continues an owner-scoped task using optimistic concurrency. Setting returnImmediately=true uses durable background Responses execution; GetTask reconciles pending execution and CancelTask cancels it. Streaming, binary/data parts and push notifications return explicit protocol errors.
      security: [{bearerAuth: []}]
      parameters:
        - {name: agent, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
        - {name: A2A-Version, in: header, required: true, schema: {type: string, const: '1.0'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/A2AJSONRPCRequest'}
      responses:
        '200':
          description: A2A Message, Task or task-list result
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/A2AJSONRPCResponse'}
        default:
          description: Protocol, authentication, policy, quota, or provider failure in a JSON-RPC error envelope
          content:
            application/json:
              schema: {$ref: '#/components/schemas/A2AJSONRPCResponse'}
  /model/{model}/converse-stream:
    post:
      operationId: bedrockConverseStream
      tags: [Inference]
      summary: Stream a Converse response
      description: Uses the same authorization, model and tool policy, quota, guardrail, routing and billing lifecycle as Chat streaming. Successful responses use checksummed AWS EventStream frames. Provider fallback is allowed only before the first event; non-streaming deployments produce a bounded event stream after the full response passes output policy.
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 2048}
        - in: query
          name: provider
          required: false
          schema: {type: string}
          description: Optional gateway deployment selector.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BedrockConverseRequest'}
      responses:
        '200':
          description: Checksummed event stream ending in messageStop and usage metadata
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/vnd.amazon.eventstream:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
  /model/{model}/converse:
    post:
      operationId: bedrockConverse
      tags: [Inference]
      summary: Create a synchronous Converse response
      description: Uses the gateway authentication, model and tool authorization, quotas, content policy, routing, and billing pipeline. Supports text, bounded base64 user images and documents, function tool use and result blocks, system text, and standard inference limits. Documents are limited to five per user message and 4.5 MiB each, require accompanying text, contribute to TPM reserve, and are projected to configured scanners. Unsupported native fields are rejected before provider execution.
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 2048}
        - in: query
          name: provider
          required: false
          schema: {type: string}
          description: Optional gateway deployment selector.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BedrockConverseRequest'}
      responses:
        '200':
          description: Synchronous Converse response with provider-reported usage
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BedrockConverseResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
  /v1beta/models/{model}:countTokens:
    post:
      operationId: countGenerateTokens
      tags: [Inference]
      summary: Count native GenerateContent context tokens
      description: |
        Uses gateway authorization, model/tool ACL, quotas and content policy.
        Does not generate output or open a billing lifecycle. Query credentials are
        rejected. Requires a native token counter; no estimate fallback is used.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - in: query
          name: alt
          required: false
          schema: {type: string, enum: [json]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateCountRequest'}
      responses:
        '200':
          description: Provider-reported input token count
          content:
            application/json:
              schema:
                type: object
                required: [totalTokens]
                properties:
                  totalTokens: {type: integer, minimum: 0}
        default:
          description: Native error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentError'}
  /v1beta/models/{model}:generateContent:
    post:
      operationId: generateContent
      tags: [Inference]
      summary: Create native GenerateContent through the gateway pipeline
      description: |
        Uses gateway authorization, model/tool ACL, quotas, content policy and billing.
        Supports one candidate; unsupported fields are rejected. Tool calls are
        buffered until their JSON arguments are complete. Query credentials are rejected.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - in: query
          name: alt
          required: false
          schema: {type: string, enum: [json]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateContentRequest'}
      responses:
        '200':
          description: Native response with provider-reported usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentResponse'}
        default:
          description: Native error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentError'}
  /v1beta/models/{model}:streamGenerateContent:
    post:
      operationId: streamGenerateContent
      tags: [Inference]
      summary: Stream native GenerateContent through the gateway pipeline
      description: |
        Uses gateway authorization, model/tool ACL, quotas, content policy and billing.
        Supports one candidate; unsupported fields are rejected. Tool calls are
        buffered until their JSON arguments are complete. Query credentials are rejected.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - in: query
          name: alt
          required: true
          schema: {type: string, enum: [sse]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateContentRequest'}
      responses:
        '200':
          description: Native SSE events; errors terminate the stream without a successful finishReason
          content:
            text/event-stream:
              schema: {type: string}
        default:
          description: Native error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentError'}
  /v1/messages/count_tokens:
    post:
      operationId: countMessageTokens
      tags: [Inference]
      summary: Count context tokens using a native provider counter
      description: |
        Applies authorization, tool ACL, input TPM/RPM and pre-inference policy.
        Does not generate output or open a billing lifecycle. Currently requires
        native Anthropic, Gemini or Bedrock. No automatic retry, mirror or response cache is used.
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      parameters:
        - in: header
          name: anthropic-version
          required: true
          schema: {type: string, enum: ['2023-06-01']}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageTokenCountRequest'}
      responses:
        '200':
          description: Provider-reported count of the context after policy processing
          content:
            application/json:
              schema:
                type: object
                required: [input_tokens]
                additionalProperties: false
                properties:
                  input_tokens: {type: integer, minimum: 0}
        default:
          description: Native Messages error
          content:
            application/json:
              schema:
                type: object
                required: [type, error]
                properties:
                  type: {type: string, enum: [error]}
                  error:
                    type: object
                    required: [type, message]
                    properties:
                      type: {type: string}
                      message: {type: string}
  /v1/messages:
    post:
      operationId: createMessage
      tags: [Inference]
      summary: Create an Anthropic Messages response through the gateway pipeline
      description: |
        Supports text, base64 user images, function tools and text tool results.
        Bounded native web-search and web-fetch result blocks are preserved in provider order.
        Other advanced input blocks and server-tool types are rejected.
        Assistant prefill requires an explicitly capable deployment and model.
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      parameters:
        - in: header
          name: anthropic-version
          required: true
          schema: {type: string, enum: ['2023-06-01']}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessagesRequest'}
      responses:
        '200':
          description: Message or native Messages SSE events ending in message_stop
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagesResponse'}
            text/event-stream:
              schema: {type: string}
        default:
          description: Native Messages error; existing gateway policy and rate limits apply
          content:
            application/json:
              schema:
                type: object
                required: [type, error]
                properties:
                  type: {type: string, enum: [error]}
                  error:
                    type: object
                    required: [type, message]
                    properties:
                      type: {type: string}
                      message: {type: string}
  /v1/images/generations:
    post:
      operationId: generateImage
      tags: [Inference]
      summary: Generate images through an explicitly capable deployment
      description: Applies gateway authentication, model policy, RPM/TPM admission, provider retries and billing settlement. Responses and decoded images are bounded. Native Gemini deployments support one inline base64 image plus the documented native aspect-ratio and resolution controls; unsupported parameters are rejected before upstream execution.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImageGenerationRequest'}
      responses:
        '200':
          description: Generated images and provider-reported token usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageGenerationResponse'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/images/edits:
    post:
      operationId: editImage
      tags: [Inference]
      summary: Edit uploaded images through an explicitly capable deployment
      description: Applies bounded multipart decoding, image signature checks, gateway policy, AV/DLP modules, RPM/TPM admission, retries and billing settlement. Native Gemini deployments accept one to eight PNG/JPEG/WebP inputs and return one inline base64 image; mask editing and parameters without an exact native mapping are rejected before upstream execution.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ImageEditRequest'}
      responses:
        '200':
          description: Edited images and provider-reported token usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageGenerationResponse'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/images/variations:
    post:
      operationId: createImageVariation
      tags: [Inference]
      summary: Create variations of an uploaded image through an explicitly capable deployment
      description: Applies bounded multipart decoding, image signature checks, gateway policy, AV scanning, RPM/TPM admission, retries and billing settlement. Native Gemini deployments accept one PNG/JPEG/WebP input and return one inline base64 variation; incompatible output and size parameters are rejected before upstream execution.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ImageVariationRequest'}
      responses:
        '200':
          description: Image variations and provider-reported token usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageGenerationResponse'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/audio/transcriptions:
    post:
      operationId: transcribeAudio
      tags: [Inference]
      summary: Transcribe an uploaded audio file through an explicitly capable deployment
      description: Applies bounded multipart decoding, file signature checks, AV and prompt DLP policies, RPM/TPM admission, retries and exact provider usage settlement. Duration-priced native deployments reserve validated container duration before execution. Native Gemini supports bounded inline WAV/MP3/MPEG/OGG/FLAC/WebM input, language hints, vocabulary, prompt guidance and temperature; unsupported structured modes fail before upstream execution.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/AudioTranscriptionRequest'}
      responses:
        '200':
          description: Transcript with exact token or duration usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudioTranscriptionResponse'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/audio/translations:
    post:
      operationId: translateAudio
      tags: [Inference]
      summary: Translate uploaded speech to English through an explicitly capable deployment
      description: Uses the same bounded multipart, authorization, access policy, DLP/AV, RPM/TPM, retry and billing lifecycle as transcription. Native Gemini accepts inline WAV/MP3/MPEG/OGG/FLAC/WebM input plus prompt and temperature, translates to English, returns exact token usage, and rejects transcription-only controls before upstream execution. Native Groq, compatible and Azure adapters use duration settlement; compatible transports require reliable container duration metadata before execution.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/AudioTranscriptionRequest'}
      responses:
        '200':
          description: English translation with exact token or duration usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudioTranscriptionResponse'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/audio/speech:
    post:
      operationId: createSpeech
      tags: [Inference]
      summary: Generate speech audio from text through an explicitly capable deployment
      description: Applies strict JSON validation, text policies, RPM/TPM admission, bounded provider response buffering, retries, exact Unicode character billing and durable settlement. Native Gemini uses the Interactions API for inline MP3, Opus, WAV or PCM output, supports voice and natural-language instructions, and rejects unsupported speed, AAC and FLAC controls before upstream execution. The audio stream format returns a buffered binary response; SSE is rejected explicitly.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AudioSpeechRequest'}
      responses:
        '200':
          description: Generated speech in the requested audio format
          content:
            audio/mpeg: {schema: {type: string, format: binary}}
            audio/ogg: {schema: {type: string, format: binary}}
            audio/aac: {schema: {type: string, format: binary}}
            audio/flac: {schema: {type: string, format: binary}}
            audio/wav: {schema: {type: string, format: binary}}
            application/octet-stream: {schema: {type: string, format: binary}}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/files:
    post:
      operationId: createFile
      tags: [Files]
      summary: Store a bounded file for later gateway operations
      description: Authenticates the virtual key, consumes RPM admission and stores the file in PostgreSQL under a credential-and-user owner key. Uploads fail closed when durable storage is unavailable and an atomic per-owner byte quota prevents concurrent requests from exceeding the configured limit.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, purpose]
              properties:
                file: {type: string, format: binary}
                purpose: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$'}
      responses:
        '200':
          description: Stored file metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileObject'}
        default:
          description: Authentication, validation, quota, or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    get:
      operationId: listFiles
      tags: [Files]
      summary: List files owned by the authenticated credential and user
      security: [{bearerAuth: []}]
      parameters:
        - {name: purpose, in: query, schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$'}}
        - {name: after, in: query, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Cursor page of owned file metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileList'}
        default:
          description: Authentication, validation, or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/files/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
    get:
      operationId: getFile
      tags: [Files]
      summary: Read owned file metadata
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Owned file metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileObject'}
        default:
          description: Authentication or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      operationId: deleteFile
      tags: [Files]
      summary: Delete an owned file
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileDeletion'}
        default:
          description: Authentication or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/files/{id}/content:
    get:
      operationId: getFileContent
      tags: [Files]
      summary: Download content of an owned file
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
      responses:
        '200':
          description: Stored file bytes with the validated media type and attachment filename
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        default:
          description: Authentication or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/vector_stores:
    post:
      operationId: createVectorStore
      tags: [Vector stores]
      summary: Create an owner-isolated durable vector store
      description: Persists metadata and expiry policy in PostgreSQL after authentication and RPM admission. An atomic per-owner quota prevents concurrent creation from exceeding the configured limit. Files are attached through the dedicated file lifecycle API; search is a separate operation.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VectorStoreCreateRequest'}
      responses:
        '200':
          description: Created vector store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VectorStore'}
        default:
          description: Authentication, validation, quota, or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    get:
      operationId: listVectorStores
      tags: [Vector stores]
      summary: List vector stores owned by the authenticated credential and user
      security: [{bearerAuth: []}]
      parameters:
        - {name: after, in: query, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Cursor page of owned vector stores
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VectorStoreList'}
        default:
          description: Authentication, validation, or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/vector_stores/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
    get:
      operationId: getVectorStore
      tags: [Vector stores]
      summary: Get an owned vector store
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Vector store metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VectorStore'}
        default:
          description: Authentication or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      operationId: updateVectorStore
      tags: [Vector stores]
      summary: Update an owned vector store
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VectorStoreUpdateRequest'}
      responses:
        '200':
          description: Updated vector store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VectorStore'}
        default:
          description: Authentication, validation, or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      operationId: deleteVectorStore
      tags: [Vector stores]
      summary: Delete an owned vector store
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VectorStoreDeletion'}
        default:
          description: Authentication or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/vector_stores/{id}/files:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
    post:
      operationId: attachVectorStoreFile
      tags: [Vector stores]
      summary: Attach an owned file to an owned vector store
      description: Atomically verifies file and vector-store ownership in PostgreSQL, enforces the configured per-store file quota, and refreshes last-active expiry.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VectorStoreFileCreateRequest'}
      responses:
        '200':
          description: Attached file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VectorStoreFile'}
        default:
          description: Authentication, ownership, quota, validation, conflict, or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    get:
      operationId: listVectorStoreFiles
      tags: [Vector stores]
      summary: List files attached to an owned vector store
      security: [{bearerAuth: []}]
      parameters:
        - {name: after, in: query, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Cursor page of attached files
