      tags: [Usage]
      summary: Get aggregated usage and spend
      description: Returns final request outcomes aggregated by currency, day, public or upstream model, provider, endpoint, credential tag, and customer scope. Mixed currencies are never summed together.
      parameters:
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 90, default: 30}
        - name: from
          in: query
          description: Inclusive RFC3339 timestamp; must be provided together with `to`.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: Exclusive RFC3339 timestamp; range is limited to 90 days.
          schema: {type: string, format: date-time}
        - name: model
          in: query
          schema: {type: string, maxLength: 256}
        - name: upstream_model
          in: query
          schema: {type: string, maxLength: 256}
        - name: provider
          in: query
          schema: {type: string, maxLength: 256}
        - name: endpoint
          in: query
          schema: {type: string, maxLength: 256}
        - name: tag
          in: query
          schema: {type: string, maxLength: 256}
        - name: scope_type
          in: query
          description: Customer dimension to filter; must be provided together with `scope_id`.
          schema: {type: string, enum: [key, user, team, organization]}
        - name: scope_id
          in: query
          description: Non-secret virtual-key fingerprint or configured customer ID.
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Usage and spend report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageReport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/customers/{scope_type}/{scope_id}/usage:
    get:
      operationId: getCustomerUsageReport
      tags: [Customers]
      summary: Get usage and spend for one customer scope
      description: Aggregates metadata-only final outcomes for an organization, user, team, or non-secret virtual-key ID. Scope values are passed to ClickHouse as typed parameters.
      parameters:
        - {name: scope_type, in: path, required: true, schema: {type: string, enum: [key, user, team, organization]}}
        - {name: scope_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 30}}
      responses:
        '200': {description: Scoped usage and spend report, content: {application/json: {schema: {$ref: '#/components/schemas/UsageReport'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs:
    get:
      operationId: listRequestLogs
      tags: [Observability]
      summary: List inference request outcomes
      description: Returns bounded metadata-only final outcomes. Prompts, responses, raw provider errors, credentials, and upstream URLs are never returned.
      parameters:
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
        - {name: from, in: query, description: Custom UTC window start; must be paired with to and span at most 90 days, schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive custom UTC window end, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: before_request_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: request_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: session_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: trace_id, in: query, schema: {type: string, pattern: '^[0-9a-fA-F]{32}$'}}
        - {name: status, in: query, schema: {type: string, enum: [ok, error]}}
        - {name: model, in: query, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, schema: {type: string, maxLength: 256}}
        - {name: tag, in: query, schema: {type: string, maxLength: 256}}
        - {name: user_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: team_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: organization_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: credential_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: cache_status, in: query, schema: {type: string, enum: [hit, miss, error]}}
        - {name: failure_class, in: query, schema: {type: string, maxLength: 256}}
        - {name: min_cost, in: query, schema: {type: number, minimum: 0}}
        - {name: max_cost, in: query, schema: {type: number, minimum: 0}}
      responses:
        '200':
          description: Request log page ordered newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLogPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs/groups:
    get:
      operationId: listRequestLogGroups
      tags: [Observability]
      summary: Aggregate inference outcomes by session or trace
      description: Aggregates the complete bounded query window in ClickHouse. Spend is grouped separately by currency and content fields are never read or returned.
      parameters:
        - {name: dimension, in: query, required: true, schema: {type: string, enum: [session, trace]}}
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
        - {name: from, in: query, description: Custom UTC window start; must be paired with to and span at most 90 days, schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive custom UTC window end, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: before_group_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: before_currency, in: query, schema: {type: string, maxLength: 16}}
        - {name: request_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: session_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: trace_id, in: query, schema: {type: string, pattern: '^[0-9a-fA-F]{32}$'}}
        - {name: status, in: query, schema: {type: string, enum: [ok, error]}}
        - {name: model, in: query, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, schema: {type: string, maxLength: 256}}
        - {name: tag, in: query, schema: {type: string, maxLength: 256}}
        - {name: user_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: team_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: organization_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: credential_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: cache_status, in: query, schema: {type: string, enum: [hit, miss, error]}}
        - {name: failure_class, in: query, schema: {type: string, maxLength: 256}}
        - {name: min_cost, in: query, schema: {type: number, minimum: 0}}
        - {name: max_cost, in: query, schema: {type: number, minimum: 0}}
      responses:
        '200': {description: Session or trace aggregate page ordered by latest request, content: {application/json: {schema: {$ref: '#/components/schemas/RequestLogGroupPage'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs/settings:
    get:
      operationId: getRequestLogSettings
      tags: [Observability]
      summary: Get request-log privacy and retention settings
      responses:
        '200':
          description: Effective request-log settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLogSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs/{request_id}:
    get:
      operationId: getRequestLog
      tags: [Observability]
      summary: Get one inference request outcome
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Safe request outcome metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLog'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/routing/diagnostics:
    get:
      operationId: getRoutingDiagnostics
      tags: [Routing]
      summary: Get safe provider routing diagnostics
      description: Returns endpoint names and operational routing state. Base URLs, credentials, and internal headers are never exposed.
      responses:
        '200':
          description: Routing strategy and endpoint state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoutingDiagnostics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/routing/simulate:
    post:
      operationId: simulateRouting
      tags: [Routing]
      summary: Explain deployment selection without calling a provider
      description: Uses a copy of routing state so weighted selection counters and endpoint health are not mutated.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingSimulationRequest'}}}}
      responses:
        '200': {description: Ordered eligible deployments and selected route, content: {application/json: {schema: {$ref: '#/components/schemas/RoutingSimulation'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-catalog:
    get:
      operationId: getRuntimeModelCatalog
      tags: [Models]
      summary: Get the active runtime model catalog
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, schema: {type: string, maxLength: 256}}
        - {name: capability, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [model, provider, input_cost, output_cost]}}
        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: asc}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        '200':
          description: Active catalog snapshot
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ModelCatalog'}
                  - {$ref: '#/components/schemas/ModelCatalogPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    put:
      operationId: replaceRuntimeModelCatalog
      tags: [Models]
      summary: Atomically replace the active runtime model catalog
      description: Replicas synchronize the validated catalog through the versioned control-plane snapshot. Priced entries require an explicit currency.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelCatalog'}
      responses:
        '200':
          description: Activated catalog snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelCatalog'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-onboarding/plan:
    post:
      operationId: planModelOnboarding
      tags: [Models]
      summary: Validate a model onboarding transaction without changing runtime state
      description: Returns the current control-plane revision and normalized catalog, deployment, and model-group changes. Providers and credentials must already exist.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingInput'}}}}
      responses:
        '200': {description: Validated non-mutating plan, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingPlan'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-onboarding/apply:
    post:
      operationId: applyModelOnboarding
      tags: [Models]
      summary: Atomically commit a previously validated model onboarding transaction
      description: Revalidates the complete input and commits catalog, deployments, and model groups in one optimistic control-plane revision. A stale expected_revision returns 409 and changes nothing.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingApply'}}}}
      responses:
        '200': {description: Committed plan with the new control-plane revision, content: {application/json: {schema: {$ref: '#/components/schemas/ModelOnboardingPlan'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/audit/events:
    get:
      operationId: listManagementAuditEvents
      tags: [Audit]
      summary: List durable management audit events
      description: Returns append-only attempted and terminal outcome events in descending ID order.
      parameters:
        - {name: before_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: actor_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: action, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: Audit event page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
components:
  securitySchemes:
    googleAPIKey:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: Gateway virtual key, not an upstream provider credential
    nativeAPIKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Gateway virtual key, not an upstream provider credential
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Virtual key or JWT
  headers:
    XExecutionID:
      description: Server-generated inference execution identifier used in billing and request logs. Independent of the caller correlation ID.
      schema:
        type: string
        maxLength: 128
    XRequestID:
      description: Request correlation identifier
      schema:
        type: string
        maxLength: 128
  parameters:
    MessagesVersion:
      name: anthropic-version
      in: header
      required: true
      schema: {type: string, enum: ['2023-06-01']}
    MessageBatchID:
      name: message_batch_id
      in: path
      required: true
      schema: {type: string, minLength: 10, maxLength: 128, pattern: '^msgbatch_[A-Za-z0-9_.-]+$'}
    FineTuningJobID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    SkillID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    SkillVersionID:
      name: version
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    VirtualKeyID:
      name: id
      in: path
      required: true
      description: Opaque virtual-key identifier, never the plaintext token
      schema:
        type: string
        pattern: '^vk_[A-Za-z0-9_-]{5,125}$'
        maxLength: 128
    DirectoryTeamID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    DirectoryUserID:
      name: user_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    DirectoryUserPathID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    ModelDeploymentID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    GuardrailPolicyName:
      name: name
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    MCPEntryID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    AccessEntryID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    OrganizationID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9._@:-]+$'}
    OrganizationTeamID:
      name: team_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9._@:-]+$'}
    BudgetID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
  responses:
    InvalidRequest:
      description: Invalid request or unsupported input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: unauthorized, message: invalid api key}
            ts: '2026-08-21T12:00:00Z'
    Forbidden:
      description: Credential policy rejects the model, function, or MCP connector
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdminRequired:
      description: The credential does not have the admin role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTooLarge:
      description: Request exceeds the 24 MiB inference body limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Credential rate limit, budget, or provider concurrency capacity exceeded
      headers:
        Retry-After:
          description: Seconds until the rate window resets or provider admission should be retried, when available
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContentRejected:
      description: A required DLP, antivirus, or content-policy guardrail rejected the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: content_rejected, message: content rejected}
            ts: '2026-08-21T12:00:00Z'
    ProviderFailed:
      description: Provider, guardrail, billing, or post-processing failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ModuleFailed:
      description: Required gateway module failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: Required storage is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GuardrailUnavailable:
      description: Required policy registry, audit store, or scanner is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ManagementUnavailable:
      description: Required admin management service is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists or the optimistic control-plane revision is stale
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested managed resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AssistantTool:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [code_interpreter, file_search, function]}
        function:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
            description: {type: string, maxLength: 1024}
            parameters: {type: object, additionalProperties: true}
            strict: {type: boolean}
    AssistantDefinition:
      type: object
      properties:
        model: {type: string, minLength: 1, maxLength: 256}
        name: {type: [string, 'null'], maxLength: 256}
        description: {type: [string, 'null'], maxLength: 512}
        instructions: {type: [string, 'null'], maxLength: 262144}
        tools: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/AssistantTool'}}
        tool_resources: {type: [object, 'null'], additionalProperties: true}
        metadata: {type: object, maxProperties: 16, additionalProperties: {type: string, maxLength: 512}}
        temperature: {type: [number, 'null'], minimum: 0, maximum: 2}
        top_p: {type: [number, 'null'], minimum: 0, maximum: 1}
        response_format: {}
        response_mime_type: {type: string, maxLength: 128, description: Text or JSON MIME type. It is normalized into the current response_format representation before policy evaluation and provider execution.}
    AssistantCreateRequest:
      allOf:
        - {$ref: '#/components/schemas/AssistantDefinition'}
        - type: object
          required: [model]
      unevaluatedProperties: false
    AssistantUpdateRequest:
      allOf:
        - {$ref: '#/components/schemas/AssistantDefinition'}
        - type: object
          minProperties: 1
      unevaluatedProperties: false
    Assistant:
      allOf:
        - {$ref: '#/components/schemas/AssistantDefinition'}
        - type: object
          required: [id, object, created_at, model, name, description, instructions, tools, metadata]
          properties:
            id: {type: string}
            object: {type: string, const: assistant}
            created_at: {type: integer}
    AssistantList:
      type: object
      additionalProperties: false
      required: [object, data, has_more]
      properties:
        object: {type: string, const: list}
        data: {type: array, items: {$ref: '#/components/schemas/Assistant'}}
        has_more: {type: boolean}
        first_id: {type: string}
        last_id: {type: string}
    AssistantDeletion:
      type: object
      additionalProperties: false
      required: [id, object, deleted]
      properties:
        id: {type: string}
        object: {type: string, const: assistant.deleted}
        deleted: {type: boolean, const: true}
    AssistantThreadDefinition:
      type: object
      properties:
        tool_resources: {type: object, additionalProperties: true}
        metadata: {type: object, maxProperties: 16, additionalProperties: {type: string, maxLength: 512}}
    AssistantThreadCreateRequest:
      allOf:
        - {$ref: '#/components/schemas/AssistantThreadDefinition'}
        - type: object
          properties:
            messages: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AssistantMessageCreateRequest'}}
      unevaluatedProperties: false
    AssistantThreadUpdateRequest:
      allOf:
        - {$ref: '#/components/schemas/AssistantThreadDefinition'}
        - type: object
          minProperties: 1
      unevaluatedProperties: false
    AssistantThread:
      allOf:
        - {$ref: '#/components/schemas/AssistantThreadDefinition'}
        - type: object
          required: [id, object, created_at, tool_resources, metadata]
          properties:
            id: {type: string}
            object: {type: string, const: thread}
