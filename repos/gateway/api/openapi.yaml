  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [Inference]
      summary: Create a chat completion
      description: |
        Supports function tools, structured outputs, SSE streaming, and bounded
        inline image input. Vision requests accept at most 8 JPEG, PNG, GIF, or
        WebP data URLs, at most 8 MiB decoded each and 16 MiB decoded total.
        Remote image URLs are rejected. The native Cohere adapter supports
        text-only JSON, function tools, and native or buffered SSE with
        provider-reported usage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              text:
                value:
                  model: gpt-5-mini
                  messages:
                    - role: user
                      content: Explain atomic rate limiting briefly.
              vision:
                value:
                  model: vision-model
                  messages:
                    - role: user
                      content:
                        - type: text
                          text: Describe this image.
                        - type: image_url
                          image_url:
                            url: data:image/png;base64,iVBORw0KGgo=
                            detail: auto
      responses:
        '200':
          description: Completion JSON or an SSE stream when `stream=true`
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: 'OpenAI-compatible `data:` events terminated by `data: [DONE]`.'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
  /v1/completions:
    post:
      operationId: createCompletion
      tags: [Inference]
      summary: Create a text completion
      description: Supports string/list and token-ID prompts with native completion parameters on adapters that expose a completions operation. Streaming is incremental when the selected adapter exposes native SSE; otherwise the bounded JSON result is replayed as compatible SSE after billing and post-processing.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompletionRequest'}
            example:
              model: gpt-3.5-turbo-instruct
              prompt: Complete this sentence
              max_tokens: 16
      responses:
        '200':
          description: Text completion JSON, native SSE, or buffered SSE fallback when `stream=true`
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompletionResponse'}
            text/event-stream:
              schema:
                type: string
                description: 'Text completion `data:` events terminated by `data: [DONE]`.'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
  /v1/responses:
    post:
      operationId: createResponse
      tags: [Inference]
      summary: Create a Responses API response
      description: Supports function tools, explicitly scoped MCP connectors, provider-managed code interpreter and file search, structured output, previous-response affinity, SSE, durable background execution, inline images and bounded inline PDF file_data. Code interpreter files and file-search vector stores must belong to the authenticated credential and user; routing requires explicit code_interpreter or file_search deployment capabilities. PDF bytes are signature-validated, projected to configured scanners and require an explicit file_input deployment capability. Background requests require store=true, stream=false, and an explicit background_responses deployment capability; billing settlement is resumed from PostgreSQL after process restarts. MCP definitions are forwarded to an upstream provider that must support remote MCP; the gateway does not execute MCP calls. Routing requires explicit mcp capability. Tool authorization checks connector identity (label and canonical URL), not individual remote tool names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseRequest'
            examples:
              text:
                value:
                  model: gpt-5-mini
                  input: Summarize the release notes.
              mcp:
                value:
                  model: gpt-5-mini
                  input: Check the weather.
                  tools:
                    - type: mcp
                      server_label: weather-prod
                      server_url: https://mcp.example.test
      responses:
        '200':
          description: Completed response JSON, queued background response JSON, or an SSE stream when `stream=true`
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseResponse'
            text/event-stream:
              schema:
                type: string
                description: 'Named Responses API events terminated by `data: [DONE]`.'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
        '503':
          description: Required response affinity, ownership, or background job storage is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/interactions:
    post:
      operationId: createInteraction
      tags: [Inference]
      summary: Create a model interaction
      description: Uses a native model interaction adapter when the selected deployment declares the interactions capability; otherwise converts the request to the Responses execution pipeline. The native Gemini path supports synchronous, incremental SSE, and durable background model or agent interactions, optional durable ownership for store=true, owner-isolated continuity through previous_interaction_id, retrieve/cancel/delete lifecycle calls, string or step-array input, system instructions, function tools, structured response formats, text and JSON response MIME normalization, and bounded generation settings including seed, stop sequences, and thinking level. Agent requests require the interaction_agents deployment capability and use the configured agent ID as the gateway authorization, quota, routing, and billing model key. An existing native environment can be reused only when its ID was returned by the owner-isolated previous interaction and the deployment declares interaction_environment_reuse. Native background requests require background_interactions and durable job storage. Their usage and billing settle only after the provider reaches a terminal state. Continuations remain pinned to the immutable deployment binding of the previous interaction. The terminal streaming completion event and stored ownership binding are released only after post-processing succeeds. The Responses bridge retains its synchronous, incremental SSE, durable background, continuity, and storage behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionRequest'
      responses:
        '200':
          description: Completed, queued, failed, or incomplete interaction JSON, or named interaction SSE events when stream=true
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionResponse'
            text/event-stream:
              schema:
                type: string
                description: Named interaction and step events terminated by a named done event containing `[DONE]`.
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
        '503':
          description: Required response affinity, policy, ownership, or background job storage is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/interactions/{id}:
    get:
      operationId: retrieveInteraction
      tags: [Inference]
      summary: Retrieve a stored interaction
      description: Resolves the authenticated owner's immutable deployment binding and rechecks current model policy before reading the durable resource. Retrieval does not create inference usage or billing.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, maxLength: 256}}
      responses:
        '200':
          description: Stored interaction
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InteractionResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: The interaction does not exist for the authenticated owner.
          content:
            application/json:
