  /v1/videos:
    post:
      operationId: createVideo
      tags: [Inference]
      summary: Create an owner-scoped video generation job
      description: Selects a video-capable deployment, reserves the requested duration against billing, and atomically stores its exact deployment binding with a durable settlement job. A background worker commits completed jobs and cancels failed jobs with leased, idempotent retries across process restarts.
