  /v1/search:
    post:
      operationId: search
      tags: [Inference]
      summary: Execute a standalone search through an explicitly capable deployment
      description: Applies strict JSON validation, query content policy, model authorization, RPM/TPM admission, bounded response validation, retries and exact search-unit settlement.
