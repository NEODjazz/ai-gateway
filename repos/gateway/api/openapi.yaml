openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AI Gateway API
  version: 0.1.14
  description: |
    OpenAI-compatible inference API and administrative virtual-key API.
    Authentication, routing, guardrails, anonymization, billing, caching, and
    provider failover are performed by the gateway.
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same-origin gateway
tags:
  - name: Inference
  - name: Models
  - name: Virtual keys
  - name: Identity
  - name: Model deployments
  - name: Guardrails
  - name: MCP
  - name: Projects and access
  - name: Caching and logging
  - name: Agent templates
  - name: Customers
  - name: Organizations
  - name: AI Hub
  - name: Cost optimization
  - name: Operations
  - name: Observability
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Process liveness
      security: []
      responses:
        '204':
          description: Gateway process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
  /readyz:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Required dependency readiness
      security: []
      responses:
        '204':
          description: Required dependencies are ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /metrics:
    get:
      operationId: getMetrics
      tags: [Operations]
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /v1/models:
    get:
      operationId: listModels
      tags: [Models]
      summary: List models allowed for the authenticated credential
      responses:
        '200':
          description: Model list filtered by credential policy
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ModuleFailed'
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [Inference]
      summary: Create a chat completion
      description: |
        Supports function tools, structured outputs, SSE streaming, and bounded
        inline image input. Vision requests accept at most 8 JPEG, PNG, GIF, or
        WebP data URLs, at most 8 MiB decoded each and 16 MiB decoded total.
        Remote image URLs are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              text:
                value:
                  model: gpt-5-mini
                  messages:
                    - role: user
                      content: Explain atomic rate limiting briefly.
              vision:
                value:
                  model: vision-model
                  messages:
                    - role: user
                      content:
                        - type: text
                          text: Describe this image.
                        - type: image_url
                          image_url:
                            url: data:image/png;base64,iVBORw0KGgo=
                            detail: auto
      responses:
        '200':
          description: Completion JSON or an SSE stream when `stream=true`
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: 'OpenAI-compatible `data:` events terminated by `data: [DONE]`.'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
  /v1/responses:
    post:
      operationId: createResponse
      tags: [Inference]
      summary: Create a Responses API response
      description: Supports function tools, explicitly scoped MCP connectors, structured output, previous-response affinity, SSE, and inline images.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseRequest'
            examples:
              text:
                value:
                  model: gpt-5-mini
                  input: Summarize the release notes.
              mcp:
                value:
                  model: gpt-5-mini
                  input: Check the weather.
                  tools:
                    - type: mcp
                      server_label: weather-prod
                      server_url: https://mcp.example.test
      responses:
        '200':
          description: Response JSON or an SSE stream when `stream=true`
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseResponse'
            text/event-stream:
              schema:
                type: string
                description: 'Named Responses API events terminated by `data: [DONE]`.'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
  /v1/embeddings:
    post:
      operationId: createEmbeddings
      tags: [Inference]
      summary: Create float embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
            example:
              model: text-embedding-model
              input: Text to embed
              encoding_format: float
      responses:
        '200':
          description: Embedding vectors
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
  /v1/rerank:
    post:
      operationId: rerankDocuments
      tags: [Inference]
      summary: Rank documents by relevance to a query
      description: LiteLLM/Cohere-compatible rerank request routed to an explicitly rerank-capable provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RerankRequest'}
            example:
              model: rerank-model
              query: Which document is about refunds?
              documents: [Shipping takes two days., Refunds are available for 30 days.]
              top_n: 1
              return_documents: true
      responses:
        '200':
          description: Documents ranked by provider relevance score
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RerankResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
  /admin/v1/keys:
    get:
      operationId: listVirtualKeys
      tags: [Virtual keys]
      summary: List virtual key metadata
      description: Requires the `admin` role. Returns policy and lifecycle metadata only; plaintext tokens and token hashes are never exposed.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Safe virtual key metadata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/VirtualKeyMetadata'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    post:
      operationId: createVirtualKey
      tags: [Virtual keys]
      summary: Create a virtual key
      description: Requires an authenticated credential with the `admin` role. The plaintext token is returned exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualKeyPolicy'
      responses:
        '201':
          description: Virtual key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedVirtualKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
  /admin/v1/keys/{id}/rotate:
    post:
      operationId: rotateVirtualKey
      tags: [Virtual keys]
      summary: Rotate a virtual key
      description: Creates a linked replacement and revokes the previous key atomically.
      parameters:
        - $ref: '#/components/parameters/VirtualKeyID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualKeyPolicy'
      responses:
        '201':
          description: Replacement virtual key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedVirtualKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
  /admin/v1/keys/{id}:
    put:
      operationId: updateVirtualKey
      tags: [Virtual keys]
      summary: Update a virtual key policy without changing its secret
      parameters: [{$ref: '#/components/parameters/VirtualKeyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VirtualKeyPolicy'}
      responses:
        '204': {description: Virtual key policy updated}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: revokeVirtualKey
      tags: [Virtual keys]
      summary: Revoke a virtual key
      parameters:
        - $ref: '#/components/parameters/VirtualKeyID'
      responses:
        '204':
          description: Virtual key revoked
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
  /admin/v1/keys/{id}/disable:
    post:
      operationId: disableVirtualKey
      tags: [Virtual keys]
      summary: Temporarily disable a virtual key
      parameters: [{$ref: '#/components/parameters/VirtualKeyID'}]
      responses:
        '204': {description: Virtual key disabled}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/keys/{id}/enable:
    post:
      operationId: enableVirtualKey
      tags: [Virtual keys]
      summary: Re-enable a disabled virtual key
      parameters: [{$ref: '#/components/parameters/VirtualKeyID'}]
      responses:
        '204': {description: Virtual key enabled}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/users:
    get:
      operationId: listDirectoryUsers
      tags: [Identity]
      summary: List users visible to the admin scope
      parameters:
        - {name: team_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200':
          description: Directory users
          content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/DirectoryUser'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/users/{id}:
    put:
      operationId: putDirectoryUser
      tags: [Identity]
      summary: Create or update a directory user
      parameters: [{$ref: '#/components/parameters/DirectoryUserPathID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryUserInput'}}}}
      responses:
        '200': {description: User saved, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryUser'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/teams:
    get:
      operationId: listDirectoryTeams
      tags: [Identity]
      summary: List teams visible to the admin scope
      parameters:
        - {name: team_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Directory teams, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/DirectoryTeam'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/teams/{id}:
    put:
      operationId: putDirectoryTeam
      tags: [Identity]
      summary: Create or update a team
      parameters: [{$ref: '#/components/parameters/DirectoryTeamID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryTeamInput'}}}}
      responses:
        '200': {description: Team saved, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryTeam'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/teams/{id}/members/{user_id}:
    put:
      operationId: putTeamMembership
      tags: [Identity]
      summary: Add or update a scoped team membership
      parameters:
        - {$ref: '#/components/parameters/DirectoryTeamID'}
        - {$ref: '#/components/parameters/DirectoryUserID'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TeamMembershipInput'}}}}
      responses:
        '200': {description: Membership saved, content: {application/json: {schema: {$ref: '#/components/schemas/TeamMembership'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/organizations:
    get:
      operationId: listOrganizations
      tags: [Organizations]
      summary: List persistent organizations and assigned teams
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}]
      responses:
        '200': {description: Organizations, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/Organization'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/organizations/{id}:
    put:
      operationId: putOrganization
      tags: [Organizations]
      summary: Create or update an organization
      parameters: [{$ref: '#/components/parameters/OrganizationID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationInput'}}}}
      responses:
        '200': {description: Organization saved, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/organizations/{id}/teams/{team_id}:
    put:
      operationId: putOrganizationTeam
      tags: [Organizations]
      summary: Assign a team to an organization
      parameters:
        - {$ref: '#/components/parameters/OrganizationID'}
        - {$ref: '#/components/parameters/OrganizationTeamID'}
      responses:
        '200': {description: Team assigned, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/ai-hub/models:
    get:
      operationId: getAIHubModels
      tags: [AI Hub]
      summary: Join model catalog metadata with safe runtime availability
      description: Provider URLs, API keys, and secret references are never returned.
      responses:
        '200': {description: AI Hub models, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/AIHubModel'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/cost-optimization/recommendations:
    get:
      operationId: getCostRecommendations
      tags: [Cost optimization]
      summary: Get deterministic catalog and availability recommendations
      description: Savings compare catalog input plus output prices for the same model and currency. They are not usage projections.
      responses:
        '200': {description: Cost recommendations, content: {application/json: {schema: {$ref: '#/components/schemas/CostRecommendationResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-deployments:
    get:
      operationId: listModelDeployments
      tags: [Model deployments]
      summary: List safe runtime deployment metadata
      description: Endpoint URLs and secret values are never returned. Credential IDs are non-secret references.
      responses:
        '200': {description: Runtime deployments, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/ModelDeployment'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    post:
      operationId: createModelDeployment
      tags: [Model deployments]
      summary: Create a runtime model deployment
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelDeploymentInput'}}}}
      responses:
        '201': {description: Runtime deployment created, content: {application/json: {schema: {$ref: '#/components/schemas/ModelDeployment'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-deployments/{id}:
    put:
      operationId: updateModelDeployment
      tags: [Model deployments]
      summary: Atomically update runtime routing metadata for a preconfigured endpoint
      parameters: [{$ref: '#/components/parameters/ModelDeploymentID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelDeploymentInput'}}}}
      responses:
        '200': {description: Runtime deployment updated, content: {application/json: {schema: {$ref: '#/components/schemas/ModelDeployment'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: deleteModelDeployment
      tags: [Model deployments]
      summary: Delete an unused runtime model deployment
      parameters: [{$ref: '#/components/parameters/ModelDeploymentID'}]
      responses:
        '204': {description: Deployment deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-deployments/{id}/test:
    post:
      operationId: testModelDeployment
      tags: [Model deployments]
      summary: Test a deployment with its configured credential and upstream model
      description: Runs a minimal model request without optional generation parameters. Only bounded diagnostic metadata is retained; prompts, responses, credentials, and raw provider errors are excluded.
      parameters: [{$ref: '#/components/parameters/ModelDeploymentID'}]
      responses:
        '200': {description: Completed health check, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentHealthCheck'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-deployments/{id}/health:
    get:
      operationId: listModelDeploymentHealth
      tags: [Model deployments]
      summary: List recent sanitized deployment health checks
      description: History is runtime operational data and is bounded to the latest 50 checks per deployment.
      parameters:
        - {$ref: '#/components/parameters/ModelDeploymentID'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200': {description: Recent health checks, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/DeploymentHealthCheck'}}}}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/providers:
    get:
      operationId: listManagedProviders
      tags: [Providers]
      summary: List managed provider endpoints without credentials
      responses:
        '200': {description: Providers, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/ManagedProvider'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
    post:
      operationId: createManagedProvider
      tags: [Providers]
      summary: Create a managed provider endpoint
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedProvider'}}}}
      responses:
        '201': {description: Provider created, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedProvider'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
  /admin/v1/providers/{id}:
    put:
      operationId: updateManagedProvider
      tags: [Providers]
      summary: Update a managed provider endpoint
      parameters: [{$ref: '#/components/parameters/ModelDeploymentID'}]
