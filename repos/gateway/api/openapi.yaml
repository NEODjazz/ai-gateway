        finish_reason: {type: string}
        index: {type: integer, minimum: 0, maximum: 127}
        logprobs:
          oneOf:
            - {$ref: '#/components/schemas/CompletionLogprobs'}
            - type: 'null'
        text: {type: string}
    CompletionResponse:
      type: object
      additionalProperties: false
      required: [id, object, created, model, choices, usage]
      properties:
        id: {type: string, minLength: 1, maxLength: 512}
        object: {type: string, const: text_completion}
        created: {type: integer, minimum: 0}
        model: {type: string, minLength: 1}
        choices:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/CompletionChoice'}
        system_fingerprint: {type: string}
        usage: {$ref: '#/components/schemas/Usage'}
    ChoiceLogprobs:
      type: object
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/TokenLogprob'}
        refusal:
          type: array
          items: {$ref: '#/components/schemas/TokenLogprob'}
    TopLogprob:
      type: object
      required: [token, logprob, bytes]
      properties:
        token: {type: string}
        logprob: {type: number}
        bytes:
          oneOf:
            - type: 'null'
            - type: array
              items: {type: integer}
    TokenLogprob:
      allOf:
        - {$ref: '#/components/schemas/TopLogprob'}
        - type: object
          properties:
            top_logprobs:
              type: array
              items: {$ref: '#/components/schemas/TopLogprob'}
    Choice:
      type: object
      required: [index, message, finish_reason]
      properties:
        index: {type: integer, minimum: 0}
        message: {$ref: '#/components/schemas/Message'}
        finish_reason: {type: string}
        stop_sequence: {type: string, description: Exact matched sequence when reported by the provider}
        logprobs: {$ref: '#/components/schemas/ChoiceLogprobs'}
    ChatCompletionResponse:
      type: object
      required: [id, object, model, choices, usage]
      properties:
        id: {type: string}
        object: {type: string, const: chat.completion}
        created: {type: integer, format: int64, minimum: 0}
        model: {type: string}
        metadata:
          type: object
          maxProperties: 16
          propertyNames: {maxLength: 64}
          additionalProperties: {type: string, maxLength: 512}
        service_tier: {type: string}
        system_fingerprint: {type: string}
        choices:
          type: array
          items: {$ref: '#/components/schemas/Choice'}
        usage: {$ref: '#/components/schemas/Usage'}
    FunctionResponseTool:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type: {type: string, const: function}
        name: {type: string, minLength: 1}
        description: {type: string}
        parameters:
          type: object
          additionalProperties: true
        strict: {type: boolean}
    CustomResponseTool:
      type: object
      description: Provider-executed custom tool whose output is constrained as plain text or by a Lark/regex grammar. Gateway authorization uses the tool name, and routing requires an explicit custom_tools deployment capability.
      additionalProperties: false
      required: [type, name]
      properties:
        type: {type: string, const: custom}
        name: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
        description: {type: string, maxLength: 4096}
        format:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type]
              properties:
                type: {type: string, const: text}
            - type: object
              additionalProperties: false
              required: [type, syntax, definition]
              properties:
                type: {type: string, const: grammar}
                syntax: {type: string, enum: [lark, regex]}
                definition: {type: string, minLength: 1, maxLength: 65536}
    ImageGenerationResponseTool:
      type: object
      description: Provider-hosted image generation within a Responses request. Routing requires the explicit response_image_generation deployment capability. A mask file must belong to the authenticated credential and user.
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, const: image_generation}
        action: {type: string, enum: [generate, edit, auto]}
        background: {type: string, enum: [transparent, opaque, auto]}
        input_fidelity: {type: string, enum: [high, low]}
        input_image_mask:
          type: object
          additionalProperties: false
          minProperties: 1
          maxProperties: 1
          properties:
            file_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
            image_url: {type: string, description: Base64 data image URL, maxLength: 33554432}
        model: {type: string, maxLength: 256}
        moderation: {type: string, enum: [auto, low]}
        output_compression: {type: integer, minimum: 0, maximum: 100}
        output_format: {type: string, enum: [png, webp, jpeg]}
        partial_images: {type: integer, minimum: 0, maximum: 3}
        quality: {type: string, enum: [low, medium, high, auto]}
        size: {type: string, description: auto or WIDTHxHEIGHT; dimensions must be divisible by 16 and have an aspect ratio from 1:3 to 3:1.}
    ComputerResponseTool:
      type: object
      description: Provider computer interaction tool. Gateway authorization uses the computer grant, and routing requires an explicit response_computer deployment capability.
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, const: computer}
    ShellResponseTool:
      type: object
      description: Provider shell tool. Gateway authorization uses the shell grant, routing requires an explicit response_shell deployment capability, and tenant-owned resources are checked before provider execution. The gateway never executes commands itself.
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, const: shell}
        allowed_callers:
          type: array
          maxItems: 1
          uniqueItems: true
          items: {type: string, const: direct}
        environment:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type]
              properties:
                type: {type: string, const: local}
            - type: object
              additionalProperties: false
              required: [type, container_id]
              properties:
                type: {type: string, const: container_reference}
                container_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
            - type: object
              additionalProperties: false
              required: [type]
              properties:
                type: {type: string, const: container_auto}
                memory_limit: {type: string, enum: [1g, 4g, 16g, 64g]}
                file_ids:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    ShellCallOutput:
      type: object
      description: Captured output from a client-executed shell call. Text is included in token accounting and input policy processing.
      additionalProperties: false
      required: [type, call_id, output]
      properties:
        type: {type: string, const: shell_call_output}
        id: {type: string, minLength: 1, maxLength: 512}
        call_id: {type: string, minLength: 1, maxLength: 512}
        created_by: {type: string, minLength: 1, maxLength: 512}
        max_output_length: {type: integer, minimum: 1, maximum: 8388608}
        status: {type: string, enum: [in_progress, completed, incomplete]}
        caller:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, const: direct}
        output:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [stdout, stderr, outcome]
            properties:
              stdout: {type: string}
              stderr: {type: string}
              outcome:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [type]
                    properties:
                      type: {type: string, const: timeout}
                  - type: object
                    additionalProperties: false
                    required: [type, exit_code]
                    properties:
                      type: {type: string, const: exit}
                      exit_code: {type: integer, format: int64}
    ComputerCallOutput:
      type: object
      description: Result of executing a provider-requested computer action. A gateway file_id is resolved only after authentication and must belong to the same credential and user.
      additionalProperties: false
      required: [type, call_id, output]
      properties:
        type: {type: string, const: computer_call_output}
        id: {type: string, maxLength: 512}
        call_id: {type: string, minLength: 1, maxLength: 512}
        status: {type: string, enum: [in_progress, completed, incomplete]}
        output:
          type: object
          additionalProperties: false
          required: [type]
          minProperties: 2
          maxProperties: 3
          oneOf:
            - required: [file_id]
              not: {required: [image_url]}
            - required: [image_url]
              not: {required: [file_id]}
          properties:
            type: {type: string, const: computer_screenshot}
            file_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
            image_url: {type: string, description: Base64 data image URL, maxLength: 33554432}
            detail: {type: string, enum: [auto, low, high, original]}
        acknowledged_safety_checks:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: {type: string, minLength: 1, maxLength: 512}
              code: {type: string, maxLength: 2048}
              message: {type: string, maxLength: 2048}
    MCPResponseTool:
      type: object
      description: Remote connector forwarded to the selected provider for execution. This does not reference or automatically load a registry entry. Gateway authorization checks mcp:<server_label>@<canonical-https-url>; the provider enforces connector-level allowed_tools and require_approval.
      additionalProperties: false
      required: [type, server_label, server_url]
      properties:
        type: {type: string, const: mcp}
        server_label: {type: string, minLength: 1}
        server_url:
          type: string
          format: uri
          pattern: '^https://'
        server_description: {type: string}
        allowed_tools:
          type: array
          maxItems: 128
          uniqueItems: true
          items: {type: string, minLength: 1}
        require_approval: {}
        headers:
          type: object
          additionalProperties: {type: string}
          description: Provider-scoped connector headers. Client bearer is never injected.
    CodeInterpreterResponseTool:
      type: object
      description: Provider-managed code execution with a new automatic container. Referenced files must belong to the authenticated credential and user.
      additionalProperties: false
      required: [type, container]
      properties:
        type: {type: string, const: code_interpreter}
        container:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
              pattern: '^[A-Za-z0-9_.-]+$'
              description: Owner-scoped gateway container ID. Execution remains pinned to its original deployment.
            - type: object
              additionalProperties: false
              required: [type]
              properties:
                type: {type: string, const: auto}
                memory_limit: {type: string, enum: [1g, 4g, 16g, 64g]}
                file_ids:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
    FileSearchResponseTool:
      type: object
      description: Provider-managed search over one vector store owned by the authenticated credential and user.
      additionalProperties: false
      required: [type, vector_store_ids]
      properties:
        type: {type: string, const: file_search}
        vector_store_ids:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
        filters: {$ref: '#/components/schemas/ResponseFileSearchFilter'}
        max_num_results: {type: integer, minimum: 1, maximum: 50}
        rewrite_query: {type: boolean}
        ranking_options:
          type: object
          additionalProperties: false
          properties:
            ranker: {type: string, minLength: 1, maxLength: 128}
            score_threshold: {type: number, minimum: 0, maximum: 1}
            hybrid_search:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                embedding_weight: {type: number, minimum: 0, maximum: 1}
                text_weight: {type: number, minimum: 0, maximum: 1}
    WebSearchResponseTool:
      type: object
      description: Provider-managed web search. Gateway authorization uses the canonical web_search tool grant, and routing requires an explicit web_search deployment capability.
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [web_search, web_search_2025_08_26]}
        filters:
          type: object
          additionalProperties: false
          properties:
            allowed_domains:
              type: array
              maxItems: 20
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 253}
        search_context_size: {type: string, enum: [low, medium, high]}
        user_location: {$ref: '#/components/schemas/ResponseWebSearchUserLocation'}
    WebSearchPreviewResponseTool:
      type: object
      description: Legacy provider-managed web search contract retained for compatible upstream deployments.
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [web_search_preview, web_search_preview_2025_03_11]}
        search_context_size: {type: string, enum: [low, medium, high]}
        user_location: {$ref: '#/components/schemas/ResponseWebSearchUserLocation'}
    ResponseWebSearchUserLocation:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, const: approximate}
        city: {type: string, maxLength: 128}
        country: {type: string, pattern: '^[A-Z]{2}$'}
        region: {type: string, maxLength: 128}
        timezone: {type: string, maxLength: 128}
    ResponseFileSearchFilter:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, key, value]
          properties:
            type: {type: string, enum: [eq, ne, gt, gte, lt, lte, in, nin]}
            key: {type: string, minLength: 1, maxLength: 64}
            value: {}
        - type: object
          additionalProperties: false
          required: [type, filters]
          properties:
            type: {type: string, enum: [and, or]}
            filters:
              type: array
              minItems: 1
              maxItems: 16
              items: {$ref: '#/components/schemas/ResponseFileSearchFilter'}
    ResponseInputMessage:
      type: object
      additionalProperties: true
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant]}
        content:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/TextContentPart'
              - $ref: '#/components/schemas/InputImageContentPart'
    ResponseRequest:
      description: Supply at most one non-null output limit, max_output_tokens or max_tokens.
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        metadata:
          type: object
          maxProperties: 16
          propertyNames: {maxLength: 64}
          additionalProperties: {type: string, maxLength: 512}
        reasoning:
          type: object
          additionalProperties: false
          properties:
            effort: {type: string, enum: [none, minimal, low, medium, high, xhigh, max, default]}
            summary: {type: string, enum: [auto, concise, detailed]}
            generate_summary: {type: string, enum: [auto, concise, detailed], deprecated: true}
            context: {type: string, enum: [auto, current_turn, all_turns]}
            mode: {type: string, minLength: 1, maxLength: 128}
        top_logprobs: {type: integer, minimum: 0, maximum: 20}
        truncation: {type: string, enum: [auto, disabled]}
        store: {type: boolean}
        include:
          type: array
          maxItems: 7
          uniqueItems: true
          items:
            type: string
            enum: [web_search_call.action.sources, code_interpreter_call.outputs, computer_call_output.output.image_url, file_search_call.results, message.input_image.image_url, message.output_text.logprobs, reasoning.encrypted_content]
        provider: {type: string}
        model: {type: string, minLength: 1}
        input:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              items:
                oneOf:
                  - {$ref: '#/components/schemas/ResponseInputMessage'}
                  - {$ref: '#/components/schemas/TextContentPart'}
                  - {$ref: '#/components/schemas/InputImageContentPart'}
                  - {$ref: '#/components/schemas/ComputerCallOutput'}
                  - {$ref: '#/components/schemas/ShellCallOutput'}
                  - type: object
                    additionalProperties: true
        instructions: {type: string}
        tools:
          type: array
          maxItems: 128
          items:
            oneOf:
              - $ref: '#/components/schemas/FunctionResponseTool'
              - $ref: '#/components/schemas/CustomResponseTool'
              - $ref: '#/components/schemas/ImageGenerationResponseTool'
              - $ref: '#/components/schemas/ComputerResponseTool'
              - $ref: '#/components/schemas/ShellResponseTool'
              - $ref: '#/components/schemas/MCPResponseTool'
              - $ref: '#/components/schemas/CodeInterpreterResponseTool'
              - $ref: '#/components/schemas/FileSearchResponseTool'
              - $ref: '#/components/schemas/WebSearchResponseTool'
              - $ref: '#/components/schemas/WebSearchPreviewResponseTool'
        tool_choice: {}
        parallel_tool_calls: {type: boolean}
        text:
          type: object
          additionalProperties: false
          properties:
            format: {type: object, additionalProperties: true}
            verbosity: {type: string, enum: [low, medium, high]}
        previous_response_id: {type: string}
        user: {type: string, description: Provider-specific end-user isolation identifier; compatible adapters forward it and native adapters reject or validate it according to their contract.}
        safety_identifier: {type: string, maxLength: 64}
        prompt_cache_key: {type: string}
        prompt_cache_options:
          type: object
          additionalProperties: false
          properties:
            mode: {type: string, enum: [implicit, explicit]}
            ttl: {type: string, const: 30m}
            comparison_response_id:
              type: string
              maxLength: 256
              description: Must reference a recent response owned by the same credential and user; the gateway pins execution to that response's deployment and rejects missing, cross-owner or conflicting references.
        prompt_cache_retention: {type: string, enum: [in_memory, 24h], deprecated: true}
        service_tier: {type: string, enum: [auto, default, on_demand, flex, performance, scale, priority, fast, ultrafast, standard_only], description: Forwarded by compatible adapters; native adapters may reject it.}
        stream: {type: boolean, default: false}
        stream_options:
          type: object
          additionalProperties: false
          description: Responses streaming controls. Accepted only when stream is true and only by adapters that advertise this option.
          properties:
            include_obfuscation: {type: boolean, default: true}
        max_output_tokens: {type: integer, minimum: 1}
        max_tokens: {type: integer, minimum: 1}
        temperature: {type: number}
        top_p: {type: number}
        frequency_penalty: {type: number, minimum: -2, maximum: 2}
        presence_penalty: {type: number, minimum: -2, maximum: 2}
        max_tool_calls: {type: integer, minimum: 0, maximum: 1000}
    InteractionGenerationConfig:
      type: object
      additionalProperties: false
      properties:
        max_output_tokens: {type: integer, minimum: 1}
        temperature: {type: number, minimum: 0, maximum: 2}
        top_p: {type: number, minimum: 0, maximum: 1}
        seed: {type: integer, minimum: -2147483648, maximum: 2147483647, description: Supported by compatible native interaction adapters.}
        stop_sequences:
          type: array
          maxItems: 5
          items: {type: string}
          description: Supported by compatible native interaction adapters.
        thinking_level: {type: string, enum: [minimal, low, medium, high], description: Supported by compatible native interaction adapters.}
    InteractionRequest:
      type: object
      additionalProperties: false
      required: [input]
      oneOf:
        - required: [model]
          not: {required: [agent]}
        - required: [agent]
          not: {required: [model]}
      properties:
        provider: {type: string}
        model: {type: string, minLength: 1}
        agent: {type: string, minLength: 1, description: Native provider agent ID. The deployment must list this ID as a model and declare interaction_agents.}
        environment: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_.:-]+$', description: "Existing native environment ID returned by the owner-isolated previous interaction. Requires agent, previous_interaction_id, and interaction_environment_reuse. Inline environment configuration is rejected."}
        input:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              items: {type: object, additionalProperties: true}
        system_instruction: {type: string}
        tools:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/FunctionResponseTool'}
        response_format: {}
        previous_interaction_id: {type: string, description: Requires an owner-isolated stored interaction and pins execution to its original deployment.}
        store: {type: boolean, description: Persists an owner-isolated resource when supported by the selected execution path.}
        stream: {type: boolean, default: false, description: Streams named interaction and step SSE events. Cannot be combined with background=true.}
        background: {type: boolean, default: false, description: Runs durably when true; store defaults to true and an explicit false is rejected.}
        generation_config: {$ref: '#/components/schemas/InteractionGenerationConfig'}
    InteractionResponseContent:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, const: text}
        text: {type: string}
    InteractionStep:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        id: {type: string}
        type: {type: string, enum: [model_output, function_call, thought]}
        name: {type: string}
        arguments: {}
        content:
          type: array
          items: {$ref: '#/components/schemas/InteractionResponseContent'}
    InteractionUsage:
      type: object
      additionalProperties: false
      properties:
        total_cached_tokens: {type: integer, minimum: 0}
        total_input_tokens: {type: integer, minimum: 0}
        total_output_tokens: {type: integer, minimum: 0}
        total_thought_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
    InteractionResponse:
      type: object
      additionalProperties: false
      required: [id, object, status]
      oneOf:
        - required: [model]
        - required: [agent]
      properties:
        id: {type: string}
        object: {type: string, const: interaction}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
        model: {type: string}
        agent: {type: string}
        environment_id: {type: string, description: Native environment ID bound to this stored interaction for owner-isolated continuation.}
        status: {type: string}
        steps:
          type: array
          items: {$ref: '#/components/schemas/InteractionStep'}
        usage: {$ref: '#/components/schemas/InteractionUsage'}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
        incomplete_details:
          type: object
          additionalProperties: false
          required: [reason]
          properties:
            reason: {type: string}
    ResponseInputTokenCountRequest:
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        provider: {type: string}
        model: {type: string, minLength: 1}
        input:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              items:
                oneOf:
                  - {$ref: '#/components/schemas/ResponseInputMessage'}
                  - {$ref: '#/components/schemas/TextContentPart'}
                  - {$ref: '#/components/schemas/InputImageContentPart'}
                  - {$ref: '#/components/schemas/ComputerCallOutput'}
                  - {$ref: '#/components/schemas/ShellCallOutput'}
                  - type: object
                    additionalProperties: true
        instructions: {type: string}
        tools:
          type: array
          maxItems: 128
          items:
            oneOf:
              - $ref: '#/components/schemas/FunctionResponseTool'
              - $ref: '#/components/schemas/CustomResponseTool'
              - $ref: '#/components/schemas/ImageGenerationResponseTool'
              - $ref: '#/components/schemas/ComputerResponseTool'
              - $ref: '#/components/schemas/ShellResponseTool'
              - $ref: '#/components/schemas/MCPResponseTool'
              - $ref: '#/components/schemas/CodeInterpreterResponseTool'
              - $ref: '#/components/schemas/FileSearchResponseTool'
              - $ref: '#/components/schemas/WebSearchResponseTool'
              - $ref: '#/components/schemas/WebSearchPreviewResponseTool'
        tool_choice: {}
        parallel_tool_calls: {type: boolean}
        text:
          type: object
          additionalProperties: false
          properties:
            format: {type: object, additionalProperties: true}
            verbosity: {type: string, enum: [low, medium, high]}
        previous_response_id: {type: string}
        reasoning:
          type: object
          additionalProperties: false
          properties:
            effort: {type: string, enum: [none, minimal, low, medium, high, xhigh, max, default]}
            summary: {type: string, enum: [auto, concise, detailed]}
            generate_summary: {type: string, enum: [auto, concise, detailed], deprecated: true}
            context: {type: string, enum: [auto, current_turn, all_turns]}
            mode: {type: string, minLength: 1, maxLength: 128}
        truncation: {type: string, enum: [auto, disabled]}
    ResponseInputTokenCount:
      type: object
      additionalProperties: false
      required: [object, input_tokens]
      properties:
        object: {type: string, const: response.input_tokens}
        input_tokens: {type: integer, minimum: 0}
    ResponseOutputContent:
      type: object
      required: [type]
      properties:
        logprobs:
          type: array
          items: {$ref: '#/components/schemas/TokenLogprob'}
        annotations:
          type: array
          items:
            oneOf:
              - type: object
                additionalProperties: true
              - type: 'null'
        type: {type: string}
        text: {type: string}
