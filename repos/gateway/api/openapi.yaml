      description: Selects a deployment that explicitly enables container operations, validates every file_id against the authenticated owner, reserves billing, creates the upstream resource, copies files through the pinned deployment, stores its owner and exact deployment binding durably, and commits billing before returning. Any failure after upstream creation compensates the upstream resource, local binding, and reservation.
