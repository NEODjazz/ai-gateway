      tags: [Vector stores]
      summary: Atomically ingest an owned file into a vector store
      description: Creates an inline UTF-8 document or uses an existing owner-scoped assistants file, creates a vector store or uses an existing owner-scoped store, and attaches the file in one durable transaction. Inline content is base64 encoded and limited to 1 MiB. Accepted formats are plain text, Markdown, CSV, and JSON. Remote URLs are not accepted. Retrieval-time embedding remains governed by the selected authorized embedding deployment.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RAGIngestRequest'}
      responses:
        '200':
          description: Atomically persisted file, vector store, and attachment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RAGIngestResponse'}
        default:
          description: Authentication, ownership, quota, validation, or durable storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/rag/query:
    post:
      operationId: queryRAG
      tags: [Inference]
      summary: Answer a Chat request with owner-scoped vector-store context
      description: Performs bounded semantic retrieval from one vector store owned by the authenticated credential and user, optionally reranks the retrieved excerpts, and injects them as untrusted JSON reference data into a Chat Completion request. Retrieval, reranking, and generation each enforce model authorization, content policy, RPM/TPM admission, routing, and an independent billing lifecycle. All Chat Completion request parameters are accepted alongside retrieval_config and rerank. Sync and SSE streaming responses use the Chat Completions wire contract.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RAGQueryRequest'}
      responses:
        '200':
          description: Chat Completion response or SSE stream
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatCompletionResponse'}
            text/event-stream:
              schema: {type: string}
        default:
          description: Authentication, ownership, content policy, model authorization, quota, provider, validation, or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/search:
    post:
      operationId: search
      tags: [Inference]
      summary: Execute a standalone search through an explicitly capable deployment
      description: Applies strict JSON validation, query content policy, model authorization, RPM/TPM admission, bounded response validation, retries and exact search-unit settlement.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200':
          description: Bounded search results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/sandbox/execute:
    post:
      operationId: executeSandboxCode
      tags: [Inference]
      summary: Execute code in an ephemeral isolated runtime
      description: Applies authentication, model and access-group policy, input content controls, RPM/TPM admission, deployment routing, retries, billing settlement and bounded output validation. The native adapter creates a runtime with network access denied by default, waits for readiness, executes one code block, limits the provider response to 10 MiB and attempts deletion with an independent cleanup deadline on every exit path. Execution endpoints outside the configured provider domain are rejected.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SandboxExecuteRequest'}
      responses:
        '200':
          description: Bounded code execution result after runtime cleanup
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SandboxExecutionResult'}
        default:
          description: Authentication, policy, quota, routing, provider, cleanup, or validation failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/mcp/servers/{id}/tools:
    get:
      operationId: listMCPServerTools
      tags: [MCP]
      summary: Discover tools from an enabled registered MCP server
      description: Authenticates the virtual key, enforces connector or tool-specific credential and access-group grants, consumes RPM admission, and records a durable zero-cost discovery lifecycle. Each request creates a bounded Streamable HTTP session and performs initialize followed by tools/list. Returned definitions are filtered through the server registry, credential and access-group policies. The gateway sends no client bearer token or stored credential to the MCP server. Legacy SSE registry entries are rejected.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
      responses:
        '200':
          description: Bounded page of validated MCP tool definitions
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPRuntimeToolPage'}
        default:
          description: Authentication, policy, rate-limit, billing, transport, or upstream failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/mcp/servers/{id}/tools/{tool}:
    post:
      operationId: callMCPServerTool
      tags: [MCP]
      summary: Execute a tool on an enabled registered MCP server
      description: Authenticates the virtual key, enforces connector and access-group grants, consumes RPM admission, requires a scoped idempotency key, writes a fail-closed durable audit attempt, and settles one external tool request through billing. The first execution and its bounded result are persisted in PostgreSQL for 24 hours; retries replay the stored HTTP response without invoking the tool or billing again. A concurrent retry receives 409 and a Retry-After header. The gateway sends no client bearer token or stored credential to the MCP server.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: tool, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}, description: "Visible ASCII key scoped to the authenticated credential, server and tool. Reusing it with different arguments returns 409."}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MCPToolCallRequest'}
      responses:
        '200':
          description: Bounded MCP tool result, or the exact persisted response for an idempotent retry
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPToolCallResult'}
        '409':
          description: The key is in progress or conflicts with different arguments
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        default:
          description: Authentication, policy, rate-limit, audit, billing, transport, persistence, or upstream failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/ocr:
    post:
      operationId: createOCR
      tags: [Inference]
      summary: Extract text and structured content from a document or image
      description: Routes to an explicitly OCR-capable native deployment. Applies strict document, page-selection and annotation validation, model authorization, RPM/TPM admission, bounded provider response validation, retries and exact processed-page settlement. Native Gemini accepts bounded inline PDF, PNG, JPEG and WebP data, requests schema-constrained page Markdown, verifies selected page indices and rejects unsupported remote documents and extraction controls before upstream execution. Inline data, including owner-scoped file references, is projected to configured antivirus scanning; annotation prompts are projected to text policy modules.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OCRRequest'}
      responses:
        '200':
          description: Bounded OCR result with exact processed-page usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OCRResponse'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
