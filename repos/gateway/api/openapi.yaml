    A2APart:
      type: object
      additionalProperties: false
      description: A2A 1.0 member-discriminated part. Supply text, structured JSON data, inline image/audio/MP4/WebM video/PDF bytes, or HTTPS media of the same types with one advertised mediaType. Binary input is signature-validated, bounded, scanner-projected, and routed only to deployments declaring the required media capability. Remote media are converted to validated inline bytes before durable storage.
      properties:
        text: {type: string}
        raw: {type: string, contentEncoding: base64}
        url: {type: string, format: uri, maxLength: 2048, pattern: '^https://', description: "Public HTTPS image, audio, MP4/WebM video, PDF, plain-text, Markdown, or CSV URL without credentials or fragment"}
        data: {description: Structured JSON value accepted with application/json mediaType}
        mediaType: {type: string, enum: [text/plain, text/markdown, text/csv, application/json, image/jpeg, image/png, image/gif, image/webp, audio/wav, audio/mpeg, application/pdf]}
        filename: {type: string, maxLength: 256, pattern: '^[^/\\\x00]+$'}
    A2AMessage:
      type: object
      additionalProperties: false
      required: [messageId, role, parts]
      properties:
        messageId: {type: string, minLength: 1, maxLength: 128}
        contextId: {type: string, maxLength: 128}
        taskId: {type: string, maxLength: 128, description: Existing durable task to continue}
        role: {type: string, enum: [ROLE_USER, ROLE_AGENT]}
        parts: {type: array, minItems: 1, maxItems: 1024, items: {$ref: '#/components/schemas/A2APart'}}
        metadata: {type: object, additionalProperties: true}
    A2AJSONRPCRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id: {oneOf: [{type: string}, {type: number}]}
        method: {type: string, enum: [SendMessage, SendStreamingMessage, SubscribeToTask, GetTask, ListTasks, CancelTask, CreateTaskPushNotificationConfig, GetTaskPushNotificationConfig, ListTaskPushNotificationConfigs, DeleteTaskPushNotificationConfig, GetExtendedAgentCard]}
        params:
          type: object
          additionalProperties: false
          properties:
            tenant: {type: string, description: Must equal the selected agent profile ID}
            id: {type: string, minLength: 1, maxLength: 128, description: Task ID for task operations or configuration ID for push notification configuration operations}
            taskId: {type: string, minLength: 1, maxLength: 128, description: Task ID for push notification configuration operations}
            url: {type: string, format: uri, maxLength: 2048, pattern: '^https://', description: Callback URL for CreateTaskPushNotificationConfig}
            token: {type: string, maxLength: 4096, description: Opaque callback validation token encrypted at rest}
            authentication:
              type: object
              additionalProperties: false
              required: [schemes, credentials]
              properties:
                schemes: {type: array, minItems: 1, maxItems: 1, items: {type: string, enum: [Bearer, Basic]}}
                credentials: {type: string, minLength: 1, maxLength: 4096}
            contextId: {type: string, maxLength: 128}
            status: {type: string, enum: [TASK_STATE_UNSPECIFIED, TASK_STATE_SUBMITTED, TASK_STATE_WORKING, TASK_STATE_COMPLETED, TASK_STATE_FAILED, TASK_STATE_CANCELED, TASK_STATE_INPUT_REQUIRED, TASK_STATE_REJECTED, TASK_STATE_AUTH_REQUIRED]}
            pageSize: {type: integer, minimum: 1, maximum: 100, default: 50}
            pageToken: {type: string, maxLength: 128}
            historyLength: {type: integer, minimum: 0, maximum: 100}
            includeArtifacts: {type: boolean, default: false}
            statusTimestampAfter: {type: string, format: date-time}
            message: {$ref: '#/components/schemas/A2AMessage'}
            configuration:
              type: object
              additionalProperties: false
              properties:
                acceptedOutputModes: {type: array, items: {type: string, const: text/plain}}
                returnImmediately: {type: boolean, description: Return an owner-scoped submitted or working task while durable background execution continues}
                pushNotificationConfig: {$ref: '#/components/schemas/A2APushNotificationConfig'}
    A2APushNotificationConfig:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}
        url: {type: string, format: uri, maxLength: 2048, pattern: '^https://', description: Public HTTPS callback URL without credentials or fragment}
        token: {type: string, maxLength: 4096, description: Opaque value delivered in X-A2A-Notification-Token and encrypted at rest}
        authentication:
          type: object
          additionalProperties: false
          required: [schemes, credentials]
          properties:
            schemes: {type: array, minItems: 1, maxItems: 1, items: {type: string, enum: [Bearer, Basic]}}
            credentials: {type: string, minLength: 1, maxLength: 4096, description: Static callback credential encrypted at rest}
    A2AJSONRPCResponse:
      type: object
      additionalProperties: false
      required: [jsonrpc, id]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id: {oneOf: [{type: string}, {type: number}, {type: "null"}]}
        result:
          oneOf:
            - type: object
              additionalProperties: false
              required: [message]
              properties: {message: {$ref: '#/components/schemas/A2AMessage'}}
            - type: object
              additionalProperties: false
              required: [task]
              properties: {task: {$ref: '#/components/schemas/A2ATask'}}
            - {$ref: '#/components/schemas/A2ATask'}
            - type: object
              additionalProperties: false
              required: [tasks, pageSize, totalSize]
              properties:
                tasks: {type: array, items: {$ref: '#/components/schemas/A2ATask'}}
                nextPageToken: {type: string}
                pageSize: {type: integer}
                totalSize: {type: integer}
            - {$ref: '#/components/schemas/A2ATaskPushNotificationConfig'}
            - type: object
              additionalProperties: false
              required: [configs, pageSize, totalSize]
              properties:
                configs: {type: array, items: {$ref: '#/components/schemas/A2ATaskPushNotificationConfig'}}
                nextPageToken: {type: string}
                pageSize: {type: integer}
                totalSize: {type: integer}
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: integer}
            message: {type: string}
    A2ATaskPushNotificationConfig:
      type: object
      additionalProperties: false
      required: [id, taskId, url, createdAt]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        taskId: {type: string, minLength: 1, maxLength: 128}
        url: {type: string, format: uri, pattern: '^https://'}
        token: {type: string, maxLength: 4096}
        authentication:
          type: object
          additionalProperties: false
          required: [schemes, credentials]
          properties:
            schemes: {type: array, minItems: 1, maxItems: 1, items: {type: string, enum: [Bearer, Basic]}}
            credentials: {type: string, minLength: 1, maxLength: 4096}
        createdAt: {type: string, format: date-time}
    A2ATask:
      type: object
      additionalProperties: false
      required: [id, contextId, status]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        contextId: {type: string, minLength: 1, maxLength: 128}
        status:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state: {type: string, enum: [TASK_STATE_UNSPECIFIED, TASK_STATE_SUBMITTED, TASK_STATE_WORKING, TASK_STATE_COMPLETED, TASK_STATE_FAILED, TASK_STATE_CANCELED, TASK_STATE_INPUT_REQUIRED, TASK_STATE_REJECTED, TASK_STATE_AUTH_REQUIRED]}
            timestamp: {type: string, format: date-time}
        artifacts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [artifactId, parts]
            properties:
              artifactId: {type: string, minLength: 1, maxLength: 128}
              parts: {type: array, minItems: 1, maxItems: 1024, items: {$ref: '#/components/schemas/A2APart'}}
        history: {type: array, items: {$ref: '#/components/schemas/A2AMessage'}}
    A2AAgentCard:
