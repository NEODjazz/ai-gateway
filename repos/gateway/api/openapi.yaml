openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AI Gateway API
  version: 0.1.5
  description: |
    OpenAI-compatible inference API and administrative virtual-key API.
    Authentication, routing, guardrails, anonymization, billing, caching, and
    provider failover are performed by the gateway.
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same-origin gateway
tags:
  - name: Inference
  - name: Models
  - name: Virtual keys
  - name: Identity
  - name: Operations
  - name: Observability
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Process liveness
      security: []
      responses:
        '204':
          description: Gateway process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
  /readyz:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Required dependency readiness
      security: []
      responses:
        '204':
          description: Required dependencies are ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /metrics:
    get:
      operationId: getMetrics
      tags: [Operations]
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /v1/models:
    get:
      operationId: listModels
      tags: [Models]
      summary: List models allowed for the authenticated credential
      responses:
        '200':
          description: Model list filtered by credential policy
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ModuleFailed'
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [Inference]
      summary: Create a chat completion
      description: |
        Supports function tools, structured outputs, SSE streaming, and bounded
        inline image input. Vision requests accept at most 8 JPEG, PNG, GIF, or
        WebP data URLs, at most 8 MiB decoded each and 16 MiB decoded total.
        Remote image URLs are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              text:
                value:
                  model: gpt-5-mini
                  messages:
                    - role: user
                      content: Explain atomic rate limiting briefly.
              vision:
                value:
                  model: vision-model
                  messages:
                    - role: user
                      content:
                        - type: text
                          text: Describe this image.
                        - type: image_url
                          image_url:
                            url: data:image/png;base64,iVBORw0KGgo=
                            detail: auto
      responses:
        '200':
          description: Completion JSON or an SSE stream when `stream=true`
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: 'OpenAI-compatible `data:` events terminated by `data: [DONE]`.'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
  /v1/responses:
    post:
      operationId: createResponse
      tags: [Inference]
      summary: Create a Responses API response
      description: Supports function tools, explicitly scoped MCP connectors, structured output, previous-response affinity, SSE, and inline images.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseRequest'
            examples:
              text:
                value:
                  model: gpt-5-mini
                  input: Summarize the release notes.
              mcp:
                value:
                  model: gpt-5-mini
                  input: Check the weather.
                  tools:
                    - type: mcp
                      server_label: weather-prod
                      server_url: https://mcp.example.test
      responses:
        '200':
          description: Response JSON or an SSE stream when `stream=true`
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseResponse'
            text/event-stream:
              schema:
                type: string
                description: 'Named Responses API events terminated by `data: [DONE]`.'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
  /v1/embeddings:
    post:
      operationId: createEmbeddings
      tags: [Inference]
      summary: Create float embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
            example:
              model: text-embedding-model
              input: Text to embed
              encoding_format: float
      responses:
        '200':
          description: Embedding vectors
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '451':
          $ref: '#/components/responses/ContentRejected'
        '502':
          $ref: '#/components/responses/ProviderFailed'
  /v1/rerank:
    post:
      operationId: rerankDocuments
      tags: [Inference]
      summary: Rank documents by relevance to a query
      description: LiteLLM/Cohere-compatible rerank request routed to an explicitly rerank-capable provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RerankRequest'}
            example:
              model: rerank-model
              query: Which document is about refunds?
              documents: [Shipping takes two days., Refunds are available for 30 days.]
              top_n: 1
              return_documents: true
      responses:
        '200':
          description: Documents ranked by provider relevance score
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RerankResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
  /admin/v1/keys:
    get:
      operationId: listVirtualKeys
      tags: [Virtual keys]
      summary: List virtual key metadata
      description: Requires the `admin` role. Returns policy and lifecycle metadata only; plaintext tokens and token hashes are never exposed.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Safe virtual key metadata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/VirtualKeyMetadata'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    post:
      operationId: createVirtualKey
      tags: [Virtual keys]
      summary: Create a virtual key
      description: Requires an authenticated credential with the `admin` role. The plaintext token is returned exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualKeyPolicy'
      responses:
        '201':
          description: Virtual key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedVirtualKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
  /admin/v1/keys/{id}/rotate:
    post:
      operationId: rotateVirtualKey
      tags: [Virtual keys]
      summary: Rotate a virtual key
      description: Creates a linked replacement and revokes the previous key atomically.
      parameters:
        - $ref: '#/components/parameters/VirtualKeyID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualKeyPolicy'
      responses:
        '201':
          description: Replacement virtual key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedVirtualKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
  /admin/v1/keys/{id}:
    put:
      operationId: updateVirtualKey
      tags: [Virtual keys]
      summary: Update a virtual key policy without changing its secret
      parameters: [{$ref: '#/components/parameters/VirtualKeyID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VirtualKeyPolicy'}
      responses:
        '204': {description: Virtual key policy updated}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: revokeVirtualKey
      tags: [Virtual keys]
      summary: Revoke a virtual key
      parameters:
        - $ref: '#/components/parameters/VirtualKeyID'
      responses:
        '204':
          description: Virtual key revoked
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
  /admin/v1/keys/{id}/disable:
    post:
      operationId: disableVirtualKey
      tags: [Virtual keys]
      summary: Temporarily disable a virtual key
      parameters: [{$ref: '#/components/parameters/VirtualKeyID'}]
      responses:
        '204': {description: Virtual key disabled}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/keys/{id}/enable:
    post:
      operationId: enableVirtualKey
      tags: [Virtual keys]
      summary: Re-enable a disabled virtual key
      parameters: [{$ref: '#/components/parameters/VirtualKeyID'}]
      responses:
        '204': {description: Virtual key enabled}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/users:
    get:
      operationId: listDirectoryUsers
      tags: [Identity]
      summary: List users visible to the admin scope
      parameters:
        - {name: team_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200':
          description: Directory users
          content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/DirectoryUser'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/users/{id}:
    put:
      operationId: putDirectoryUser
      tags: [Identity]
      summary: Create or update a directory user
      parameters: [{$ref: '#/components/parameters/DirectoryUserPathID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryUserInput'}}}}
      responses:
        '200': {description: User saved, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryUser'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/teams:
    get:
      operationId: listDirectoryTeams
      tags: [Identity]
      summary: List teams visible to the admin scope
      parameters:
        - {name: team_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Directory teams, content: {application/json: {schema: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/DirectoryTeam'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/teams/{id}:
    put:
      operationId: putDirectoryTeam
      tags: [Identity]
      summary: Create or update a team
      parameters: [{$ref: '#/components/parameters/DirectoryTeamID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryTeamInput'}}}}
      responses:
        '200': {description: Team saved, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryTeam'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/teams/{id}/members/{user_id}:
    put:
      operationId: putTeamMembership
      tags: [Identity]
      summary: Add or update a scoped team membership
      parameters:
        - {$ref: '#/components/parameters/DirectoryTeamID'}
        - {$ref: '#/components/parameters/DirectoryUserID'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TeamMembershipInput'}}}}
      responses:
        '200': {description: Membership saved, content: {application/json: {schema: {$ref: '#/components/schemas/TeamMembership'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/budgets:
    get:
      operationId: listBudgets
      tags: [Budgets]
      summary: List budget policies
      responses:
        '200':
          description: Budget policies
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/BudgetPolicy'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    post:
      operationId: createBudget
      tags: [Budgets]
      summary: Create a budget policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BudgetPolicyInput'}
      responses:
        '201':
          description: Budget policy created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetPolicy'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/budgets/{id}:
    parameters:
      - $ref: '#/components/parameters/BudgetID'
    get:
      operationId: getBudget
      tags: [Budgets]
      summary: Get a budget policy
      responses:
        '200':
          description: Budget policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetPolicy'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    put:
      operationId: updateBudget
      tags: [Budgets]
      summary: Replace a budget policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BudgetPolicyInput'}
      responses:
        '200':
          description: Updated budget policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetPolicy'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    delete:
      operationId: disableBudget
      tags: [Budgets]
      summary: Disable a budget policy
      responses:
        '204': {description: Budget policy disabled}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/budgets/{id}/summary:
    get:
      operationId: getBudgetSummary
      tags: [Budgets]
      summary: Get current committed and reserved spend
      parameters:
        - $ref: '#/components/parameters/BudgetID'
      responses:
        '200':
          description: Current budget window summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetSummary'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/usage/report:
    get:
      operationId: getUsageReport
      tags: [Usage]
      summary: Get aggregated usage and spend
      description: Returns final request outcomes aggregated by currency, day, model, and provider. Mixed currencies are never summed together.
      parameters:
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 90, default: 30}
      responses:
        '200':
          description: Usage and spend report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageReport'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs:
    get:
      operationId: listRequestLogs
      tags: [Observability]
      summary: List inference request outcomes
      description: Returns bounded metadata-only final outcomes. Prompts, responses, raw provider errors, credentials, and upstream URLs are never returned.
      parameters:
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 7}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: before_request_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: request_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: status, in: query, schema: {type: string, enum: [ok, error]}}
        - {name: model, in: query, schema: {type: string, maxLength: 256}}
        - {name: provider, in: query, schema: {type: string, maxLength: 256}}
        - {name: user_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: team_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: credential_id, in: query, schema: {type: string, maxLength: 256}}
      responses:
        '200':
          description: Request log page ordered newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLogPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs/settings:
    get:
      operationId: getRequestLogSettings
      tags: [Observability]
      summary: Get request-log privacy and retention settings
      responses:
        '200':
          description: Effective request-log settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLogSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/request-logs/{request_id}:
    get:
      operationId: getRequestLog
      tags: [Observability]
      summary: Get one inference request outcome
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
      responses:
        '200':
          description: Safe request outcome metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RequestLog'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/routing/diagnostics:
    get:
      operationId: getRoutingDiagnostics
      tags: [Routing]
      summary: Get safe provider routing diagnostics
      description: Returns endpoint names and operational routing state. Base URLs, credentials, and internal headers are never exposed.
      responses:
        '200':
          description: Routing strategy and endpoint state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoutingDiagnostics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/model-catalog:
    get:
      operationId: getRuntimeModelCatalog
      tags: [Models]
      summary: Get the active runtime model catalog
      responses:
        '200':
          description: Active catalog snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelCatalog'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    put:
      operationId: replaceRuntimeModelCatalog
      tags: [Models]
      summary: Atomically replace the active runtime model catalog
      description: Replicas synchronize the validated catalog through Redis. Priced entries require an explicit currency.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelCatalog'}
      responses:
        '200':
          description: Activated catalog snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelCatalog'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/audit/events:
    get:
      operationId: listManagementAuditEvents
      tags: [Audit]
      summary: List durable management audit events
      description: Returns append-only attempted and terminal outcome events in descending ID order.
      parameters:
        - {name: before_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: actor_id, in: query, schema: {type: string, maxLength: 256}}
        - {name: action, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200':
          description: Audit event page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Virtual key or JWT
  headers:
    XRequestID:
      description: Request correlation identifier
      schema:
        type: string
        maxLength: 128
  parameters:
    VirtualKeyID:
      name: id
      in: path
      required: true
      description: Opaque virtual-key identifier, never the plaintext token
      schema:
        type: string
        pattern: '^vk_[A-Za-z0-9_-]{5,125}$'
        maxLength: 128
    DirectoryTeamID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    DirectoryUserID:
      name: user_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    DirectoryUserPathID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    BudgetID:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
  responses:
    InvalidRequest:
      description: Invalid request or unsupported input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: unauthorized, message: invalid api key}
            ts: '2026-08-21T12:00:00Z'
    Forbidden:
      description: Credential policy rejects the model, function, or MCP connector
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdminRequired:
      description: The credential does not have the admin role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTooLarge:
      description: Request exceeds the 24 MiB inference body limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Credential rate limit, budget, or provider concurrency capacity exceeded
      headers:
        Retry-After:
          description: Seconds until the rate window resets or provider admission should be retried, when available
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ContentRejected:
      description: A required DLP, antivirus, or content-policy guardrail rejected the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: {code: content_rejected, message: content rejected}
            ts: '2026-08-21T12:00:00Z'
    ProviderFailed:
      description: Provider, guardrail, billing, or post-processing failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ModuleFailed:
      description: Required gateway module failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: Required storage is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ManagementUnavailable:
      description: Required admin management service is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested managed resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, occurred_at, request_id, actor_id, actor_credential_id, action, target_type, outcome]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        occurred_at: {type: string, format: date-time}
        request_id: {type: string, maxLength: 128}
        actor_id: {type: string, maxLength: 256}
        actor_credential_id: {type: string, maxLength: 256}
        action: {type: string, maxLength: 128}
        target_type: {type: string, maxLength: 128}
        target_id: {type: string, maxLength: 256}
        outcome: {type: string, enum: [attempted, succeeded, failed]}
        details: {type: object, additionalProperties: true}
    ModelCatalogEntry:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider: {type: string, minLength: 1}
        model: {type: string, minLength: 1}
        capabilities:
          type: array
          uniqueItems: true
          items: {type: string, enum: [chat, responses, embeddings, rerank, stream, tools, structured_output, mcp, vision]}
        max_input_tokens: {type: integer, minimum: 0}
        max_output_tokens: {type: integer, minimum: 0}
        input_cost_per_1m: {type: number, minimum: 0}
        output_cost_per_1m: {type: number, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    ModelCatalog:
      type: object
      additionalProperties: false
      required: [version, models]
      properties:
        version: {type: string, minLength: 1, maxLength: 128}
        unknown_model_policy: {type: string, enum: [legacy, deny], default: legacy}
        models:
          type: array
          maxItems: 5000
          items: {$ref: '#/components/schemas/ModelCatalogEntry'}
    BudgetPolicyInput:
      type: object
      additionalProperties: false
      required: [scope_type, scope_id, period]
      properties:
        scope_type: {type: string, enum: [global, key, user, team, model, provider]}
        scope_id: {type: string, minLength: 1, maxLength: 256}
        period: {type: string, enum: [hour, day, week, month]}
        currency: {type: string, pattern: '^[A-Z]{3}$', default: USD}
        max_cost: {type: number, exclusiveMinimum: 0}
        max_tokens: {type: integer, format: int64, minimum: 1}
        enabled: {type: boolean, default: true}
      anyOf:
        - required: [max_cost]
        - required: [max_tokens]
    BudgetPolicy:
      allOf:
        - $ref: '#/components/schemas/BudgetPolicyInput'
        - type: object
          required: [id, currency, enabled, created_at, updated_at]
          properties:
            id: {type: integer, format: int64, minimum: 1}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    BudgetSummary:
      type: object
      required: [policy, window_start, window_end, used_cost, used_tokens]
      properties:
        policy: {$ref: '#/components/schemas/BudgetPolicy'}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        used_cost: {type: number, minimum: 0}
        remaining_cost: {type: number, minimum: 0}
        used_tokens: {type: integer, format: int64, minimum: 0}
        remaining_tokens: {type: integer, format: int64, minimum: 0}
    UsageAggregate:
      type: object
      additionalProperties: false
      required: [currency, requests, errors, input_tokens, output_tokens, total_tokens, cost, avg_latency_ms]
      properties:
        date: {type: string, format: date}
        name: {type: string}
        currency: {type: string}
        requests: {type: integer, minimum: 0}
        errors: {type: integer, minimum: 0}
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
        cost: {type: number, minimum: 0}
        avg_latency_ms: {type: number, minimum: 0}
    UsageReport:
      type: object
      additionalProperties: false
      required: [days, from, to, totals, daily, by_model, by_provider]
      properties:
        days: {type: integer, minimum: 1, maximum: 90}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        totals: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}}
        daily: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}}
        by_model: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}}
        by_provider: {type: array, items: {$ref: '#/components/schemas/UsageAggregate'}}
    RequestLog:
      type: object
      additionalProperties: false
      required: [timestamp, request_id, api_type, phase, status, latency_ms, input_tokens, output_tokens, total_tokens, cost, currency, content_stored]
      properties:
        timestamp: {type: string, format: date-time}
        request_id: {type: string}
        user_id: {type: string}
        team_id: {type: string}
        roles: {type: array, items: {type: string}}
        credential_id: {type: string, description: Non-secret credential identifier or fingerprint}
        provider: {type: string}
        provider_endpoint_name: {type: string}
        provider_endpoint_type: {type: string}
        model: {type: string}
        api_type: {type: string}
        phase: {type: string, enum: [commit, cancel]}
        status: {type: string, enum: [ok, error]}
        failure_class: {type: string, description: Bounded failure category; raw provider errors are excluded}
        latency_ms: {type: integer, minimum: 0}
        cache_status: {type: string}
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
        cost: {type: number, minimum: 0}
        currency: {type: string}
        content_stored: {type: boolean, const: false}
    RequestLogPage:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/RequestLog'}}
        next_before: {type: string, format: date-time}
        next_request_id: {type: string}
    RequestLogSettings:
      type: object
      additionalProperties: false
      required: [retention_days, content_stored, max_query_days]
      properties:
        retention_days: {type: integer, minimum: 1}
        content_stored: {type: boolean, const: false}
        max_query_days: {type: integer, minimum: 1, maximum: 90}
    EndpointDiagnostics:
      type: object
      additionalProperties: false
      required: [name, type, models, priority, weight, state, consecutive_failures, samples, latency_ewma_ms, failure_ewma, in_flight_requests, queued_requests, max_retries, guardrail_policy_valid, dlp_enabled, av_enabled, shadow]
      properties:
        name: {type: string}
        type: {type: string}
        models: {type: array, items: {type: string}}
        capabilities: {type: array, items: {type: string}}
        priority: {type: integer}
        weight: {type: integer}
        state: {type: string, enum: [available, cooling_down, half_open]}
        cooldown_until: {type: string, format: date-time}
        consecutive_failures: {type: integer, minimum: 0}
        samples: {type: integer, minimum: 0}
        latency_ewma_ms: {type: number, minimum: 0}
        failure_ewma: {type: number, minimum: 0, maximum: 1}
        max_parallel_requests: {type: integer, minimum: 0}
        in_flight_requests: {type: integer, minimum: 0}
        queue_capacity: {type: integer, minimum: 0}
        queued_requests: {type: integer, minimum: 0}
        max_retries: {type: integer, minimum: 0}
        guardrail_policy: {type: string}
        guardrail_policy_valid: {type: boolean}
        dlp_enabled: {type: boolean}
        av_enabled: {type: boolean}
        shadow: {type: boolean}
        mirror_percentage: {type: number, minimum: 0, maximum: 100}
    RoutingDiagnostics:
      type: object
      additionalProperties: false
      required: [strategy, endpoints]
      properties:
        strategy: {type: string}
        endpoints: {type: array, items: {$ref: '#/components/schemas/EndpointDiagnostics'}}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, ts]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
        ts:
          type: string
          format: date-time
    Model:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id: {type: string}
        object: {type: string, const: model}
        created: {type: integer, format: int64}
        owned_by: {type: string}
    ModelsResponse:
      type: object
      required: [object, data]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items: {$ref: '#/components/schemas/Model'}
    ImageURL:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          pattern: '^data:image/(jpeg|png|gif|webp);base64,[A-Za-z0-9+/]+={0,2}$'
          description: Inline image data URL. Remote URLs are rejected.
        detail:
          type: string
          enum: [auto, low, high]
    TextContentPart:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: {type: string, enum: [text, input_text]}
        text: {type: string, minLength: 1}
    ImageContentPart:
      type: object
      additionalProperties: false
      required: [type, image_url]
      properties:
        type: {type: string, const: image_url}
        image_url: {$ref: '#/components/schemas/ImageURL'}
    InputImageContentPart:
      type: object
      additionalProperties: false
      required: [type, image_url]
      properties:
        type: {type: string, const: input_image}
        image_url:
          type: string
          pattern: '^data:image/(jpeg|png|gif|webp);base64,[A-Za-z0-9+/]+={0,2}$'
    MessageContent:
      oneOf:
        - type: string
        - type: 'null'
        - type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/TextContentPart'
              - $ref: '#/components/schemas/ImageContentPart'
    FunctionCall:
      type: object
      required: [name, arguments]
      properties:
        name: {type: string, minLength: 1}
        arguments: {type: string}
    ToolCall:
      type: object
      required: [type, function]
      properties:
        index: {type: integer, minimum: 0}
        id: {type: string}
        type: {type: string, const: function}
        function: {$ref: '#/components/schemas/FunctionCall'}
    Message:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content: {$ref: '#/components/schemas/MessageContent'}
        name: {type: string}
        tool_call_id: {type: string}
        tool_calls:
          type: array
          items: {$ref: '#/components/schemas/ToolCall'}
    FunctionDefinition:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        parameters:
          type: object
          additionalProperties: true
        strict: {type: boolean}
    ChatTool:
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type: {type: string, const: function}
        function: {$ref: '#/components/schemas/FunctionDefinition'}
    JSONSchemaFormat:
      type: object
      additionalProperties: false
      required: [name, schema]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        schema:
          type: object
          additionalProperties: true
        strict: {type: boolean}
    ResponseFormat:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [text, json_object, json_schema]
        json_schema: {$ref: '#/components/schemas/JSONSchemaFormat'}
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        provider: {type: string}
        model: {type: string, minLength: 1}
        messages:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Message'}
        tools:
          type: array
          items: {$ref: '#/components/schemas/ChatTool'}
        tool_choice: {}
        parallel_tool_calls: {type: boolean}
        response_format: {$ref: '#/components/schemas/ResponseFormat'}
        stream: {type: boolean, default: false}
        max_tokens: {type: integer, minimum: 1}
        temperature: {type: number}
        top_p: {type: number}
        stop: {}
        seed: {type: integer, format: int64}
    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: {type: integer, minimum: 0}
        completion_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
    Choice:
      type: object
      required: [index, message, finish_reason]
      properties:
        index: {type: integer, minimum: 0}
        message: {$ref: '#/components/schemas/Message'}
        finish_reason: {type: string}
    ChatCompletionResponse:
      type: object
      required: [id, object, model, choices, usage]
      properties:
        id: {type: string}
        object: {type: string, const: chat.completion}
        model: {type: string}
        choices:
          type: array
          items: {$ref: '#/components/schemas/Choice'}
        usage: {$ref: '#/components/schemas/Usage'}
    FunctionResponseTool:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type: {type: string, const: function}
        name: {type: string, minLength: 1}
        description: {type: string}
        parameters:
          type: object
          additionalProperties: true
        strict: {type: boolean}
    MCPResponseTool:
      type: object
      additionalProperties: false
      required: [type, server_label, server_url]
      properties:
        type: {type: string, const: mcp}
        server_label: {type: string, minLength: 1}
        server_url:
          type: string
          format: uri
          pattern: '^https://'
        server_description: {type: string}
        allowed_tools:
          type: array
          items: {type: string}
        require_approval: {}
        headers:
          type: object
          additionalProperties: {type: string}
          description: Provider-scoped connector headers. Client bearer is never injected.
    ResponseInputMessage:
      type: object
      additionalProperties: true
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant]}
        content:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/TextContentPart'
              - $ref: '#/components/schemas/InputImageContentPart'
    ResponseRequest:
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        provider: {type: string}
        model: {type: string, minLength: 1}
        input:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              items:
                oneOf:
                  - {$ref: '#/components/schemas/ResponseInputMessage'}
                  - {$ref: '#/components/schemas/TextContentPart'}
                  - {$ref: '#/components/schemas/InputImageContentPart'}
                  - type: object
                    additionalProperties: true
        instructions: {type: string}
        tools:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/FunctionResponseTool'
              - $ref: '#/components/schemas/MCPResponseTool'
        tool_choice: {}
        parallel_tool_calls: {type: boolean}
        text: {}
        previous_response_id: {type: string}
        stream: {type: boolean, default: false}
        max_output_tokens: {type: integer, minimum: 1}
        max_tokens: {type: integer, minimum: 1}
        temperature: {type: number}
        top_p: {type: number}
    ResponseOutputContent:
      type: object
      required: [type]
      properties:
        type: {type: string}
        text: {type: string}
    ResponseOutputItem:
      type: object
      required: [type]
      properties:
        id: {type: string}
        type: {type: string}
        status: {type: string}
        role: {type: string}
        name: {type: string}
        call_id: {type: string}
        arguments: {type: string}
        content:
          type: array
          items: {$ref: '#/components/schemas/ResponseOutputContent'}
        summary:
          type: array
          items: {$ref: '#/components/schemas/ResponseOutputContent'}
    ResponseUsage:
      type: object
      properties:
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
    ResponseResponse:
      type: object
      required: [id, object, model]
      properties:
        id: {type: string}
        object: {type: string}
        created_at: {type: integer, format: int64}
        status: {type: string}
        model: {type: string}
        output:
          type: array
          items: {$ref: '#/components/schemas/ResponseOutputItem'}
        output_text: {type: string}
        usage: {$ref: '#/components/schemas/ResponseUsage'}
    EmbeddingRequest:
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        provider: {type: string}
        model: {type: string, minLength: 1}
        input:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              items: {type: string, minLength: 1}
        encoding_format: {type: string, enum: [float]}
        dimensions: {type: integer, minimum: 1}
        user: {type: string}
    Embedding:
      type: object
      required: [object, embedding, index]
      properties:
        object: {type: string, const: embedding}
        embedding:
          type: array
          items: {type: number, format: double}
        index: {type: integer, minimum: 0}
    EmbeddingResponse:
      type: object
      required: [object, data, model, usage]
      properties:
        object: {type: string, const: list}
        data:
          type: array
          items: {$ref: '#/components/schemas/Embedding'}
        model: {type: string}
        usage: {$ref: '#/components/schemas/Usage'}
    RerankRequest:
      type: object
      additionalProperties: false
      required: [model, query, documents]
      properties:
        provider: {type: string}
        model: {type: string, minLength: 1}
        query: {type: string, minLength: 1}
        documents:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            oneOf:
              - {type: string, minLength: 1}
              - {type: object, additionalProperties: true}
        top_n: {type: integer, minimum: 1}
        rank_fields:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string, minLength: 1}
        return_documents: {type: boolean}
        max_chunks_per_doc: {type: integer, minimum: 1}
        max_tokens_per_doc: {type: integer, minimum: 1}
    RerankResult:
      type: object
      required: [index, relevance_score]
      properties:
        index: {type: integer, minimum: 0}
        relevance_score: {type: number, format: double}
        document: {}
    RerankResponse:
      type: object
      required: [results]
      properties:
        id: {type: string}
        results:
          type: array
          items: {$ref: '#/components/schemas/RerankResult'}
        meta:
          type: object
          properties:
            api_version: {type: object, additionalProperties: true}
            billed_units:
              type: object
              properties:
                search_units: {type: integer, minimum: 0}
                total_tokens: {type: integer, minimum: 0}
            tokens:
              type: object
              properties:
                input_tokens: {type: integer, minimum: 0}
                output_tokens: {type: integer, minimum: 0}
    VirtualKeyPolicy:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        alias: {type: string, maxLength: 128}
        description: {type: string, maxLength: 1024}
        tags:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 256}
        user_id: {type: string, minLength: 1, maxLength: 256}
        team_id: {type: string, maxLength: 256}
        roles:
          type: array
          items: {type: string, minLength: 1}
