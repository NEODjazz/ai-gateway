  /admin/v1/agent-profiles:
    get:
      operationId: listAgentProfiles
      tags: [Agent templates]
      summary: List metadata-only profiles for external agent runtimes
      responses:
        '200': {description: Agent profiles and execution boundary, content: {application/json: {schema: {$ref: '#/components/schemas/AgentProfileList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/agent-profiles/{id}:
