          description: Authentication or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/batches:
    post:
      operationId: createBatch
      tags: [Batches]
      summary: Create a durable asynchronous inference batch
      description: Validates an owner-scoped JSONL file with purpose=batch, authorizes every model and tool before accepting it, and atomically persists the Batch, its items and durable jobs. Each item executes through the normal routing, guardrail, rate-limit and billing pipeline with an independent execution ID. Messages items use the native request and response envelopes and reject streaming. Image edit and variation items use bounded inline base64 images; streaming edits are rejected. Audio transcription and translation items use bounded inline base64 audio, reject streaming and preserve exact token or duration usage. Each JSONL line is limited to 4 MiB. Mixed-model files are supported. Completed and failed lines are stored as owner-scoped Files resources.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchCreateRequest'}
      responses:
        '200':
          description: Queued batch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        default:
          description: Authentication, validation, authorization, quota, or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    get:
      operationId: listBatches
      tags: [Batches]
      summary: List batches owned by the authenticated credential and user
      security: [{bearerAuth: []}]
      parameters:
        - {name: after, in: query, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Cursor page of owned batches
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchList'}
        default:
          description: Authentication, validation, or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/batches/{id}:
    get:
      operationId: getBatch
      tags: [Batches]
      summary: Retrieve an owned batch
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
      responses:
        '200':
          description: Current batch lifecycle state and authoritative request counts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        default:
          description: Authentication, ownership, validation, or storage failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/batches/{id}/cancel:
    post:
      operationId: cancelBatch
      tags: [Batches]
      summary: Cancel an owned queued or running batch
      security: [{bearerAuth: []}]
