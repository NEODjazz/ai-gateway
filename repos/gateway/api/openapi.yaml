                    additionalProperties: {$ref: '#/components/schemas/BudgetSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
    post:
      operationId: createBudget
      tags: [Budgets]
      summary: Create a budget policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BudgetPolicyInput'}
      responses:
        '201':
          description: Budget policy created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BudgetPolicy'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AdminRequired'}
        '503': {$ref: '#/components/responses/ManagementUnavailable'}
  /admin/v1/budgets/{id}:
