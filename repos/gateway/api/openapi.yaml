        - {name: order, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: after, in: query, schema: {type: string, maxLength: 128}}
        - {name: before, in: query, schema: {type: string, maxLength: 128}}
      responses:
        '200': {description: Owner-filtered run-step page, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRunStepList'}}}}
        '400': {description: Invalid or conflicting pagination controls}
        '404': {description: 'Thread, run, or pagination boundary is absent for this owner'}
  /v1/threads/{thread_id}/runs/{run_id}/steps/{step_id}:
    parameters:
      - {name: thread_id, in: path, required: true, schema: {type: string, maxLength: 128}}
      - {name: run_id, in: path, required: true, schema: {type: string, maxLength: 128}}
      - {name: step_id, in: path, required: true, schema: {type: string, maxLength: 128}}
    get:
      operationId: getAssistantRunStep
      tags: [Assistants]
      summary: Retrieve a durable step from an owned run
      responses:
        '200': {description: Run step, content: {application/json: {schema: {$ref: '#/components/schemas/AssistantRunStep'}}}}
        '404': {description: 'Thread, run, or step is absent for this owner'}
  /v1/realtime:
    get:
      operationId: openRealtimeSession
      tags: [Inference]
      summary: Open a bounded bidirectional Realtime session
      description: Authenticates the gateway credential, authorizes the public model, selects one Realtime-capable deployment, and proxies bounded WebSocket events without exposing provider credentials. Text-bearing client events pass the effective input policy before delivery. Input audio requires the deployment capability audio_input; output audio requires audio. PCM16/24 kHz, G.711 mu-law and G.711 A-law input buffers support append, commit and clear, with a 15 MiB decoded limit per append, a 1 GiB session counter limit, optional AV scanning and conservative TPM reserve before each response. Separately billed input-audio transcription is rejected with unsupported_feature until an independent ASR pricing, admission and settlement lifecycle is configured. Provider audio deltas require strict base64 and exact terminal usage preserves text, audio and cached token details. Each response is rate-limited and settled independently, including immediate idempotent settlement of client cancellation. Output-policy deployments buffer up to 8 MiB until the complete response passes the configured scan. Each WebSocket event is limited to 20 MiB plus 64 KiB of envelope overhead and each provider connection to 30 minutes.
      parameters:
        - {name: model, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
      responses:
        '101': {description: WebSocket session established}
        '400': {description: Invalid model or WebSocket handshake}
        '401': {description: Invalid gateway credential}
        '403': {description: Model is not allowed}
        '429': {description: "Credential, deployment, or provider capacity exceeded"}
        '503': {description: No eligible Realtime deployment is available}
  /a2a/{agent}/.well-known/agent-card.json:
    get:
      operationId: getA2AAgentCard
      tags: [A2A]
      summary: Discover one enabled executable agent profile
      description: Returns an A2A 1.0 Agent Card for direct discovery. The card advertises text, structured JSON data and bounded inline or HTTPS image, audio, video, PDF and UTF-8 document inputs, text output, bearer authentication, authenticated extended-card retrieval, streaming when durable task storage is configured, and push notifications when the durable encrypted outbox is configured.
      security: []
      parameters:
        - {name: agent, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
      responses:
        '200':
          description: Public A2A Agent Card
          content:
            application/json:
              schema: {$ref: '#/components/schemas/A2AAgentCard'}
        '404': {description: 'Agent profile is absent, disabled, or requires an unavailable instruction template'}
  /a2a/{agent}:
    post:
      operationId: callA2AAgent
      tags: [A2A]
      summary: Execute A2A messages and task lifecycle operations
      description: Implements A2A 1.0 SendMessage, SendStreamingMessage, SubscribeToTask, GetTask, ListTasks, CancelTask and authenticated GetExtendedAgentCard. New messages pass through the same authentication, model authorization, rate limit, guardrail, routing and billing pipeline as Responses. Text, structured JSON data and bounded inline or HTTPS image, audio, MP4/WebM video, PDF and UTF-8 document parts are accepted. HTTPS media are retrieved only after credential and model authorization, reject redirects and non-public destinations, and are persisted as validated inline bytes. When durable task storage is configured, SendMessage creates or continues an owner-scoped task using optimistic concurrency. Setting returnImmediately=true uses durable background Responses execution; GetTask reconciles pending execution and CancelTask cancels it. SendMessage push configuration is encrypted at rest and atomically persisted with the task; terminal delivery uses bounded durable retries after billing settlement. Streaming methods emit ordered task, artifact-update and terminal-status SSE lifecycles. Subscriptions have bounded concurrency, duration and polling frequency. Other media parts and push configuration on streaming messages return explicit protocol errors.
      security: [{bearerAuth: []}]
      parameters:
        - {name: agent, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$'}}
        - {name: A2A-Version, in: header, required: true, schema: {type: string, const: '1.0'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/A2AJSONRPCRequest'}
      responses:
        '200':
          description: A2A Message, Task or task-list result
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/A2AJSONRPCResponse'}
            text/event-stream:
              schema: {type: string, description: 'Ordered JSON-RPC task, artifactUpdate and statusUpdate data events for SendStreamingMessage'}
        default:
          description: Protocol, authentication, policy, quota, or provider failure in a JSON-RPC error envelope
          content:
            application/json:
              schema: {$ref: '#/components/schemas/A2AJSONRPCResponse'}
  /model/{model}/converse-stream:
    post:
      operationId: bedrockConverseStream
      tags: [Inference]
      summary: Stream a Converse response
      description: Uses the same authorization, model and tool policy, quota, guardrail, routing and billing lifecycle as Chat streaming. Successful responses use checksummed AWS EventStream frames. Provider fallback is allowed only before the first event; non-streaming deployments produce a bounded event stream after the full response passes output policy.
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 2048}
        - in: query
          name: provider
          required: false
          schema: {type: string}
          description: Optional gateway deployment selector.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BedrockConverseRequest'}
      responses:
        '200':
          description: Checksummed event stream ending in messageStop and usage metadata
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/vnd.amazon.eventstream:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
  /model/{model}/invoke:
    post:
      operationId: bedrockInvokeModel
      tags: [Inference]
      summary: Invoke a Bedrock model using the Anthropic Messages dialect
      description: Accepts the bounded Anthropic Messages request shape for Bedrock and uses the shared authentication, model and function-tool authorization, quota, content policy, routing, retry and exact billing lifecycle. Routing requires a Bedrock deployment with explicit chat and bedrock_invoke capabilities. Unknown fields and unsupported native controls are rejected before provider execution.
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 2048}
        - in: query
          name: provider
          required: false
          schema: {type: string}
          description: Optional gateway deployment selector.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BedrockInvokeRequest'}
      responses:
        '200':
          description: Anthropic Messages response with provider-reported usage
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagesResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
  /model/{model}/invoke-with-response-stream:
    post:
      operationId: bedrockInvokeModelWithResponseStream
      tags: [Inference]
      summary: Stream a Bedrock model using the Anthropic Messages dialect
      description: Accepts the bounded Anthropic Messages request shape for Bedrock and returns checksummed AWS EventStream chunk events containing incremental Anthropic message events. It uses shared authentication, model and function-tool authorization, quota, content policy, routing, retry and exact post-stream billing. Routing requires a streaming Bedrock deployment with explicit chat and bedrock_invoke capabilities. Provider reads, individual frames and the complete stream are bounded, and client cancellation terminates upstream work.
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 2048}
        - in: query
          name: provider
          required: false
          schema: {type: string}
          description: Optional gateway deployment selector.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BedrockInvokeRequest'}
      responses:
        '200':
          description: Checksummed AWS EventStream chunk events containing base64-encoded Anthropic Messages events
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/vnd.amazon.eventstream:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
  /model/{model}/converse:
    post:
      operationId: bedrockConverse
      tags: [Inference]
      summary: Create a synchronous Converse response
      description: Uses the gateway authentication, model and tool authorization, quotas, content policy, routing, and billing pipeline. Supports text, bounded base64 user images and documents, function tool use and result blocks, system text, and standard inference limits. Documents are limited to five per user message and 4.5 MiB each, require accompanying text, contribute to TPM reserve, and are projected to configured scanners. Unsupported native fields are rejected before provider execution.
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 2048}
        - in: query
          name: provider
          required: false
          schema: {type: string}
          description: Optional gateway deployment selector.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BedrockConverseRequest'}
      responses:
        '200':
          description: Synchronous Converse response with provider-reported usage
          headers:
            X-Execution-ID: {$ref: '#/components/headers/XExecutionID'}
            X-Request-ID: {$ref: '#/components/headers/XRequestID'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BedrockConverseResponse'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/RequestTooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
  /v1beta/cachedContents:
    post:
      operationId: createCachedContent
      tags: [Cached content]
      summary: Create owner-scoped Gemini cached content
      description: Applies gateway authentication, model authorization, policy transforms, provider quotas and billing before persisting only provider metadata. Prompt content is never stored by the gateway. The selected deployment and credential binding are pinned for the resource lifecycle.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GeminiCachedContentCreateRequest'}
      responses:
        '200': {description: Created cached content metadata, content: {application/json: {schema: {$ref: '#/components/schemas/GeminiCachedContent'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '451': {$ref: '#/components/responses/ContentRejected'}
        '502': {$ref: '#/components/responses/ProviderFailed'}
        '503': {description: Durable cached content storage or a required policy service is unavailable}
    get:
      operationId: listCachedContents
      tags: [Cached content]
      summary: List active cached content owned by the caller
      description: Reads the owner-filtered durable gateway index and never enumerates a shared provider credential.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      parameters:
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: pageToken, in: query, schema: {type: string, minLength: 1, maxLength: 344}}
      responses:
        '200': {description: Owner-filtered cached content page, content: {application/json: {schema: {$ref: '#/components/schemas/GeminiCachedContentList'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Durable cached content storage is unavailable}
  /v1beta/cachedContents/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 241, pattern: '^[A-Za-z0-9_.-]+$'}}
    get:
      operationId: getCachedContent
      tags: [Cached content]
      summary: Retrieve owned cached content metadata
      description: Resolves ownership locally and retrieves metadata only from the deployment pinned at creation.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      responses:
        '200': {description: Current cached content metadata, content: {application/json: {schema: {$ref: '#/components/schemas/GeminiCachedContent'}}}}
        '404': {description: 'Cached content is absent, expired, or belongs to another owner'}
        '409': {description: The pinned deployment has changed}
        '503': {description: Durable cached content storage is unavailable}
    patch:
      operationId: updateCachedContent
      tags: [Cached content]
      summary: Update owned cached content expiration
      description: Updates exactly one expiration field on the pinned provider resource and restores the old provider expiration if durable metadata persistence fails.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      parameters:
        - {name: updateMask, in: query, required: true, schema: {type: string, enum: [ttl, expireTime]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GeminiCachedContentExpiration'}
      responses:
        '200': {description: Updated cached content metadata, content: {application/json: {schema: {$ref: '#/components/schemas/GeminiCachedContent'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {description: 'Cached content is absent, expired, or belongs to another owner'}
        '409': {description: The pinned deployment has changed}
        '503': {description: Durable cached content storage is unavailable}
    delete:
      operationId: deleteCachedContent
      tags: [Cached content]
      summary: Delete owned cached content
      description: Deletes the pinned provider resource and its owner-scoped durable metadata. A provider-side missing resource is treated as an idempotent cleanup.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      responses:
        '204': {description: Cached content deleted}
        '404': {description: 'Cached content is absent, expired, or belongs to another owner'}
        '409': {description: The pinned deployment has changed}
        '503': {description: Durable cached content storage is unavailable}
  /v1beta/models/{model}:countTokens:
    post:
      operationId: countGenerateTokens
      tags: [Inference]
      summary: Count native GenerateContent context tokens
      description: |
        Uses gateway authorization, model/tool ACL, quotas and content policy.
        Does not generate output or open a billing lifecycle. Query credentials are
        rejected. Requires a native token counter; no estimate fallback is used.
        Owner-scoped fileData is resolved and validated after authentication.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - in: query
          name: alt
          required: false
          schema: {type: string, enum: [json]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateCountRequest'}
      responses:
        '200':
          description: Provider-reported input token count
          content:
            application/json:
              schema:
                type: object
                required: [totalTokens]
                properties:
                  totalTokens: {type: integer, minimum: 0}
        default:
          description: Native error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentError'}
  /v1beta/models/{model}:generateContent:
    post:
      operationId: generateContent
      tags: [Inference]
      summary: Create native GenerateContent through the gateway pipeline
      description: |
        Uses gateway authorization, model/tool ACL, quotas, content policy and billing.
        Supports one candidate; unsupported fields are rejected. Tool calls are
        buffered until their JSON arguments are complete. Query credentials are rejected.
        Owner-scoped fileData is resolved and validated after authentication.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - in: query
          name: alt
          required: false
          schema: {type: string, enum: [json]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateContentRequest'}
      responses:
        '200':
          description: Native response with provider-reported usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentResponse'}
        default:
          description: Native error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentError'}
  /v1beta/models/{model}:streamGenerateContent:
    post:
      operationId: streamGenerateContent
      tags: [Inference]
      summary: Stream native GenerateContent through the gateway pipeline
      description: |
        Uses gateway authorization, model/tool ACL, quotas, content policy and billing.
        Supports one candidate; unsupported fields are rejected. Tool calls are
        buffered until their JSON arguments are complete. Query credentials are rejected.
        Owner-scoped fileData is resolved and validated after authentication.
      security:
        - googleAPIKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: model
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - in: query
          name: alt
          required: true
          schema: {type: string, enum: [sse]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateContentRequest'}
      responses:
        '200':
          description: Native SSE events; errors terminate the stream without a successful finishReason
          content:
            text/event-stream:
              schema: {type: string}
        default:
          description: Native error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerateContentError'}
  /v1/messages/count_tokens:
    post:
      operationId: countMessageTokens
      tags: [Inference]
      summary: Count context tokens using a native provider counter
      description: |
        Applies authorization, tool ACL, input TPM/RPM and pre-inference policy.
        Native skill and managed code-execution context is owner-checked, included
        in the provider count, and pinned to the skill or container deployment.
        Does not generate output or open a billing lifecycle. Currently requires
        native Anthropic, Gemini or Bedrock. No automatic retry, mirror or response cache is used.
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      parameters:
        - in: header
          name: anthropic-version
          required: true
          schema: {type: string, enum: ['2023-06-01']}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageTokenCountRequest'}
      responses:
        '200':
          description: Provider-reported count of the context after policy processing
          content:
            application/json:
              schema:
                type: object
                required: [input_tokens]
                additionalProperties: false
                properties:
                  input_tokens: {type: integer, minimum: 0}
                  context_management:
                    type: object
                    additionalProperties: false
                    required: [original_input_tokens]
                    properties:
                      original_input_tokens: {type: integer, minimum: 0, description: Context size before server-side edits; always greater than or equal to input_tokens.}
        default:
          description: Native Messages error
          content:
            application/json:
              schema:
                type: object
                required: [type, error]
                properties:
                  type: {type: string, enum: [error]}
                  error:
                    type: object
                    required: [type, message]
                    properties:
                      type: {type: string}
                      message: {type: string}
  /v1/messages:
    post:
      operationId: createMessage
      tags: [Inference]
      summary: Create an Anthropic Messages response through the gateway pipeline
      description: |
        Supports text, base64 user images, function tools and text tool results.
        Bounded native web-search, web-fetch and managed code-execution result blocks are preserved in provider order.
        Requests can execute up to 20 owner-checked native skills through the deployment where each custom skill was created. With stream=true the gateway buffers provider execution until the returned container binding is durably recorded, then emits a valid Messages SSE sequence. A returned container ID can be reused until its reported expiry by the same credential and user; routing remains pinned to the original deployment.
        Other advanced input blocks and server-tool types are rejected.
        Assistant prefill requires an explicitly capable deployment and model.
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      parameters:
        - in: header
          name: anthropic-version
          required: true
          schema: {type: string, enum: ['2023-06-01']}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessagesRequest'}
      responses:
        '200':
          description: Message or native Messages SSE events ending in message_stop
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagesResponse'}
            text/event-stream:
              schema: {type: string}
        default:
          description: Native Messages error; existing gateway policy and rate limits apply
          content:
            application/json:
              schema:
                type: object
                required: [type, error]
                properties:
                  type: {type: string, enum: [error]}
                  error:
                    type: object
                    required: [type, message]
                    properties:
                      type: {type: string}
                      message: {type: string}
  /v1/messages/batches:
    post:
      operationId: createMessagesBatch
      tags: [Batches]
      summary: Create a durable native Messages batch
      description: Accepts 1 to 50000 native Messages requests, validates every model, tool and resolved document or image before persistence, and atomically stores immutable request snapshots with durable execution jobs. Each item uses the normal policy, quota, routing and billing lifecycle with its own execution ID. Streaming items are rejected. A request item is limited to 4 MiB after owner-scoped file and bounded HTTPS references are resolved.
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      parameters: [{$ref: '#/components/parameters/MessagesVersion'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MessagesBatchCreateRequest'}}}
      responses:
        '200': {description: Queued native Messages batch, content: {application/json: {schema: {$ref: '#/components/schemas/MessagesBatch'}}}}
        default: {description: 'Authentication, validation, authorization, quota, or durable storage failure', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    get:
      operationId: listMessagesBatches
      tags: [Batches]
      summary: List native Messages batches owned by the authenticated credential and user
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/MessagesVersion'}
        - {name: after_id, in: query, schema: {type: string, minLength: 10, maxLength: 128, pattern: '^msgbatch_[A-Za-z0-9_.-]+$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Cursor page of owned native Messages batches, content: {application/json: {schema: {$ref: '#/components/schemas/MessagesBatchList'}}}}
        default: {description: 'Authentication, validation, or durable storage failure', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/messages/batches/{message_batch_id}:
    parameters:
      - {$ref: '#/components/parameters/MessagesVersion'}
      - {$ref: '#/components/parameters/MessageBatchID'}
    get:
      operationId: getMessagesBatch
      tags: [Batches]
      summary: Retrieve an owned native Messages batch
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      responses:
        '200': {description: Current batch state and authoritative request counts, content: {application/json: {schema: {$ref: '#/components/schemas/MessagesBatch'}}}}
        default: {description: 'Authentication, ownership, validation, or durable storage failure', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    delete:
      operationId: deleteMessagesBatch
      tags: [Batches]
      summary: Delete an owned ended native Messages batch
      description: Deletes a completed, failed, expired or cancelled batch, its immutable request and result rows, and any remaining durable item jobs in one transaction. Active batches return a lifecycle conflict.
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      responses:
        '200': {description: Deleted batch identifier, content: {application/json: {schema: {$ref: '#/components/schemas/MessagesBatchDeletion'}}}}
        default: {description: 'Authentication, ownership, lifecycle conflict, validation, or durable storage failure', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/messages/batches/{message_batch_id}/cancel:
    post:
      operationId: cancelMessagesBatch
      tags: [Batches]
      summary: Cancel an owned queued or running native Messages batch
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/MessagesVersion'}
        - {$ref: '#/components/parameters/MessageBatchID'}
      responses:
        '200': {description: Cancelled native Messages batch, content: {application/json: {schema: {$ref: '#/components/schemas/MessagesBatch'}}}}
        default: {description: 'Authentication, ownership, lifecycle conflict, validation, or durable storage failure', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/messages/batches/{message_batch_id}/results:
    get:
      operationId: getMessagesBatchResults
      tags: [Batches]
      summary: Stream ordered native Messages batch results
      description: Returns one succeeded, errored, canceled or expired JSON object per original request, in input order. Results become available only after the batch ends.
      security:
        - nativeAPIKey: []
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/MessagesVersion'}
        - {$ref: '#/components/parameters/MessageBatchID'}
      responses:
        '200': {description: Newline-delimited native Messages batch results, content: {application/x-ndjson: {schema: {type: string}}}}
        default: {description: 'Authentication, ownership, lifecycle conflict, validation, or durable storage failure', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/images/generations:
    post:
      operationId: generateImage
      tags: [Inference]
      summary: Generate images through an explicitly capable deployment
      description: Applies gateway authentication, model policy, RPM/TPM admission, provider retries and billing settlement. JSON responses, SSE streams and decoded images are bounded. Streaming emits validated partial-image events followed by one completed event whose exact usage settles billing; output policies may suppress native partial streaming. Native Gemini deployments support one inline base64 image plus the documented native aspect-ratio and resolution controls; unsupported parameters are rejected before upstream execution.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImageGenerationRequest'}
      responses:
        '200':
          description: Generated images and provider-reported token usage, or an SSE stream when stream is true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageGenerationResponse'}
            text/event-stream:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ImageGenerationPartialEvent'}
                  - {$ref: '#/components/schemas/ImageGenerationCompletedEvent'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/images/edits:
    post:
      operationId: editImage
      tags: [Inference]
      summary: Edit uploaded images through an explicitly capable deployment
      description: Applies bounded multipart decoding, image signature checks, gateway policy, AV/DLP modules, RPM/TPM admission, retries and billing settlement. Compatible deployments can emit bounded, validated partial and completed SSE events; output policies may suppress native partial streaming. Native Gemini deployments accept one to eight PNG/JPEG/WebP inputs and return one inline base64 image; mask editing and parameters without an exact native mapping are rejected before upstream execution.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ImageEditRequest'}
      responses:
        '200':
          description: Edited images and provider-reported token usage, or an SSE stream when stream is true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageGenerationResponse'}
            text/event-stream:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/ImageEditPartialEvent'}
                  - {$ref: '#/components/schemas/ImageEditCompletedEvent'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/images/variations:
    post:
      operationId: createImageVariation
      tags: [Inference]
      summary: Create variations of an uploaded image through an explicitly capable deployment
      description: Applies bounded multipart decoding, image signature checks, gateway policy, AV scanning, RPM/TPM admission, retries and billing settlement. Native Gemini deployments accept one PNG/JPEG/WebP input and return one inline base64 variation; incompatible output and size parameters are rejected before upstream execution.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ImageVariationRequest'}
      responses:
        '200':
          description: Image variations and provider-reported token usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageGenerationResponse'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/audio/transcriptions:
    post:
      operationId: transcribeAudio
      tags: [Inference]
      summary: Transcribe an uploaded audio file through an explicitly capable deployment
      description: Applies bounded multipart decoding, file signature checks, AV and prompt DLP policies, RPM/TPM admission, retries and exact provider usage settlement. With stream=true, capable compatible deployments forward validated transcript delta, diarized segment and terminal done SSE events; the terminal event must contain exact usage and match all emitted text. Policies requiring complete output use a validated terminal-only SSE response. Duration-priced native deployments reserve validated container duration before execution. Native Gemini supports bounded inline WAV/MP3/MPEG/OGG/FLAC/WebM input, language hints, vocabulary, prompt guidance and temperature; unsupported structured modes fail before upstream execution.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/AudioTranscriptionRequest'}
      responses:
        '200':
          description: Transcript with exact token or duration usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudioTranscriptionResponse'}
            text/event-stream:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/AudioTranscriptionDeltaEvent'}
                  - {$ref: '#/components/schemas/AudioTranscriptionSegmentEvent'}
                  - {$ref: '#/components/schemas/AudioTranscriptionDoneEvent'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/audio/translations:
    post:
      operationId: translateAudio
      tags: [Inference]
      summary: Translate uploaded speech to English through an explicitly capable deployment
      description: Uses the same bounded multipart, authorization, access policy, DLP/AV, RPM/TPM, retry and billing lifecycle as transcription. Native Gemini accepts inline WAV/MP3/MPEG/OGG/FLAC/WebM input plus prompt and temperature, translates to English, returns exact token usage, and rejects transcription-only controls before upstream execution. Native Groq, compatible and Azure adapters use duration settlement; compatible transports require reliable container duration metadata before execution.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/AudioTranscriptionRequest'}
      responses:
        '200':
          description: English translation with exact token or duration usage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AudioTranscriptionResponse'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/audio/speech:
    post:
      operationId: createSpeech
      tags: [Inference]
      summary: Generate speech audio from text through an explicitly capable deployment
      description: Applies strict JSON validation, text policies, RPM/TPM admission, retries, exact Unicode character billing and durable settlement. With stream_format=sse, capable compatible deployments forward bounded base64 audio delta events and require a terminal event with consistent exact token usage; retry and fallback stop after the first client event. Native Gemini uses the Interactions API for inline MP3, Opus, WAV or PCM output, supports voice and natural-language instructions, and rejects unsupported speed, AAC, FLAC and SSE controls before upstream execution.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AudioSpeechRequest'}
      responses:
        '200':
          description: Generated speech in the requested audio format
          content:
            audio/mpeg: {schema: {type: string, format: binary}}
            audio/ogg: {schema: {type: string, format: binary}}
            audio/aac: {schema: {type: string, format: binary}}
            audio/flac: {schema: {type: string, format: binary}}
            audio/wav: {schema: {type: string, format: binary}}
            application/octet-stream: {schema: {type: string, format: binary}}
            text/event-stream:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/AudioSpeechDeltaEvent'}
                  - {$ref: '#/components/schemas/AudioSpeechDoneEvent'}
        default:
          description: Gateway or provider error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/files:
    post:
      operationId: createFile
      tags: [Files]
      summary: Store a bounded file for later gateway operations
      description: Authenticates the virtual key, consumes RPM admission and stores the file in PostgreSQL under a credential-and-user owner key. Uploads fail closed when durable storage is unavailable and an atomic per-owner byte quota prevents concurrent requests from exceeding the configured limit. Expired files are removed from storage and quota accounting. Batch input files expire after 30 days unless an explicit policy is supplied.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, purpose]
              properties:
                file: {type: string, format: binary}
                purpose: {type: string, enum: [assistants, batch, fine-tune, vision, user_data, evals]}
                expires_after:
                  type: object
                  additionalProperties: false
                  required: [anchor, seconds]
                  properties:
                    anchor: {type: string, const: created_at}
                    seconds: {type: integer, format: int64, minimum: 3600, maximum: 2592000}
      responses:
        '200':
          description: Stored file metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileObject'}
        default:
          description: Authentication, validation, quota, or storage failure
