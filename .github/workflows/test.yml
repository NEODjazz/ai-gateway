name: Test

on:
  workflow_call:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate OpenAPI specification
        uses: oasdiff/oasdiff-action/validate@v0.1.10
        with:
          spec: repos/gateway/api/openapi.yaml
          fail-on: WARN
          allow-external-refs: false

      - name: Check whether the base revision has an OpenAPI specification
        if: github.event_name == 'pull_request'
        id: openapi_base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if git cat-file -e "${BASE_SHA}:repos/gateway/api/openapi.yaml"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request' && steps.openapi_base.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.10
        with:
          base: ${{ github.event.pull_request.base.sha }}:repos/gateway/api/openapi.yaml
          revision: repos/gateway/api/openapi.yaml
          fail-on: WARN
          allow-external-refs: false
          review: false

  go:
    name: Go / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - anonymizer
          - auth
          - billing
          - dlp
          - av
    defaults:
      run:
        working-directory: repos/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: repos/${{ matrix.service }}/go.mod
          cache-dependency-path: repos/${{ matrix.service }}/go.mod

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.service }}
          path: repos/${{ matrix.service }}/coverage.out
          if-no-files-found: error

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONTROL_PLANE_POSTGRES_TEST_DSN: postgres://postgres@127.0.0.1:5432/gateway_test?sslmode=disable
      AUTH_POSTGRES_TEST_DSN: postgres://postgres@127.0.0.1:5432/auth_test?sslmode=disable
      BILLING_POSTGRES_TEST_DSN: postgres://postgres@127.0.0.1:5432/billing_test?sslmode=disable
      POSTGRES_INTEGRATION_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: repos/gateway/go.mod
      - name: Create isolated test databases
        run: |
          psql postgres://postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gateway_test' -c 'CREATE DATABASE auth_test' -c 'CREATE DATABASE billing_test'
      - name: Apply migrations and run required database scenarios
        run: bash scripts/test-postgres-integration.sh

  admin-ui:
    name: React admin UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos/gateway/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.3.1
          cache: npm
          cache-dependency-path: repos/gateway/ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run component tests
        run: npm test

      - name: Build embedded assets
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  helm:
    name: Helm / ${{ matrix.chart }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - ai-gateway
          - anonymizer
          - auth
          - billing
          - security
          - redis
          - postgres
          - clickhouse
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.1

      - name: Lint chart
        run: helm lint "charts/${{ matrix.chart }}"

      - name: Render chart
        run: helm template "${{ matrix.chart }}" "charts/${{ matrix.chart }}" --namespace ai-gateway > /dev/null

      - name: Verify published image defaults
        shell: bash
        run: |
          values="charts/${{ matrix.chart }}/values.yaml"
          if grep -q '^devMode:' "$values"; then
            rendered="$(helm template "${{ matrix.chart }}" "charts/${{ matrix.chart }}" --namespace ai-gateway)"
            if grep -q 'image: "golang:' <<< "$rendered"; then
              echo "Published charts must not enable devMode by default"
              exit 1
            fi
            if ! grep -q 'image: "ghcr.io/' <<< "$rendered"; then
              echo "Published application images must come from GHCR"
              exit 1
            fi
          fi

      - name: Render development configuration
        run: helm template "${{ matrix.chart }}" "charts/${{ matrix.chart }}" --namespace ai-gateway --set devMode.enabled=true > /dev/null

  images:
    name: Image / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - anonymizer
          - auth
          - billing
          - dlp
          - av
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: repos/${{ matrix.service }}
          push: false
          tags: ai-gateway-${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
