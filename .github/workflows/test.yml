name: Test

on:
  workflow_call:
  push:
    branches:
      - main
      - master
      - test
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate OpenAPI specification
        uses: oasdiff/oasdiff-action/validate@v0.1.10
        with:
          spec: repos/gateway/api/openapi.yaml
          fail-on: WARN
          allow-external-refs: false

      - name: Check whether the base revision has an OpenAPI specification
        if: github.event_name == 'pull_request'
        id: openapi_base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if git cat-file -e "${BASE_SHA}:repos/gateway/api/openapi.yaml"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request' && steps.openapi_base.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.10
        with:
          base: ${{ github.event.pull_request.base.sha }}:repos/gateway/api/openapi.yaml
          revision: repos/gateway/api/openapi.yaml
          fail-on: WARN
          allow-external-refs: false
          review: false

  smoke-scripts:
    name: Smoke script contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify prerequisites
        run: command -v curl && command -v jq && command -v python3
      - name: Test embedding smoke routing and credential handling
        run: python3 -B -m unittest scripts/test_smoke_ollama_embeddings.py
      - name: Validate secret-free OIDC realm profile
        run: python3 -B -m unittest scripts/test_identity_profile.py

  go:
    name: Go / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - anonymizer
          - auth
          - billing
          - dlp
          - av
    defaults:
      run:
        working-directory: repos/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: repos/${{ matrix.service }}/go.mod
          cache-dependency-path: repos/${{ matrix.service }}/go.mod

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.service }}
          path: repos/${{ matrix.service }}/coverage.out
          if-no-files-found: error

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONTROL_PLANE_POSTGRES_TEST_DSN: postgres://postgres@127.0.0.1:5432/gateway_test?sslmode=disable
      AUTH_POSTGRES_TEST_DSN: postgres://postgres@127.0.0.1:5432/auth_test?sslmode=disable
      BILLING_POSTGRES_TEST_DSN: postgres://postgres@127.0.0.1:5432/billing_test?sslmode=disable
      POSTGRES_INTEGRATION_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: repos/gateway/go.mod
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.1
      - name: Create isolated test databases
        run: |
          psql postgres://postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gateway_test' -c 'CREATE DATABASE auth_test' -c 'CREATE DATABASE billing_test'
      - name: Apply migrations and run required database scenarios
        run: bash scripts/test-postgres-integration.sh

  organization-reporting-integration:
    name: ClickHouse organization reporting integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_USER: integration
          # Disposable fixture credentials, never deployment credentials.
          CLICKHOUSE_PASSWORD: integration-only-test-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user integration --password integration-only-test-password --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CLICKHOUSE_INTEGRATION_REQUIRED: "true"
      BILLING_CLICKHOUSE_TEST_URL: http://127.0.0.1:8123
      BILLING_CLICKHOUSE_TEST_USERNAME: integration
      BILLING_CLICKHOUSE_TEST_PASSWORD: integration-only-test-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: repos/billing/go.mod
      - name: Verify tenant Usage, detail, groups and pagination on real ClickHouse
        working-directory: repos/billing
        run: go test -race -count=1 -run TestClickHouseOrganizationReportingIsolationIntegration ./internal/modules

  identity-integration:
    name: Keycloak and OpenWebUI identity integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      IDENTITY_INTEGRATION_TESTS: "true"
      CONTROL_PLANE_POSTGRES_TEST_DSN: postgres://postgres@127.0.0.1:5432/identity_gateway_test?sslmode=disable
      AUTH_POSTGRES_TEST_DSN: postgres://postgres@127.0.0.1:5432/identity_auth_test?sslmode=disable
      BILLING_POSTGRES_TEST_DSN: postgres://postgres@127.0.0.1:5432/identity_billing_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: repos/gateway/go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.1
      - name: Create dedicated test databases
        run: |
          psql postgres://postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE identity_gateway_test' -c 'CREATE DATABASE identity_auth_test' -c 'CREATE DATABASE identity_billing_test'
      - name: Pull pinned real identity services
        run: |
          docker pull quay.io/keycloak/keycloak:26.3.3@sha256:6a7217a100bd3e5de4063a27a538ef999a3c5a88c4b4ec0ffc0a642aee7b2597
          docker pull ghcr.io/open-webui/open-webui:v0.11.4-slim@sha256:0487ad4a5a4b986062dedace806c3ef1e88fec38c10d1e64d6a5501c66671e5e
      - name: Verify user OAuth, refresh, grants, resources and billing
        run: python3 -B scripts/test-identity-integration.py
      # Never upload raw OAuth/service logs: they may contain runtime test tokens.

  admin-ui:
    name: React admin UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos/gateway/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.3.1
          cache: npm
          cache-dependency-path: repos/gateway/ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run component tests
        run: npm test

      - name: Build embedded assets
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  helm:
    name: Helm / ${{ matrix.chart }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - ai-gateway
          - anonymizer
          - auth
          - billing
          - security
          - redis
          - postgres
          - clickhouse
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.1

      - name: Lint chart
        run: helm lint "charts/${{ matrix.chart }}"

      - name: Render chart
        run: helm template "${{ matrix.chart }}" "charts/${{ matrix.chart }}" --namespace ai-gateway > /dev/null

      - name: Verify shared credential encryption configuration
        if: matrix.chart == 'ai-gateway'
        run: python3 scripts/test-credential-encryption-charts.py

      - name: Verify gateway integer environment rendering
        if: matrix.chart == 'ai-gateway'
        shell: bash
        run: |
          rendered="$(helm template ai-gateway charts/ai-gateway --namespace ai-gateway)"
          if grep -Eq 'value: "[0-9]+(\.[0-9]+)?e[+-][0-9]+"' <<< "$rendered"; then
            echo "Integer environment values must use decimal notation"
            exit 1
          fi
          grep -A1 'name: ASSISTANT_RUN_RETENTION_SECONDS' <<< "$rendered" | grep -q 'value: "2592000"'
          grep -A1 'name: A2A_TASK_TTL_SECONDS' <<< "$rendered" | grep -q 'value: "2592000"'

      - name: Verify Azure service principal Secret reference
        if: matrix.chart == 'ai-gateway'
        shell: bash
        run: |
          default_rendered="$(helm template ai-gateway charts/ai-gateway --namespace ai-gateway)"
          if grep -q 'name: AZURE_CLIENT_SECRET' <<< "$default_rendered"; then
            echo "Azure client secret must be opt-in"
            exit 1
          fi
          rendered="$(helm template ai-gateway charts/ai-gateway --namespace ai-gateway --set gateway.azureIdentity.tenantId=tenant-id --set gateway.azureIdentity.clientId=client-id --set gateway.azureIdentity.clientSecretSecretName=azure-sp)"
          grep -A1 'name: AZURE_TENANT_ID' <<< "$rendered" | grep -q 'value: "tenant-id"'
          grep -A1 'name: AZURE_CLIENT_ID' <<< "$rendered" | grep -q 'value: "client-id"'
          grep -A5 'name: AZURE_CLIENT_SECRET' <<< "$rendered" | grep -q 'name: "azure-sp"'
          grep -A5 'name: AZURE_CLIENT_SECRET' <<< "$rendered" | grep -q 'key: "AZURE_CLIENT_SECRET"'

      - name: Verify published image defaults
        shell: bash
        run: |
          values="charts/${{ matrix.chart }}/values.yaml"
          if grep -q '^devMode:' "$values"; then
            rendered="$(helm template "${{ matrix.chart }}" "charts/${{ matrix.chart }}" --namespace ai-gateway)"
            if grep -q 'image: "golang:' <<< "$rendered"; then
              echo "Published charts must not enable devMode by default"
              exit 1
            fi
            if ! grep -q 'image: "ghcr.io/' <<< "$rendered"; then
              echo "Published application images must come from GHCR"
              exit 1
            fi
          fi

      - name: Render development configuration
        run: helm template "${{ matrix.chart }}" "charts/${{ matrix.chart }}" --namespace ai-gateway --set devMode.enabled=true > /dev/null

  images:
    name: Image / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - anonymizer
          - auth
          - billing
          - dlp
          - av
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: repos/${{ matrix.service }}
          push: false
          tags: ai-gateway-${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
