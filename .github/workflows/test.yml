name: Test

on:
  workflow_call:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - anonymizer
          - auth
          - billing
          - dlp
          - av
    defaults:
      run:
        working-directory: repos/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: repos/${{ matrix.service }}/go.mod
          cache-dependency-path: repos/${{ matrix.service }}/go.mod

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.service }}
          path: repos/${{ matrix.service }}/coverage.out
          if-no-files-found: error

  helm:
    name: Helm / ${{ matrix.chart }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - ai-gateway
          - anonymizer
          - auth
          - billing
          - security
          - redis
          - postgres
          - clickhouse
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.1

      - name: Lint chart
        run: helm lint "charts/${{ matrix.chart }}"

      - name: Render chart
        run: helm template "${{ matrix.chart }}" "charts/${{ matrix.chart }}" --namespace ai-gateway > /dev/null

      - name: Verify published image defaults
        shell: bash
        run: |
          values="charts/${{ matrix.chart }}/values.yaml"
          if grep -q '^devMode:' "$values"; then
            rendered="$(helm template "${{ matrix.chart }}" "charts/${{ matrix.chart }}" --namespace ai-gateway)"
            if grep -q 'image: "golang:' <<< "$rendered"; then
              echo "Published charts must not enable devMode by default"
              exit 1
            fi
            if ! grep -q 'image: "ghcr.io/' <<< "$rendered"; then
              echo "Published application images must come from GHCR"
              exit 1
            fi
          fi

      - name: Render development configuration
        run: helm template "${{ matrix.chart }}" "charts/${{ matrix.chart }}" --namespace ai-gateway --set devMode.enabled=true > /dev/null

  images:
    name: Image / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - anonymizer
          - auth
          - billing
          - dlp
          - av
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: repos/${{ matrix.service }}
          push: false
          tags: ai-gateway-${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
