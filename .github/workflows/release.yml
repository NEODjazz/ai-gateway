name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release
    uses: ./.github/workflows/test.yml

  release-info:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.info.outputs.owner }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Parse release information
        id: info
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    name: Image / ${{ matrix.service }}
    needs:
      - test
      - release-info
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - anonymizer
          - auth
          - billing
          - dlp
          - av
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.release-info.outputs.owner }}/ai-gateway-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: repos/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ needs.release-info.outputs.owner }}/ai-gateway-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  charts:
    name: Helm charts
    needs:
      - test
      - release-info
      - images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.release-info.outputs.version }}
      OCI_REGISTRY: oci://ghcr.io/${{ needs.release-info.outputs.owner }}/charts
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.1

      - name: Log in to GHCR
        shell: bash
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Package charts
        shell: bash
        run: |
          mkdir -p dist
          for chart in charts/*; do
            name="$(basename "$chart")"
            case "$name" in
              redis|postgres|clickhouse)
                helm package "$chart" --version "$VERSION" --destination dist
                ;;
              *)
                helm package "$chart" --version "$VERSION" --app-version "$VERSION" --destination dist
                ;;
            esac
          done

      - name: Push charts to GHCR
        shell: bash
        run: |
          for package in dist/*.tgz; do
            helm push "$package" "$OCI_REGISTRY"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm-charts-${{ needs.release-info.outputs.version }}
          path: dist/*.tgz
          if-no-files-found: error

      - name: Create GitHub release
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
